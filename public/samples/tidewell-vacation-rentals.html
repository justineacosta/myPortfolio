or-body);text-decoration:none\" style-hover=\"color:var(--color-ink);text-decoration:underline;text-underline-offset:6px\">{{ n.label }}\u003c/a>\n        \u003c/sc-for>\n      \u003c/nav>\n      \u003cdiv style=\"display:flex;align-items:center;gap:20px\">\n        \u003ca href=\"#guests\" style=\"font-family:var(--font-sans);font-size:14px;font-weight:500;color:var(--color-ink);text-decoration:none\">Book a stay\u003c/a>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" on-click=\"{{ toAssessment }}\" hint-size=\"230px,40px\">Get a property assessment\u003c/x-import>\n      \u003c/div>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{ compactNav }}\" hint-placeholder-val=\"{{ false }}\">\n      \u003cdiv style=\"flex:1\">\u003c/div>\n      \u003cbutton type=\"button\" aria-expanded=\"{{ menuOpenStr }}\" aria-controls=\"mobile-menu\" sc-camel-on-click=\"{{ toggleMenu }}\" style=\"height:44px;padding:0 16px;border:1px solid var(--color-hairline);border-radius:8px;background:var(--color-canvas);font-family:var(--font-sans);font-size:14px;font-weight:500;color:var(--color-ink);display:flex;align-items:center;gap:8px;cursor:pointer\">{{ menuLabel }}\u003c/button>\n    \u003c/sc-if>\n  \u003c/div>\n  \u003csc-if value=\"{{ menuVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv id=\"mobile-menu\" style=\"border-top:1px solid var(--color-hairline);background:var(--color-canvas);padding:16px clamp(20px,4vw,72px) 28px;display:flex;flex-direction:column;gap:4px;max-height:calc(100svh - 72px);overflow:auto\">\n      \u003csc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"7\">\n        \u003ca href=\"{{ n.href }}\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:var(--font-serif-display);font-size:30px;letter-spacing:-0.4px;color:var(--color-ink);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--color-hairline-soft)\">{{ n.label }}\u003c/a>\n      \u003c/sc-for>\n      \u003cdiv style=\"displa  the income and the house without the second job. Guests, cleans, repairs and pricing are handled by a local team, and you get one manager and one clear statement each month.\u003c/p>\n        \u003cdiv data-hero=\"\" style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" on-click=\"{{ toAssessment }}\" style=\"height:52px;padding:0 28px;font-size:15px\" hint-size=\"250px,52px\">Get a property assessment\u003c/x-import>\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" on-click=\"{{ toHow }}\" style=\"height:52px;padding:0 24px;font-size:15px\" hint-size=\"200px,52px\">See how it works\u003c/x-import>\n        \u003c/div>\n      \u003c/div>\n      \u003cdl data-hero=\"\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0;border-top:1px solid var(--color-hairline);padding-top:24px\">\n        \u003cdiv>\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Guest rating\u003c/dt>\u003cdd style=\"margin:4px 0 0;font-family:var(--font-serif-display);font-size:clamp(28px,2.4vw,40px);letter-spacing:-0.5px;color:var(--color-ink)\">4.92\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Median reply\u003c/dt>\u003cdd style=\"margin:4px 0 0;font-family:var(--font-serif-display);font-size:clamp(28px,2.4vw,40px);letter-spacing:-0.5px;color:var(--color-ink)\">9 min\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Owners who stay\u003c/dt>\u003cdd style=\"margin:4px 0 0;font-family:var(--font-serif-display);font-size:clamp(28px,2.4vw,40px);letter-spacing:-0.5px;color:var(--color-ink)\">96%\u003c/dd>\u003c/div>\n      \u003c/dl>\n    \u003c/div>\n    \u003cfigure style=\"flex:1.45 1 480px;margin:0 ca .4vw,80px);line-height:1.02;letter-spacing:-0.025em;color:var(--color-ink);text-wrap:balance\">We stand between you and the house, so the house never needs you at 11 pm.\u003c/h2>\n      \u003c/div>\n      \u003cp data-reveal=\"\" style=\"flex:0 1 420px;margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.65;color:var(--color-body)\">Tidewell is the operating layer for your property: one team that answers guests, cleans, inspects, repairs, prices and reports. You keep the decisions that matter.\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px);align-items:stretch\">\n      \u003cdiv data-reveal=\"\" style=\"flex:1.3 1 480px;border-top:1px solid var(--color-ink);padding-top:24px\">\n        \u003ch3 style=\"margin:0 0 20px;font-family:var(--font-sans);font-size:13px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--color-ink)\">What we handle\u003c/h3>\n        \u003cul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));column-gap:40px\">\n          \u003csc-for list=\"{{ handled }}\" as=\"h\" hint-placeholder-count=\"10\">\n            \u003cli style=\"display:flex;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--color-hairline)\">\n              \u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:var(--color-muted)\">{{ h.n }}\u003c/span>\n              \u003cspan style=\"font-family:var(--font-serif-display);font-size:24px;letter-spacing:-0.3px;color:var(--color-ink)\">{{ h.label }}\u003c/span>\n            \u003c/li>\n          \u003c/sc-for>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv data-reveal=\"\" style=\"flex:1 1 360px;background:var(--color-surface-card);border-radius:12px;padding:clamp(28px,3vw,48px);display:flex;flex-direction:column;gap:20px\">\n        \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:13px;font-weight:500;le -height:1.65;color:var(--color-on-dark-soft)\">Salt air, humidity, mountain winters and historic-district rules each call for their own maintenance plan. We write one for every home.\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,1.6vw,28px)\">\n      \u003csc-for list=\"{{ homes }}\" as=\"h\" hint-placeholder-count=\"6\">\n        \u003carticle data-reveal=\"\" style=\"flex:{{ h.flex }};min-width:min(100%,300px);display:flex;flex-direction:column;gap:16px\">\n          \u003cdiv style=\"overflow:hidden;border-radius:12px;height:clamp(300px,{{ h.vh }},720px);background:var(--color-surface-dark-elevated)\">\n            \u003cimg src=\"{{ h.img }}\" alt=\"{{ h.alt }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:{{ h.pos }};transition:transform 1200ms var(--ease-standard)\" style-hover=\"transform:scale(1.035)\">\n          \u003c/div>\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline\">\n            \u003ch3 style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(26px,2vw,34px);letter-spacing:-0.4px;color:var(--color-on-dark)\">{{ h.title }}\u003c/h3>\n            \u003cspan style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-on-dark-soft)\">{{ h.where }}\u003c/span>\n          \u003c/div>\n          \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:15px;line-height:1.6;color:var(--color-on-dark-soft);max-width:34em\">{{ h.note }}\u003c/p>\n        \u003c/article>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"owners\" aria-labelledby=\"owners-title\" style=\"background:var(--color-canvas);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,120px);align-items:flex-start\">\n    \u003cdiv style=\"flex:1 1 400px;max-width:640px;display:flex;flex-direction:column;gap:28px\">\n      \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-muted)\">05 · For owners\u003c/p>\n      \u003ch2 id=\"owners-title\" data-reveal=\"\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.4vw,80px);line-height:1.02;letter-spacing:-0.025em;color:var(--color-ink);text-wrap:balance\">Your property is an investment. We operate it accordingly.\u003c/h2>\n      \u003cp data-reveal=\"\" style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.65;color:var(--color-body)\">You see what we see: every booking, every expense and every repair, with photos. The owner portal is there when you want detail. Your manager's phone number is there when you would rather talk.\u003c/p>\n      \u003cul style=\"list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px 32px\">\n        \u003csc-for list=\"{{ ownerFeatures }}\" as=\"f\" hint-placeholder-count=\"6\">\n          \u003cli data-reveal=\"\" style=\"display:flex;gap:14px;align-items:flex-start\">\n            \u003cspan style=\"flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--color-surface-card);display:flex;align-items:center;justify-content:center;color:var(--color-ink)\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"{{ f.icon }}\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/span>\n            \u003cspan style=\"display:flex;flex-direction:column;gap:4px\">\u003cspan style=\"font-family:var(--font-sans);font-size:16px;font-weight:500;color:var(--color-ink)\">{{ f.title }}\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px;line-height:1.55;color:var(--color-body)\">{{ f.text }}\u003c/span>\u003c/span>\n          \u003c 11,642\u003c/dd>\n          \u003c/div>\n        \u003c/dl>\n        \u003cdiv style=\"background:var(--color-surface-soft);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:4px\">\n          \u003cspan style=\"font-family:var(--font-sans);font-size:12px;font-weight:500;color:var(--color-muted)\">Note from Ruth\u003c/span>\n          \u003cspan style=\"font-family:var(--font-sans);font-size:15px;line-height:1.55;color:var(--color-body)\">The outdoor shower valve was replaced on the 14th (photo in the portal). The deck is due for stain before spring. I've attached two quotes; nothing is needed from you until January.\u003c/span>\n        \u003c/div>\n      \u003c/article>\n      \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Illustrative statement. Actual results vary by property, season and market.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"guests\" aria-labelledby=\"guests-title\" style=\"background:var(--color-surface-card);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-direction:column;gap:clamp(40px,4vw,72px)\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end\">\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:20px;max-width:960px\">\n        \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-muted)\">06 · For guests\u003c/p>\n        \u003ch2 id=\"guests-title\" data-reveal=\"\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.4vw,80px);line-height:1.02;letter-spacing:-0.025em;color:var(--color-ink);text-wrap:balance\">Good stays write good reviews. Good reviews fill calendars.\u003c/h2>\n      \u003c/div>\n      \u003cx-import component-from-globa c-for list=\"{{ guestPoints }}\" as=\"g\" hint-placeholder-count=\"5\">\n            \u003cli data-reveal=\"\" style=\"display:grid;grid-template-columns:28px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--color-surface-cream-strong)\">\n              \u003cspan style=\"color:var(--color-ink);padding-top:3px\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"{{ g.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\">\u003c/x-import>\u003c/span>\n              \u003cspan style=\"display:flex;flex-direction:column;gap:2px\">\u003cspan style=\"font-family:var(--font-sans);font-size:16px;font-weight:500;color:var(--color-ink)\">{{ g.title }}\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px;line-height:1.55;color:var(--color-body)\">{{ g.text }}\u003c/span>\u003c/span>\n            \u003c/li>\n          \u003c/sc-for>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"how\" aria-labelledby=\"how-title\" style=\"background:var(--color-surface-dark);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-direction:column;gap:clamp(40px,4vw,72px)\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end\">\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:20px;max-width:900px\">\n        \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-on-dark-soft)\">07 · How it works\u003c/p>\n        \u003ch2 id=\"how-title\" data-reveal=\"\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.4vw,80px);line-height:1.02;letter-spacing:-0.025em;color:var(--color-on-dark);text-wrap:balance\">From first walkthrough to first guest in about four weeks.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:0 1 360px;margin:0;font-family:var(--font-sans);font-size:16px;line-height:1.65;color:var(--color-on-dark-soft)\">The right-hand column is everything we need from you.\u003c/p>\n    \u003c/div>\n    \u003col style=\"list-style:none;margin:0;padding:0\">\n      \u003csc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n        \u003cli data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:16px clamp(24px,3vw,56px);padding:clamp(24px,2.4vw,40px) 0;border-top:1px solid rgba(250,249,245,0.14);align-items:baseline\">\n          \u003cspan style=\"flex:0 0 clamp(64px,6vw,120px);font-family:var(--font-serif-display);font-size:clamp(40px,4vw,72px);line-height:0.9;color:var(--color-primary)\">{{ s.n }}\u003c/span>\n          \u003cspan style=\"flex:1 1 200px;display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(30px,2.6vw,44px);line-height:1;letter-spacing:-0.4px;color:var(--color-on-dark)\">{{ s.title }}\u003c/span>\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:var(--color-on-dark-soft)\">{{ s.when }}\u003c/span>\u003c/span>\n          \u003cspan style=\"flex:2 1 320px;font-family:var(--font-sans);font-size:16px;line-height:1.65;color:var(--color-on-dark-soft)\">{{ s.text }}\u003c/span>\n          \u003cspan style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:4px;border-left:1px solid rgba(250,249,245,0.14);padding-left:20px\">\u003cspan style=\"font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--color-on-dark-soft)\">Your part\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:15px;line-height:1.5;color:var(--color-on-dark)\">{{ s.you }}\u003c/span>\u003c/span>\n        \u003c/li>\n      \u003c/sc-for>\n    \u003c/ol>\n  \u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"story-title\" style=\"background:var(--color-canvas);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,120px);align-items:center\">\n    \u003cdiv data-reveal=\"\" style=\"flex:1.1 1 440px;display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(12px,1.4vw,24px);align-items:end\">\n      \u003cdiv style=\"overflow:hidden;border-radius:12px;aspect-ratio:4/5;background:var(--color-surface-card)\">\u003cimg src=\"tidewell-vacation-rentals/50149e3ef522.webp\" alt=\"Two members of the housekeeping team making a bed with fresh linens\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\u003c/div>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:clamp(12px,1.4vw,24px)\">\n        \u003cdiv style=\"overflow:hidden;border-radius:12px;aspect-ratio:1;background:var(--color-surface-card)\">\u003cimg src=\"tidewell-vacation-rentals/18897f3bc2e4.webp\" alt=\"Pale blue shutters and an arched black door on a Charleston street\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\u003c/div>\n        \u003cdiv style=\"overflow:hidden;border-radius:12px;aspect-ratio:4/5;background:var(--color-surface-card)\">\u003cimg src=\"tidewell-vacation-rentals/8e208c3a47ec.webp\" alt=\"A neatly made bed with folded linens and a reading lamp\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"flex:1 1 400px;max-width:620px;display:flex;flex-direction:column;gap:24px\">\n      \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-muted)\">08 · About Tidewell\u003c/p>\n      \u003ch2 id=\"story-title\" data-reveal=\"\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4vw,72px);line-height:1.04;letter-spacing:-0.025em;color:var(--color-ink);text-wrap:balance\">Started with four houses on Sullivan's Island.\u003c/h2>\n      \u003cdiv data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans);font-size:17px;line-height:1.7;color:var(--color-body)\">\n        \u003cp style=\"margin:0\">Ruth Calloway ran front of house at two Charleston hotels for eleven years. Her business partner, Marcus Bell, spent his career managing maintenance crews across the Lowcountry. In 2014 a neighbor asked them to look after her beach house for a summer, and three more owners asked by August.\u003c/p>\n        \u003cp style=\"margin:0\">We still work the way we did then. Each manager looks after no more than eighteen homes, our cleaners are on staff, and every house has a binder, a key log and a maintenance calendar. The software helps. The people are the service.\u003c/p>\n      \u003c/div>\n      \u003cdl style=\"margin:8px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;border-top:1px solid var(--color-hairline);padding-top:20px\">\n        \u003cdiv>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:36px;color:var(--color-ink)\">18\u003c/dd>\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Homes per manager, at most\u003c/dt>\u003c/div>\n        \u003cdiv>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:36px;color:var(--color-ink)\">46\u003c/dd>\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">People on staff\u003c/dt>\u003c/div>\n        \u003cdiv>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:36px;color:var(--color-ink)\">2\u003c/dd>\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Local offices\u003c/dt>\u003c/div>\n      \u003c/dl>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"markets\" aria-labelledby=\"markets-title\" style=\"background:var(--color-surface-card);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-direction:column;gap:clamp(40px,4vw,72px)\">\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:20px;max-width:900px\">\n      \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-muted)\">09 · Where we work\u003c/p>\n      \u003ch2 id=\"markets-title\" data-reveal=\"\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.4vw,80px);line-height:1.02;letter-spacing:-0.025em;color:var(--color-ink)\">Three markets we know by name.\u003c/h2>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(20px,2vw,36px)\">\n      \u003csc-for list=\"{{ markets }}\" as=\"m\" hint-placeholder-count=\"3\">\n        \u003carticle data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:20px\">\n          \u003cdiv style=\"overflow:hidden;border-radius:12px;aspect-ratio:4/5;background:var(--color-surface-cream-strong)\">\u003cimg src=\"{{ m.img }}\" alt=\"{{ m.alt }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;transition:transform 1200ms var(--ease-standard)\" style-hover=\"transform:scale(1.03)\">\u003c/div>\n          \u003cdiv style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\u003ch3 style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(32px,2.6vw,44px);letter-spacing:-0.5px;color:var(--color-ink)\">{{ m.name }}\u003c/h3>\u003cspan style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">{{ m.count }}\u003c/span>\u003c/div>\n          \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:15px;line-height:1.6;color:var(--color-body)\">{{ m.text }}\u003c/p>\n          \u003cdl style=\"margin:0;display:flex;flex-direction:column;border-top:1px solid var(--color-surface-cream-strong)\">\n            \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-surface-cream-strong)\">\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Towns\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-sans);font-size:13px;color:var(--color-ink);text-align:right\">{{ m.towns }}\u003c/dd>\u003c/div>\n            \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-surface-cream-strong)\">\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Peak season\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-sans);font-size:13px;color:var(--color-ink);text-align:right\">{{ m.peak }}\u003c/dd>\u003c/div>\n            \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-surface-cream-strong)\">\u003cdt style=\"font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Guests come for\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-sans);font-size:13px;color:var(--color-ink);text-align:right\">{{ m.draw }}\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/article>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"voices-title\" style=\"background:var(--color-canvas);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-direction:column;gap:clamp(40px,4vw,72px)\">\n    \u003cp id=\"voices-title\" style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-muted)\">10 · Owners and guests\u003c/p>\n    \u003cfigure data-reveal=\"\" style=\"margin:0;display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,72px);align-items:flex-end\">\n      \u003cblockquote style=\"flex:3 1 520px;margin:0;font-family:var(--font-serif-display);font-size:clamp(32px,3.4vw,60px);line-height:1.12;letter-spacing:-0.02em;color:var(--color-ink);text-wrap:pretty\">“We live in Columbus. In three years I haven't called a plumber once. When the air conditioning failed in July, I heard about it from Ruth's text, which already said the repair was booked and the guests had been moved to a sister house.”\u003c/blockquote>\n      \u003cfigcaption style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-family:var(--font-sans);border-left:1px solid var(--color-hairline);padding-left:20px\">\u003cspan style=\"font-size:16px;font-weight:500;color:var(--color-ink)\">Karen M.\u003c/span>\u003cspan style=\"font-size:14px;color:var(--color-muted)\">Owner, 4-bedroom on Isle of Palms, since 2022\u003c/span>\u003c/figcaption>\n    \u003c/figure>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(20px,2vw,36px)\">\n      \u003csc-for list=\"{{ quotes }}\" as=\"q\" hint-placeholder-count=\"3\">\n        \u003cfigure data-reveal=\"\" style=\"margin:0;background:var(--color-surface-card);border-radius:12px;padding:clamp(24px,2.4vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:28px\">\n          \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n            \u003cspan style=\"align-self:flex-start\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" hint-size=\"60px,24px\">{{ q.kind }}\u003c/x-import>\u003c/span>\n            \u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(22px,1.7vw,28px);line-height:1.3;letter-spacing:-0.2px;color:var(--color-ink)\">“{{ q.text }}”\u003c/blockquote>\n          \u003c/div>\n          \u003cfigcaption style=\"font-family:var(--font-sans);display:flex;flex-direction:column;gap:2px\">\u003cspan style=\"font-size:15px;font-weight:500;color:var(--color-ink)\">{{ q.name }}\u003c/span>\u003cspan style=\"font-size:13px;color:var(--color-muted)\">{{ q.meta }}\u003c/span>\u003c/figcaption>\n        \u003c/figure>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:13px;color:var(--color-muted)\">Testimonials are written for this concept and do not describe real customers.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"faq-title\" style=\"background:var(--color-surface-card);padding:clamp(72px,8vw,144px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,120px);align-items:flex-start\">\n    \u003cdiv style=\"flex:1 1 320px;max-width:520px;display:flex;flex-direction:column;gap:24px;position:sticky;top:104px\">\n      \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--color-muted)\">11 · Questions\u003c/p>\n      \u003ch2 id=\"faq-title\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4vw,72px);line-height:1.04;letter-spacing:-0.025em;color:var(--color-ink)\">What owners ask us first.\u003c/h2>\n      \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:16px;line-height:1.65;color:var(--color-body)\">If your question isn't here, a property manager will answer it on the phone. \u003ca href=\"tel:+18435550142\" style=\"color:var(--color-primary);text-decoration:none\">(843) 555-0142 →\u003c/a>\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"flex:1.6 1 480px;border-top:1px solid var(--color-ink)\">\n      \u003csc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"12\">\n        \u003cdiv style=\"border-bottom:1px solid var(--color-surface-cream-strong)\">\n          \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:inherit;font-weight:inherit;letter-spacing:0\">\n            \u003cbutton type=\"button\" aria-expanded=\"{{ f.expanded }}\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;background:transparent;border:0;padding:22px 0;display:flex;justify-content:space-between;gap:24px;align-items:baseline;text-align:left;cursor:pointer;font-family:var(--font-serif-display);font-size:clamp(22px,1.8vw,30px);line-height:1.25;letter-spacing:-0.3px;color:var(--color-ink)\">{{ f.q }}\u003cspan aria-hidden=\"true\" style=\"font-family:var(--font-sans);font-size:22px;color:var(--color-muted)\">{{ f.sign }}\u003c/span>\u003c/button>\n          \u003c/h3>\n          \u003csc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cp style=\"margin:0;padding:0 48px 26px 0;font-family:var(--font-sans);font-size:16px;line-height:1.7;color:var(--color-body);max-width:44em\">{{ f.a }}\u003c/p>\n          \u003c/sc-if>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"contact\" aria-labelledby=\"cta-title\" style=\"background:var(--color-canvas);padding:clamp(32px,4vw,72px) 0\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px)\">\n    \u003cdiv style=\"background:var(--color-primary);border-radius:16px;overflow:hidden;display:flex;flex-wrap:wrap\">\n      \u003cdiv style=\"flex:1.2 1 460px;padding:clamp(32px,5vw,96px);display:flex;flex-direction:column;gap:28px;justify-content:center\">\n        \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:#ffffff\">Free property assessment\u003c/p>\n        \u003ch2 id=\"cta-title\" style=\"margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5vw,96px);line-height:1;letter-spacing:-0.03em;color:#ffffff;text-wrap:balance\">Hand us the keys. Keep the house.\u003c/h2>\n        \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.65;color:#ffffff;max-width:32em\">We visit the property, review your current numbers and send a written twelve-month revenue projection with a setup plan. It takes about an hour and commits you to nothing.\u003c/p>\n        \u003csc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          \u003cform sc-camel-on-submit=\"{{ submit }}\" aria-label=\"Request a property assessment\" style=\"background:var(--color-canvas);border-radius:12px;padding:clamp(20px,2.4vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;align-items:end;max-width:760px\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextInput\" label=\"Property address or town\" name=\"address\" required=\"{{ true }}\" placeholder=\"e.g. Isle of Palms\" hint-size=\"100%,64px\">\u003c/x-import>\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextInput\" label=\"Email\" type=\"email\" name=\"email\" required=\"{{ true }}\" placeholder=\"you@example.com\" hint-size=\"100%,64px\">\u003c/x-import>\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" type=\"submit\" style=\"height:40px;width:100%\" hint-size=\"100%,40px\">Get a property assessment\u003c/x-import>\n          \u003c/form>\n        \u003c/sc-if>\n        \u003csc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          \u003cdiv role=\"status\" style=\"background:var(--color-canvas);border-radius:12px;padding:24px 28px;max-width:760px;font-family:var(--font-sans);font-size:16px;line-height:1.6;color:var(--color-ink)\">Thank you. A property manager will call within one business day to schedule your walkthrough.\u003c/div>\n        \u003c/sc-if>\n        \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;font-family:var(--font-sans);font-size:15px;color:#ffffff\">\n          \u003cspan>Prefer to talk first?\u003c/span>\n          \u003ca href=\"tel:+18435550142\" style=\"color:#ffffff;font-weight:500;text-decoration:underline;text-underline-offset:4px\">Talk to a property manager · (843) 555-0142\u003c/a>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex:1 1 360px;min-height:360px;position:relative\">\n        \u003cimg src=\"tidewell-vacation-rentals/54be9a3396c9.webp\" alt=\"A wooden deck with chairs overlooking forested hills at sunset\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c/main>\n\n\u003cfooter style=\"background:var(--color-surface-dark);color:var(--color-on-dark-soft);padding:clamp(56px,6vw,96px) 0 40px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,72px);display:flex;flex-direction:column;gap:56px\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between\">\n      \u003cdiv style=\"flex:1 1 300px;max-width:420px;display:flex;flex-direction:column;gap:20px\">\n        \u003cspan style=\"font-family:var(--font-serif-display);font-size:44px;letter-spacing:-0.8px;color:var(--color-on-dark);line-height:1\">Tide\u003cspan style=\"font-style:italic\">well\u003c/span>\u003c/span>\n        \u003cp style=\"margin:0;font-family:var(--font-sans);font-size:15px;line-height:1.65\">Vacation rental and short-term rental management for homeowners on the Charleston coast and in the Blue Ridge.\u003c/p>\n        \u003caddress style=\"font-style:normal;font-family:var(--font-sans);font-size:14px;line-height:1.7\">418 Coleman Blvd, Mount Pleasant, SC\u003cbr>\u003ca href=\"tel:+18435550142\" style=\"color:var(--color-on-dark);text-decoration:none\">(843) 555-0142\u003c/a> · \u003ca href=\"mailto:owners@tidewell.example\" style=\"color:var(--color-on-dark);text-decoration:none\">owners@tidewell.example\u003c/a>\u003c/address>\n      \u003c/div>\n      \u003cnav aria-label=\"Footer\" style=\"flex:2 1 560px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:32px\">\n        \u003csc-for list=\"{{ footerCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n          \u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n            \u003cspan style=\"font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--color-on-dark)\">{{ c.title }}\u003c/span>\n            \u003csc-for list=\"{{ c.links }}\" as=\"l\" hint-placeholder-count=\"5\">\n              \u003ca href=\"{{ l.href }}\" style=\"font-family:var(--font-sans);font-size:14px;color:var(--color-on-dark-soft);text-decoration:none\" style-hover=\"color:var(--color-on-dark)\">{{ l.label }}\u003c/a>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/nav>\n    \u003c/div>\n    \u003cdiv style=\"border-top:1px solid rgba(250,249,245,0.10);padding-top:24px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-sans);font-size:13px;line-height:1.6\">\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between\">\u003cspan>© 2026 Tidewell Home Management\u003c/span>\u003cspan style=\"display:flex;flex-wrap:wrap;gap:20px\">\u003ca href=\"#\" style=\"color:var(--color-on-dark-soft)\">Privacy\u003c/a>\u003ca href=\"#\" style=\"color:var(--color-on-dark-soft)\">Terms\u003c/a>\u003ca href=\"#\" style=\"color:var(--color-on-dark-soft)\">Accessibility\u003c/a>\u003ca href=\"images/CREDITS.md\" style=\"color:var(--color-on-dark-soft)\">Photo credits\u003c/a>\u003ca href=\"#\" style=\"color:var(--color-on-dark-soft)\">Instagram\u003c/a>\u003ca href=\"#\" style=\"color:var(--color-on-dark-soft)\">LinkedIn\u003c/a>\u003c/span>\u003c/div>\n      \u003cp style=\"margin:0;max-width:72em\">Tidewell is a fictional company created for a design concept. Figures, statements, properties and testimonials are illustrative. Revenue projections are estimates and not a guarantee of income. Short-term rental permits, taxes and HOA rules vary by municipality; owners remain responsible for compliance at their property. Some photography is licensed under Creative Commons; see photo credits.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/footer>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\">\nconst R = (p) => (window.__resources && window.__resources['img_' + p.replace('images/','').replace('.jpg','').replace(/-/g,'_')]) || p;\nclass Component extends DCLogic {\n  state = { vw: typeof window !== 'undefined' ? window.innerWidth : 1440, menu: false, svc: 0, faq: 0, sent: false };\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) return;\n    const root = document;\n    root.querySelectorAll('[data-hero]').forEach((el, i) => el.animate(\n      [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }],\n      { duration: 1100, delay: 120 + i * 110, easing: 'cubic-bezier(0.2,0,0,1)', fill: 'backwards' }));\n    const hero = root.querySelector('[data-parallax]');\n    if (hero) {\n      hero.animate([{ transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 2200, easing: 'cubic-bezier(0.2,0,0,1)' });\n      this.onScroll = () => { const y = Math.min(window.scrollY, 900); hero.style.translate = `0 ${-y * 0.07}px`; };\n      window.addEventListener('scroll', this.onScroll, { passive: true });\n    }\n    this.io = new IntersectionObserver((entries) => entries.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.style.opacity = '1'; e.target.style.transform = 'none';\n      this.io.unobserve(e.target);\n    }), { rootMargin: '0px 0px -8% 0px' });\n    this.observe = () => root.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {\n      el.setAttribute('data-rv', '');\n      if (el.getBoundingClientRect().top \u003c window.innerHeight) return;\n      el.style.opacity = '0'; el.style.transform = 'translateY(28px)';\n      el.style.transition = 'opacity 1000ms cubic-bezier(0.2,0,0,1), transform 1000ms cubic-bezier(0.2,0,0,1)';\n      this.io.observe(el);\n    });\n    this.observe();\n    setTimeout(this.observe, 600);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n    if (this.io) this.io.disconnect();\n  }\n\n  renderVals() {\n    const { vw, menu, svc, faq, sent } = this.state;\n    const wideNav = vw >= 1200, narrow = vw \u003c 900;\n    const go = (id) => () => { this.setState({ menu: false }); const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); };\n\n    const services = [\n      { title: 'Property preparation', img: R('images/estate-living.jpg'), alt: 'A bright living room with arched windows, styled for guests', text: 'Deep clean, safety audit, linen and supply kit, smart lock and noise monitor installed. We style the rooms so the house photographs the way it feels in person.', tags: ['Safety audit', 'Supply kit', 'Styling'] },\n      { title: 'Listing and marketing', img: R('images/bedroom-sun.jpg'), alt: 'A bedroom in warm afternoon light', text: 'Professional photography and plainly written listings on Airbnb, Vrbo and our direct-booking site, refreshed every season so the photos match the house.', tags: ['Photography', 'Airbnb', 'Vrbo', 'Direct booking'] },\n      { title: 'Revenue management', img: R('images/villa-dusk.jpg'), alt: 'A modern beach house at dusk', text: 'Nightly rates set against local demand, events and booking pace, then reviewed by a person every week. Minimum stays and gap nights are tuned by season.', tags: ['Dynamic pricing', 'Weekly review'] },\n      { title:
