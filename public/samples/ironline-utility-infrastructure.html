g:.16em;text-transform:uppercase;color:var(--mute)\">TRIR\u003c/div>\u003c/div>\n\u003cdiv style=\"background:var(--ink2);padding:22px 18px\">\u003cdiv style=\"font-size:clamp(24px,2.6vw,36px);font-weight:800;letter-spacing:-.02em;color:#fff\">1.4M\u003c/div>\u003cdiv style=\"margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)\">Hrs since lost time\u003c/div>\u003c/div>\n\u003cdiv style=\"background:var(--ink2);padding:22px 18px\">\u003cdiv style=\"font-size:clamp(24px,2.6vw,36px);font-weight:800;letter-spacing:-.02em;color:#fff\">100%\u003c/div>\u003cdiv style=\"margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)\">OSHA 30 foremen\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"200\" style=\"margin-top:28px;display:flex;flex-wrap:wrap;gap:8px;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cspan style=\"border:1px solid var(--line);padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#C3C1BB\">ISNETWORLD\u003c/span>\n\u003cspan style=\"border:1px solid var(--line);padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#C3C1BB\">AVETTA\u003c/span>\n\u003cspan style=\"border:1px solid var(--line);padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#C3C1BB\">NCCCO OPERATORS\u003c/span>\n\u003cspan style=\"border:1px solid var(--line);padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#C3C1BB\">IBEW SIGNATORY\u003c/span>\n\u003cspan style=\"border:1px solid var(--line);padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#C3C1BB\">DOT SMS REGISTERED\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"company\" style=\"background:var(--paper);color:#151615;padding:clamp(72px,9vw,150px) clamp(18px,4vw,44px)\">\n\u003cdiv style=\"max-width:1440px;margin:0 auto\">\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(36px,5vw,80px);align-items:center\" data-stack=\"\">\n\u003cdiv data-reveal=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cdiv style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\u003cspan style=\"width:28px;height:1px;background:var(--accent)\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9A3C17\">05 — The company\u003c/span>\u003c/div>\n\u003ch2 style=\"font-size:clamp(32px,4.8vw,70px);line-height:.98;letter-spacing:-.025em;font-weight:800;text-transform:uppercase;max-width:15ch\">Four decades on the same corridors.\u003c/h2>\n\u003cp style=\"margin-top:26px;max-width:56ch;font-size:clamp(15.5px,1.2vw,18px);line-height:1.7;color:#43443F\">Ironline started in 1978 with two bucket trucks and a contract to maintain 60 miles of rural distribution outside Columbus. We still hold that contract. What grew around it is a 340-person organization that utilities call when the work is complicated, the corridor is live, and the schedule has no slack in it.\u003c/p>\n\u003cp style=\"margin-top:18px;max-width:56ch;font-size:clamp(15.5px,1.2vw,18px);line-height:1.7;color:#43443F\">Our general foremen average nineteen years with the company. That continuity is the product — it is what lets an owner hand us a difficult scope and get back a crew that has already built it twice.\u003c/p>\n\u003cdiv style=\"margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px;border-top:1px solid rgba(21,22,21,.16);padding-top:26px\">\n\u003cdiv>\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7A7B75;margin-bottom:8px\">Founded\u003c/div>\u003cdiv style=\"font-size:17px;font-weight:700\">1978, Columbus OH\u003c/div>\u003c/div>\n\u003cdiv>\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7A7B75;margin-bottom:8px\">Ownership\u003c/div>\u003cdiv style=\"font-size:17px;font-weight:700\">Employee-owned\u003c/div>\u003c/div>\n\u003cdiv>\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7A7B75;margin-bottom:8px\">Avg. tenure\u003c/div>\u003cdiv style=\"font-size:17px;font-weight:700\">19 yrs, general foremen\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"120\" style=\"display:grid;grid-template-columns:1.25fr .85fr;gap:clamp(12px,1.6vw,20px);align-items:end;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cfigure style=\"position:relative;overflow:hidden;aspect-ratio:3/4;background:#DEDBD4\">\n\u003cimg loading=\"lazy\" decoding=\"async\" src=\"ironline-utility-infrastructure/7aadf9d28104.webp\" alt=\"Ironline lineman working from an elevated bucket beside a distribution pole\" style=\"width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:scale(1.05)\">\n\u003c/figure>\n\u003cfigure style=\"position:relative;overflow:hidden;aspect-ratio:1/1;background:#DEDBD4\">\n\u003cimg loading=\"lazy\" decoding=\"async\" src=\"ironline-utility-infrastructure/77e530a3eee8.webp\" alt=\"Transmission towers crossing open farmland alongside wind turbines\" style=\"width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:scale(1.05)\">\n\u003c/figure>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"margin-top:clamp(64px,8vw,130px);border-top:1px solid rgba(21,22,21,.16);padding-top:clamp(34px,4vw,56px)\">\n\u003cdiv data-reveal=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap;margin-bottom:clamp(28px,3.4vw,46px);opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003ch3 style=\"font-size:clamp(26px,3.4vw,46px);line-height:1;letter-spacing:-.02em;font-weight:800;text-transform:uppercase;max-width:18ch\">How a job moves through Ironline\u003c/h3>\n\u003cp style=\"flex:0 1 380px;font-size:15.5px;line-height:1.65;color:#5A5B55\">Five stages, one superintendent, one document trail. Owners see the same reporting format from kickoff through closeout.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:rgba(21,22,21,.16);border:1px solid rgba(21,22,21,.16)\">\n\u003cdiv data-reveal=\"\" style=\"background:var(--paper);padding:clamp(24px,2.6vw,34px) clamp(18px,2vw,26px);transition:background .4s ease;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1),background .4s ease\" style-hover=\"background:#E7E4DD\">\n\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#9A3C17;margin-bottom:26px\">01\u003c/div>\n\u003ch4 style=\"font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em\">Plan\u003c/h4>\n\u003cp style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#5A5B55\">Site walk, constructability review and a schedule built against real crew availability.\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"70\" style=\"background:var(--paper);padding:clamp(24px,2.6vw,34px) clamp(18px,2vw,26px);opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1),background .4s ease\" style-hover=\"background:#E7E4DD\">\n\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#9A3C17;margin-bottom:26px\">02\u003c/div>\n\u003ch4 style=\"font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em\">Engineer\u003c/h4>\n\u003cp style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#5A5B55\">Structure loading, foundation design and outage sequencing stamped and coordinated.\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"140\" style=\"background:var(--paper);padding:clamp(24px,2.6vw,34px) clamp(18px,2vw,26px);opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1),background .4s ease\" style-hover=\"background:#E7E4DD\">\n\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#9A3C17;margin-bottom:26px\">03\u003c/div>\n\u003ch4 style=\"font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em\">Build\u003c/h4>\n\u003cp style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#5A5B55\">Self-performed civil and electrical, daily progress reporting, weekly owner walk.\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"210\" style=\"background:var(--paper);padding:clamp(24px,2.6vw,34px) clamp(18px,2vw,26px);opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1),background .4s ease\" style-hover=\"background:#E7E4DD\">\n\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#9A3C17;margin-bottom:26px\">04\u003c/div>\n\u003ch4 style=\"font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em\">Verify\u003c/h4>\n\u003cp style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#5A5B55\">Relay and continuity testing, punch resolution, third-party QA where specified.\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"280\" style=\"background:var(--paper);padding:clamp(24px,2.6vw,34px) clamp(18px,2vw,26px);opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1),background .4s ease\" style-hover=\"background:#E7E4DD\">\n\u003cdiv style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#9A3C17;margin-bottom:26px\">05\u003c/div>\n\u003ch4 style=\"font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em\">Energize\u003c/h4>\n\u003cp style=\"margin-top:10px;font-size:14px;line-height:1.6;color:#5A5B55\">Switching executed with operations, as-builts and closeout delivered in ten days.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"coverage\" style=\"background:var(--ink);padding:clamp(72px,9vw,150px) clamp(18px,4vw,44px)\">\n\u003cdiv style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:clamp(36px,5vw,80px);align-items:center\" data-stack=\"\">\n\u003cdiv data-reveal=\"\" style=\"opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cdiv style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\u003cspan style=\"width:28px;height:1px;background:var(--accent)\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2)\">06 — Coverage\u003c/span>\u003c/div>\n\u003ch2 style=\"font-size:clamp(32px,4.6vw,66px);line-height:.98;letter-spacing:-.025em;font-weight:800;text-transform:uppercase;color:#fff;max-width:14ch\">Four hubs. Seven states.\u003c/h2>\n\u003cp style=\"margin-top:24px;max-width:52ch;font-size:clamp(15px,1.15vw,17px);line-height:1.68;color:var(--mute)\">Crews and material are staged so that no point in our territory sits more than four driving hours from an Ironline yard. Storm work is dispatched from whichever hub is upwind.\u003c/p>\n\u003cdiv style=\"margin-top:clamp(28px,3.4vw,44px);border-top:1px solid var(--line)\">\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">Ohio\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">HQ · 680 circuit mi\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">Indiana\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">HUB · 415 circuit mi\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">Pennsylvania\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">HUB · 310 circuit mi\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">Kentucky\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">HUB · 265 circuit mi\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">West Virginia\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">FIELD · 140 circuit mi\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">Michigan\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">FIELD · 95 circuit mi\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);transition:padding-left .35s ease\" style-hover=\"padding-left:10px\">\u003cspan style=\"font-size:16px;font-weight:600;color:#EEECE7\">Tennessee\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)\">FIELD · 35 circuit mi\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv data-reveal=\"\" data-delay=\"140\" style=\"position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:#101111;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);background-size:24px 24px;overflow:hidden;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cdiv style=\"position:absolute;left:34%;top:34%;width:38%;height:1px;background:rgba(224,86,42,.45);transform-origin:0 50%;transform:rotate(7deg)\">\u003c/div>\n\u003cdiv style=\"position:absolute;left:40%;top:64%;width:22%;height:1px;background:rgba(224,86,42,.45);transform-origin:0 50%;transform:rotate(-46deg)\">\u003c/div>\n\u003cdiv style=\"position:absolute;left:52%;top:46%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px\">\u003cspan style=\"width:10px;height:10px;background:var(--accent);border-radius:50%;animation:irPulse 3s infinite\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#fff;white-space:nowrap\">COLUMBUS OH · HQ\u003c/span>\u003c/div>\n\u003cdiv style=\"position:absolute;left:34%;top:34%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px\">\u003cspan style=\"width:7px;height:7px;background:#EEECE7;border-radius:50%\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#C3C1BB;white-space:nowrap\">FORT WAYNE IN\u003c/span>\u003c/div>\n\u003cdiv style=\"position:absolute;left:72%;top:36%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px\">\u003cspan style=\"width:7px;height:7px;background:#EEECE7;border-radius:50%\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#C3C1BB;white-space:nowrap\">PITTSBURGH PA\u003c/span>\u003c/div>\n\u003cdiv style=\"position:absolute;left:40%;top:64%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px\">\u003cspan style=\"width:7px;height:7px;background:#EEECE7;border-radius:50%\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#C3C1BB;white-space:nowrap\">LOUISVILLE KY\u003c/span>\u003c/div>\n\u003cdiv style=\"position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);background:rgba(11,12,12,.7);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8E8C86\">\u003cspan>Operating footprint — schematic\u003c/span>\u003cspan>4 hr max response radius\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection aria-label=\"Client feedback\" style=\"background:var(--ink2);border-top:1px solid var(--line);padding:clamp(72px,9vw,140px) clamp(18px,4vw,44px)\">\n\u003cdiv style=\"max-width:1440px;margin:0 auto\">\n\u003cdiv data-reveal=\"\" style=\"display:flex;align-items:center;gap:12px;margin-bottom:clamp(32px,4vw,52px);opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\u003cspan style=\"width:28px;height:1px;background:var(--accent)\">\u003c/span>\u003cspan style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2)\">07 — What owners say\u003c/span>\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)\">\n\u003cfigure data-reveal=\"\" style=\"background:var(--ink2);padding:clamp(28px,3vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:30px;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cblockquote style=\"margin:0;font-size:clamp(18px,1.6vw,23px);line-height:1.42;font-weight:500;letter-spacing:-.012em;color:#fff\">“Ironline held our outage window to the hour on a river crossing two other bidders called impossible. Their planning package was the most complete we have received.”\u003c/blockquote>\n\u003cfigcaption style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.9\">\u003cspan style=\"color:#EEECE7;display:block\">Director, Transmission Operations\u003c/span>Meridian Power · 138 kV crossing\u003c/figcaption>\n\u003c/figure>\n\u003cfigure data-reveal=\"\" data-delay=\"100\" style=\"background:var(--ink2);padding:clamp(28px,3vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:30px;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cblockquote style=\"margin:0;font-size:clamp(18px,1.6vw,23px);line-height:1.42;font-weight:500;letter-spacing:-.012em;color:#fff\">“Four substation packages, the same superintendent every time, 61,000 man-hours and zero recordables. That consistency is why they stay on our short list.”\u003c/blockquote>\n\u003cfigcaption style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.9\">\u003cspan style=\"color:#EEECE7;display:block\">VP, Capital Projects\u003c/span>Cuyahoga Municipal Light\u003c/figcaption>\n\u003c/figure>\n\u003cfigure data-reveal=\"\" data-delay=\"200\" style=\"background:var(--ink2);padding:clamp(28px,3vw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:30px;opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)\">\n\u003cblockquote style=\"margin:0;font-size:clamp(18px,1.6vw,23px);line-height:1.42;font-weight:500;letter-spacing:-.012em;color:#fff\">“Fourteen hours after the ice storm they had 118 linemen staged in our yard. They did not leave until the last service was restored.”\u003c/blockquote>\n\u003cfigcaption style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.9\">\u003cspan style=\"color:#EEECE7;display:block\">Emergency Operations Manager\u003c/span>Allegheny County Public Works\u003c/figcaption>\n\u003c/figure>\n\u003c/div>\n\n\u003cdiv style=\"margin-top:clamp(44px,5vw,72px);overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0\">\n\u003cdiv style=\"display:flex;width:max-content;gap:56px;animation:irMarquee 42s linear infinite;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6E6C67
