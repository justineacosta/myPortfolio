er */\n    --motion-normal:0ms; /* @kind other */\n    --motion-slow:0ms; /* @kind other */\n    --motion-deliberate:0ms; /* @kind other */\n  }\n  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}\n}\n\n/* App-surface tokens. The marketing site floors on --color-canvas; the application\n   floors one step darker (--color-surface-soft) so panels can sit *above* it in\n   canvas. Light theme lives here; dark overrides live in theme-dark.css. */\n:root{\n/* Surfaces */\n--app-canvas:#f5f0e8;          /* page floor */\n--app-surface:#faf9f5;         /* panels, cards, table body */\n--app-raised:#faf9f5;          /* popovers, dropdowns, modals (+ shadow) */\n--app-sunken:#efe9de;          /* table headers, inset wells, code */\n--app-hover:#efe9de;           /* row / item hover */\n--app-selected:#f3e4dd;        /* selected row, active nav item */\n--app-selected-strong:#ead5cb; /* multi-select, drag target */\n--app-scrim:rgba(20,20,19,0.35);\n\n/* Chrome */\n--app-topbar-bg:#faf9f5;\n--app-sidebar-bg:#f5f0e8;\n--app-code-bg:#181715;         /* code never inverts — always dark */\n\n/* Semantic aliases requested by the UI/UX master prompt */\n--background-default:var(--app-canvas);\n--background-subtle:var(--app-sunken);\n--background-elevated:var(--app-raised);\n--foreground-default:var(--color-ink);\n--foreground-muted:var(--color-body);\n--foreground-subtle:var(--color-muted);\n--foreground-disabled:var(--color-muted-soft);\n--border-strong:#d6cdc0;\n--action-destructive:var(--color-error);\n--action-destructive-fg:#ffffff;\n--status-info:var(--color-accent-teal);\n\n/* Status surfaces — 10% tints of each status colour on the light floor */\n--status-success-bg:#e6f2e6;\n--status-warning-bg:#f7efd9;\n--status-error-bg:#f7e4e4;\n--status-info-bg:#e2f1ee;\n--status-success-fg:#2f6b3c;\n--status-warning-fg:#7a5c08;\n--status-error-fg:#8f2f2f;\n--status-info-fg:#2f6b60;\n\n/* Focus */\n- witchgear\">\u003c/image-slot>\n          \u003c/div>\n          \u003cdiv style=\"margin-top:26px;display:flex;align-items:baseline;gap:14px\">\n            \u003cspan style=\"font:400 13px/1.4 var(--font-mono);color:#e8a55a\">{{ activeStep.n }}\u003c/span>\n            \u003cspan style=\"font:500 10px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">{{ activeStep.d }}\u003c/span>\n          \u003c/div>\n          \u003ch3 style=\"margin:14px 0 0;font:400 clamp(24px,2.4vw,36px)/1.1 var(--font-serif-display);letter-spacing:-0.025em;color:#faf9f5;text-wrap:balance\">{{ activeStep.t }}\u003c/h3>\n          \u003cp style=\"margin:18px 0 0;max-width:52ch;font:400 clamp(14px,1.05vw,16px)/1.68 var(--font-sans);color:#a09d96\">{{ activeStep.body }}\u003c/p>\n          \u003cdiv style=\"margin-top:26px;border-top:1px solid rgba(250,249,245,0.12);padding-top:18px;display:flex;flex-wrap:wrap;gap:8px\">\n            \u003csc-for list=\"{{ activeStep.specs }}\" as=\"sp\" hint-placeholder-count=\"3\">\n              \u003cspan style=\"font:400 11px/1 var(--font-mono);color:#c4c0b7;border:1px solid rgba(250,249,245,0.16);padding:7px 11px;border-radius:2px\">{{ sp }}\u003c/span>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection style=\"background:#141413;padding:clamp(80px,10vw,160px) clamp(20px,4vw,56px);border-top:1px solid rgba(250,249,245,0.10);position:relative;overflow:hidden\">\n    \u003cdiv style=\"position:absolute;inset:0;display:flex;pointer-events:none;opacity:0.5\">\n      \u003csc-for list=\"{{ bgCols }}\" as=\"c\" hint-placeholder-count=\"16\">\n        \u003cdiv style=\"flex:1;border-right:1px solid rgba(250,249,245,0.05)\">\u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;align-items:flex-end;gap:clamp(3px,0.6vw,9px);padding:0 clamp(20px,4vw,56px) to=\"{{ i.v }}\" data-count-dec=\"{{ i.dec }}\">{{ i.vt }}\u003c/span>\u003cspan style=\"font-size:0.34em;color:#5db8a6\">{{ i.suf }}\u003c/span>\n            \u003c/div>\n            \u003cdiv style=\"margin-top:16px;font:500 10px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:#faf9f5\">{{ i.k }}\u003c/div>\n            \u003cdiv style=\"margin-top:10px;font:400 11px/1.6 var(--font-mono);color:#6c6a64;max-width:26ch\">{{ i.note }}\u003c/div>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection style=\"background:#faf9f5;padding:clamp(80px,10vw,150px) clamp(20px,4vw,56px)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto\">\n      \u003cdiv data-reveal=\"0\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(30px,4vw,80px);align-items:start;opacity:0;transform:translateY(20px);transition:opacity 800ms cubic-bezier(.2,.7,.2,1),transform 800ms cubic-bezier(.2,.7,.2,1)\">\n        \u003cdiv>\n          \u003cdiv style=\"font:500 12px/1.4 var(--font-sans);letter-spacing:2px;text-transform:uppercase;color:#cc785c\">Why Meridian\u003c/div>\n          \u003ch2 style=\"margin:24px 0 0;max-width:15ch;font:400 clamp(38px,5.2vw,82px)/1.02 var(--font-serif-display);letter-spacing:-0.03em;color:#141413;text-wrap:balance\">Engineered for the long term.\u003c/h2>\n          \u003cp style=\"margin:28px 0 0;max-width:48ch;font:400 clamp(15px,1.15vw,17px)/1.7 var(--font-sans);color:#3d3d3a\">Most developers sell a system and hand the asset to a third-party service contractor. Meridian holds the engineering, the tax-equity structure, the construction management, and the twenty-five-year operations obligation under one roof. The team that models your production is the team accountable for it in year nineteen.\u003c/p>\n          \u003cdiv style=\"margin-top:34px;overflow:hidden;background:#efe9de;aspect-ratio:16/9\">\n            \u003cimage-slot id= -sans);color:#c4c0b7\">Let's evaluate your site, model the opportunity, and build the right energy strategy for your property.\u003c/p>\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            \u003ca href=\"#\" sc-camel-on-click=\"{{ goContact }}\" style=\"display:inline-flex;align-items:center;gap:12px;background:#cc785c;color:#ffffff;font:500 13px/1 var(--font-sans);letter-spacing:1.2px;text-transform:uppercase;padding:19px 26px;border-radius:2px;transition:background 180ms\" style-hover=\"background:#a9583e;color:#ffffff\">Request a Site Assessment \u003cspan style=\"font-size:14px\">→\u003c/span>\u003c/a>\n            \u003ca href=\"#\" sc-camel-on-click=\"{{ goContact }}\" style=\"display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(250,249,245,0.26);color:#faf9f5;font:500 13px/1 var(--font-sans);letter-spacing:1.2px;text-transform:uppercase;padding:19px 26px;border-radius:2px;transition:background 200ms,border-color 200ms\" style-hover=\"background:rgba(250,249,245,0.07);border-color:#faf9f5;color:#faf9f5\">Talk to an Energy Advisor\u003c/a>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{ isSolutions }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cmain style=\"padding-top:78px\">\n  \u003csection style=\"background:#141413;padding:clamp(70px,9vw,140px) clamp(20px,4vw,56px) clamp(50px,6vw,90px);border-bottom:1px solid rgba(250,249,245,0.10)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto\">\n      \u003cdiv style=\"font:500 12px/1.4 var(--font-sans);letter-spacing:2px;text-transform:uppercase;color:#5db8a6\">Solutions\u003c/div>\n      \u003ch1 style=\"margin:26px 0 0;max-width:20ch;font:400 clamp(40px,6.6vw,110px)/0.98 var(--font-serif-display);letter-spacing:-0.035em;color:#faf9f5;text-wrap:balance\">One platform. Every energy asset.\u003c/h1>\n      \u003cp style=\"margin:32px 0 0;max-width:58ch;fon ng:clamp(70px,9vw,140px) clamp(20px,4vw,56px) clamp(50px,6vw,90px);border-bottom:1px solid rgba(250,249,245,0.10)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto\">\n      \u003cdiv style=\"font:500 12px/1.4 var(--font-sans);letter-spacing:2px;text-transform:uppercase;color:#5db8a6\">Process\u003c/div>\n      \u003ch1 style=\"margin:26px 0 0;max-width:22ch;font:400 clamp(40px,6.4vw,106px)/0.98 var(--font-serif-display);letter-spacing:-0.035em;color:#faf9f5;text-wrap:balance\">From site survey to 25 years of operations.\u003c/h1>\n      \u003cp style=\"margin:32px 0 0;max-width:58ch;font:400 clamp(15px,1.2vw,18px)/1.68 var(--font-sans);color:#a09d96\">Nine to thirteen months from first survey to commissioning, then a quarter century of monitored operation. Every stage below has a named owner inside Meridian and a contracted duration.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n  \u003csection style=\"background:#181715;padding:0 clamp(20px,4vw,56px) clamp(80px,10vw,150px)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto\">\n      \u003csc-for list=\"{{ process }}\" as=\"s\" hint-placeholder-count=\"6\">\n        \u003cdiv data-reveal=\"0\" style=\"display:grid;grid-template-columns:minmax(60px,0.5fr) minmax(220px,2.4fr) minmax(220px,3fr) minmax(90px,0.7fr);gap:clamp(20px,3vw,52px);padding:clamp(32px,4vw,58px) 0;border-bottom:1px solid rgba(250,249,245,0.10);opacity:0;transform:translateY(22px);transition:opacity 850ms cubic-bezier(.2,.7,.2,1),transform 850ms cubic-bezier(.2,.7,.2,1)\">\n          \u003cdiv style=\"font:400 clamp(24px,2.4vw,36px)/1 var(--font-serif-display);letter-spacing:-0.03em;color:#3d3d3a\">{{ s.n }}\u003c/div>\n          \u003cdiv>\n            \u003ch2 style=\"margin:0;font:400 clamp(22px,2.2vw,32px)/1.12 var(--font-serif-display);letter-spacing:-0.022em;color:#faf9f5;text-wrap:balance\">{{ s.t }}\u003c/h2>\n            \u003cdiv style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:7px\">\n              \u003csc-for list=\"{{ s.specs }}\" as=\"sp\" hint-placeholder-count=\"3\">\n                \u003cspan style=\"font:400 11px/1 var(--font-mono);color:#c4c0b7;border:1px solid rgba(250,249,245,0.16);padding:6px 10px;border-radius:2px\">{{ sp }}\u003c/span>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/div>\n          \u003cp style=\"margin:0;max-width:54ch;font:400 clamp(14px,1.05vw,16px)/1.7 var(--font-sans);color:#a09d96\">{{ s.body }}\u003c/p>\n          \u003cdiv style=\"text-align:right\">\n            \u003cdiv style=\"font:400 13px/1.4 var(--font-mono);color:#e8a55a\">{{ s.d }}\u003c/div>\n            \u003cdiv style=\"margin-top:6px;font:500 10px/1.4 var(--font-sans);letter-spacing:1.4px;text-transform:uppercase;color:#6c6a64\">{{ s.owner }}\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cmain style=\"padding-top:78px\">\n  \u003csection style=\"background:#141413;padding:clamp(70px,9vw,140px) clamp(20px,4vw,56px) clamp(50px,6vw,90px)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto\">\n      \u003cdiv style=\"font:500 12px/1.4 var(--font-sans);letter-spacing:2px;text-transform:uppercase;color:#5db8a6\">About\u003c/div>\n      \u003ch1 style=\"margin:26px 0 0;max-width:20ch;font:400 clamp(40px,6.4vw,106px)/0.98 var(--font-serif-display);letter-spacing:-0.035em;color:#faf9f5;text-wrap:balance\">An energy operator, not an installer.\u003c/h1>\n      \u003cdiv style=\"margin-top:clamp(36px,4.4vw,70px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,76px);align-items:start\">\n        \u003cp style=\"margin:0;max-width:54ch;font:400 clamp(15px,1.2vw,18px)/1.7 var(--font-sans);color:#c4c0b7\">Meridian Energy Infrastructure was founded in Houston in 2009 to develop commercial-scale generation for industrial property owners who were being underserved by residential installers and ignored by utility-scale developers. Seventeen years later we hold 312 MW under management across five states, and we still operate every asset we have ever built.\u003c/p>\n        \u003cp style=\"margin:0;max-width:54ch;font:400 clamp(14px,1.05vw,16px)/1.7 var(--font-sans);color:#a09d96\">Our structure is deliberate. Engineering, financial modelling, permitting, construction management, and operations sit in one company with one balance sheet. That means a single contract, a single accountable party, and production guarantees we carry ourselves rather than pass to a service vendor. It also means we decline projects where the numbers do not work — roughly one in three sites we survey.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection style=\"background:#181715\">\n    \u003cdiv style=\"position:relative;height:clamp(280px,40vw,560px);overflow:hidden\">\n      \u003cdiv data-parallax=\"0.10\" style=\"position:absolute;inset:-12% 0;will-change:transform\">\n        \u003cimage-slot id=\"mrd-about\" shape=\"rect\" fit=\"cover\" src=\"{{ imgAbout }}\" placeholder=\"Wide — Gulf Coast industrial site or operations centre\">\u003c/image-slot>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection style=\"background:#181715;padding:clamp(60px,7vw,110px) clamp(20px,4vw,56px) clamp(80px,10vw,150px)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(30px,4vw,80px);align-items:start\">\n      \u003cdiv>\n        \u003ch2 style=\"margin:0;max-width:16ch;font:400 clamp(30px,3.6vw,54px)/1.06 var(--font-serif-display);letter-spacing:-0.028em;color:#faf9f5;text-wrap:balance\">Capabilities held in house.\u003c/h2>\n        \u003cdiv style=\"margin-top:34px;border-top:1px solid rgba(250,249,245,0.14)\">\n          \u003csc-for list=\"{{ whyUs }}\" as=\"w\" hint-placeholder-count=\"7\">\n            \u003cdiv style=\"display:grid;grid-template-columns:40px 1fr;gap:18px;padding:20px 0;border-bottom:1px solid rgba(250,249,245,0.10);align-items:baseline\">\n              \u003cspan style=\"font:400 12px/1.4 var(--font-mono);color:#6c6a64\">{{ w.n }}\u003c/span>\n              \u003cdiv>\n                \u003ch3 style=\"margin:0;font:500 clamp(15px,1.2vw,17px)/1.4 var(--font-sans);color:#faf9f5\">{{ w.t }}\u003c/h3>\n                \u003cp style=\"margin:8px 0 0;max-width:50ch;font:400 14px/1.6 var(--font-sans);color:#8e8b82\">{{ w.d }}\u003c/p>\n              \u003c/div>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch2 style=\"margin:0;font:400 clamp(30px,3.6vw,54px)/1.06 var(--font-serif-display);letter-spacing:-0.028em;color:#faf9f5\">By the numbers.\u003c/h2>\n        \u003cdiv style=\"margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:rgba(250,249,245,0.12);border:1px solid rgba(250,249,245,0.12)\">\n          \u003csc-for list=\"{{ aboutStats }}\" as=\"s\" hint-placeholder-count=\"6\">\n            \u003cdiv style=\"background:#181715;padding:24px 20px\">\n              \u003cdiv style=\"font:400 clamp(26px,2.6vw,38px)/1 var(--font-serif-display);letter-spacing:-0.03em;color:#faf9f5\">{{ s.v }}\u003c/div>\n              \u003cdiv style=\"margin-top:10px;font:500 10px/1.4 var(--font-sans);letter-spacing:1.4px;text-transform:uppercase;color:#8e8b82\">{{ s.k }}\u003c/div>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n        \u003cdiv style=\"margin-top:34px;border-top:1px solid rgba(250,249,245,0.14);padding-top:22px\">\n          \u003cdiv style=\"font:500 10px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Offices\u003c/div>\n          \u003cdiv style=\"margin-top:16px;display:grid;gap:12px;font:400 13px/1.6 var(--font-mono);color:#c4c0b7\">\n            \u003cdiv>Houston, TX — 1420 Kirby Dr, Suite 300 \u003cspan style=\"color:#5db8a6\">· HQ\u003c/span>\u003c/div>\n            \u003cdiv>San Antonio, TX — 711 Navarro St, Suite 510\u003c/div>\n            \u003cdiv>Baton Rouge, LA — 8550 United Plaza Blvd\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cmain style=\"padding-top:78px\">\n  \u003csection style=\"background:#141413;padding:clamp(60px,8vw,120px) clamp(20px,4vw,56px) clamp(80px,10vw,150px);min-height:calc(100svh - 78px)\">\n    \u003cdiv style=\"max-width:1520px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(34px,4.5vw,88px);align-items:start\">\n      \u003cdiv>\n        \u003cdiv style=\"font:500 12px/1.4 var(--font-sans);letter-spacing:2px;text-transform:uppercase;color:#5db8a6\">Site assessment\u003c/div>\n        \u003ch1 style=\"margin:26px 0 0;max-width:16ch;font:400 clamp(38px,5.4vw,86px)/0.99 var(--font-serif-display);letter-spacing:-0.035em;color:#faf9f5;text-wrap:balance\">Send us your site. We'll send you a real number.\u003c/h1>\n        \u003cp style=\"margin:30px 0 0;max-width:50ch;font:400 clamp(15px,1.15vw,17px)/1.7 var(--font-sans);color:#a09d96\">Twenty business days from survey to a fully modelled proposal with locked interconnection capacity. No NDA required for round one, and we pay for the engineering study.\u003c/p>\n        \u003cdiv style=\"margin-top:40px;border-top:1px solid rgba(250,249,245,0.14)\">\n          \u003csc-for list=\"{{ contactMeta }}\" as=\"c\" hint-placeholder-count=\"4\">\n            \u003cdiv style=\"display:grid;grid-template-columns:130px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid rgba(250,249,245,0.10)\">\n              \u003cspan style=\"font:500 10px/1.5 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">{{ c.k }}\u00 #6c6a64\">{{ f.hint }}\u003c/span>\n                    \u003c/label>\n                  \u003c/sc-for>\n                \u003c/div>\n              \u003c/sc-if>\n\n              \u003cdiv style=\"margin-top:34px;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ wizNext }}\" style=\"cursor:pointer;border:0;background:#cc785c;color:#ffffff;font:500 12px/1 var(--font-sans);letter-spacing:1.2px;text-transform:uppercase;padding:17px 24px;border-radius:2px;transition:background 180ms\" style-hover=\"background:#a9583e\">{{ wizCta }} →\u003c/button>\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ wizBack }}\" style=\"cursor:pointer;background:transparent;border:0;font:500 11px/1 var(--font-sans);letter-spacing:1.3px;text-transform:uppercase;color:#6c6a64;padding:17px 4px;transition:color 200ms\" style-hover=\"color:#faf9f5\">Back\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/sc-if>\n\n          \u003csc-if value=\"{{ wizDone }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cdiv style=\"animation:mrd-slide 480ms cubic-bezier(.2,.7,.2,1) both\">\n              \u003cdiv style=\"font:500 10px/1.4 var(--font-sans);letter-spacing:1.6px;text-transform:uppercase;color:#e8a55a\">Preliminary model — {{ est.facility }}\u003c/div>\n              \u003ch2 style=\"margin:16px 0 0;max-width:20ch;font:400 clamp(26px,2.8vw,40px)/1.1 var(--font-serif-display);letter-spacing:-0.028em;color:#faf9f5;text-wrap:balance\">{{ est.headline }}\u003c/h2>\n              \u003cdiv style=\"margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:rgba(250,249,245,0.12);border:1px solid rgba(250,249,245,0.12)\">\n                \u003csc-for list=\"{{ est.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  \u003cdiv style=\"background:#181715;padding:22px 18px\">\n                    \u003cdiv style=\"font:400 clamp(24px,2.4vw,34px)/1 var(--font-serif-display);letter-spacing:-0.03em;color:#faf9f5\">{{ r.v }}\u003c/div>\n                    \u003cdiv style=\"margin-top:10px;font:500 10px/1.4 var(--font-sans);letter-spacing:1.4px;text-transform:uppercase;color:#8e8b82\">{{ r.k }}\u003c/div>\n                  \u003c/div>\n                \u003c/sc-for>\n              \u003c/div>\n              \u003cp style=\"margin:26px 0 0;max-width:46ch;font:400 13px/1.65 var(--font-sans);color:#8e8b82\">{{ est.note }}\u003c/p>\n              \u003cdiv style=\"margin-top:30px;display:flex;flex-wrap:wrap;gap:12px\">\n                \u003ca href=\"#\" sc-camel-on-click=\"{{ wizSubmit }}\" style=\"display:inline-flex;align-items:center;gap:10px;background:#cc785c;color:#ffffff;font:500 12px/1 var(--font-sans);letter-spacing:1.2px;text-transform:uppercase;padding:17px 24px;border-radius:2px;transition:background 180ms\" style-hover=\"background:#a9583e;color:#ffffff\">Book the site survey\u003c/a>\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ wizRestart }}\" style=\"cursor:pointer;background:transparent;border:1px solid rgba(250,249,245,0.22);color:#faf9f5;font:500 12px/1 var(--font-sans);letter-spacing:1.2px;text-transform:uppercase;padding:17px 24px;border-radius:2px;transition:background 200ms\" style-hover=\"background:rgba(250,249,245,0.07)\">Adjust inputs\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/sc-if>\n\n          \u003csc-if value=\"{{ wizSent }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cdiv style=\"animation:mrd-slide 480ms cubic-bezier(.2,.7,.2,1) both;padding:clamp(12px,2vw,28px) 0\">\n              \u003cdiv style=\"width:34px;height:34px;border:1px solid #5db8a6;display:flex;align-items:center;justify-content:center;color:#5db8a6;font-size:15px\">✓\u003c/div>\n              \u003ch2 style=\"margin:24px 0 0;max-width:20ch;font:400 clamp(26px,2.8vw,40px)/1.1 var(--font-serif-display);letter-spacing:-0.028em;color:#faf9f5;text-wrap:balance\">Survey request received.\u003c/h2>\n              \u003cp style=\"margin:18px 0 0;max-width:44ch;font:400 14px/1.7 var(--font-sans);color:#a09d96\">An energy advisor will confirm a drone survey window within one business day. You will receive the modelled proposal, interconnection assessment, and draft PPA pricing within twenty business days of the site visit.\u003c/p>\n              \u003cdiv style=\"margin-top:28px;font:400 12px/1.7 var(--font-mono);color:#6c6a64\">Reference {{ est.ref }}\u003cbr>projects@meridianenergy.com · (713) 555-0142\u003c/div>\n            \u003c/div>\n          \u003c/sc-if>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003c/sc-if>\n\n\u003cfooter style=\"background:#141413;border-top:1px solid rgba(250,249,245,0.12);padding:clamp(60px,7vw,110px) clamp(20px,4vw,56px) 34px\">\n  \u003cdiv style=\"max-width:1520px;margin:0 auto\">\n    \u003cdiv style=\"display:grid;gap:clamp(30px,3.4vw,56px);align-items:start;grid-template-columns: {{ footerGrid }}\">\n      \u003cdiv style=\"max-width:46ch;padding-right:clamp(0px,2vw,32px);grid-column: {{ footerBrandSpan }}\">\n        \u003cdiv style=\"display:flex;align-items:baseline;gap:10px\">\n          \u003cspan style=\"display:block;width:11px;height:11px;border:1px solid #5db8a6;transform:rotate(45deg)\">\u003c/span>\n          \u003cspan style=\"font:400 24px/1 var(--font-serif-display);letter-spacing:-0.02em;color:#faf9f5\">Meridian\u003c/span>\n          \u003cspan style=\"font:500 9px/1 var(--font-sans);letter-spacing:1.6px;text-transform:uppercase;color:#6c6a64\">Energy Infrastructure\u003c/span>\n        \u003c/div>\n        \u003cp style=\"margin:22px 0 0;font:400 14px/1.7 var(--font-sans);color:#8e8b82\">Meridian designs, finances, engineers, and operates commercial solar and battery storage assets across Texas and the Gulf Coast. We hold the tax-equity structure, the production warranty, and the twenty-five-year service obligation ourselves.\u003c/p>\n      \u003c/div>\n      \u003csc-for list=\"{{ footerCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n        \u003cdiv>\n          \u003cdiv style=\"font:500 10px/1.4 var(--font-sans);letter-spacing:1.6px;text-transform:uppercase;color:#faf9f5;padding-bottom:16px;border-bottom:1px solid rgba(250,249,245,0.12)\">{{ c.head }}\u003c/div>\n          \u003cdiv style=\"margin-top:16px;display:grid;gap:11px\">\n            \u003csc-for list=\"{{ c.items }}\" as=\"i\" hint-placeholder-count=\"5\">\n              \u003ca href=\"#\" sc-camel-on-click=\"{{ i.onClick }}\" style=\"font:400 13px/1.5 var(--font-sans);color:#8e8b82;transition:color 200ms\" style-hover=\"color:#faf9f5\">{{ i.label }}\u003c/a>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:clamp(44px,5vw,80px);padding-top:24px;border-top:1px solid rgba(250,249,245,0.12);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;font:400 11px/1.6 var(--font-mono);color:#6c6a64\">\n      \u003cspan>© 2026 Meridian Energy Infrastructure, LLC · TX TECL 34291 · NABCEP certified\u003c/span>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:22px\">\n        \u003ca href=\"#\" style=\"color:#6c6a64\" style-hover=\"color:#faf9f5\">LinkedIn\u003c/a>\n        \u003ca href=\"#\" style=\"color:#6c6a64\" style-hover=\"color:#faf9f5\">Privacy\u003c/a>\n        \u003ca href=\"#\" style=\"color:#6c6a64\" style-hover=\"color:#faf9f5\">Terms\u003c/a>\n        \u003ca href=\"#\" style=\"color:#6c6a64\" style-hover=\"color:#faf9f5\">Accessibility\u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/footer>\n\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nconst TEAL = '#5db8a6', CORAL = '#cc785c', INK = '#faf9f5', MUT = '#8e8b82';\n\nconst SOLUTIONS = [\n  { n: '01', t: 'Rooftop Solar', cta: 'Rooftop engineering',\n    d: 'Ballasted and mechanically attached arrays from 250 kW to 12 MW on membrane, metal, and built-up roofs. Structural review before design, not after.',\n    long: 'We model dead and live load against the existing deck, coordinate with the roof warranty holder before a single penetration, and sequence installation outside production hours. Racking is selected by wind zone and attachment condition, not by vendor relationship.',\n    specs: ['250 kW – 12 MW', 'Ballasted / attached', 'Roof warranty preserved'],\n    kv: [{ k: 'Capacity range', v: '250 kW – 12 MW' }, { k: 'Roof types', v: 'TPO · EPDM · SSMR' }, { k: 'Wind design', v: 'ASCE 7-22' }],\n    ph: 'Rooftop array on a distribution warehouse' },\n  { n: '02', t: 'Ground-Mount Solar', cta: 'Ground-mount siting',\n    d: 'Fixed-tilt and single-axis tracking on adjacent acreage, brownfield, and buffer land from 1 MW to 25 MW, with soil and interconnection studies up front.',\n    long: 'Geotechnical borings and soil resistivity drive pile design before layout is fixed. We prioritise brownfield and already-disturbed parcels, which shortens the environmental review and keeps productive land in use.',\n    specs: ['1 – 25 MW', 'Fixed tilt / tracker', 'Geotech-led pile design'],\n    kv: [{ k: 'Capacity range', v: '1 – 25 MW' }, { k: 'Land factor', v: '4.2 ac / MW' }, { k: 'Siting preference', v: 'Brownfield' }],\n    ph: 'Ground-mount array with tracker rows' },\n  { n: '03', t: 'Solar Carports & Canopies', cta: 'Canopy structures',\n    d: 'Structural canopies over employee, fleet, and customer parking that generate power, provide rated shade, and host charging without losing a single stall.',\n    long: 'Steel is engineered to local wind and, on the Gulf Coast, hurricane uplift. Drainage, lighting, and conduit for future charging are designed in from the start so the deck is never opened twice.',\n    specs: ['500 kW – 6 MW', '150 mph uplift rated', 'Zero stalls lost'],\n    kv: [{ k: 'Capacity range', v: '500 kW – 6 MW' }, { k: 'Wind rating', v: '150 mph' }, { k: 'Clear height', v: \"14' – 16'\" }],\n    ph: 'Solar canopy over a parking deck' },\n  { n: '04', t: 'Battery Energy Storage', cta: 'Storage economics',\n    d: 'Two- and four-hour lithium iron phosphate systems sized for demand-charge reduction, ERCOT ancillary participation, and critical-load ride-through.',\n    long: 'Storage is added only where the arbitrage, capacity, or resilience value clears the capital cost. We model dispatch against twelve months of your interval data before recommending a duration.',\n    specs: ['1 – 20 MWh', 'LFP chemistry', 'UL 9540A · NFPA 855'],\n    kv: [{ k: 'Energy range', v: '1 – 20 MWh' }, { k: 'Duration', v: '2 h / 4 h' }, { k: 'Compliance', v: 'NFPA 855' }],\n    ph: 'Battery enclosures on a concrete pad' },\n  { n: '05', t: 'EV Charging Infrastructure', cta: 'Charging design',\n    d: 'Level 2 fleet depots and DC fast charging sized against your solar production curve and existing service capacity, with behind-the-meter pairing.',\n    long: 'Charging is the fastest way to create a new demand peak. We coordinate charger dispatch with generation and storage so fleet electrification does not reset your ratchet.',\n    specs: ['L2 & 350 kW DCFC', 'Load-managed', 'OCPP 2.0.1'],\n    kv: [{ k: 'Port range', v: '4 – 120 ports' }, { k: 'Peak output', v: '350 kW' }, { k: 'Protocol', v: 'OCPP 2.0.1' }],\n    ph: 'DC fast chargers at a fleet depot' },\n  { n: '06', t: 'Energy Monitoring & Operations', cta: 'Operations scope',\n    d: 'Revenue-grade metering, 24/7 SCADA, semi-annual aerial infrared inspection, and a contracted 48-hour response on any production fault.',\n    long: 'Every asset we build enters our own operations centre. Monthly production reports reconcile against utility settlement data, so the number you see is the number the meter recorded.',\n    specs: ['24/7 SCADA', 'IR scan 2× yearly', '48 h response SLA'],\n    kv: [{ k: 'Monitoring', v: '24/7 SCADA' }, { k: 'Response SLA', v: '48 hours' }, { k: 'Uptime floor', v: '97.5%' }],\n    ph: 'Operations centre with monitoring displays' }\n];\n\nconst PROJECTS = [\n  { code: 'PROJECT 047', name: 'Alamo Ridge Manufacturing', loc: 'Seguin, TX', cap: '2.4 MW', sys: 'Rooftop', year: '2026', sector: 'Manufacturing',\n    ph: 'Rooftop array over two production halls',\n    stats: [{ v: '2.4 MW', k: 'Capacity' }, { v: '68%', k: 'Roof coverage' }, { v: '25 yr', k: 'PPA term' }, { v: '$2.4M', k: 'Projected savings' }],\n    body1: 'A 386,000 sq ft mechanically attached TPO roof at year nine of a twenty-year warranty, carrying rooftop units across two production halls. Demand charges accounted for 41 percent of the facility electricity bill, driven by a single compressed-air start each shift.',\n    body2: 'Meridian structured a 25-year power purchase agreement at 24 percent below the blended utility rate, with all roof work completed outside production hours. Month thirteen production came in 2 percent above model. The roof warranty was transferred intact and Meridian carries the structural and production guarantee.',\n    spec: [{ k: 'Modules', v: '4,214 × 580 W bifacial' }, { k: 'Inverters', v: '12 × 200 kW string' }, { k: 'Attachment', v: 'Mechanically attached' }, { k: 'Annual yield', v: '3,790 MWh' }, { k: 'Offset', v: '74% of site load' }, { k: 'Structure', v: 'IFC stamped, TX PE' }, { k: 'Commissioned', v: 'March 2026' }] },\n  { code: 'PROJECT 052', name: 'Port Arthur Distribution Center', loc: 'Port Arthur, TX', cap: '6.8 MW', sys: 'Rooftop', year: '2025', sector: 'Logistics',\n    ph: 'Aerial of a large distribution roof array',\n    stats: [{ v: '6.8 MW', k: 'Capacity' }, { v: '81%', k: 'Roof coverage' }, { v: '25 yr', k: 'PPA term' }, { v: '$7.1M', k: 'Projected savings' }],\n    body1: 'An 840,000 sq ft cross-dock facility in a 150 mph wind zone, operating twenty-two hours a day with refrigera 25 yr', k: 'PPA term' }, { v: '$2.9M', k: 'Projected savings' }],\n    body1: 'Eleven acres of undevelopable floodplain buffer on the south edge of campus, with a 12.47 kV distribution feeder at the property line and a public procurement process.',\n    body2: 'The array is fenced, screened, and instrumented as a teaching asset with live production data piped into the engineering curriculum. Procurement completed under a state cooperative contract, which removed nine weeks from the schedule.',\n    spec: [{ k: 'Modules', v: '4,480 × 580 W' }, { k: 'Racking', v: 'Fixed tilt, 25°' }, { k: 'Pile depth', v: \"8'-0\\\" driven\" }, { k: 'Annual yield', v: '4,090 MWh' }, { k: 'Offset', v: '31% of campus load' }, { k: 'Interconnection', v: '12.47 kV distribution' }, { k: 'Commissioned', v: 'November 2024' }] },\n  { code: 'PROJECT 061', name: 'Baton Rouge Cold Chain', loc: 'Baton Rouge, LA', cap: '2.2 MW + 8 MWh', sys: 'Rooftop + BESS', year: '2026', sector: 'Energy Storage',\n    ph: 'Cold storage facility with battery enclosures',\n    stats: [{ v: '2.2 MW', k: 'Solar capacity' }, { v: '8 MWh', k: 'Storage' }, { v: '4 h', k: 'Duration' }, { v: '$3.2M', k: 'Projected savings' }],\n    body1: 'A refrigerated distribution facility where a four-hour outage means product loss measured in millions. Demand charges and reliability were weighted equally in the business case.',\n    body2: 'A four-hour LFP system carries the full refrigeration load through a grid outage and shaves the facility peak by 1.8 MW. The system has islanded twice since commissioning, both times without operator intervention.',\n    spec: [{ k: 'Battery', v: '8 MWh LFP, 4 h' }, { k: 'Peak shaved', v: '1.8 MW' }, { k: 'Islanding', v: 'Full refrigeration load' }, { k: 'Compliance', v: 'NFPA 855, UL 9540A' }, { k: 'Annual yield', v: '3,410 MWh' }, { k: 'Dispatch', v: 'Meridian SCADA' }, { k: 'Commissioned', v: 'January 2026' }] },\n  { code: 'PROJECT 044', name: 'Corpus Christi Municipal Complex', loc: 'Corpus rty-attached' }, { k: 'Commissioned', v: 'April 2025' }] },\n  { code: 'PROJECT 063', name: 'Brazoria Polymer Works', loc: 'Freeport, TX', cap: '9.6 MW', sys: 'Ground-Mount', year: '2026', sector: 'Manufacturing',\n    ph: 'Large ground-mount array beside a chemical plant',\n    stats: [{ v: '9.6 MW', k: 'Capacity' }, { v: '41 ac', k: 'Land used' }, { v: '25 yr', k: 'PPA term' }, { v: '$11.8M', k: 'Projected savings' }],\n    body1: 'Forty-one acres of former process-water retention land inside the fence line of an operating polymer plant, requiring hot-work permitting and continuous process-safety coordination.',\n    body2: 'The largest asset in the Meridian portfolio and the first to interconnect at 138 kV transmission. Construction completed without a single process interruption or recordable safety incident across 94,000 site hours.',\n    spec: [{ k: 'Modules', v: '16,550 × 580 W' }, { k: 'Racking', v: 'Single-axis tracker' }, { k: 'Interconnection', v: '138 kV transmission' }, { k: 'Annual yield', v: '16,900 MWh' }, { k: 'Offset', v: '28% of plant load' }, { k: 'Site hours', v: '94,000, zero recordable' }, { k: 'Commissioned', v: 'May 2026' }] },\n  { code: 'PROJECT 066', name: 'Mobile Bay Resilience Hub', loc: 'Mobile, AL', cap: '12 MWh', sys: 'Standalone BESS', year: '2026', sector: 'Energy Storage',\n    ph: 'Standalone battery installation at a substation',\n    stats: [{ v: '12 MWh', k: 'Storage' }, { v: '3 MW', k: 'Power' }, { v: '4 h', k: 'Duration' }, { v: '$1.9M', k: 'Annual value' }],\n    body1: 'A standalone storage asset sited at a distribution substation serving a hospital district, developed with the local utility to defer a feeder upgrade.',\n    body2: 'The system provides peak capacity to the utility on weekday afternoons and reserves four hours of islanded supply for the hospital district during declared emergencies. Feeder reinforcement has been deferred at least seven years.',\n    spec: [{ k: 'Battery', v: '12 MWh LFP' }, { k: 'Power rat
