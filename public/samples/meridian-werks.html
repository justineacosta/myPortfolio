ent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n\u003c/style>\n\u003cscript src=\"meridian-werks/7d1ad60da19d.js\">\u003c/script>\n\u003cscript src=\"meridian-werks/fff26d081c8d.js\">\u003c/script>\n\u003cstyle>\n:root{--color-bg:#0B0C0D;--color-surface:#121416;--color-text:#ECE7DE;--color-accent:#8FA9C0;--color-accent-2:#8FA9C0;--color-divider: 0 auto;padding:0 clamp(18px,3.4vw,54px);height:clamp(64px,5.2vw,82px)\">\n    \u003ca href=\"#top\" style=\"display:flex;align-items:center;gap:11px;text-decoration:none;color:#ECE7DE;margin-right:auto\">\n      \u003cspan style=\"display:block;width:13px;height:13px;border:1px solid var(--volt);position:relative;flex:none\">\n        \u003cspan style=\"position:absolute;inset:3px;background:var(--volt)\">\u003c/span>\n      \u003c/span>\n      \u003cspan style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(15px,1.15vw,18px);letter-spacing:.2em;text-transform:uppercase;line-height:1\">Meridian Werks\u003c/span>\n    \u003c/a>\n    \u003cnav aria-label=\"Primary\" style=\"display:none;gap:clamp(16px,1.9vw,32px);align-items:center\" data-desk=\"1\">\n      \u003csc-for list=\"{{ links }}\" as=\"l\" hint-placeholder-count=\"6\">\n        \u003ca href=\"{{ l.href }}\" sc-camel-on-click=\"{{ l.onClick }}\" aria-current=\"{{ l.cur }}\" style=\"font-family:var(--font-heading);font-weight:600;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;color:{{ l.color }};transition:color .3s ease;white-space:nowrap;padding-bottom:4px;border-bottom:1px solid {{ l.rule }}\" style-hover=\"color:#B4FF39\">{{ l.label }}\u003c/a>\n      \u003c/sc-for>\n    \u003c/nav>\n    \u003ca href=\"#booking\" style=\"display:none;align-items:center;gap:10px;padding:12px 20px;border:1px solid var(--volt);color:var(--volt);text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;transition:background .35s cubic-bezier(.2,.7,.3,1),color .35s cubic-bezier(.2,.7,.3,1);white-space:nowrap\" style-hover=\"background:#B4FF39;color:#0B0C0D\" data-desk=\"1\">Book a Service\u003c/a>\n    \u003cbutton type=\"button\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Open menu\" aria-expanded=\"{{ menuOpen }}\" style=\"display:flex;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;padding:0 9px;background:transparent;border:1px solid rgba(236,231,222,.2);cursor:pointer;margin-left:auto\" data-mob=\"1\">\n      \u003cspan style=\"display:block;height:1px;background:#ECE7DE;width:100%\">\u003c/span>\n      \u003cspan style=\"display:block;height:1px;background:#ECE7DE;width:100%\">\u003c/span>\n    \u003c/button>\n  \u003c/div>\n\u003c/header>\n\u003csc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  \u003cdiv style=\"position:fixed;inset:0;z-index:300;background:#0B0C0D;display:flex;flex-direction:column;padding:clamp(18px,3.4vw,54px);animation:mwfade .4s cubic-bezier(.22,.8,.28,1)\">\n    \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;height:clamp(64px,5.2vw,82px);margin-top:calc(clamp(64px,5.2vw,82px) * -1)\">\n      \u003cspan style=\"font-family:var(--font-heading);font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase\">Meridian Werks\u003c/span>\n      \u003cbutton type=\"button\" sc-camel-on-click=\"{{ closeMenu }}\" aria-label=\"Close menu\" style=\"width:42px;height:42px;background:transparent;border:1px solid rgba(236,231,222,.2);color:#ECE7DE;font-size:20px;line-height:1;cursor:pointer;font-family:var(--font-body)\">×\u003c/button>\n    \u003c/div>\n    \u003cnav aria-label=\"Mobile\" style=\"display:flex;flex-direction:column;margin-top:auto;margin-bottom:auto;gap:2px\">\n      \u003csc-for list=\"{{ links }}\" as=\"l\" hint-placeholder-count=\"6\">\n        \u003ca href=\"{{ l.href }}\" sc-camel-on-click=\"{{ l.onClick }}\" style=\"display:flex;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid rgba(236,231,222,.1);text-decoration:none;color:#ECE7DE;font-family:var(--font-heading);font-weight:600;font-size:clamp(30px,8vw,46px);letter-spacing:-.01em;text-transform:uppercase;line-height:1\">\n          \u003cspan style=\"font-family:var(--font-body);font-size:11px;letter-spacing:.18em;color:var(--mut);flex:none\">{{ l.num }}\u003c/span>{{ l.label }}\n        \u003c/a>\n      \u003c/sc-for>\n    \u003c/nav>\n    \u003ca href=\"#booking\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;text-align:center;padding:19px;background:var(--volt);color:#0B0C0D;text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase\">Book a Service\u003c/a>\n  \u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{ showMobCta }}\" hint-placeholder-val=\"{{ false }}\">\n\u003ca href=\"#booking\" style=\"position:fixed;left:14px;right:14px;bottom:14px;z-index:180;display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;background:var(--volt);color:#0B0C0D;text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:mwfade .35s ease\" data-mobcta=\"1\">Book a Service\u003c/a>\n\u003c/sc-if>\n\u003cmain style=\"font-family:var(--font-body)\">\n\u003csection id=\"top\" data-screen-label=\"Hero\" style=\"position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden\">\n  \u003cdiv data-parallax=\"1\" style=\"position:absolute;top:-8%;left:0;right:0;height:116%;will-change:transform\">\n    \u003cdiv class=\"duotone\" style=\"position:absolute;inset:0;filter:brightness(.52) contrast(1.06)\">\n      \u003cimage-slot id=\"mw-hero\" src=\"{{ p01 }}\" credit=\"Chi Xiang / Unsplash\" credit-href=\"https://unsplash.com/@chixiang\" shape=\"rect\" fit=\"cover\" placeholder=\"Hero — premium vehicle inside the workshop bay, low light\">\u003c/image-slot>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,13,.88) 0%,rgba(11,12,13,.8) 45%,rgba(11,12,13,.86) 74%,#0B0C0D 100%);pointer-events:none\">\u003c/div>\n  \u003cdiv style=\"position:relative;flex:1;display:flex;align-items:flex-end;max-width:1680px;width:100%;margin:0 auto;padding:clamp(110px,12vw,150px) clamp(18px,3.4vw,54px) clamp(28px,3vw,44px)\">\n    \u003cdiv style=\"width:100%\">\n      \u003cp data-reveal=\"1\" style=\"display:flex;align-items:center;gap:12px;margin:0 0 clamp(20px,2.4vw,34px);font-size:clamp(10px,.82vw,11.5px);letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">\n        \u003cspan style=\"display:block;width:clamp(24px,3vw,52px);height:1px;background:var(--volt);flex:none\">\u003c/span>\n        Automotive Engineering • Service • Refinement\n      \u003c/p>\n      \u003ch1 data-reveal=\"1\" style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:clamp(52px,12.4vw,210px);line-height:.86;letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance\">\n        Engineered\u003cbr>to drive\u003cbr>\u003cspan style=\"color:var(--volt)\">better.\u003c/span>\n      \u003c/h1>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:clamp(24px,3vw,56px);margin-top:clamp(28px,3.4vw,52px)\">\n        \u003cp data-reveal=\"1\" style=\"margin:0;max-width:48ch;font-size:clamp(15px,1.15vw,18px);line-height:1.68;color:rgba(236,231,222,.78);text-wrap:pretty\">Specialist automotive service, diagnostics, performance, and vehicle refinement for owners who expect more from their machines.\u003c/p>\n        \u003cdiv data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          \u003ca href=\"#booking\" style=\"display:inline-flex;align-items:center;gap:12px;padding:17px 30px;background:var(--volt);color:#0B0C0D;text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:13.5px;letter-spacing:.18em;text-transform:uppercase;transition:transform .4s cubic-bezier(.2,.7,.3,1),box-shadow .4s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 14px 34px rgba(180,255,57,.22)\">Book a Service\u003c/a>\n          \u003ca href=\"#services-top\" style=\"display:inline-flex;align-items:center;gap:12px;pa e:clamp(24px,2.4vw,38px);line-height:1.04;text-transform:uppercase\">Stage II performance refinement\u003c/h3>\n        \u003cp style=\"margin:0 0 16px;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.68);text-wrap:pretty\">The owner did not want a louder car. He wanted the B58 to respond the way the chassis already promised — flat, immediate, and repeatable on a long drive rather than for one dyno pull.\u003c/p>\n        \u003cp style=\"margin:0;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.68);text-wrap:pretty\">We started with cooling and fuelling headroom, then rebuilt the damper and bushing package before touching calibration. Final figures were signed off after three road-test loops and a logged heat-soak run.\u003c/p>\n      \u003c/div>\n      \u003cdiv data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:rgba(236,231,222,.14);border:1px solid rgba(236,231,222,.14);min-width:0\">\n        \u003csc-for list=\"{{ buildMetrics }}\" as=\"b\" hint-placeholder-count=\"4\">\n          \u003cdiv style=\"background:#090A0B;padding:clamp(18px,2vw,30px);min-width:0\">\n            \u003cspan data-count=\"{{ b.v }}\" data-prefix=\"{{ b.prefix }}\" data-suffix=\"{{ b.suffix }}\" data-static=\"{{ b.static }}\" style=\"display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(24px,2.8vw,44px);line-height:1;letter-spacing:-.01em;color:#ECE7DE\">{{ b.seed }}\u003c/span>\n            \u003cspan style=\"display:block;margin-top:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(236,231,222,.45);text-wrap:pretty\">{{ b.l }}\u003c/span>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cdiv data-reveal=\"1\" style=\"min-width:0\">\n        \u003cp style=\"margin:0 0 16px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,231,222,.45)\">Work performed\u003c/p>\n        \u003cul style=\"list-style:none;margin:0;padding:0;display:grid;gap:0\">\n          \u003csc-for list=\"{{ buildWork }}\" as=\"w\" hint-placeholder-count=\"7\">\n            \u003cli style=\"display:flex;gap:14px;padding:11px 0;border-bottom:1px solid rgba(236,231,222,.1);font-size:14px;color:rgba(236,231,222,.74);line-height:1.5\">\n              \u003cspan style=\"color:var(--volt);flex:none;font-size:10px;letter-spacing:.1em;padding-top:4px\">{{ w.n }}\u003c/span>{{ w.t }}\n            \u003c/li>\n          \u003c/sc-for>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection data-screen-label=\"Process\" id=\"process\" style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,10vw,170px) clamp(18px,3.4vw,54px)\">\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(40px,5vw,100px);align-items:start\">\n    \u003cdiv data-reveal=\"1\" style=\"min-width:0;position:sticky;top:clamp(90px,8vw,130px)\">\n      \u003cp style=\"margin:0 0 clamp(20px,2.2vw,32px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">Our Approach\u003c/p>\n      \u003ch2 style=\"margin:0 0 28px;font-family:var(--font-heading);font-weight:600;font-size:clamp(38px,5.4vw,84px);line-height:.94;letter-spacing:-.02em;text-transform:uppercase\">Measured.\u003cbr>Diagnosed.\u003cbr>Executed.\u003c/h2>\n      \u003cp style=\"margin:0;max-width:44ch;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.62);text-wrap:pretty\">Four stages, in order, every time. No work begins before the findings are documented and approved.\u003c/p>\n    \u003c/div>\n    \u003col data-reveal=\"1\" style=\"list-style:none;margin:0;padding:0;min-width:0;border-top:1px solid rgba(236,231,222,.14)\">\n      \u003csc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n        \u003cli style=\"border-bottom:1px solid rgba(236,231,222,.14)\">\n          \u003cbutton type=\"button\" sc-camel-on-click=\"{{ st.onClick }}\" aria div>\n          \u003c/div>\n        \u003c/li>\n      \u003c/sc-for>\n    \u003c/ol>\n  \u003c/div>\n\u003c/section>\n\n\u003cheader id=\"workshop-top\" data-screen-label=\"Workshop Header\" style=\"max-width:1680px;margin:0 auto;padding:clamp(56px,7vw,120px) clamp(18px,3.4vw,54px) clamp(36px,4vw,64px)\">\n  \u003cp data-reveal=\"1\" style=\"display:flex;align-items:center;gap:12px;margin:0 0 clamp(20px,2.4vw,34px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">\n    \u003cspan style=\"display:block;width:clamp(24px,3vw,52px);height:1px;background:var(--volt);flex:none\">\u003c/span>\n    The Workshop\n  \u003c/p>\n  \u003ch2 data-reveal=\"1\" style=\"margin:0 0 clamp(28px,3vw,48px);font-family:var(--font-heading);font-weight:600;font-size:clamp(44px,8.4vw,155px);line-height:.88;letter-spacing:-.03em;text-transform:uppercase\">Where\u003cbr>precision\u003cbr>\u003cspan style=\"color:var(--volt)\">lives.\u003c/span>\u003c/h2>\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(24px,3vw,64px);align-items:end\">\n    \u003cp data-reveal=\"1\" style=\"margin:0;max-width:54ch;font-size:clamp(15px,1.15vw,18px);line-height:1.7;color:rgba(236,231,222,.72);text-wrap:pretty\">A converted port workshop on the Loodsweg, running since 2012. Six bays, a levelled alignment cell, a calibration room that stays quiet, and a bench that is powered whether or not there is a car on it.\u003c/p>\n    \u003cdl data-reveal=\"1\" style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:rgba(236,231,222,.14);border:1px solid rgba(236,231,222,.14);min-width:0\">\n      \u003csc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n        \u003cdiv style=\"background:#0B0C0D;padding:clamp(14px,1.6vw,22px);min-width:0\">\n          \u003cdt style=\"font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.4);margin-bottom:9px\">{{ f.l }}\u003c/dt>\n          \u003cdd style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:clamp(20px,2vw,32px);line-height:1;color:var(--volt)\">{{ f.v }}\u003c/dd>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/dl>\n  \u003c/div>\n\u003c/header>\n\n\u003csection id=\"gallery\" data-screen-label=\"Gallery\" aria-label=\"Workshop gallery\" style=\"max-width:1680px;margin:0 auto;padding:0 clamp(18px,3.4vw,54px) clamp(70px,9vw,150px)\">\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(10px,1.4vw,22px)\">\n    \u003csc-for list=\"{{ gallery }}\" as=\"g\" hint-placeholder-count=\"8\">\n      \u003cfigure data-reveal=\"1\" style=\"margin:0;grid-column:{{ g.col }};min-width:0\">\n        \u003cbutton type=\"button\" sc-camel-on-click=\"{{ g.open }}\" aria-label=\"{{ g.alt }}\" class=\"blueprint duotone\" style=\"display:block;width:100%;padding:0;border:1px solid rgba(236,231,222,.14);background:#111315;position:relative;aspect-ratio:{{ g.ar }};cursor:zoom-in;overflow:hidden\">\n          \u003cimage-slot id=\"{{ g.slot }}\" src=\"{{ g.img }}\" credit=\"{{ g.credit }}\" credit-href=\"{{ g.creditHref }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ g.alt }}\" style=\"pointer-events:none\">\u003c/image-slot>\n          \u003ci class=\"corner tl\">\u003c/i>\u003ci class=\"corner tr\">\u003c/i>\u003ci class=\"corner bl\">\u003c/i>\u003ci class=\"corner br\">\u003c/i>\n        \u003c/button>\n        \u003cfigcaption style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding-top:11px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(236,231,222,.42)\">\n          \u003cspan>{{ g.cap }}\u003c/span>\u003cspan style=\"color:rgba(236,231,222,.25)\">{{ g.n }}\u003c/span>\n        \u003c/figcaption>\n      \u003c/figure>\n    \u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"equipment\" data-screen-label=\"Equipment\" style=\"border-block:1px ;line-height:1.6;color:rgba(236,231,222,.58);text-wrap:pretty\">{{ e.d }}\u003c/span>\n            \u003cspan style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt);text-align:right\">{{ e.m }}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"visit\" data-screen-label=\"Visit\" style=\"max-width:1680px;margin:0 auto;padding:clamp(60px,8vw,140px) clamp(18px,3.4vw,54px)\">\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,4.4vw,90px);align-items:start\">\n    \u003cdiv data-reveal=\"1\" style=\"min-width:0\">\n      \u003cp style=\"margin:0 0 clamp(18px,2.2vw,30px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">Visit\u003c/p>\n      \u003ch2 style=\"margin:0 0 26px;font-family:var(--font-heading);font-weight:600;font-size:clamp(30px,4.2vw,70px);line-height:.96;letter-spacing:-.02em;text-transform:uppercase\">Loodsweg 14,\u003cbr>Rotterdam.\u003c/h2>\n      \u003cp style=\"margin:0 0 30px;max-width:46ch;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.66);text-wrap:pretty\">Reception is Unit B, second roller door. Parking inside the gate. If you are dropping a car outside hours, call ahead and we will leave the key box open.\u003c/p>\n      \u003cdl style=\"margin:0;display:grid;gap:0;border-top:1px solid rgba(236,231,222,.14)\">\n        \u003csc-for list=\"{{ visit }}\" as=\"v\" hint-placeholder-count=\"4\">\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(236,231,222,.1)\">\n            \u003cdt style=\"font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.4)\">{{ v.l }}\u003c/dt>\n            \u003cdd style=\"margin:0;font-size:14.5px;color:rgba(236,231,222,.78);text-align:right\">{{ v.v }}\u003c/dd>\n          \u00 "{{ capabilities }}\" as=\"c\" hint-placeholder-count=\"8\">\n        \u003cdiv style=\"background:#090A0B;padding:clamp(20px,2.2vw,34px);min-width:0;transition:background .4s ease\" style-hover=\"background:#101214\">\n          \u003cspan style=\"display:block;font-size:9.5px;letter-spacing:.18em;color:var(--volt);margin-bottom:clamp(26px,3vw,48px)\">{{ c.n }}\u003c/span>\n          \u003cspan style=\"display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(16px,1.35vw,21px);line-height:1.15;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance\">{{ c.t }}\u003c/span>\n          \u003cspan style=\"display:block;margin-top:10px;font-size:12.5px;line-height:1.6;color:rgba(236,231,222,.48);text-wrap:pretty\">{{ c.d }}\u003c/span>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection data-screen-label=\"Vehicle Specialties\" id=\"vehicles\" style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,10vw,170px) clamp(18px,3.4vw,54px)\">\n  \u003ch2 data-reveal=\"1\" style=\"margin:0 0 clamp(44px,5vw,80px);font-family:var(--font-heading);font-weight:600;font-size:clamp(34px,5vw,86px);line-height:.94;letter-spacing:-.02em;text-transform:uppercase\">Specialists in the machines\u003cbr>we work on.\u003c/h2>\n  \u003cdiv data-reveal=\"1\" style=\"border-top:1px solid rgba(236,231,222,.14)\">\n    \u003csc-for list=\"{{ specialties }}\" as=\"sp\" hint-placeholder-count=\"6\">\n      \u003cdiv sc-camel-on-mouse-enter=\"{{ sp.onEnter }}\" sc-camel-on-click=\"{{ sp.onEnter }}\" style=\"border-bottom:1px solid rgba(236,231,222,.14);padding:clamp(18px,2vw,30px) 0;cursor:pointer;transition:background .4s ease;background:{{ sp.bg }}\">\n        \u003cdiv style=\"display:grid;grid-template-columns:clamp(46px,5vw,96px) minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:baseline\">\n          \u003cspan style=\"font-family:var(--font-heading);font-weight:400;font-size:clamp(13px,1.05vw,16px);letter-spacing:.1em;color:rgba(236,231,222,.35)\">{{ sp.n }}\u003c/span>\n          \u003cdiv style=\"min-width:0\">\n            \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px\">\n              \u003ch3 style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:clamp(26px,3.6vw,62px);line-height:1;letter-spacing:-.015em;text-transform:uppercase;color:{{ sp.color }};transition:color .35s ease\">{{ sp.t }}\u003c/h3>\n              \u003cspan style=\"font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(236,231,222,.38)\">{{ sp.count }}\u003c/span>\n            \u003c/div>\n            \u003cdiv style=\"overflow:hidden;transition:max-height .5s cubic-bezier(.22,.8,.28,1),opacity .4s ease;max-height:{{ sp.maxH }};opacity:{{ sp.op }}\">\n              \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;padding-top:16px\">\n                \u003csc-for list=\"{{ sp.marques }}\" as=\"mk\" hint-placeholder-count=\"5\">\n                  \u003cspan style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:1px solid rgba(180,255,57,.34);color:var(--volt)\">{{ mk }}\u003c/span>\n                \u003c/sc-for>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\n\u003cheader id=\"about-top\" data-screen-label=\"About Header\" style=\"max-width:1680px;margin:0 auto;padding:clamp(56px,7vw,120px) clamp(18px,3.4vw,54px) clamp(50px,6vw,100px)\">\n  \u003cp data-reveal=\"1\" style=\"display:flex;align-items:center;gap:12px;margin:0 0 clamp(20px,2.4vw,34px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">\n    \u003cspan style=\"display:block;width:clamp(24px,3vw,52px);height:1px;background:var(--volt);flex:none\">\u003c/span>\n    About · Est. 2012\n  \u003c/p>\n  \u003ch2 data-reveal=\"1\" style=\"margin:0 0 clamp(30px,3.4vw,54px);font-family:var(--font-heading);font-weight:600;font-size:clamp(40px,7vw,128px);line-height:.9;letter-spacing:-.028em;text-transform:uppercase;max-width:18ch\">An independent workshop, run like an \u003cspan style=\"color:var(--volt)\">engineering office.\u003c/span>\u003c/h2>\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(24px,3vw,70px)\">\n    \u003cp data-reveal=\"1\" style=\"margin:0;max-width:52ch;font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:rgba(236,231,222,.74);text-wrap:pretty\">Meridian Werks began as a two-bay unit taking on the diagnostic work other garages had given up on. Fourteen years later the method has not changed: measure the car, write down what you found, and only then decide what to touch.\u003c/p>\n    \u003cp data-reveal=\"1\" style=\"margin:0;max-width:52ch;font-size:clamp(15px,1.15vw,18px);line-height:1.72;color:rgba(236,231,222,.55);text-wrap:pretty\">We work on roughly four hundred vehicles a year. Most are German, many are performance cars, some are fleets of vans, and a few are collections we have looked after since the first inspection.\u003c/p>\n  \u003c/div>\n\u003c/header>\n\n\u003csection id=\"founder\" data-screen-label=\"Founder\" style=\"border-block:1px solid rgba(236,231,222,.14);background:#090A0B\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:clamp(60px,8vw,150px) clamp(18px,3.4vw,54px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,4.4vw,100px);align-items:center\">\n    \u003cdiv data-reveal=\"1\" class=\"blueprint duotone\" style=\"position:relative;aspect-ratio:4/5;min-width:0\">\n      \u003cimage-slot id=\"mw-founder\" src=\"{{ p06 }}\" credit=\"Sten Rademaker / Unsplash\" credit-href=\"https://unsplash.com/@stenrademaker\" shape=\"rect\" fit=\"cover\" placeholder=\"Founder portrait in the workshop, low light\">\u003c/image-slot>\n      \u003ci class=\"corner tl\">\u003c/i>\u003ci class=\"corner tr\">\u003c/i>\u003ci class=\"corner bl\">\u003c/i>\u003ci class=\"corner br\">\u003c/i>\n    \u003c/div>\n    \u003cdiv data-reveal=\"1\" style=\"min-width:0\">\n      \u003cp style=\"margin:0 0 clamp(20px,2.4vw,34px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">Founder &amp; Master Technician\u003c/p>\n      \u003cblockquote style=\"margin:0 0 clamp(28px,3.2vw,48px);font-family:var(--font-heading);font-weight:600;font-size:clamp(24px,3.2vw,54px);line-height:1.04;letter-spacing:-.015em;text-wrap:balance\">“A fault has a reason. If you replace the part without finding it, you have bought the customer time, not a repair.”\u003c/blockquote>\n      \u003cp style=\"margin:0 0 16px;max-width:50ch;font-size:15.5px;line-height:1.74;color:rgba(236,231,222,.68);text-wrap:pretty\">Anton trained at a main dealer network before spending six years in motorsport preparation, where the difference between a car that finishes and a car that does not is usually documentation.\u003c/p>\n      \u003cp style=\"margin:0 0 clamp(28px,3vw,44px);max-width:50ch;font-size:15.5px;line-height:1.74;color:rgba(236,231,222,.55);text-wrap:pretty\">He still signs off every calibration and every pre-purchase inspection that leaves the building.\u003c/p>\n      \u003cdiv style=\"padding-top:24px;border-top:1px solid rgba(236,231,222,.16)\">\n        \u003cp style=\"margin:0 0 9px;font-family:var(--font-heading);font-weight:400;font-style:italic;font-size:clamp(28px,3vw,44px);line-height:1;color:#ECE7DE\">Anton Vosloo\u003c/p>\n        \u003cp style=\"margin:0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,231,222,.45)\">Founder &amp; Master Technician · Est. 2012\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"history\" data-screen-label=\"Timeline\" style=\"max-width:1680px;margin:0 auto;padding:clamp(60px,8vw,150px) clamp(18px,3.4vw,54px)\">\n  \u003ch2 data-reveal=\"1\" style=\"margin:0 0 clamp(40px,4.6vw,76px);font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,4.8vw,84px);line-height:.94;letter-spacing:-.02em;text-transform:uppercase\">Fourteen years,\u003cbr>in order.\u003c/h2>\n  \u003cdiv data-reveal=\"1\" style=\"border-top:1px solid rgba(236,231,222,.14)\">\n    \u003csc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"6\">\n      \u003cdiv style=\"display:grid;grid-template-columns:clamp(64px,7vw,150px) minmax(0,1fr);gap:clamp(14px,2.4vw,44px);align-items:baseline;padding:clamp(20px,2.4vw,36px) 0;border-bottom:1px solid rgba(236,231,222,.12);transition:padding-left .45s cubic-bezier(.2,.7,.3,1),background .45s ease\" style-hover=\"padding-left:14px;background:rgba(236,231,222,.03)\">\n        \u003cspan style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(20px,2.2vw,36px);line-height:1;color:var(--volt)\">{{ t.y }}\u003c/span>\n        \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px clamp(16px,2.4vw,44px);align-items:baseline;min-width:0\">\n          \u003cspan style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(18px,1.9vw,30px);line-height:1.08;text-transform:uppercase;text-wrap:balance\">{{ t.t }}\u003c/span>\n          \u003cspan style=\"font-size:14.5px;line-height:1.66;color:rgba(236,231,222,.6);text-wrap:pretty\">{{ t.d }}\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"team\" data-screen-label=\"Team\" style=\"border-block:1px solid rgba(236,231,222,.14);background:#090A0B\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:clamp(60px,8vw,150px) clamp(18px,3.4vw,54px)\">\n    \u003cdiv data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,80px);align-items:end;margin-bottom:clamp(36px,4.4vw,70px)\">\n      \u003ch2 style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,4.8vw,84px);line-height:.94;letter-spacing:-.02em;text-transform:uppercase\">Seven people.\u003cbr>No handovers.\u003c/h2>\n      \u003cp style=\"margin:0;max-width:46ch;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.62);text-wrap:pretty\">The technician who diagnoses your car is the one who repairs it and the one who road-tests it afterwards.\u003c/p>\n    \u003c/div>\n    \u003cdiv data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:rgba(236,231,222,.14);border:1px solid rgba(236,231,222,.14)\">\n      \u003csc-for list=\"{{ team }}\" as=\"p\" hint-placeholder-count=\"4\">\n        \u003cdiv style=\"background:#090A0B;padding:clamp(20px,2.2vw,34px);min-width:0;transition:background .4s ease\" style-hover=\"background:#101214\">\n          \u003cdiv class=\"duotone\" style=\"aspect-ratio:1/1;margin-bottom:clamp(16px,1.8vw,26px);border:1px solid rgba(236,231,222,.12)\">\n            \u003cimage-slot id=\"{{ p.slot }}\" src=\"{{ p.img }}\" credit=\"{{ p.credit }}\" credit-href=\"{{ p.creditHref }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ p.ph }}\">\u003c/image-slot>\n          \u003c/div>\n          \u003ch3 style=\"margin:0 0 7px;font-family:var(--font-heading);font-weight:600;font-size:clamp(17px,1.5vw,23px);line-height:1.1;letter-spacing:.02em;text-transform:uppercase\">{{ p.n }}\u003c/h3>\n          \u003cp style=\"margin:0 0 12px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt)\">{{ p.r }}\u003c/p>\n          \u003cp style=\"margin:0;font-size:13.5px;line-height:1.62;color:rgba(236,231,222,.52);text-wrap:pretty\">{{ p.d }}\u003c/p>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"standards\" data-screen-label=\"Credentials\" style=\"max-width:1680px;margin:0 auto;padding:clamp(60px,8vw,150px) clamp(18px,3.4vw,54px)\">\n  \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,4.4vw,90px);align-items:start\">\n    \u003cdiv data-reveal=\"1\" style=\"min-width:0;position:sticky;top:clamp(90px,8vw,130px)\">\n      \u003cp style=\"margin:0 0 clamp(18px,2.2vw,30px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">Standards\u003c/p>\n      \u003ch2 style=\"margin:0 0 24px;font-family:var(--font-heading);font-weight:600;font-size:clamp(30px,4.2vw,72px);line-height:.94;letter-spacing:-.02em;text-transform:uppercase\">What we hold\u003cbr>ourselves to.\u003c/h2>\n      \u003cp style=\"margin:0;max-width:42ch;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.6);text-wrap:pretty\">Accreditations matter less than the habits behind them, but both are on file and both are audited.\u003c/p>\n    \u003c/div>\n    \u003cdiv data-reveal=\"1\" style=\"min-width:0;display:grid;gap:0;border-top:1px solid rgba(236,231,222,.14)\">\n      \u003csc-for list=\"{{ creds }}\" as=\"c\" hint-placeholder-count=\"6\">\n        \u003cdiv style=\"padding:clamp(18px,2vw,28px) 0;border-bottom:1px solid rgba(236,231,222,.12)\">\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px\">\n            \u003ch3 style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:clamp(17px,1.6vw,25px);line-height:1.1;letter-spacing:.02em;text-transform:uppercase\">{{ c.t }}\u003c/h3>\n            \u003cspan style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(236,231,222,.36)\">{{ c.m }}\u003c/span>\n          \u003c/div>\n          \u003cp style=\"margin:0;max-width:54ch;font-size:14.5px;line-height:1.66;color:rgba(236,231,222,.58);text-wrap:pretty\">{{ c.d }}\u003c/p>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection data-screen-label=\"About CTA\" style=\"border-top:1px solid rgba(236,231,222,.14);background:#090A0B\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:clamp(70px,9vw,150px) clamp(18px,3.4vw,54px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,4vw,80px);align-items:end\">\n    \u003ch2 data-reveal=\"1\" style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:clamp(36px,5.6vw,104px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase\">Come and see\u003cbr>\u003cspan style=\"color:var(--volt)\">the workshop.\u003c/span>\u003c/h2>\n    \u003cdiv data-reveal=\"1\" style=\"min-width:0\">\n      \u003cp style=\"margin:0 0 30px;max-width:46ch;font-size:clamp(15px,1.1vw,17.5px);line-height:1.7;color:rgba(236,231,222,.7);text-wrap:pretty\">Book a service, or call and talk it through first. Either is fine.\u003c/p>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        \u003ca href=\"#booking\" style=\"display:inline-flex;align-items:center;gap:12px;padding:17px 30px;background:var(--volt);color:#0B0C0D;text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:13.5px;letter-spacing:.18em;text-transform:uppercase;transition:transform .4s cubic-bezier(.2,.7,.3,1),box-shadow .4s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 14px 34px rgba(180,255,57,.22)\">Book a Service\u003c/a>\n        \u003ca href=\"#workshop-top\" style=\"display:inline-flex;align-items:center;gap:12px;padding:17px 30px;border:1px solid rgba(236,231,222,.3);color:#ECE7DE;text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:13.5px;letter-spacing:.18em;text-transform:uppercase;transition:border-color .35s ease,background .35s ease\" style-hover=\"border-color:#ECE7DE;background:rgba(236,231,222,.07)\">Inside the Workshop\u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"clients\" data-screen-label=\"Testimonial\" style=\"background:#090A0B;border-block:1px solid rgba(236,231,222,.14)\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,10vw,180px) clamp(18px,3.4vw,54px)\">\n    \u003cfigure data-reveal=\"1\" style=\"margin:0;min-width:0\">\n      \u003cspan style=\"display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(60px,8vw,140px);line-height:.5;color:rgba(180,255,57,.5);margin-bottom:clamp(18px,2vw,30px)\">“\u003c/span>\n      \u003cblockquote style=\"margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: clamp(32px,5.6vw,102px); line-height: .98; letter-spacing: -.025em; text-wrap: balance; max-width: 20em\">They didn't just repair the issue. They found the reason it happened.\u003c/blockquote>\n      \u003cfigcaption style=\"margin-top:clamp(30px,3.4vw,52px);padding-top:22px;border-top:1px solid rgba(236,231,222,.16);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,231,222,.55);line-height:2\">\n        Daniël Kuipers\u003cbr>\u003cspan style=\"color:rgba(236,231,222,.35)\">Porsche 991.2 Carrera S · Rotterdam\u003c/span>\n      \u003c/figcaption>\n    \u003c/figure>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"principles\" data-screen-label=\"Why Us\" style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,10vw,170px) clamp(18px,3.4vw,54px)\">\n  \u003ch2 data-reveal=\"1\" style=\"margin:0 0 clamp(44px,5vw,80px);font-family:var(--font-heading);font-weight:600;font-size:clamp(38px,5.4vw,92px);line-height:.94;letter-spacing:-.02em;text-transform:uppercase\">Service without\u003cbr>shortcuts.\u003c/h2>\n  \u003cdiv data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:0;border-top:1px solid rgba(236,231,222,.14)\">\n    \u003csc-for list=\"{{ principles }}\" as=\"pr\" hint-placeholder-count=\"6\">\n      \u003cdiv style=\"padding:clamp(26px,3vw,46px) clamp(20px,2.4vw,38px) clamp(30px,3.4vw,52px) 0;border-bottom:1px solid rgba(236,231,222,.14);min-width:0\">\n        \u003cspan style=\"display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(38px,4.4vw,72px);line-height:1;color:rgba(236,231,222,.14);margin-bottom:clamp(16px,1.8vw,28px)\">{{ pr.n }}\u003c/span>\n        \u003ch3 style=\"margin:0 0 12px;font-family:var(--font-heading);font-weight:600;font-size:clamp(18px,1.6vw,25px);line-height:1.1;letter-spacing:.03em;text-transform:uppercase\">{{ pr.t }}\u003c/h3>\n        \u003cp style=\"margin:0;max-width:34ch;font-size:14.5px;line-height:1.68;color:rgba(236,231,222,.58);text-wrap:pretty\">{{ pr.d }}\u003c/p>\n      \u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\n\u003cdiv style=\"max-width:1680px;margin:0 auto;padding:clamp(40px,5vw,90px) clamp(18px,3.4vw,54px) clamp(80px,9vw,150px);display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:clamp(34px,4.4vw,96px);align-items:start\">\n\n  \u003caside style=\"min-width:0;position:sticky;top:clamp(90px,8vw,120px)\">\n    \u003cp style=\"display:flex;align-items:center;gap:12px;margin:0 0 clamp(18px,2.2vw,32px);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--volt)\">\n      \u003cspan style=\"display:block;width:clamp(24px,3vw,52px);height:1px;background:var(--volt);flex:none\">\u003c/span>\n      Booking\n    \u003c/p>\n    \u003ch2 style=\"margin:0 0 26px;font-family:var(--font-heading);font-weight:600;font-size:clamp(36px,5.2vw,86px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase\">Book a\u003cbr>service.\u003c/h2>\n    \u003cp style=\"margin:0 0 clamp(30px,3.4vw,48px);max-width:40ch;font-size:15.5px;line-height:1.72;color:rgba(236,231,222,.66);text-wrap:pretty\">Four short steps. Describe the symptom rather than the repair — working out the cause is our job. We confirm by phone within one working day.\u003c/p>\n    \u003col style=\"list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid rgba(236,231,222,.14)\">\n      \u003csc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n        \u003cli style=\"display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid rgba(236,231,222,.1)\">\n          \u003cspan style=\"font-family:var(--font-heading);font-weight:400;font-size:12px;letter-spacing:.1em;color:{{ n.color }}\">{{ n.n }}\u003c/span>\n          \u003cspan style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(15px,1.3vw,20px);letter-spacing:.06em;text-transform:uppercase;color:{{ n.color }};transition:color .35s ease\">{{ n.t }}\u003c/span>\n          \u003cspan style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:{{ n.markColor }}\">{{ n.mark }}\u003c/span>\n        \u003c/li>\n      \u003c/sc-for>\n    \u003c/ol>\n    \u003cdiv style=\"margin-top:clamp(28px,3vw,44px);padding-top:22px;border-top:1px solid rgba(236,231,222,.14);display:grid;gap:7px\">\n      \u003cspan style=\"font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,231,222,.38)\">Rather talk?\u003c/span>\n      \u003ca href=\"tel:+31102441180\" style=\"font-family:var(--font-heading);font-weight:600;font-size:clamp(17px,1.5vw,24px);letter-spacing:.04em;color:#ECE7DE;text-decoration:none\" style-hover=\"color:#B4FF39\">+31 10 244 1180\u003c/a>\n      \u003cspan style=\"font-size:13px;color:rgba(236,231,222,.42)\">Mon–Fri 07:30–18:00\u003c/span>\n    \u003c/div>\n  \u003c/aside>\n\n  \u003csection id=\"booking\" aria-label=\"Booking form\" style=\"min-width:0\">\n    \u003cdiv style=\"border:1px solid rgba(236,231,222,.16);background:#0E1011\">\n      \u003cdiv style=\"height:2px;background:rgba(236,231,222,.1)\">\n        \u003cdiv style=\"height:2px;background:var(--volt);width:{{ progress }};transition:width .6s cubic-bezier(.22,.8,.28,1)\">\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"padding:clamp(24px,3vw,52px)\">\n\n        \u003csc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n          \u003cdiv style=\"animation:mwrise .5s cubic-bezier(.22,.8,.28,1)\">\n            \u003cp style=\"margin:0 0 8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--volt)\">Step 01 of 04\u003c/p>\n            \u003ch2 style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:600;font-size:clamp(24px,2.6vw,40px);line-height:1.04;text-transform:uppercase\">The vehicle\u003c/h2>\n            \u003cp style=\"margin:0 0 clamp(24px,2.6vw,38px);font-size:14.5px;line-height:1.6;color:rgba(236,231,222,.52)\">Registration is optional but it speeds up the parts lookup.\u003c/p>\n            \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(14px,1.8vw,22px)\">\n              \u003clabel style=\"display:grid;gap:9px;min-width:0\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Make\u003c/span>\u003cinput class=\"mwin\" type=\"text\" placeholder=\"BMW\" value=\"{{ f.make }}\" sc-camel-on-change=\"{{ setMake }}\">\u003c/label>\n              \u003clabel style=\"display:grid;gap:9px;min-width:0\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Model\u003c/span>\u003cinput class=\"mwin\" type=\"text\" placeholder=\"M340i xDrive\" value=\"{{ f.model }}\" sc-camel-on-change=\"{{ setModel }}\">\u003c/label>\n              \u003clabel style=\"display:grid;gap:9px;min-width:0\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Year\u003c/span>\u003cinput class=\"mwin\" type=\"text\" sc-camel-input-mode=\"numeric\" placeholder=\"2021\" value=\"{{ f.year }}\" sc-camel-on-change=\"{{ setYear }}\">\u003c/label>\n              \u003clabel style=\"display:grid;gap:9px;min-width:0\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Registration \u003cspan style=\"color:rgba(236,231,222,.3)\">optional\u003c/span>\u003c/span>\u003cinput class=\"mwin\" type=\"text\" placeholder=\"XX-123-X\" value=\"{{ f.reg }}\" sc-camel-on-change=\"{{ setReg }}\">\u003c/label>\n              \u003clabel style=\"display:grid;gap:9px;min-width:0\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Mileage (km)\u003c/span>\u003cinput class=\"mwin\" type=\"text\" sc-camel-input-mode=\"numeric\" placeholder=\"64000\" value=\"{{ f.km }}\" sc-camel-on-change=\"{{ setKm }}\">\u003c/label>\n              \u003clabel style=\"display:grid;gap:9px;min-width:0\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Use\u003c/span>\n                \u003csc-raw-select class=\"mwin\" value=\"{{ f.use }}\" sc-camel-on-change=\"{{ setUse }}\">\n                  \u003coption value=\"Private\">Private\u003c/option>\n                  \u003coption value=\"Performance / track\">Performance / track\u003c/option>\n                  \u003coption value=\"Collection\">Collection\u003c/option>\n                  \u003coption value=\"Fleet / commercial\">Fleet / commercial\u003c/option>\n                \u003c/sc-raw-select>\n              \u003c/label>\n            \u003c/div>\n          \u003c/div>\n        \u003c/sc-if>\n\n        \u003csc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n          \u003cdiv style=\"animation:mwrise .5s cubic-bezier(.22,.8,.28,1)\">\n            \u003cp style=\"margin:0 0 8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--volt)\">Step 02 of 04\u003c/p>\n            \u003ch2 style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:600;font-size:clamp(24px,2.6vw,40px);line-height:1.04;text-transform:uppercase\">What it needs\u003c/h2>\n            \u003cp style=\"margin:0 0 clamp(24px,2.6vw,38px);font-size:14.5px;line-height:1.6;color:rgba(236,231,222,.52)\">Select one or more. If you are not sure, choose diagnostics and describe the symptom.\u003c/p>\n            \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:rgba(236,231,222,.14);border:1px solid rgba(236,231,222,.14);margin-bottom:clamp(20px,2.4vw,32px)\">\n              \u003csc-for list=\"{{ serviceOpts }}\" as=\"s\" hint-placeholder-count=\"8\">\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ s.toggle }}\" aria-pressed=\"{{ s.on }}\" style=\"text-align:left;background:{{ s.bg }};border:0;padding:clamp(15px,1.7vw,22px);cursor:pointer;font-family:var(--font-body);color:inherit;min-width:0;transition:background .3s ease\">\n                  \u003cspan style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px\">\n                    \u003cspan style=\"font-size:9.5px;letter-spacing:.18em;color:{{ s.numColor }}\">{{ s.n }}\u003c/span>\n                    \u003cspan style=\"width:13px;height:13px;border:1px solid {{ s.boxBorder }};background:{{ s.boxFill }};flex:none;transition:background .3s ease,border-color .3s ease\">\u003c/span>\n                  \u003c/span>\n                  \u003cspan style=\"display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(14px,1.2vw,18px);line-height:1.14;letter-spacing:.03em;text-transform:uppercase;color:{{ s.titleColor }};text-wrap:balance;transition:color .3s ease\">{{ s.t }}\u003c/span>\n                \u003c/button>\n              \u003c/sc-for>\n            \u003c/div>\n            \u003clabel style=\"display:grid;gap:9px\">\u003cspan style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Describe the symptom or the objective\u003c/span>\n              \u003ctextarea class=\"mwin\" rows=\"4\" placeholder=\"Vibration through the wheel above 120 km/h, worse when braking. Started after the last tyre change.\" value=\"{{ f.notes }}\" sc-camel-on-change=\"{{ setNotes }}\" style=\"resize:vertical;line-height:1.6\">\u003c/textarea>\n            \u003c/label>\n          \u003c/div>\n        \u003c/sc-if>\n\n        \u003csc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n          \u003cdiv style=\"animation:mwrise .5s cubic-bezier(.22,.8,.28,1)\">\n            \u003cp style=\"margin:0 0 8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--volt)\">Step 03 of 04\u003c/p>\n            \u003ch2 style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:600;font-size:clamp(24px,2.6vw,40px);line-height:1.04;text-transform:uppercase\">When\u003c/h2>\n            \u003cp style=\"margin:0 0 clamp(24px,2.6vw,38px);font-size:14.5px;line-height:1.6;color:rgba(236,231,222,.52)\">Pick a preferred drop-off. We confirm the slot by phone.\u003c/p>\n            \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:1px;background:rgba(236,231,222,.14);border:1px solid rgba(236,231,222,.14);margin-bottom:clamp(22px,2.6vw,34px)\">\n              \u003csc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"10\">\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ d.pick }}\" disabled=\"{{ d.closed }}\" aria-pressed=\"{{ d.on }}\" style=\"background:{{ d.bg }};border:0;padding:clamp(13px,1.5vw,19px);cursor:{{ d.cursor }};text-align:left;font-family:var(--font-body);color:inherit;opacity:{{ d.opacity }};min-width:0;transition:background .3s ease\">\n                  \u003cspan style=\"display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:{{ d.dowColor }};margin-bottom:7px\">{{ d.dow }}\u003c/span>\n                  \u003cspan style=\"display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(19px,1.9vw,28px);line-height:1;color:{{ d.numColor }}\">{{ d.day }}\u003c/span>\n                  \u003cspan style=\"display:block;margin-top:7px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:{{ d.metaColor }}\">{{ d.meta }}\u003c/span>\n                \u003c/button>\n              \u003c/sc-for>\n            \u003c/div>\n            \u003cspan style=\"display:block;margin-bottom:11px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,222,.5)\">Drop-off window\u003c/span>\n            \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(22px,2.6vw,34px)\">\n              \u003csc-for list=\"{{ slots }}\" as=\"sl\" hint-placeholder-count=\"3\">\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ sl.pick }}\" aria-pressed=\"{{ sl.on }}\" style=\"padding:12px 19px;background:{{ sl.bg }};border:1px solid {{ sl.border }};color:{{ sl.color }};cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:all .3s ease\">{{ sl.t }}\u003c/button>\n              \u003c/sc-for>\n            \u003c/div>\n            \u003clabel style=\"display:flex;align-items:flex-start;gap:12px;cursor:pointer\">\n              \u003cinput type=\"checkbox\" checked=\"{{ f.courtesy }}\" sc-camel-on-change=\"{{ setCourtesy }}\" style=\"width:17px;height:17px;margin-top:2px;accent-color:#B4FF39;flex:none\">\n              \u003cspan style=\"font-size:14.5px;line-height:1.6;color:rgba(236,231,222,.68)\">I would like a courtesy vehicle if one is available\u003c/span>\n            \u003c/label>\n          \u003c/div>\n        \u003c/sc-if>\n\n        \u003csc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n          \u003cdiv style=\"animation:mwrise .5s cubic-bezier(.22,.8,.28,1)\">\n            \u003cp style=\"margin:0 0 8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--volt)\">Step 04 of 04\u003c/p>\n            \u003ch2 style=\"margin:0 0 8px;font-family:var(--font-heading);font-weight:600;font-size:clamp(24px,2.6vw,40px);line-height:1.04;text-transform:uppercase\">Your details\u003c/h2>\n            \u003cp style=\ 2,.72);text-decoration:none;word-break:break-word\" style-hover=\"color:#B4FF39\">workshop@meridianwerks.nl\u003c/a>\n      \u003c/div>\n      \u003cp style=\"margin:18px 0 0;font-size:13px;line-height:1.75;color:rgba(236,231,222,.45)\">Mon–Fri 07:30–18:00\u003cbr>Sat 09:00–14:00\u003cbr>Sunday closed\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:22px clamp(18px,3.4vw,54px) clamp(88px,6vw,40px);border-top:1px solid rgba(236,231,222,.1);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between\">\n    \u003cp style=\"margin:0;font-size:12px;letter-spacing:.06em;color:rgba(236,231,222,.34)\">© 2026 Meridian Werks B.V. — KvK 68420117\u003c/p>\n    \u003cdiv style=\"display:flex;gap:22px\">\n      \u003ca href=\"#\" style=\"font-size:12px;letter-spacing:.06em;color:rgba(236,231,222,.34);text-decoration:none\" style-hover=\"color:#B4FF39\">Privacy\u003c/a>\n      \u003ca href=\"#\" style=\"font-size:12px;letter-spacing:.06em;color:rgba(236,231,222,.34);text-decoration:none\" style-hover=\"color:#B4FF39\">Terms\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/footer>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nclass Component extends DCLogic {\n  state = {\n    step: 0, spec: 0, ba: 52,\n    lb: -1,\n    scrolled: false, menu: false, active: '', heroIn: true,\n    bstep: 1,\n    make: '', model: '', year: '', reg: '', km: '', use: 'Private',\n    picked: [], notes: '',\n    day: null, slot: 'Morning 07:30–09:00', courtesy: false,\n    name: '', phone: '', email: ''\n  };\n\n  componentDidMount() {\n    this._io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { this._show(e.target); this._io.unobserve(e.target); } });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });\n    this._scan();\n    this._fallback = setTimeout(() => document.querySelectorAll('[data-reveal]').forEach(el => this._show(el)), 2600);\n\n    const hero = document.querySelector('[data-parallax=\"1\"]');\n    this._spy = [\n      ['services', 'services'], ['refinement', 'programme'], ['process', 'process'],\n      ['workshop', 'workshop-top'], ['vehicles', 'vehicles'], ['about', 'about-top'],\n      ['', 'booking'], ['contact', 'contact']\n    ];\n    this._sc = () => {\n      const y0 = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;\n      const s = y0 > 40;\n      if (s !== this.state.scrolled) this.setState({ scrolled: s });\n      const line = (document.querySelector('header') ? document.querySelector('header').offsetHeight : 76) + 12;\n      // pick the target nearest the header line, not the last one in array order —\n      // the merged blocks are not in nav order\n      let act = '', best = -Infinity;\n      for (const [key, id] of this._spy) {\n        const el = document.getElementById(id);\n        if (!el) continue;\n        const top = el.getBoundingClientRect().top;\n        if (top \u003c= line && top > best) { best = top; act = key; }\n      }\n      if (act !== this.state.active) this.setState({ active: act });\n      if (!hero) return;\n      const y = Math.min(y0, window.innerHeight);\n      hero.style.transform = 'translate3d(0,' + (y * 0.22).toFixed(1) + 'px,0) scale(' + (1 + y / 14000).toFixed(4) + ')';\n    };\n    window.addEventListener('scroll', this._sc, { passive: true });\n    this._sc();\n\n    this._key = (e) => {\n      if (this.state.lb \u003c 0) return;\n      if (e.key === 'Escape') this.setState({ lb: -1 });\n      if (e.key === 'ArrowRight') this._lbStep(1);\n      if (e.key === 'ArrowLeft') this._lbStep(-1);\n    };\n    window.addEventListener('keydown', this._key);\n\n    const heroEl = document.getElementById('top');\n    if (heroEl) {\n      this._hio = new IntersectionObserver(([e]) => {\n        const inView = e.isIntersecting && e.intersectionRatio > 0.12;\n        if (inView !== this.state.heroIn) this.setState({ heroIn: inView });\n      }, { threshold: [0, 0.12, 0.5] });\n      this._hio.observe(heroEl);\n    }\n\n    this._hash = () => {\n      const h = (location.hash || '').replace('#', '');\n      if (!h) return;\n      const hit = this._spy.find(([, id]) => id === h);\n      this.setState({ active: hit ? hit[0] : '' });\n    };\n    window.addEventListener('hashchange', this._hash);\n    this._hash();\n\n    // IntersectionObserver spy: works even where scroll events are throttled\n    this._nio = new IntersectionObserver(() => this._sc(), {\n      rootMargin: '-15% 0px -70% 0px', threshold: [0, 0.01, 0.5]\n    });\n    this._spy.forEach(([, id]) => {\n      const el = document.getElementById(id);\n      if (el) this._nio.observe(el);\n    });\n  }\n  componentDidUpdate() { this._scan(); }\n  componentWillUnmount() {\n    this._io && this._io.disconnect();\n    clearTimeout(this._fallback);\n    window.removeEventListener('scroll', this._sc);\n    window.removeEventListener('keydown', this._key);\n    window.removeEventListener('hashchange', this._hash);\n    this._nio && this._nio.disconnect();\n    this._hio && this._hio.disconnect();\n  }\n\n  _scan() {\n    if (!this._io) return;\n    document.querySelectorAll('[data-reveal]:not([data-obs])').forEach((el, i) => {\n      el.setAttribute('data-obs', '1');\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(26px)';\n      el.style.transition = 'opacity .9s cubic-bezier(.22,.8,.28,1) ' + (i % 4 * 0.07).toFixed(2) + 's, transform 1s cubic-bezier(.22,.8,.28,1) ' + (i % 4 * 0.07).toFixed(2) + 's';\n      this._io.observe(el);\n    });\n  }\n  _show(el) {\n    if (el.getAttribute('data-seen')) return;\n    el.setAttribute('data-seen', '1');\n    el.style.opacity = '1';\n    el.style.transform = 'none';\n    el.querySelectorAll('[data-count]').forEach(n => this._count(n));\n  }\n\n  _count(node) {\n    const target = parseFloat(node.getAttribute('data-count'));\n    if (!isFinite(target)) return;\n    const stat = node.getAttribute('data-static');\n    if (stat) { node.textContent = stat; return; }\n    const pre = node.getAttribute('data-prefix') || '';\n    const suf = node.getAttribute('data-suffix') || '';\n    const t0 = performance.now(), dur = 1500;\n    const tick = (t) => {\n      const p = Math.min((t - t0) / dur, 1);\n      const e = 1 - Math.pow(1 - p, 3);\n      node.textContent = pre + Math.round(target * e) + suf;\n      if (p \u003c 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  _baSet(ev) {\n    const r = ev.currentTarget.getBoundingClientRect();\n    const v = Math.max(2, Math.min(98, ((ev.clientX - r.left) / r.width) * 100));\n    this.setState({ ba: v });\n  }\n\n  _lbStep(d) { const n = this._gal.length; this.setState(s => ({ lb: (s.lb + d + n) % n })); }\n\n  _set(k) { return (e) => this.setState({ [k]: e.target.value }); }\n\n  _days() {\n    if (this._cache) return this._cache;\n    const out = [];\n    const d = new Date();\n    d.setHours(0, 0, 0, 0);\n    d.setDate(d.getDate() + 1);\n    const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n    const mons = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n    let i = 0;\n    while (out.length \u003c 10) {\n      const c = new Date(d.getTime() + i * 86400000);\n      i++;\n      const w = c.getDay();\n      if (w === 0) continue;\n      const busy = (out.length === 1 || out.length === 5);\n      out.push({\n        key: c.toISOString().slice(0, 10),\n        dow: dows[w],\n        day: String(c.getDate()),\n        label: dows[w] + ' ' + c.getDate() + ' ' + mons[c.getMonth()],\n        meta: w === 6 ? 'Sat · limited' : (busy ? 'Fully booked' : 'Available'),\n        closed: busy\n      });\n    }\n    this._cache = out;\n    return out;\n  }\n\n  _imgMap() {\n    return {\n      p01: 'https://images.unsplash.com/photo-1632405862117-236585cfb757?auto=format&fit=crop&w=1600&q=70',\n      p02: 'https://images.unsplash.com/photo-1643700973089-baa86a1ab9ee?auto=format&fit=crop&w=1600&q=70',\n      p03: 'https://images.unsplash.com/photo-1727893141025-35d62b3f4a03?auto=format&fit=crop&w=1600&q=70',\n      p04: 'https://images.unsplash.com/photo-1727893119356-1702fe921cf9?auto=format&fit=crop&w=1600&q=70',\n      p05: 'https://images.unsplash.com/photo-1618312980096-873bd19759a0?auto=format&fit=crop&w=1600&q=70',\n      p06: 'https://images.unsplash.com/photo-1615906655593-ad0386982a0f?auto=format&fit=crop&w=1600&q=70',\n      p07: 'https://images.unsplash.com/photo-1551522435-a13afa10f103?auto=format&fit=crop&w=1600&q=70',\n      p08: 'https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=1600&q=70',\n      p09: 'https://images.unsplash.com/photo-1637640125496-31852f042a60?auto=format&fit=crop&w=1600&q=70',\n      p10: 'https://images.unsplash.com/photo-1606577924006-27d39b132ae2?auto=format&fit=crop&w=1600&q=70',\n      p11: 'https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1600&q=70',\n      p12: 'https://images.unsplash.com/photo-1727893294198-e85137574f5b?auto=format&fit=crop&w=1600&q=70',\n      p13: 'https://images.unsplash.com/photo-1551522435-b2347f669045?auto=format&fit=crop&w=1600&q=70',\n      p14: 'https://images.unsplash.com/photo-1570129476815-ba368ac77013?auto=format&fit=crop&w=1600&q=70',\n      p15: 'https://images.unsplash.com/photo-1625047509248-ec889cbff17f?auto=format&fit=crop&w=1600&q=70',\n      p16: 'https://images.unsplash.com/photo-1632733711679-529326f6db12?auto=format&fit=crop&w=1600&q=70',\n      p17: 'https://images.unsplash.com/photo-1645445522156-9ac06bc7a767?auto=format&fit=crop&w=1600&q=70'\n    };\n  }\n  _res(id) {\n    const r = window.__resources;\n    return (r && r[id]) || this._imgMap()[id];\n  }\n  _valsImages() {\n    const out = {};\n    for (const id of Object.keys(this._imgMap())) out[id] = this._res(id);\n    return out;\n  }\n\n  renderVals() {\n    return Object.assign({}, this._valsImages(),\n      this._valsNav(), this._valsHome(), this._valsServices(),\n      this._valsWorkshop(), this._valsAbout(), this._valsBooking());\n  }\n\n  _valsNav() {\n    const active = this.state.active;\n    const defs = [\n      ['Services', '#services', 'services'],\n      ['Refinement', '#programme', 'refinement'],\n      ['Process', '#process', 'process'],\n      ['Workshop', '#workshop-top', 'workshop'],\n      ['Vehicles', '#vehicles', 'vehicles'],\n      ['About', '#about-top', 'about'],\n      ['Contact', '#contact', 'contact']\n    ];\n    return {\n      scrim: (this.props.solid || this.state.scrolled) ? 1 : 0,\n      showMobCta: !this.state.heroIn,\n      menuOpen: this.state.menu,\n      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),\n      closeMenu: () => this.setState({ menu: false }),\n      links: defs.map(([label, href, key], i) => ({\n        label, href,\n        onClick: () => this.setState({ active: key, menu: false }),\n        num: String(i + 1).padStart(2, '0'),\n        cur: active === key ? 'page' : undefined,\n        color: active === key ? '#B4FF39' : 'rgba(236,231,222,.62)',\n        rule: active === key ? '#B4FF39' : 'transparent'\n      }))\n    };\n  }\n  _valsHome() {\n    const S = this.state;\n    const stepData = [\n      ['01', 'Consultation', 'Understand the vehicle, symptoms, objectives, and owner\\u2019s expectations. We ask what changed, when, and under what conditions — most diagnoses begin in that conversation.', ['Intake interview', 'History review', 'Objectives']],\n      ['02', 'Diagnostics', 'Inspect the vehicle using professional diagnostic tools and physical inspection. Fault memory, live data, oscilloscope traces and a lift inspection, cross-referenced before anything is concluded.', ['OEM interface', 'Live data', 'Lift inspection']],\n      ['03', 'Recommendation', 'Provide documented findings, photographs, priorities, and a transparent estimate. Work is separated into what is needed now, what is upcoming, and what is optional.', ['Photo report', 'Priorities', 'Fixed estimate']],\n      ['04', 'Execution', 'Perform the work with documented procedures, quality components, testing, and final verification. Every vehicle leaves after a road test against the original complaint.', ['Torque logged', 'OE-grade parts', 'Road test']]\n    ];\n    const specData = [\n      ['01', 'European', '18 marques', ['BMW', 'Mercedes-Benz', 'Audi', 'Volkswagen', 'Volvo', 'Land Rover', 'Jaguar', 'Alfa Romeo']],\n      ['02', 'German', 'Core specialism', ['BMW M', 'Mercedes-AMG', 'Porsche', 'Audi Sport', 'VW R', 'Alpina']],\n      ['03', 'Japanese', '11 marques', ['Lexus', 'Toyota', 'Nissan', 'Honda', 'Mazda', 'Subaru']],\n      ['04', 'Performance', 'Calibration &amp; chassis', ['M3 / M4', '911', 'RS Series', 'AMG 63', 'GT-R', 'Type R']],\n      ['05', 'Luxury', 'Comfort &amp; electronics', ['S-Class', '7 Series', 'A8', 'Range Rover', 'LS', 'Panamera']],\n      ['06', 'Commercial', 'Fleet contracts', ['Sprinter', 'Transit', 'Crafter', 'Transporter', 'Vivaro', 'Ducato']]\n    ];\n    const marques = ['BMW', 'Mercedes-Benz', 'Porsche', 'Audi', 'Volkswagen', 'Land Rover', 'Lexus', 'Toyota', 'Nissan', 'Ford'];\n\n    return {\n      pillars: [\n        { n: '01', t: 'Diagnostics' }, { n: '02', t: 'Mechanical' },\n        { n: '03', t: 'Performance' }, { n: '04', t: 'Refinement' }\n      ],\n      craftStats: [\n        { v: 14, suffix: '', l: 'Years under one roof' },\n        { v: 6, suffix: '', l: 'Bays incl. alignment cell' }\n      ],\n      marquesLoop: marques.concat(marques),\n      services: [\n        ['01', 'Diagnostics &amp; Electrical', 'Advanced vehicle diagnostics, fault tracing, ECU analysis, sensors, wiring, CAN-bus systems, and electrical troubleshooting.', 'OEM interfaces · Oscilloscope · CAN-bus', 's01'],\n        ['02', 'Mechanical Service', 'Engine, cooling, fuel, lubrication, belts, timing systems
