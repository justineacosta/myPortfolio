n                \u003cp style=\"margin:0; font-size:13px; line-height:1.6; color:#a09d96;\">Sun positions are calculated for the site. The coral band on the horizon marks the arc the living-room windows face.\u003c/p>\n              \u003c/div>\n            \u003c/sc-if>\n\n            \u003csc-if value=\"{{ isView }}\" hint-placeholder-val=\"{{ false }}\">\n              \u003cdiv style=\"display:flex; flex-direction:column; gap:16px;\">\n                \u003cp style=\"margin:0; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#a09d96;\">Same plan, different floor\u003c/p>\n                \u003cdiv role=\"group\" aria-label=\"Choose a level\" style=\"display:flex; flex-direction:column; gap:4px;\">\n                  \u003csc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"4\">\n                    \u003cbutton type=\"button\" data-level=\"{{ lv.id }}\" sc-camel-on-click=\"{{ setLevel }}\" aria-pressed=\"{{ lv.pressed }}\" style=\"display:flex; align-items:baseline; gap:16px; width:100%; text-align:left; padding:14px 16px; border:none; border-radius:8px; background:{{ lv.bg }}; color:#faf9f5; cursor:pointer; font-family:var(--font-sans);\">\n                      \u003cspan style=\"flex:0 0 96px; font-family:var(--font-serif-display); font-size:26px; line-height:1;\">{{ lv.label }}\u003c/span>\n                      \u003cspan style=\"flex:1 1 auto; min-width:0;\">\u003cspan style=\"display:block; font-family:var(--font-mono); font-size:11px; color:#8e8b82; margin-bottom:4px;\">{{ lv.elev }} above the street\u003c/span>\u003cspan style=\"display:block; font-size:13px; line-height:1.5; color:{{ lv.fg }};\">{{ lv.desc }}\u003c/span>\u003c/span>\n                    \u003c/button>\n                  \u003c/sc-for>\n                \u003c/div>\n                \u003cp style=\"margin:0; font-size:13px; line-height:1.6; color:#a09d96;\">Views are rendered from the camera height of each floor, on the real site, with the neighbouring buildings modelled from the city survey.\u003c/p>\n              \u003c/div>\n            \u003c/sc-if>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 32px; margin-top:20px; font-size:13px; line-height:1.55; color:#6c6a64;\">\n          \u003cspan style=\"max-width:80ch;\">Prototype preview. In the full model you move freely through every room, in a headset at the studio or in a browser at home.\u003c/span>\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextLink\" href=\"#viewing\" size=\"sm\" hint-size=\"220px,22px\">Book a guided walkthrough →\u003c/x-import>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"residences\" data-chapter=\"05\" data-screen-label=\"05 Residences\" aria-labelledby=\"res-title\" style=\"background:#181715; color:#faf9f5; padding-bottom:{{ resPadB }};\">\n      \u003cdiv style=\"max-width:1760px; margin:0 auto; padding:clamp(96px,10vw,176px) clamp(20px,4vw,72px) clamp(32px,4vw,64px); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:24px 64px;\">\n        \u003cdiv style=\"flex:1 1 560px;\">\n          \u003cp style=\"margin:0 0 20px; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#a09d96;\">05 — The residences\u003c/p>\n          \u003ch2 id=\"res-title\" style=\"margin:0; max-width:15ch; font-family:var(--font-serif-display); font-weight:400; font-size:clamp(42px,5vw,96px); line-height:1; letter-spacing:-0.025em; color:#faf9f5;\">Four places, each one walkable today.\u003c/h2>\n        \u003c/div>\n        \u003cdiv style=\"flex:0 1 420px; display:flex; flex-direction:column; gap:20px;\">\n          \u003cp style=\"margin:0; font-size:16px; line-height:1.65; color:#a09d96;\">Every Oriel development opens its model before it opens a sales office. Three are being built. One is finished, eight:1.65; color:#3d3d3a; text-wrap:pretty;\">We commission independent Portuguese architects and build in materials that age well in this light: board-marked concrete, lime render, local stone and oak. A selection from our sites and the studio’s reference library.\u003c/p>\n        \u003c/div>\n        \u003cfigure style=\"margin:0; grid-column:{{ g.f1.c }}; grid-row:{{ g.f1.r }};\">\n          \u003cdiv style=\"position:relative; aspect-ratio:3 / 4; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg data-speed=\"0.05\" src=\"oriel-portugal-residences/845efedf4a56.webp\" sc-camel-src-set=\"oriel-portugal-residences/31bac5eaf18e.webp 700w, oriel-portugal-residences/845efedf4a56.webp 1400w\" sizes=\"(min-width: 1100px) 40vw, 92vw\" alt=\"A curved board-marked concrete canopy over a doorway, framed by tall bamboo.\" loading=\"lazy\" style=\"position:absolute; left:0; right:0; top:-6%; width:100%; height:112%; object-fit:cover;\">\u003c/div>\n          \u003cfigcaption style=\"padding-top:12px; font-size:13px; line-height:1.55; color:#6c6a64;\">\u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#141413; margin-right:10px;\">Fig. 2\u003c/span>Socalco, Porto. A concrete canopy over the garden entrance, cast in Douro pine formwork.\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"margin:0; grid-column:{{ g.f2.c }}; grid-row:{{ g.f2.r }};\">\n          \u003cdiv style=\"position:relative; aspect-ratio:3 / 2; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg src=\"oriel-portugal-residences/2307f2e39f8b.webp\" sc-camel-src-set=\"oriel-portugal-residences/1ff0d32879a5.webp 700w, oriel-portugal-residences/2307f2e39f8b.webp 1400w\" sizes=\"(min-width: 1100px) 46vw, 92vw\" alt=\"A nineteenth-century interior stripped back to brick and timber, with scaffolding and a doorway onto a bright room.\" loading=\"lazy\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\u003c/div>\n          \u003cfigcaption style=\"padding-top:12px; font-size:13px; line-height:1.55; color:#6c6a64;\">\u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#141413; margin-right:10px;\">Fig. 3\u003c/span>Lioz, Lisbon. The existing building stripped to its masonry before the laser survey.\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"margin:0; grid-column:{{ g.f3.c }}; grid-row:{{ g.f3.r }}; margin-top:{{ g.f3.mt }};\">\n          \u003cdiv style=\"position:relative; aspect-ratio:4 / 3; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg src=\"oriel-portugal-residences/0b42e390fa42.webp\" sc-camel-src-set=\"oriel-portugal-residences/995c34ad4445.webp 700w, oriel-portugal-residences/0b42e390fa42.webp 1400w\" sizes=\"(min-width: 1100px) 46vw, 92vw\" alt=\"Black-and-white photograph of a long concrete façade with a pattern of deep, offset window reveals.\" loading=\"lazy\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\u003c/div>\n          \u003cfigcaption style=\"padding-top:12px; font-size:13px; line-height:1.55; color:#6c6a64;\">\u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#141413; margin-right:10px;\">Fig. 4\u003c/span>Studio reference. Deep reveals photographed for the Lioz shading study.\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"margin:0; grid-column:{{ g.f4.c }}; grid-row:{{ g.f4.r }};\">\n          \u003cdiv style=\"position:relative; aspect-ratio:2 / 3; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg data-speed=\"-0.05\" src=\"oriel-portugal-residences/4eb90d39ba37.webp\" sc-camel-src-set=\"oriel-portugal-residences/3ee1f811f708.webp 700w, oriel-portugal-residences/4eb90d39ba37.webp 1400w\" sizes=\"(min-width: 1100px) 32vw, 46vw\" alt=\"A concrete wall with vertical fins and a large round opening, grasses growing along its base.\" loading=\"lazy\" style=\"position:absolute; left:0; right:0; top:-6%; width:100%; height:112%; object-fit:cover;\">\u003c/div>\n          \u003cfigcaption style=\"padding-top:12px; font-size:13px; line-height:1.55; color:#6c6a64;\">\u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#141413; margin-right:10px;\">Fig. 5\u003c/span>Pinhal, Comporta. A round opening in the courtyard wall.\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"margin:0; grid-column:{{ g.f5.c }}; grid-row:{{ g.f5.r }};\">\n          \u003cdiv style=\"position:relative; aspect-ratio:9 / 10; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg src=\"oriel-portugal-residences/acff5a976f1b.webp\" sc-camel-src-set=\"oriel-portugal-residences/e6c1a13cd1d6.webp 700w, oriel-portugal-residences/acff5a976f1b.webp 1400w\" sizes=\"(min-width: 1100px) 30vw, 46vw\" alt=\"A pale concrete lattice screen with square openings onto dense green planting.\" loading=\"lazy\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\u003c/div>\n          \u003cfigcaption style=\"padding-top:12px; font-size:13px; line-height:1.55; color:#6c6a64;\">\u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#141413; margin-right:10px;\">Fig. 6\u003c/span>Socalco. A breeze-block screen between bath and garden.\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"margin:0; grid-column:{{ g.f6.c }}; grid-row:{{ g.f6.r }}; margin-top:{{ g.f6.mt }};\">\n          \u003cdiv style=\"position:relative; aspect-ratio:2 / 3; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg data-speed=\"0.07\" src=\"oriel-portugal-residences/2671f5e2e24c.webp\" sc-camel-src-set=\"oriel-portugal-residences/b3f9271e3516.webp 700w, oriel-portugal-residences/2671f5e2e24c.webp 1400w\" sizes=\"(min-width: 1100px) 24vw, 92vw\" alt=\"Model view: lime-washed arches and a pale stair behind a drifting sheer curtain.\" loading=\"lazy\" style=\"position:absolute; left:0; right:0; top:-6%; width:100%; height:112%; object-fit:cover;\">\u003c/div>\n          \u003cfigcaption style=\"padding-top:12px; font-size:13px; line-height:1.55; color:#6c6a64;\">\u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#141413; margin-right:10px;\">Fig. 7\u003c/span>Lioz, model view. Lime-washed arches to the bedroom corridor.\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"studio\" data-chapter=\"07\" data-screen-label=\"07 Studio\" aria-labelledby=\"studio-title\" style=\"background:#f5f0e8; padding:clamp(96px,10vw,176px) 0;\">\n      \u003cdiv style=\"max-width:1760px; margin:0 auto; padding:0 clamp(20px,4vw,72px);\">\n        \u003cdiv style=\"display:flex; flex-wrap:wrap; gap:clamp(40px,5vw,112px); align-items:center;\">\n          \u003cdiv style=\"flex:1 1 520px; position:relative; padding-bottom:clamp(48px,7vw,120px);\">\n            \u003cdiv style=\"position:relative; aspect-ratio:16 / 10; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg src=\"oriel-portugal-residences/e85cd926b076.webp\" sc-camel-src-set=\"oriel-portugal-residences/f69d94e8bdfa.webp 700w, oriel-portugal-residences/e85cd926b076.webp 1400w\" sizes=\"(min-width: 1100px) 46vw, 92vw\" alt=\"An architect marks up a printed plan with a pencil and a scale ruler at the studio table.\" loading=\"lazy\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover;\">\u003c/div>\n            \u003cdiv style=\"position:absolute; right:clamp(-8px,-1vw,0px); bottom:0; width:34%; aspect-ratio:2 / 3; border-radius:12px; overflow:hidden; background:#efe9de; border:clamp(6px,0.8vw,12px) solid #f5f0e8;\">\u003cimg src=\"oriel-portugal-residences/c5c1b733d900.webp\" alt=\"A ceramic table lamp, a stack of books and a sprig in a vase on an oak sideboard.\" loading=\"lazy\" style=\"width:100%; height:100%; object-fit:cover;\">\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"flex:1 1 440px; display:flex; flex-direction:column; gap:28px;\">\n            \u003cp style=\"margin:0; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#6c6a64;\">07 — The studio\u003c/p>\n            \u003ch2 id=\"studio-title\" style=\"margin:0; max-width:17ch; font-family:var(--font-serif-display); font-weight:400; font-size:clamp(38px,4vw,76px); line-height:1.02; letter-spacing:-0.025em; color:#141413;\">An architect and an engineer, tired of explaining buildings with drawings.\u003c/h2>\n            \u003cp style=\"margin:0; max-width:52ch; font-size:16px; line-height:1.7; color:#3d3d3a;\">Inês Valadares and Tomás Reis founded Oriel in Lisbon in 2018. The studio puts architects, structural engineers, the construction team and the people who build the models at one table on Rua de São Bento.\u003c/p>\n            \u003cp style=\"margin:0; max-width:52ch; font-size:16px; line-height:1.7; color:#3d3d3a;\">We develop a few residences a year, with independent architects, and we keep the model after handover. It becomes the owners’ record of what sits behind every wall, which matters the first time someone needs to drill into one.\u003c/p>\n            \u003cblockquote style=\"margin:8px 0 0; padding:24px 0 0; border-top:1px solid #d9d1c4;\">\n              \u003cp style=\"margin:0; font-family:var(--font-serif-display); font-style:italic; font-size:clamp(28px,2.4vw,40px); line-height:1.2; color:#141413;\">“A drawing asks you to trust us. A model lets you check.”\u003c/p>\n              \u003cfooter style=\"margin-top:12px; font-size:13px; color:#6c6a64;\">Inês Valadares, co-founder\u003c/footer>\n            \u003c/blockquote>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv ref=\"{{ statsRef }}\" style=\"margin-top:clamp(72px,8vw,140px); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); border-top:1px solid #d9d1c4;\">\n          \u003csc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n            \u003cdiv style=\"padding:28px 24px 8px 0; display:flex; flex-direction:column; gap:12px;\">\n              \u003cspan data-count=\"{{ st.num }}\" style=\"font-family:var(--font-serif-display); font-size:clamp(64px,6vw,112px); line-height:0.9; letter-spacing:-0.03em; color:#141413; font-variant-numeric:lining-nums tabular-nums;\">{{ st.num }}\u003c/span>\n              \u003cspan style=\"max-width:28ch; font-size:14px; line-height:1.55; color:#3d3d3a;\">{{ st.label }}\u003c/span>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n        \u003cp style=\"margin:20px 0 0; font-family:var(--font-mono); font-size:11px; color:#6c6a64;\">Figures are illustrative. Oriel and its developments are fictional, for this prototype.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"journal\" data-chapter=\"08\" data-screen-label=\"08 Journal\" aria-labelledby=\"journal-title\" style=\"background:#faf9f5; padding:clamp(96px,10vw,176px) 0;\">\n      \u003cdiv style=\"max-width:1760px; margin:0 auto; padding:0 clamp(20px,4vw,72px);\">\n        \u003cdiv style=\"display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:clamp(36px,4vw,64px); padding-bottom:24px; border-bottom:1px solid #e6dfd8;\">\n          \u003cdiv>\n            \u003cp style=\"margin:0 0 20px; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#6c6a64;\">08 — The journal · No. 14, autumn 2026\u003c/p>\n            \u003ch2 id=\"journal-title\" style=\"margin:0; max-width:16ch; font-family:var(--font-serif-display); font-weight:400; font-size:clamp(42px,5vw,96px); line-height:1; letter-spacing:-0.025em; color:#141413;\">Notes on light, material and place.\u003c/h2>\n          \u003c/div>\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextLink\" href=\"#journal\" hint-size=\"120px,24px\">All entries →\u003c/x-import>\n        \u003c/div>\n        \u003cdiv style=\"display:flex; flex-wrap:wrap; gap:clamp(40px,5vw,96px);\">\n          \u003carticle style=\"flex:1.3 1 560px; min-width:0;\">\n            \u003ca href=\"#journal\" style=\"display:flex; flex-direction:column; gap:20px; color:#141413;\">\n              \u003cdiv style=\"position:relative; aspect-ratio:4 / 3; border-radius:12px; overflow:hidden; background:#efe9de;\">\u003cimg src=\"oriel-portugal-residences/6a37ccff6647.webp\" sc-camel-src-set=\"oriel-portugal-residences/021e5d359111.webp 700w, oriel-portugal-residences/6a37ccff6647.webp 1400w\" sizes=\"(min-width: 1100px) 50vw, 92vw\" alt=\"Low winter sun falls through a window and a sheer curtain, casting long bars of light down a pale wall.\" loading=\"lazy\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 40%;\">\u003c/div>\n              \u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#6c6a64;\">Light · 7 min read\u003c/span>\n              \u003cspan style=\"max-width:22ch; font-family:var(--font-serif-display); font-size:clamp(34px,3.2vw,56px); line-height:1.05; letter-spacing:-0.02em;\">What a February morning taught us about a living room\u003c/span>\n              \u003cspan style=\"max-width:56ch; font-size:16px; line-height:1.65; color:#3d3d3a;\">We moved a window forty centimetres after watching the winter sun cross Residence 3B in the model. Its owners now call it the best decision in the flat.\u003c/span>\n            \u003c/a>\n          \u003c/article>\n          \u003cdiv style=\"flex:1 1 380px; min-width:0; display:flex; flex-direction:column;\">\n            \u003csc-for list=\"{{ journal }}\" as=\"j\" hint-placeholder-count=\"3\">\n              \u003carticle style=\"border-top:1px solid #e6dfd8;\">\n                \u003ca href=\"#journal\" style=\"display:flex; gap:20px; align-items:flex-start; padding:24px 0; color:#141413;\">\n                  \u003cdiv style=\"flex:0 0 clamp(104px,9vw,148px); aspect-ratio:4 / 5; border-radius:8px; overflow:hidden; background:#efe9de;\">\u003cimg src=\"{{ j.img }}\" alt=\"{{ j.alt }}\" loading=\"lazy\" style=\"width:100%; height:100%; object-fit:cover;\">\u003c/div>\n                  \u003cdiv style=\"min-width:0; display:flex; flex-direction:column; gap:10px;\">\n                    \u003cspan style=\"font-family:var(--font-mono); font-size:12px; color:#6c6a64;\">{{ j.cat }}\u003c/span>\n                    \u003cspan style=\"font-family:var(--font-serif-display); font-size:clamp(24px,2vw,32px); line-height:1.12; letter-spacing:-0.01em;\">{{ j.title }}\u003c/span>\n                    \u003cspan style=\"font-size:14px; line-height:1.6; color:#3d3d3a;\">{{ j.dek }}\u003c/span>\n                  \u003c/div>\n                \u003c/a>\n              \u003c/article>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"future\" data-chapter=\"09\" data-screen-label=\"09 Future\" aria-labelledby=\"future-title\" style=\"background:#181715; color:#faf9f5;\">\n      \u003cdiv ref=\"{{ futureRef }}\" style=\"position:relative; height:280vh;\">\n        \u003cdiv style=\"position:sticky; top:0; height:100svh; overflow:hidden; display:flex; align-items:center;\">\n          \u003cdiv style=\"max-width:1760px; width:100%; margin:0 auto; padding:{{ futureTop }} clamp(20px,4vw,72px) 24px; display:flex; flex-wrap:wrap; align-items:center; gap:clamp(16px,3vh,32px) clamp(40px,6vw,120px);\">\n            \u003cdiv style=\"flex:1 1 320px; max-width:460px; display:flex; flex-direction:column; gap:clamp(10px,2vh,20px);\">\n              \u003cp style=\"margin:0; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#a09d96;\">09 — The future\u003c/p>\n              \u003ch2 id=\"future-title\" style=\"margin:0; font-family:var(--font-serif-display); font-weight:400; font-size:clamp(32px,3.2vw,56px); line-height:1.06; letter-spacing:-0.02em; color:#faf9f5;\">How people come to know a home is changing.\u003c/h2>\n              \u003cp style=\"margin:0; font-size:15px; line-height:1.65; color:#a09d96; text-wrap:pretty; display:{{ futureLongDisp }};\">Plans, renders and site visits each show part of a home, in the order the seller prefers. A walkable model shows all of it at once. You arrive at the viewing already knowing the house, and spend it on what no model gives you: the sound of the street, the smell of the pines.\u003c/p>\n            \u003c/div>\n            \u003cdiv style=\"flex:2 1 520px; min-width:0;\">\n              \u003cdiv style=\"display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#8e8b82; padding-bottom:12px;\">\u003cspan>Then → now\u003c/span>\u003cspan>Plan · render · visit\u003c/span>\u003c/div>\n              \u003csc-for list=\"{{ futureWords }}\" as=\"f\" hint-placeholder-count=\"3\">\n                \u003cdiv style=\"display:flex; align-items:center; gap:clamp(16px,2vw,32px); border-top:1px solid rgba(250,249,245,0.12); padding:clamp(8px,1.2vw,18px) 0;\">\n                  \u003cspan style=\"flex:0 0 32px; font-family:var(--font-mono); font-size:12px; color:#8e8b82;\">{{ f.n }}\u003c/span>\n                  \u003cspan aria-label=\"{{ f.aria }}\" style=\"position:relative; flex:1 1 auto; display:block; height:1.08em; overflow:hidden; font-family:var(--font-serif-display); font-size:min(clamp(44px,7vw,148px), 11vh); line-height:1.08; letter-spacing:-0.035em;\">\n                    \u003cspan aria-hidden=\"true\" style=\"position:absolute; left:0; top:0; white-space:nowrap; color:#8e8b82; transform:translateY(calc(var({{ f.v }}, 0) * -100%)); opacity:calc(1 - var({{ f.v }}, 0));\">{{ f.old }}\u003c/span>\n                    \u003cspan aria-hidden=\"true\" style=\"position:absolute; left:0; top:0; white-space:nowrap; color:#faf9f5; transform:translateY(calc((1 - var({{ f.v }}, 0)) * 100%));\">{{ f.next }}\u003c/span>\n                  \u003c/span>\n                \u003c/div>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv ref=\"{{ bandRef }}\" style=\"position:relative; height:clamp(380px,76vh,900px); overflow:hidden; clip-path:inset(calc((1 - var(--q, 1)) * 7%) calc((1 - var(--q, 1)) * 7%) round calc((1 - var(--q, 1)) * 24px));\">\n        \u003cimg src=\"oriel-portugal-residences/1651e1b7c9b4.webp\" sc-camel-src-set=\"oriel-portugal-residences/d7e56cb41381.webp 900w, oriel-portugal-residences/1651e1b7c9b4.webp 1800w\" sizes=\"100vw\" alt=\"White rendered walls stepping up into a dusk sky that fades from peach to pale blue.\" loading=\"lazy\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 30%; transform:scale(calc(1.12 - var(--q, 1) * 0.12));\">\n        \u003cspan style=\"position:absolute; left:clamp(20px,4vw,72px); bottom:24px; background:#181715; color:#faf9f5; font-family:var(--font-mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; padding:7px 10px; border-radius:4px;\">Pinhal, Comporta · photographed at 19:42, 14 August\u003c/span>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"viewing\" data-chapter=\"10\" data-screen-label=\"10 Private viewing\" aria-labelledby=\"viewing-title\" style=\"background:#cc785c; color:#141413; padding:clamp(88px,9vw,168px) 0;\">\n      \u003cdiv style=\"max-width:1760px; margin:0 auto; padding:0 clamp(20px,4vw,72px); display:flex; flex-wrap:wrap; gap:clamp(40px,6vw,120px); align-items:flex-start;\">\n        \u003cdiv style=\"flex:1.4 1 520px; min-width:0; display:flex; flex-direction:column; gap:28px;\">\n          \u003cp style=\"margin:0; font-size:12px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:#141413;\">10 — Private viewing\u003c/p>\n          \u003ch2 id=\"vi
