n;gap:26px;padding-bottom:clamp(0px,0.8vw,14px)\">\n        \u003cp style=\"margin:0;font-size:clamp(17px,1.25vw,19px);line-height:1.55;color:var(--text-lead);text-wrap:pretty\">One-on-one care with a Doctor of Physical Therapy. Every visit is sixty minutes with the same clinician, and every price is published before you book.\u003c/p>\n        \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openEval }}\" hint-size=\"190px,40px\">Schedule your evaluation\u003c/x-import>\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ openCall }}\" hint-size=\"170px,40px\">Free 15-minute call\u003c/x-import>\n        \u003c/div>\n        \u003cp style=\"margin:0;font-size:13px;font-weight:500;color:var(--text-secondary)\">No referral needed in Colorado · HSA and FSA accepted\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv data-reveal=\"img\" style=\"position:relative;border-radius:16px;overflow:hidden;height:clamp(340px,47vw,780px);background:var(--color-surface-card)\">\n      \u003csc-if value=\"{{ heroWide }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cimg ref=\"{{ heroImg }}\" src=\"range-physical-therapy/ecc0909db9e1.webp\" alt=\"Dr. Mara Ellison guides a patient through an assisted arm and leg raise in the sunlit Range studio\" fetchpriority=\"high\" style=\"position:absolute;left:0;top:-6%;width:100%;height:112%;object-fit:cover;object-position:50% 46%;will-change:transform\">\n      \u003c/sc-if>\n      \u003csc-if value=\"{{ heroClose }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003cimg ref=\"{{ heroImg }}\" src=\"range-physical-therapy/a22d6853c137.webp\" alt=\"Dr. Mara Ellison guides a patient through an assisted leg raise\" style=\"position:absolute;left:0;top:-6%;width:100%;height:112%;object-fit:cover;object-position:50% 38%;will-change:transform\">\n      \u003c/sc-if>\n      \u003csc-if value=\"{{ showAvailability }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cdiv style=\"position:absolute;left:clamp(12px,2vw,28px);bottom:clamp(12px,2vw,28px);max-width:calc(100% - 24px);box-sizing:border-box;background:var(--color-canvas);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 3px rgba(20,20,19,0.08)\">\n          \u003cspan aria-hidden=\"true\" style=\"width:8px;height:8px;border-radius:999px;background:var(--color-accent-teal);flex:none\">\u003c/span>\n          \u003cspan style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n            \u003cspan style=\"font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-secondary)\">Next opening\u003c/span>\n            \u003cspan style=\"font-size:15px;font-weight:500;color:var(--text-heading);font-variant-numeric:tabular-nums\">{{ nextOpening }}\u003c/span>\n          \u003c/span>\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextLink\" href=\"#book\" size=\"sm\" sc-camel-on-click=\"{{ reserveNext }}\" hint-size=\"72px,20px\">Reserve →\u003c/x-import>\n        \u003c/div>\n      \u003c/sc-if>\n    \u003c/div>\n\n    \u003cdiv role=\"list\" aria-label=\"What every visit includes\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:28px 40px;margin-top:clamp(40px,5vw,80px)\">\n      \u003cdiv role=\"listitem\" data-reveal=\"up\" style=\"border-top:1px solid var(--border-default);padding-top:24px;display:flex;flex-direction:column;gap:10px\">\n        \u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(46px,4.2vw,68px);line-height:1;letter-spacing:-0.02em;color:var(--text-heading)\">60\u003c/span>\n        \u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-body);max-width:30ch\">minutes, every visit, one-on-one with your therapist.\u003c/span>\n      \u003c/div>\n      \u003cdiv role=\"listitem\" data-reveal=\"up\" style=\"border-top:1px solid var(--border-default);padding-top:24px;display:flex;flex-direction:column;gap:10px\">\n        \u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(46px,4.2vw,68px);line-height:1;letter-spacing:-0.02em;color:var(--text-heading)\">1\u003c/span>\n        \u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-body);max-width:30ch\">clinician from your evaluation to your last visit.\u003c/span>\n      \u003c/div>\n      \u003cdiv role=\"listitem\" data-reveal=\"up\" style=\"border-top:1px solid var(--border-default);padding-top:24px;display:flex;flex-direction:column;gap:10px\">\n        \u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(46px,4.2vw,68px);line-height:1;letter-spacing:-0.02em;color:var(--text-heading)\">0\u003c/span>\n        \u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-body);max-width:30ch\">referrals needed. Colorado allows direct access to physical therapy.\u003c/span>\n      \u003c/div>\n      \u003cdiv role=\"listitem\" data-reveal=\"up\" style=\"border-top:1px solid var(--border-default);padding-top:24px;display:flex;flex-direction:column;gap:10px\">\n        \u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(46px,4.2vw,68px);line-height:1;letter-spacing:-0.02em;color:var(--text-heading)\">$185\u003c/span>\n        \u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-body);max-width:30ch\">per follow-up visit, flat and published. HSA and FSA cards accepted.\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"model\" aria-labelledby=\"model-title\" style=\"background:var(--color-surface-dark);color:var(--color-on-dark);padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:28px clamp(32px,6vw,112px)\">\n      \u003cdiv style=\"flex:999 1 560px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--color-on-dark-soft)\">Why we’re cash-pay\u003c/p>\n        \u003ch2 id=\"model-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.6vw,76px);line-height:1.02;letter-spacing:-0.022em;color:var(--color-on-dark);margin:18px 0 0;max-width:15ch;text-wrap:balance\">Sixty minutes, and every one of them is yours.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:470px;margin:0;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:var(--color-on-dark-soft);text-wrap:pretty\">We work outside insurance networks so that you and your therapist decide what a visit includes and how long it lasts. You pay one published price. The whole hour goes to your care, with one patient on the schedule at a time.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv ref=\"{{ hourRef }}\" style=\"margin-top:clamp(56px,6.5vw,104px)\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:14px;font-size:13px;font-weight:500;color:var(--color-on-dark-soft)\">\n        \u003cspan>Inside a follow-up visit\u003c/span>\n        \u003cspan style=\"font-variant-numeric:tabular-nums\">60 min\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"position:relative;display:grid;grid-template-columns:1fr 2fr 2fr 1fr;gap:4px;height:clamp(64px,7vw,104px)\">\n        \u003csc-for list=\"{{ segs }}\" as=\"g\" hint-placeholder-count=\"4\">\n          \u003cbutton type=\"button\" sc-camel-on-click=\"{{ g.select }}\" sc-camel-on-mouse-enter=\"{{ g.select }}\" sc-camel-on-focus=\"{{ g.select }}\" aria-pressed=\"{{ g.active }}\" aria-label=\"{{ g.aria }}\" style=\"background:{{ g.bg }};color:{{ g.fg }};border:0;border-radius:8px;display:flex;align-items:flex-end;padding:12px clamp(8px,1vw,16px);font-family:var(--font-sans);font-size:13px;font-weight:500;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;transition:background-color 280ms var(--ease-standard),color 280ms var(--ease-standard);min-width:0;overflow:hidden;white-space:nowrap\">{{ g.short }}\u003c/button>\n        \u003c/sc-for>\n        \u003cdiv aria-hidden=\"true\" style=\"position:absolute;left:0;bottom:-12px;height:2px;border-radius:2px;width:{{ hourProgress }};background:var(--color-primary);transition:width 2600ms cubic-bezier(0.3,0,0,1)\">\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:28px 40px;margin-top:44px\">\n        \u003csc-for list=\"{{ segs }}\" as=\"g\" hint-placeholder-count=\"4\">\n          \u003cdiv sc-camel-on-mouse-enter=\"{{ g.select }}\" style=\"border-top:1px solid {{ g.line }};padding-top:20px;display:flex;flex-direction:column;gap:10px;transition:border-color 280ms\">\n            \u003cspan style=\"font-size:13px;font-weight:500;color:var(--color-on-dark-soft);font-variant-numeric:tabular-nums\">{{ g.range }}\u003c/span>\n            \u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(26px,2.2vw,32px);line-height:1.12;letter-spacing:-0.3px;color:{{ g.titleColor }};margin:0;transition:color 280ms\">{{ g.title }}\u003c/h3>\n            \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-on-dark-soft);text-wrap:pretty\">{{ g.body }}\u003c/p>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px;margin-top:clamp(72px,8vw,128px);padding-top:clamp(40px,4vw,56px);border-top:1px solid rgba(250,249,245,0.10)\">\n      \u003cdiv data-reveal=\"up\" style=\"display:flex;flex-direction:column;gap:12px\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"clock\" size=\"{{ 22 }}\" hint-size=\"22px,22px\">\u003c/x-import>\n        \u003ch3 style=\"font-family:var(--font-sans);font-weight:500;font-size:18px;line-height:1.4;color:var(--color-on-dark);margin:6px 0 0;letter-spacing:0\">Time to find the cause\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-on-dark-soft);max-width:38ch\">A longer visit lets us look past the sore spot to how you move, load and recover.\u003c/p>\n      \u003c/div>\n      \u003cdiv data-reveal=\"up\" style=\"display:flex;flex-direction:column;gap:12px\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"message-circle\" size=\"{{ 22 }}\" hint-size=\"22px,22px\">\u003c/x-import>\n        \u003ch3 style=\"font-family:var(--font-sans);font-weight:500;font-size:18px;line-height:1.4;color:var(--color-on-dark);margin:6px 0 0;letter-spacing:0\">A direct line to your therapist\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-on-dark-soft);max-width:38ch\">Questions between visits go straight to Dr. Ellison by email or text, and she answers them herself.\u003c/p>\n      \u003c/div>\n      \u003cdiv data-reveal=\"up\" style=\"display:flex;flex-direction:column;gap:12px\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"receipt\" size=\"{{ 22 }}\" hint-size=\"22px,22px\">\u003c/x-import>\n        \u003ch3 style=\"font-family:var(--font-sans);font-weight:500;font-size:18px;line-height:1.4;color:var(--color-on-dark);margin:6px 0 0;letter-spacing:0\">Prices you can plan around\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-on-dark-soft);max-width:38ch\">Flat, published rates, and a superbill for out-of-network claims. No surprise charges.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"approach\" aria-labelledby=\"method-title\" style=\"padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px clamp(32px,6vw,112px)\">\n      \u003cdiv style=\"flex:999 1 560px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary)\">The Range method\u003c/p>\n        \u003ch2 id=\"method-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.6vw,76px);line-height:1.02;letter-spacing:-0.022em;color:var(--text-heading);margin:18px 0 0;max-width:14ch;text-wrap:balance\">From first visit to full range.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:470px;margin:0;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:var(--text-body);text-wrap:pretty\">Most plans move through five phases. Some people spend longer in one than another, but the order holds, and you will always know which phase you are in.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;flex-direction:row-reverse;align-items:flex-start;gap:40px clamp(40px,6vw,120px);margin-top:clamp(48px,5.5vw,88px)\">\n      \u003cdiv style=\"flex:1 1 400px;min-width:0;position:{{ methodPos }};top:104px\">\n        \u003cdiv data-reveal=\"img\" style=\"position:relative;aspect-ratio:{{ methodAspect }};border-radius:12px;overflow:hidden;background:var(--color-surface-card)\">\n          \u003cimg src=\"range-physical-therapy/cc94c64ad882.webp\" alt=\"Dr. Ellison talks with a patient at the start of a session\" aria-hidden=\"{{ stepImgs.0.hidden }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;opacity:{{ stepImgs.0.op }};transform:scale({{ stepImgs.0.scale }});transition:opacity 700ms var(--ease-standard),transform 1400ms var(--ease-standard)\">\n          \u003cimg src=\"range-physical-therapy/d0a734018ef1.webp\" alt=\"Dr. Ellison assesses the shoulder movement of a seated patient\" aria-hidden=\"{{ stepImgs.1.hidden }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:38% 50%;opacity:{{ stepImgs.1.op }};transform:scale({{ stepImgs.1.scale }});transition:opacity 700ms var(--ease-standard),transform 1400ms var(--ease-standard)\">\n          \u003cimg src=\"range-physical-therapy/cc3f415eaa32.webp\" alt=\"Hands-on treatment of a patient’s shoulder\" aria-hidden=\"{{ stepImgs.2.hidden }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 40%;opacity:{{ stepImgs.2.op }};transform:scale({{ stepImgs.2.scale }});transition:opacity 700ms var(--ease-standard),transform 1400ms var(--ease-standard)\">\n          \u003cimg src=\"range-physical-therapy/d2a0bb7c7a71.webp\" alt=\"A patient holds a pair of light dumbbells during a strength exercise\" aria-hidden=\"{{ stepImgs.3.hidden }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;opacity:{{ stepImgs.3.op }};transform:scale({{ stepImgs.3.scale }});transition:opacity 700ms var(--ease-standard),transform 1400ms var(--ease-standard)\">\n          \u003cimg src=\"range-physical-therapy/a22d6853c137.webp\" alt=\"Dr. Ellison guides a patient through an assisted leg raise\" aria-hidden=\"{{ stepImgs.4.hidden }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;opacity:{{ stepImgs.4.op }};transform:scale({{ stepImgs.4.scale }});transition:opacity 700ms var(--ease-standard),transform 1400ms var(--ease-standard)\">\n          \u003cdiv style=\"position:absolute;left:16px;bottom:16px;background:var(--color-canvas);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--text-heading);font-variant-numeric:tabular-nums\">{{ activeStepLabel }}\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003col style=\"flex:1.15 1 480px;min-width:0;list-style:none;margin:0;padding:0;border-top:1px solid var(--border-default)\">\n        \u003csc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n          \u003cli style=\"border-bottom:1px solid var(--border-default)\">\n            \u003ch3 style=\"margin:0;font:inherit\">\n              \u003cbutton type=\"button\" id=\"{{ st.bid }}\" aria-expanded=\"{{ st.active }}\" aria-controls=\"{{ st.pid }}\" sc-camel-on-click=\"{{ st.select }}\" style=\"width:100%;display:flex;align-items:baseline;gap:clamp(16px,2vw,28px);padding:clamp(22px,2.2vw,32px) 0;background:none;border:0;cursor:pointer;text-align:left;color:inherit\">\n                \u003cspan style=\"font-size:13px;font-weight:500;color:{{ st.numColor }};min-width:24px;font-variant-numeric:tabular-nums;transition:color 280ms\">{{ st.num }}\u003c/span>\n                \u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(34px,3.4vw,54px);line-height:1.02;letter-spacing:-0.02em;color:{{ st.titleColor }};transition:color 280ms\">{{ st.title }}\u003c/span>\n                \u003cspan aria-hidden=\"true\" style=\"margin-left:auto;align-self:center;width:34px;height:34px;flex:none;border-radius:999px;border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;color:var(--text-heading);transform:rotate({{ st.rot }});transition:transform 320ms var(--ease-standard)\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"plus\" size=\"{{ 16 }}\" hint-size=\"16px,16px\">\u003c/x-import>\u003c/span>\n              \u003c/button>\n            \u003c/h3>\n            \u003cdiv id=\"{{ st.pid }}\" role=\"region\" aria-labelledby=\"{{ st.bid }}\" style=\"display:grid;grid-template-rows:{{ st.rows }};visibility:{{ st.vis }};transition:grid-template-rows 420ms cubic-bezier(0.3,0,0,1),visibility 420ms\">\n              \u003cdiv style=\"overflow:hidden;min-height:0\">\n                \u003cdiv style=\"padding:0 0 clamp(26px,2.4vw,36px) clamp(40px,4.2vw,52px);display:flex;flex-direction:column;gap:16px;max-width:560px\">\n                  \u003cp style=\"margin:0;font-size:17px;line-height:1.6;color:var(--text-body);text-wrap:pretty\">{{ st.body }}\u003c/p>\n                  \u003cp style=\"margin:0;font-size:14px;line-height:1.55;color:var(--text-secondary)\">\u003cspan style=\"font-weight:500;color:var(--text-heading)\">You leave with \u003c/span>{{ st.leave }}\u003c/p>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/li>\n        \u003c/sc-for>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"treatments\" aria-labelledby=\"cond-title\" style=\"background:var(--color-surface-soft);padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:flex-start;gap:48px clamp(40px,6vw,120px)\">\n    \u003cdiv style=\"flex:1 1 340px;max-width:480px;display:flex;flex-direction:column;gap:22px;position:{{ condPos }};top:104px\">\n      \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary)\">What we treat\u003c/p>\n      \u003ch2 id=\"cond-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.6vw,76px);line-height:1.02;letter-spacing:-0.022em;color:var(--text-heading);margin:0;text-wrap:balance\">What’s getting in your way?\u003c/h2>\n      \u003cp style=\"margin:0;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:var(--text-body);text-wrap:pretty\">We see adults at every activity level, from first-time runners to people rebuilding after surgery. Not sure we’re the right fit? Ask on a free 15-minute call.\u003c/p>\n      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextLink\" href=\"#book\" sc-camel-on-click=\"{{ openCallLink }}\" hint-size=\"160px,24px\">Book a free call →\u003c/x-import>\n      \u003csc-if value=\"{{ isWide }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cdiv data-reveal=\"img\" style=\"margin-top:18px;aspect-ratio:4 / 5;border-radius:12px;overflow:hidden;background:var(--color-surface-card)\">\n          \u003cimg src=\"range-physical-therapy/a96ddabf1d52.webp\" alt=\"A patient lies on the treatment table while Dr. Ellison guides an overhead arm raise\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 40%\">\n        \u003c/div>\n      \u003c/sc-if>\n    \u003c/div>\n\n    \u003cdiv style=\"flex:2 1 560px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:clamp(24px,3vw,48px)\">\n      \u003cbutton type=\"button\" data-reason=\"Low back pain\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Low back pain. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Low back pain\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Acute flare-ups, recurring stiffness, disc-related pain.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Neck and upper back\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Neck and upper back. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Neck and upper back\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Desk-related strain, stiffness, headaches that start in the neck.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Shoulder\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Shoulder. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Shoulder\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Rotator cuff pain, impingement, frozen shoulder, instability.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Knee and ACL\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Knee and ACL. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Knee and ACL\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">ACL reconstruction, kneecap pain, meniscus injuries.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Hip and pelvis\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Hip and pelvis. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Hip and pelvis\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Hip impingement, gluteal tendon pain, groin strain.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Running injury\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Running injuries. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Running injuries\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Achilles, plantar fascia, shin and IT band pain, return-to-run plans.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Climbing or sport injury\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Climbing and sport. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Climbing and sport\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Finger pulleys, elbows, ankle sprains, overuse injuries.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Rehab after surgery\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"After surgery. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">After surgery\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Rehab after joint replacements, repairs and reconstructions.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Persistent pain\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Persistent pain. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Persistent pain\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">Pain that has outlasted the injury, approached gradually.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-reason=\"Strength and mobility\" sc-camel-on-click=\"{{ bookReason }}\" aria-label=\"Strength and mobility. Book a visit.\" style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:24px 12px;background:transparent;border:0;border-top:1px solid var(--border-default);text-align:left;cursor:pointer;color:inherit;transition:background-color 180ms\" style-hover=\"background:var(--color-surface-card)\">\u003cspan style=\"display:flex;flex-direction:column;gap:6px\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(26px,2.2vw,34px);line-height:1.1;letter-spacing:-0.3px;color:var(--text-heading)\">Strength and mobility\u003c/span>\u003cspan style=\"font-size:15px;line-height:1.5;color:var(--text-secondary)\">For when nothing is injured but everything feels harder than it should.\u003c/span>\u003c/span>\u003cspan aria-hidden=\"true\" style=\"color:var(--text-secondary);font-size:18px;padding-top:6px\">→\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"about\" aria-labelledby=\"about-title\" style=\"padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:48px clamp(40px,7vw,128px)\">\n    \u003cfigure style=\"flex:1 1 360px;max-width:600px;margin:0;display:flex;flex-direction:column;gap:12px\">\n      \u003cdiv data-reveal=\"img\" style=\"aspect-ratio:4 / 5;border-radius:12px;overflow:hidden;background:var(--color-surface-card)\">\n        \u003cimg src=\"range-physical-therapy/463f54ca7aae.webp\" alt=\"Dr. Mara Ellison, wearing a white linen shirt, standing beside a treatment table in the Range studio\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 18%\">\n      \u003c/div>\n      \u003cfigcaption style=\"font-size:13px;color:var(--text-secondary)\">Dr. Mara Ellison in the Pearl Street studio.\u003c/figcaption>\n    \u003c/figure>\n    \u003cdiv style=\"flex:1.25 1 460px;max-width:660px;min-width:0;display:flex;flex-direction:column\">\n      \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary)\">Your therapist\u003c/p>\n      \u003ch2 id=\"about-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.6vw,76px);line-height:1.02;letter-spacing:-0.022em;color:var(--text-heading);margin:18px 0 0\">Dr. Mara Ellison\u003c/h2>\n      \u003cp style=\"margin:14px 0 0;font-size:14px;font-weight:500;line-height:1.5;color:var(--text-secondary)\">PT, DPT · Board-certified Orthopaedic Clinical Specialist (OCS) · CSCS\u003c/p>\n      \u003cblockquote style=\"margin:clamp(32px,3.5vw,48px) 0;padding:0;font-family:var(--font-serif-display);font-size:clamp(26px,2.4vw,38px);line-height:1.22;letter-spacing:-0.4px;color:var(--text-heading);text-wrap:pretty\">“I opened Range so I could spend the whole appointment with the person in front of me, and still have time to explain what we’re doing and why.”\u003c/blockquote>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;font-size:16px;line-height:1.65;color:var(--text-body);max-width:60ch\">\n        \u003cp style=\"margin:0\">Mara spent eight years in busy outpatient orthopaedic clinics in Denver, working with post-surgical knees, desk-bound backs and a fair number of cyclists. She opened Range in 2021 to build a practice around what worked best in those years: long, focused visits and a plan the patient fully understands.\u003c/p>\n        \u003cp style=\"margin:0\">She runs the Mesa Trail most mornings and climbs a couple of evenings a week, which is part of why so many of her patients are runners and climbers. You don’t need to be either to work with her.\u003c/p>\n      \u003c/div>\n      \u003cdl style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px 32px;margin:36px 0 0;padding-top:24px;border-top:1px solid var(--border-default)\">\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cdt style=\"font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-secondary)\">In practice\u003c/dt>\u003cdd style=\"margin:0;font-size:16px;color:var(--text-heading)\">Since 2013\u003c/dd>\u003c/div>\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:4px\">\u003cdt style=\"font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-secondary)\">Training\u003c/dt>\u003cdd style=\"margin:0;font-size:16px;color:var(--text-heading)\">Doctor of Physical Therapy, orthopaedic residency\u003c/dd>\u003c/div>\n      \u003c/dl>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:24px\" aria-label=\"Focus areas\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" hint-size=\"110px,28px\">Orthopaedics\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" hint-size=\"130px,28px\">Running injuries\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" hint-size=\"140px,28px\">Climbing injuries\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" hint-size=\"150px,28px\">Post-surgical rehab\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" hint-size=\"140px,28px\">Strength training\u003c/x-import>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"pricing\" aria-labelledby=\"pricing-title\" style=\"background:var(--color-surface-card);padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px clamp(32px,6vw,112px)\">\n      \u003cdiv style=\"flex:999 1 560px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary)\">Pricing\u003c/p>\n        \u003ch2 id=\"pricing-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(40px,4.6vw,76px);line-height:1.02;letter-spacing:-0.022em;color:var(--text-heading);margin:18px 0 0;max-width:14ch;text-wrap:balance\">Clear prices, before you book.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:470px;margin:0;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:var(--text-body);text-wrap:pretty\">Every visit is sixty minutes, one-on-one with Dr. Ellison. No facility fees, no add-on charges and no membership.\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;margin-top:clamp(48px,5vw,72px);align-items:stretch\">\n      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.PricingTierCard\" featured=\"{{ true }}\" name=\"Initial evaluation\" price=\"$215\" period=\"/ 60 min\" description=\"Where everyone starts. A full assessment, your first treatment and a written plan.\" features=\"{{ evalFeatures }}\" cta-label=\"Schedule your evaluation\" on-cta=\"{{ openEval }}\" hint-size=\"100%,500px\">\u003c/x-import>\n      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.PricingTierCard\" name=\"Follow-up visit\" price=\"$185\" period=\"/ 60 min\" description=\"Treatment and coached exercise, reassessed at the start of every visit.\" features=\"{{ followFeatures }}\" cta-label=\"Book a follow-up\" on-cta=\"{{ openFollow }}\" hint-size=\"100%,500px\">\u003c/x-import>\n      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.PricingTierCard\" name=\"Six-visit plan\" price=\"$1,020\" period=\"/ 6 visits\" description=\"Six follow-up visits at $170 each, used within four months.\" features=\"{{ planFeatures }}\" cta-label=\"Start a plan\" on-cta=\"{{ openFollow }}\" hint-size=\"100%,500px\">\u003c/x-import>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:28px 40px;margin-top:clamp(48px,5vw,72px)\">\n      \u003cdiv style=\"border-top:1px solid var(--border-strong);padding-top:20px;display:flex;flex-direction:column;gap:8px\">\n        \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:16px;font-weight:500;letter-spacing:0;line-height:1.4;color:var(--text-heading)\">HSA and FSA\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--text-body)\">Physical therapy is generally an eligible expense. We accept HSA and FSA cards at checkout.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px solid var(--border-strong);padding-top:20px;display:flex;flex-direction:column;gap:8px\">\n        \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:16px;font-weight:500;letter-spacing:0;line-height:1.4;color:var(--text-heading)\">Superbills\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--text-body)\">You’ll get a superbill after each visit to submit for out-of-network benefits. Coverage depends on your plan.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px solid var(--border-strong);padding-top:20px;display:flex;flex-direction:column;gap:8px\">\n        \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:16px;font-weight:500;letter-spacing:0;line-height:1.4;color:var(--text-heading)\">No surprises\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--text-body)\">You’ll see the full cost before your first visit. Reschedule or cancel up to 24 hours ahead at no charge.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px solid var(--border-strong);padding-top:20px;display:flex;flex-direction:column;gap:8px\">\n        \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:16px;font-weight:500;letter-spacing:0;line-height:1.4;color:var(--text-heading)\">Not sure yet?\u003c/h3>\n        \u003cp style=\"margin:0;font-size:15px;line-height:1.6;color:var(--text-body)\">Talk it through with Mara on a free 15-minute call.\u003c/p>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextLink\" href=\"#book\" size=\"sm\" sc-camel-on-click=\"{{ openCallLink }}\" hint-size=\"100px,22px\">Book a call →\u003c/x-import>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"stories\" aria-labelledby=\"stories-title\" style=\"background:var(--color-surface-dark);color:var(--color-on-dark);padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box\">\n    \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--color-on-dark-soft)\">Patient stories\u003c/p>\n    \u003ch2 id=\"stories-title\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\">Patient stories\u003c/h2>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:56px clamp(40px,7vw,128px);margin-top:28px;align-items:flex-start\">\n      \u003cfigure data-reveal=\"up\" style=\"flex:1.5 1 520px;min-width:0;margin:0;display:flex;flex-direction:column;gap:clamp(28px,3vw,44px)\">\n        \u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(32px,3.5vw,56px);line-height:1.12;letter-spacing:-0.022em;color:var(--color-on-dark);text-wrap:pretty\">“I’d been told to stop running. Mara asked what I wanted my running to look like a year from now, and we planned backwards from there. In May I ran the Bolder Boulder.”\u003c/blockquote>\n        \u003cfigcaption style=\"display:flex;align-items:center;gap:14px\">\n          \u003cspan aria-hidden=\"true\" style=\"width:44px;height:44px;border-radius:999px;background:var(--color-surface-dark-elevated);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif-display);font-size:18px;color:var(--color-on-dark);flex:none\">KM\u003c/span>\n          \u003cspan style=\"display:flex;flex-direction:column;gap:2px\">\u003cspan style=\"font-size:15px;font-weight:500;color:var(--color-on-dark)\">K.M., 41\u003c/span>\u003cspan style=\"font-size:14px;color:var(--color-on-dark-soft)\">Achilles tendon pain · 10 visits over four months\u003c/span>\u003c/span>\n        \u003c/figcaption>\n      \u003c/figure>\n      \u003cdiv style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:40px\">\n        \u003cfigure data-reveal=\"up\" style=\"margin:0;padding-top:28px;border-top:1px solid rgba(250,249,245,0.12);display:flex;flex-direction:column;gap:22px\">\n          \u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,1.9vw,30px);line-height:1.25;letter-spacing:-0.3px;color:var(--color-on-dark);text-wrap:pretty\">“Every appointment was the full hour, and she remembered everything from the last one. I never had to retell my story.”\u003c/blockquote>\n          \u003cfigcaption style=\"display:flex;align-items:center;gap:14px\">\n            \u003cspan aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:999px;background:var(--color-surface-dark-elevated);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif-display);font-size:16px;color:var(--color-on-dark);flex:none\">JR\u003c/span>\n            \u003cspan style=\"display:flex;flex-direction:column;gap:2px\">\u003cspan style=\"font-size:15px;font-weight:500;color:var(--color-on-dark)\">J.R., 63\u003c/span>\u003cspan style=\"font-size:14px;color:var(--color-on-dark-soft)\">Rehab after shoulder replacement · 16 visits\u003c/span>\u003c/span>\n          \u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure data-reveal=\"up\" style=\"margin:0;padding-top:28px;border-top:1px solid rgba(250,249,245,0.12);display:flex;flex-direction:column;gap:22px\">\n          \u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,1.9vw,30px);line-height:1.25;letter-spacing:-0.3px;color:var(--color-on-dark);text-wrap:pretty\">“My back had flared every spring for six years. I left with a strength routine I still do on Sunday mornings, and I understand why it works.”\u003c/blockquote>\n          \u003cfigcaption style=\"display:flex;align-items:center;gap:14px\">\n            \u003cspan aria-hidden=\"true\" style=\"width:40px;height:40px;border-radius:999px;background:var(--color-surface-dark-elevated);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif-display);font-size:16px;color:var(--color-on-dark);flex:none\">AT\u003c/span>\n            \u003cspan style=\"display:flex;flex-direction:column;gap:2px\">\u003cspan style=\"font-size:15px;font-weight:500;color:var(--color-on-dark)\">A.T., 35\u003c/span>\u003cspan style=\"font-size:14px;color:var(--color-on-dark-soft)\">Recurring low back pain · 6 visits\u003c/span>\u003c/span>\n          \u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/div>\n    \u003cp style=\"margin:clamp(48px,5vw,72px) 0 0;font-size:13px;color:var(--color-on-dark-soft)\">Shared with permission. Initials are used for privacy. Every recovery is different.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"faq\" aria-labelledby=\"faq-title\" style=\"padding:clamp(88px,9vw,152px) 0\">\n  \u003cdiv style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:flex-start;gap:40px clamp(40px,7vw,128px)\">\n    \u003cdiv style=\"flex:1 1 320px;max-width:440px;display:flex;flex-directi color-on-primary);margin:0;max-width:10ch;text-wrap:balance\">Start with one hour.\u003c/h2>\n        \u003cp style=\"margin:0;font-size:clamp(16px,1.25vw,19px);line-height:1.55;color:var(--color-on-primary);max-width:44ch;text-wrap:pretty\">Evaluations are open this week, including early mornings and Saturdays. Booking takes about two minutes, and Mara will be in touch before your visit.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"inverse\" sc-camel-on-click=\"{{ openEval }}\" hint-size=\"200px,40px\">Schedule your evaluation\u003c/x-import>\n        \u003ca href=\"tel:+13035550142\" style=\"font-size:15px;font-weight:500;color:var(--color-on-primary);text-decoration:underline;text-underline-offset:4px\" style-hover=\"color:var(--color-on-primary);text-decoration:underline\">Or call (303) 555-0142\u003c/a>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv data-reveal=\"up\" style=\"flex:1 1 360px;min-width:0;background:var(--color-surface-card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n      \u003cdiv style=\"height:clamp(200px,17vw,300px);overflow:hidden;background:var(--color-surface-cream-strong)\">\n        \u003cimg src=\"range-physical-therapy/d803ad46be5a.webp\" alt=\"The Range studio: a cream treatment table, wood floors and tall windows\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 45%\">\n      \u003c/div>\n      \u003cdiv style=\"padding:clamp(24px,2.4vw,36px);display:flex;flex-direction:column;gap:20px;flex:1\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary)\">Visit the studio\u003c/p>\n        \u003caddress style=\"font-style:normal;display:flex;flex-direction:column;gap:4px\">\n          \u003cspan style=\"font-family:va d:var(--color-surface-card);display:flex;align-items:center;justify-content:center;color:var(--color-ink)\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"check\" size=\"{{ 22 }}\" hint-size=\"22px,22px\">\u003c/x-import>\u003c/span>\n          \u003cp role=\"status\" style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(40px,5vw,56px);line-height:1.02;letter-spacing:-0.02em;color:var(--text-heading)\">You’re booked.\u003c/p>\n          \u003cp style=\"margin:0;font-size:17px;line-height:1.6;color:var(--text-body);max-width:44ch\">{{ confirmText }}\u003c/p>\n          \u003cdiv style=\"margin-top:12px;padding:20px;border-radius:12px;background:var(--color-surface-soft);display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5;color:var(--text-body)\">\n            \u003cspan style=\"font-weight:500;color:var(--text-heading)\">Range Physical Therapy\u003c/span>\n            \u003cspan>1942 Pearl Street, Suite 200, Boulder\u003c/span>\n            \u003cspan>Wear clothes you can move in. Bring any imaging reports or surgical notes.\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:8px\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ closeBooking }}\" hint-size=\"80px,40px\">Done\u003c/x-import>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n    \u003c/div>\n  \u003c/div>\n\u003c/sc-if>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroImage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Studio wide&quot;,&quot;Close guidance&quot;],&quot;default&quot;:&quot;Studio wide&quot;,&quot;tsType&quot;:&quot;'Studio wide' | 'Close guidance'&quot;},&quot;showAvailability&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;methodAutoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    vw: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    scrolled: false, menuOpen: false,\n    step: 0, seg: 1, hourSeen: false, faq: 0,\n    booking: false, bookIn: false, visit: 'eval', day: 0, slot: null,\n    name: '', email: '', phone: '', reason: '', booked: false, triedEmail: false,\n  };\n  heroImg = React.createRef();\n  dialogRef = React.createRef();\n  hourRef = React.createRef();\n\n  WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n  WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n  MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n  MOL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];\n\n  STEPS = [\n    { title: 'Listen', body: 'Your history, your goals, and what a good week looks like for you. We ask what you have already tried and what you want to get back to.', leave: 'a shared goal, written down in your words.', img: 'images/consult-standing.jpg', alt: 'Dr. Ellison talks with a patient at the start of a session', pos: '50% 28%' },\n    { title: 'Measure', body: 'A movement screen, strength and range-of-motion testing, and specific tests for the area that hurts. We show you what we find as we find it.', leave: 'a clear explanation of what is driving your symptoms.', img: 'images/movement-assessment.jpg', alt: 'Dr. Ellison assesses the shoulder movement of a seated patient', pos: '38% 50%' },\n    { title: 'Treat', body: 'Hands-on care and targeted mobility work to settle symptoms and restore motion, matched to how you are moving that day.', leave: 'less guarding, more motion, and a plan for the next 48 hours.', img: 'images/manual-therapy-shoulder.jpg', alt: 'Hands-on treatment of a patient’s shoulder', pos: '55% 40%' },\n    { title: 'Build', body: 'Progressive strength work, coached rep by rep in the studio and continued at home, with loads we track from visit to visit.', leave: 'a short home program, updated at every visit.', img: 'images/strength-dumbbells.jpg', alt: 'A patient holds a pair of light dumbbells during a strength exercise', pos: '50% 62%' },\n    { title: 'Return', body: 'A staged plan back to running, lifting, climbing or gardening, with clear criteria for each step and a check-in after you finish.', leave: 'criteria for each step back, and someone to call if it flares.', img: 'images/guided-mobility.jpg', alt: 'Dr. Ellison guides a patient through an assisted leg raise', pos: '50% 40%' },\n  ];\n\n  SEGS = [\n    { short: '0–10', range: '0–10 min', title: 'Check in and re-test', body: 'We measure what changed since your last visit, so the hour is planned around how you are today.' },\n    { short: '10–30', range: '10–30 min', title: 'Hands-on treatment', body: 'Manual therapy and mobility work, chosen for how you are moving that day.' },\n    { short: '30–50', range: '30–50 min', title: 'Coached exercise', body: 'Strength and movement work with feedback on every set, progressed when you are ready.' },\n    { short: '50–60', range: '50–60 min', title: 'Plan for the week', body: 'Your home program, updated, and time to ask anything before you go.' },\n  ];\n\n  FAQS = [\n    { q: 'What happens at the first appointment?', a: 'We start with a conversation about your history and goals, then test how you move, your strength and your range of motion. You’ll get a clear explanation of what we found, your first treatment, and a written plan sent to you the same day. Plan on the full 60 minutes.' },\n    { q: 'Do I need a referral?', a: 'No. Colorado allows direct access to physical therapy, so you can book an evaluation without seeing a doctor first. If anything we find needs a physician’s input, we’ll tell you and help coordinate. If you have Medicare, please call before booking so we can talk through your options.' },\n    { q: 'Why don’t you take insurance?', a: 'Working outside insurance networks lets us set the length and content of each visit with you, keep one patient on the schedule at a time, and publish our prices. We’re glad to give you a superbill for any out-of-network benefits you have.' },\n    { q: 'Can I use my HSA or FSA?', a: 'Yes. Physical therapy is generally an eligible expense for health savings and flexible spending accounts, and we accept HSA and FSA cards. If you’re unsure about your account, check with your plan administrator.' },\n    { q: 'Do you provide superbills?', a: 'Yes, after every visit. A superbill is an itemized receipt with the codes your insurer needs. Reimbursement depends on your plan, so we suggest calling your insurer about out-of-network physical therapy benefits before you start.' },\n    { q: 'How long are appointments?', a: 'Every visit is 60 minutes, one-on-one with Dr. Ellison, including your first. Free phone consultations are 15 minutes.' },\n    { q: 'How many visits will I need?', a: 'It depends on what you’re dealing with and what you want to get back to. Many people come weekly at first, then less often as they take on more of the work at home. You’ll get an estimate at your evaluation, and we revisit it as you progress.' },\n    { q: 'What should I wear and bring?', a: 'Wear clothes you can move in, and bring shorts if your knee, hip or ankle is involved. Bring any imaging reports or surgical notes. Runners, bring the shoes you train in.' },\n    { q: 'Do you work with athletes?', a: 'Yes, from weekend runners to competitive climbers and cyclists. Sport-specific testing and return-to-sport planning are part of the plan when you need them. You don’t need to be an athlete to come in.' },\n    { q: 'What is your cancellation policy?', a: 'Reschedule or cancel up to 24 hours before your visit at no charge. Cancellations with less notice are charged half the visit fee.' },\n  ];\n\n  VISITS = [\n    { id: 'eval', title: 'Initial evaluation', meta: '60 min · in the studio', price: '$215' },\n    { id: 'follow', title: 'Follow-up visit', meta: '60 min · in the studio', price: '$185' },\n    { id: 'call', title: 'Free phone call', meta: '15 min · we call you', price: '$0' },\n  ];\n\n  days = this.makeDays();\n\n  makeDays() {\n    const out = []; const d = new Date(); d.setHours(0, 0, 0, 0);\n    while (out.length \u003c 6) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0) out.push(new Date(d)); }\n    return out;\n  }\n  slotsFor(i) {\n    const date = this.days[i]; const wd = date.getDay();\n    const base = wd === 6 ? ['8:00 am', '9:30 am', '11:00 am'] : wd === 5 ? ['7:00 am', '8:30 am', '10:00 am', '11:30 am', '1:30 pm'] : ['7:00 am', '8:30 am', '10:00 am', '11:30 am', '1:30 pm', '3:00 pm', '4:30 pm', '6:00 pm'];\n    return base.map((t, k) => ({ time: t, taken: (k > 0 || i > 0) && ((i * 5 + k * 3 + date.getDate()) % 3 === 0) }));\n  }\n  firstFree() { const s = this.slotsFor(0).find(x => !x.taken); return s ? s.time : null; }\n\n  componentDidMount() {\n    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    this.onResize = () => this.setState({ vw: window.innerWidth });\n    this.onScroll = () => {\n      const sc = window.scrollY > 8;\n      if (sc !== this.state.scrolled) this.setState({ scrolled: sc });\n      if (this.reduce || this.raf) return;\n      this.raf = requestAnimationFrame(() => {\n        this.raf = null;\n        const img = this.heroImg.current; if (!img || !img.parentElement) return;\n        const r = img.parentElement.getBoundingClientRect();\n        if (r.bottom \u003c 0 || r.top > window.innerHeight) return;\n        const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - window.innerHeight / 2) / window.innerHeight));\n        img.style.transform = 'translate3d(0,' + (p * 4).toFixed(2) + '%,0)';\n      });\n    };\n    this.onKey = (e) => {\n      if (e.key !== 'Escape') return;\n      if (this.state.booking) this.closeBooking(); else if (this.state.menuOpen) this.setState({ menuOpen: false });\n    };\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('keydown', this.onKey);\n    this.onScroll();\n    this.setupReveal();\n    this.autoTimer = setInterval(() => {\n      if (!this.props.methodAutoplay || this.userPicked || this.state.booking) return;\n      this.setState(s => ({ step: (s.step + 1) % this.STEPS.length }));\n    }, 6000);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('keydown', this.onKey);\n    if (this.io) this.io.disconnect();\n    if (this.hio) this.hio.disconnect();\n    clearInterval(this.autoTimer);\n  }\n  setupReveal() {\n    if (!('IntersectionObserver' in window)) { this.setState({ hourSeen: true }); return; }\n    this.hio = new IntersectionObserver((en) => { if (en.some(e => e.isIntersecting)) { this.setState({ hourSeen: true }); this.hio.disconnect(); } }, { threshold: 0.35 });\n    if (this.hourRef.current) this.hio.observe(this.hourRef.current);\n    if (this.reduce) return;\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach(en => { if (en.isIntersecting) { en.target.style.opacity = '1'; en.target.style.transform = 'none'; this.io.unobserve(en.target); } });\n    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });\n    document.querySelectorAll('[data-reveal]').forEach(el => {\n      const r = el.getBoundingClientRect();\n      if (r.top \u003c window.innerHeight * 0.9) return;\n      el.style.opacity = '0';\n      el.style.transform = el.getAttribute('data-reveal') === 'img' ? 'scale(0.985)' : 'translateY(20px)';\n      el.style.transition = 'opacity 900ms cubic-bezier(0.2,0,0,1), transform 1100ms cubic-bezier(0.2,0,0,1)';\n      this.io.observe(el);\n    });\n  }\n\n  openBooking(opts) {\n    this.lastFocus = document.activeElement;\n    document.body.style.overflow = 'hidden';\n    this.setState(Object.assign({ booking: true, bookIn: false, booked: false, menuOpen: false, triedEmail: false }, opts || {}));\n    requestAnimationFrame(() => requestAnimationFrame(() => {\n      this.setState({ bookIn: true });\n      if (this.dialogRef.current) this.dialogRef.current.focus();\n    }));\n  }\n  closeBooking() {\n    this.setState({ bookIn: false });\n    setTimeout(() => {\n      this.setState({ booking: false });\n      document.body.style.overflow = '';\n      if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus();\n    }, 230);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isWide = s.vw >= 1080;\n    const heroClose = this.props.heroImage === 'Close guidance';\n    const steps = this.STEPS.map((st, i) => {\n      const on = i === s.step;\n      return Object.assign({}, st, {\n        num: '0' + (i + 1), active: on, bid: 'step-b' + i, pid: 'step-p' + i,\n        select: () => { this.userPicked = true; this.setState({ step: i }); },\n        rows: on ? '1fr' : '0fr', vis: on ? 'visible' : 'hidden', rot: on ? '45deg' : '0deg',\n        titleColor: on ? 'var(--text-heading)' : 'var(--color-muted)',\n        numColor: on ? 'var(--text-heading)' : 'var(--color-muted)',\n      });\n    });\n    const stepImgs = this.STEPS.map((st, i) => ({ img: st.img, alt: st.alt, pos: st.pos, op: i === s.step ? 1 : 0, scale: i === s.step ? 1 : 1.04, hidden: i !== s.step }));\n    const segs = this.SEGS.map((g, i) => {\n      const on = i === s.seg;\n      return Object.assign({}, g, {\n        active: on, aria: g.range + ': ' + g.title,\n        select: () => { if (this.state.seg !== i) this.setState({ seg: i }); },\n        bg: on ? 'var(--color-on-dark)' : 'var(--color-surface-dark-elevated)',\n        fg: on ? 'var(--color-ink)' : 'var(--color-on-dark-soft)',\n        line: on ? 'var(--color-primary)' : 'rgba(250,249,245,0.14)',\n        titleColor: on ? 'var(--color-on-dark)' : 'var(--color-on-dark-soft)',\n      });\n    });\n    const faqs = this.FAQS.map((f, i) => {\n      const on = i === s.faq;\n      return Object.assign({}, f, {\n        open: on, bid: 'faq-b' + i, pid: 'faq-p' + i,\n        toggle: () => this.setState(st => ({ faq: st.faq === i ? -1 : i })),\n        rows: on ? '1fr' : '0fr', vis: on ? 'visible' : 'hidden', rot: on ? '45deg' : '0deg',\n      });\n    });\n\n    const dSel = this.days[s.day];\n    const visit = this.VISITS.find(v => v.id === s.visit) || this.VISITS[0];\n    const visits = this.VISITS.map(v => {\n      const on = v.id === s.visit;\n      return Object.assign({}, v, {\n        checked: on, select: () => this.setState({ visit: v.id }),\n        border: on ? 'var(--color-ink)' : 'var(--border-default)',\n        bg: on ? 'var(--color-surface-soft)' : 'var(--color-canvas)',\n      });\n    });\n    const days = this.days.map((d, i) => {\n      const on = i === s.day;\n      return {\n        wd: this.WD[d.getDay()], date: d.getDate(), mo: this.MO[d.getMonth()], pressed: on,\n        label: this.WDL[d.getDay()] + ', ' + this.MOL[d.getMonth()] + ' ' + d.getDate(),\n        select: () => this.setState({ day: i, slot: null }),\n        bg: on ? 'var(--color-surface-dark)' : 'var(--color-canvas)',\n        fg: on ? 'var(--color-on-dark)' : 'var(--text-heading)',\n        border: on ? 'var(--color-surface-dark)' : 'var(--border-default)',\n      };\n    });\n    const slots = this.slotsFor(s.day).map(t => {\n      const on = s.slot === t.time;\n      return {\n        t: t.time, disabled: t.taken, pressed: on,\n        aria: t.time + (t.taken ? ', unavailable' : ''),\n        select: () => this.setState({ slot: t.time }),\n        bg: on ? 'var(--color-surface-dark)' : t.taken ? 'var(--color-surface-soft)' : 'var(--color-canvas)',\n        fg: on ? 'var(--color-on-dark)' : t.taken ? 'var(--color-muted)' : 'var(--text-heading)',\n        border: on ? 'var(--color-surface-dark)' : t.taken ? 'transparent' : 'var(--border-default)',\n        deco: t.taken ? 'line-through' : 'none', cursor: t.taken ? 'not-allowed' : 'pointer',\n      };\n    });\n    const emailOk = /\\S+@\\S+\\.\\S+/.test(s.email);\n    const valid = !!(s.slot && s.name.trim() && emailOk);\n    const shortDate = this.WD[dSel.getDay()] + ', ' + this.MO[dSel.getMonth()] + ' ' + dSel.getDate();\n    const longDate = this.WDL[dSel.getDay()] + ', ' + this.MOL[dSel.getMonth()] + ' ' + dSel.getDate();\n    const ff = this.firstFree();\n    const d0 = this.days[0];\n    const first = (s.name.trim().split(' ')[0]) || '';\n\n    return {\n      isWide, isNarrow: !isWide, showMenu: !isWide && s.menuOpen,\n      menuOpen: s.menuOpen, menuIcon: s.menuOpen ? 'x' : 'menu', menuLabel: s.menuOpen ? 'Close menu' : 'Open menu',\n      toggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      headerBorder: s.scrolled ? 'var(--border-default)' : 'transparent',\n      heroWide: !heroClose, heroClose, heroImg: this.heroImg,\n      showAvailability: this.props.showAvailability !== false,\n      nextOpening: this.WDL[d0.getDay()] + ', ' + this.MO[d0.getMonth()] + ' ' + d0.getDate() + ' · ' + ff,\n      reserveNext: (e) => { if (e && e.preventDefault) e.preventDefault(); this.openBooking({ visit: 'eval', day: 0, slot: ff }); },\n      openEval: () => this.openBooking({ visit: 'eval' }),\n      openFollow: () => this.openBooking({ visit: 'follow' }),\n      openCall: () => this.openBooking({ visit: 'call' }),\n      openCallLink: (e) => { if (e && e.preventDefault) e.preventDefault(); this.openBooking({ visit: 'call' }); },\n      bookReason: (e) => { const r = e.currentTarget.getAttribute('data-reason') || ''; this.openBooking({ visit: 'eval', reason: r }); },\n      hourRef: this.hourRef, segs, hourProgress: s.hourSeen ? '100%' : '0%',\n      steps, stepImgs, activeStepLabel: '0' + (s.step + 1) + ' · ' + this.STEPS[s.step].title,\n      methodPos: isWide ? 'sticky' : 'static', methodAspect: isWide ? '4 / 5' : '4 / 3',\n      condPos: isWide ? 'sticky' : 'static',\n      faqs,\n      evalFeatures: ['History and goal-setting conversation', 'Movement, strength and range-of-motion testing', 'Your first treatment', 'A written plan of care, sent the same day'],\n      followFeatures: ['Reassessment at the start of every visit', 'Manual therapy and mobility work', 'Coached strength training', 'An updated home program'],\n      planFeatures: ['$90 less than six single visits', 'First pick of appointment times', 'Email and text support between visits', 'Shareable with someone in your household'],\n      booking: s.booking, booked: s.booked, notBooked: !s.booked,\n      bookOp: s.bookIn ? 1 : 0, bookTx: s.bookIn ? 'none' : 'translateX(28px)',\n      dialogRef: this.dialogRef, closeBooking: () => this.closeBooking(),\n      bookTitle: s.booked ? 'Confirmed' : 'Book a visit',\n      visits, days, slots,\n      name: s.name, email: s.email, phone: s.phone, reason: s.reason,\n      onName: (e) => this.setState({ name: e.target.value }),\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onPhone: (e) => this.setState({ phone: e.target.value }),\n      onReason: (e) => this.setState({ reason: e.target.value }),\n      emailError: s.triedEmail && !emailOk ? 'Enter an email address so we can confirm.' : undefined,\n      summary: s.slot ? visit.title + ' · ' + shortDate + ', ' + s.slot : 'Choose a day and time',\n      summaryNote: s.slot ? (visit.id === 'call' ? 'Free. We call the number you give us.' : visit.price + ', paid at the visit. HSA and FSA accepted.') : visit.title + ' · ' + visit.price,\n      cantConfirm: !valid,\n      confirmBooking: () => { if (!valid) { this.setState({ triedEmail: true }); return; } this.setState({ booked: true }); },\n      conf <script>
