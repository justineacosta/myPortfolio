(--motion-normal) var(--ease-enter),transform var(--motion-normal) var(--ease-enter); /* @kind other */\n--transition-drawer:transform var(--motion-slow) var(--ease-emphasis); /* @kind other */\n--transition-toast:opacity var(--motion-normal) var(--ease-enter),transform var(--motion-normal) var(--ease-enter); /* @kind other */\n}\n@media (prefers-reduced-motion:reduce){\n  :root{\n    --motion-fast:0ms; /* @kind other */\n    --motion-normal:0ms; /* @kind other */\n    --motion-slow:0ms; /* @kind other */\n    --motion-deliberate:0ms; /* @kind other */\n  }\n  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}\n}\n\u003c/style>\n\u003cstyle>/* App-surface tokens. The marketing site floors on --color-canvas; the application\n   floors one step darker (--color-surface-soft) so panels can sit *above* it in\n   canvas. Light theme lives here; dark overrides live in theme-dark.css. */\n:root{\n/* Surfaces */\n--app-canvas:#f5f0e8;          /* page floor */\n--app-surface:#faf9f5;         /* panels, cards, table body */\n--app-raised:#faf9f5;          /* popovers, dropdowns, modals (+ shadow) */\n--app-sunken:#efe9de;          /* table headers, inset wells, code */\n--app-hover:#efe9de;           /* row / item hover */\n--app-selected:#f3e4dd;        /* selected row, active nav item */\n--app-selected-strong:#ead5cb; /* multi-select, drag target */\n--app-scrim:rgba(20,20,19,0.35);\n\n/* Chrome */\n--app-topbar-bg:#faf9f5;\n--app-sidebar-bg:#f5f0e8;\n--app-code-bg:#181715;         /* code never inverts — always dark */\n\n/* Semantic aliases requested by the UI/UX master prompt */\n--background-default:var(--app-canvas);\n--background-subtle:var(--app-sunken);\n--background-elevated:var(--app-raised);\n--foreground-default:var(--color-ink);\n--foreground-muted:var(--color-body);\n--foreground-subtle:var(--color-muted);\n--foreground-disabled:var(--color-muted-soft);\n--border-strong:#d6cdc0;\n--action-destructive:var(--color-error);\n--action-destructive-fg:#ffffff;\n--status-info:var(--color-accent-teal);\n\n/* Status surfaces — 10% tints of each status colour on the light floor */\n--status-success-bg:#e6f2e6;\n--status-warning-bg:#f7efd9;\n--status-error-bg:#f7e4e4;\n--status-info-bg:#e2f1ee;\n--status-success-fg:#2f6b3c;\n--status-warning-fg:#7a5c08;\n--status-error-fg:#8f2f2f;\n--status-info-fg:#2f6b60;\n\n/* Focus */\n--focus-ring-color:var(--color-primary);\n--focus-ring:0 0 0 3px rgba(204,120,92,0.28);\n\n/* Density — medium. Marketing controls stay 40px; app controls are 32px. */\n--control-h-sm:28px;\n--control-h-md:32px;\n--control-h-lg:40px;\n--control-pad-sm:0 10px;\n--control-pad-md:0 12px;\n--control-pad-lg:0 16px;\n\n/* App chrome metrics */\n--topbar-h:56px;\n--sidebar-w:248px;\n--sidebar-w-collapsed:56px;\n--context-panel-w:320px;\n--row-h:44px;\n--row-h-compact:36px;\n--app-gutter:24px;\n--app-gutter-tight:16px;\n--modal-w-sm:420px;\n--modal-w-md:560px;\n--modal-w-lg:760px;\n--drawer-w:440px;\n\n/* Avatar sizes */\n--avatar-xs:20px;\n--avatar-sm:24px;\n--avatar-md:32px;\n--avatar-lg:40px;\n--avatar-xl:64px;\n\n/* Icon sizes */\n--icon-xs:14px;\n--icon-sm:16px;\n--icon-md:20px;\n--icon-lg:24px;\n--icon-stroke:1.75; /* @kind other */\n\n/* z-index */\n--z-sticky:20; /* @kind other */\n--z-dropdown:40; /* @kind other */\n--z-drawer:50; /* @kind other */\n--z-modal:60; /* @kind other */\n--z-toast:70; /* @kind other */\n--z-tooltip:80; /* @kind other */\n}\n\u003c/style>\n\u003cstyle>/* Data-visualisation palette. The brand forbids a fourth *surface* family; data\n   series are not surfaces, so the ramp extends the warm trio rather than\n   introducing blues. Ordered for maximum adjacent separation. */\n:root{\n--chart-1:#cc785c;  /* coral */\n--chart-2:#5db8a6;  /* teal */\n--chart-3:#e8a55a;  /* amber */\n--chart-4:#8e8b82;  /* warm grey */\n--chart-5:#a9583e;  /* coral deep */\n--chart-6:#3f8577;  /* teal deep */\n--chart-7:#c9a227; the reason existing components adapt automatically */\n--bg-page:var(--app-canvas);\n--bg-band-soft:var(--app-sunken);\n--surface-card:var(--app-sunken);\n--surface-card-strong:var(--app-raised);\n\n--text-heading:#faf9f5;\n--text-lead:#e4e0d8;\n--text-body:#cfcbc2;\n--text-secondary:#a09d96;\n--text-caption:#8e8b82;\n--text-link:#e09a80;\n\n--border-default:#2f2c28;\n--border-subtle:#262320;\n--border-strong:#454039;\n\n--action-secondary-bg:var(--app-raised);\n--action-secondary-fg:#faf9f5;\n--action-primary-bg-disabled:#332f2b;\n\n/* Coral lifts slightly on dark so it holds its chroma against #141312 */\n--action-primary-bg:#d4835f;\n--action-primary-bg-active:#b4653f;\n--focus-ring-color:#e09a80;\n--focus-ring:0 0 0 3px rgba(224,154,128,0.32);\n\n/* Status — desaturated fills that survive on a dark floor */\n--status-success:#6fc384;\n--status-warning:#dbb23f;\n--status-error:#d96565;\n--status-info:#6ec5b4;\n--status-success-bg:#1c2a1f;\n--status-warning-bg:#2c2517;\n--status-error-bg:#2e1c1c;\n--status-info-bg:#182a27;\n--status-success-fg:#97d6a6;\n--status-warning-fg:#e6c766;\n--status-error-fg:#ed9292;\n--status-info-fg:#8fd7c8;\n\n--shadow-soft:0 1px 3px rgba(0,0,0,0.5); /* @kind shadow */\n}\n\u003c/style>\n\u003cstyle>html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}\nbody{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);font-size:var(--type-body-md-size);font-weight:var(--type-body-md-weight);line-height:var(--type-body-md-line)}\nh1,h2,h3{font-family:var(--font-serif-display);font-weight:var(--weight-regular);color:var(--text-heading);margin:0}\nh1{font-size:var(--type-display-xl-size);line-height:var(--type-display-xl-line);letter-spacing:var(--type-display-xl-tracking)}\nh2{font-size:var(--type-display-lg-size);line-height:var(--type-display-lg-line);letter-spacing:var(--type-display-lg-tracking)}\nh3{font-size:var(--type-display-md-size);line-height:var(--type-display-md-line);letter-spa src=\"riverdale-and-brooks/bcfb050edf9f.webp\" alt=\"A small-town main street at dusk, brick storefronts and flags lining the sidewalk\" style=\"width:100%;height:clamp(380px,52vw,760px);object-fit:cover;object-position:42% 60%;filter:saturate(.86) sepia(.08) contrast(1.02)\">\n\u003c/div>\n\u003cfigcaption style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:14px;font-size:13px;color:#6c6a64\">\u003cspan>East Main Street, early evening\u003c/span>\u003cspan>Two blocks from the courthouse\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\u003c/div>\n\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,48px)\">\n\u003cdl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border-top:1px solid #e6dfd8\">\n\u003cdiv style=\"padding:28px 24px 0 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#6c6a64\">Established\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,2.4vw,30px);line-height:1.15;color:#141413\">1979, East Main Street\u003c/dd>\u003c/div>\n\u003cdiv style=\"padding:28px 24px 0 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#6c6a64\">Your attorney\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,2.4vw,30px);line-height:1.15;color:#141413\">Daniel A. Brooks\u003c/dd>\u003c/div>\n\u003cdiv style=\"padding:28px 24px 0 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#6c6a64\">Meetings\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,2.4vw,30px);line-height:1.15;color:#141413\">In the office or by video\u003c/dd>\u003c/div>\n\u003cdiv style=\"padding:28px 0 0 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#6c6a64\">Replies\u003c/dt>\u003cdd style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,2.4vw,30px);line-height:1.15;color:#141413\">Within one business day\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"about\" aria-labelledby=\"about-title\" style=\"background:#f5f0e8;margin-top:clamp(64px,8vw,120px);scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(40px,6vw,104px);align-items:start\">\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-strong,#6e5430)\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>The practice\u003c/div>\n\u003ch2 id=\"about-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(38px,4.4vw,64px);line-height:1.04;letter-spacing:-0.015em;color:#141413;text-wrap:balance;margin:0\">One attorney, one office, and a habit of returning calls the same day.\u003c/h2>\n\u003cp style=\"font-size:18px;line-height:1.65;max-width:34em;text-wrap:pretty\">Margaret Riverdale opened this office in 1979 on the idea that people in a small county deserve the same careful legal work as anyone in the city, without the distance. Daniel Brooks joined her in 2010 and has led the practice since her retirement in 2019.\u003c/p>\n\u003cp style=\"font-size:18px;line-height:1.65;max-width:34em;text-wrap:pretty\">We keep the practice small on purpose. It means fewer clients at a time, a lawyer who knows your file, and advice that accounts for the people and places involved.\u003c/p>\n\u003c/div>\n\u003cfigure data-reveal=\"1\" style=\"margin:0\">\n\u003cdiv style=\"overflow:hidden;border-radius:12px\">\u003cimg src=\"riverdale-and-brooks/62597f56d4b1.webp\" alt=\"Hands signing a document at a dark wooden desk in warm lamplight\" loading=\"lazy\" style=\"width:100%;height:clamp(320px,38vw,560px);object-fit:cover;object-position:50% 55%;filter:saturate(.86) sepia(.08) contrast(1.02)\">\u003c/div>\n\u003c/figure>\n\u003c/div>\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(72px,9vw,136px)\">\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(28px,4vw,56px)\">\n\u003cdiv data-reveal=\"1\" style=\"border-top:1px solid #d9cfbf;padding-top:28px;display:flex;flex-direction:column;gap:12px\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-style:italic;font-size:24px;color:var(--rb-accent,#8a6a3b)\">i.\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-0.01em;color:#141413;margin:0\">Direct access\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;color:#3d3d3a;text-wrap:pretty\">You will have Daniel’s direct line and email. Your questions are answered by the person handling your matter.\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"1\" style=\"border-top:1px solid #d9cfbf;padding-top:28px;display:flex;flex-direction:column;gap:12px\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-style:italic;font-size:24px;color:var(--rb-accent,#8a6a3b)\">ii.\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-0.01em;color:#141413;margin:0\">Plain answers\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;color:#3d3d3a;text-wrap:pretty\">Before any work begins, we explain your options, the likely costs and a realistic timeline, in writing.\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"1\" style=\"border-top:1px solid #d9cfbf;padding-top:28px;display:flex;flex-direction:column;gap:12px\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-style:italic;font-size:24px;color:var(--rb-accent,#8a6a3b)\">iii.\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-0.01em;color:#141413;margin:0\">Clear fees\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;color:#3d3d3a;text-wrap:pretty\">Flat fees for most estate and real estate work. Hourly matters are billed monthly, itemized to the tenth of an hour.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"practice\" aria-labelledby=\"practice-title\" style=\"scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px)\">\n\u003cdiv data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px 64px;align-items:end;margin-bottom:clamp(40px,5vw,64px)\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:24px\">\n\u003cdiv style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-strong,#6e5430)\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>Practice areas\u003c/div>\n\u003ch2 id=\"practice-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(38px,4.4vw,64px);line-height:1.04;letter-spacing:-0.015em;color:#141413;margin:0\">Where we can help\u003c/h2>\n\u003c/div>\n\u003cp style=\"font-size:17px;line-height:1.65;max-width:32em;text-wrap:pretty\">Six areas, practiced in depth. If your situation sits between them, or you aren’t sure it needs a lawyer at all, call and ask. That first answer is free.\u003c/p>\n\u003c/div>\n\n\u003cdiv data-reveal=\"1\" style=\"overflow:hidden;border-radius:12px;margin-bottom:24px\">\u003cimg src=\"riverdale-and-brooks/ce3a58fd9a70.webp\" alt=\"A row of old leather-bound legal volumes with worn gilt spines\" loading=\"lazy\" style=\"width:100%;height:clamp(150px,16vw,240px);object-fit:cover;object-position:50% 45%;filter:saturate(.86) sepia(.08) contrast(1.02)\">\u003c/div>\n\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:24px\">\n\u003carticle data-reveal=\"1\" style=\"background:#efe9de;border-radius:12px;padding:clamp(28px,2.6vw,40px);display:flex;flex-direction:column;gap:16px;transition:background-color .2s\" style-hover=\"background:#e8e0d2\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-size:20px;color:var(--rb-accent-strong,#6e5430)\">01\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.01em;color:#141413;margin:0\">Estate planning &amp; probate\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">Wills, trusts and the documents that let someone you trust act for you. Steady guidance for executors through probate in Ashby and neighboring counties.\u003c/p>\n\u003cul style=\"list-style:none;margin:auto 0 0;padding:16px 0 0;border-top:1px solid #d9cfbf;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#6c6a64\">\u003cli>— Wills and revocable trusts\u003c/li>\u003cli>— Powers of attorney and advance directives\u003c/li>\u003cli>— Estate administration\u003c/li>\u003c/ul>\n\u003c/article>\n\u003carticle data-reveal=\"1\" style=\"background:#efe9de;border-radius:12px;padding:clamp(28px,2.6vw,40px);display:flex;flex-direction:column;gap:16px;transition:background-color .2s\" style-hover=\"background:#e8e0d2\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-size:20px;color:var(--rb-accent-strong,#6e5430)\">02\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.01em;color:#141413;margin:0\">Real estate\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">Residential and farm closings handled in-house, with title questions resolved before closing day rather than at the table.\u003c/p>\n\u003cul style=\"list-style:none;margin:auto 0 0;padding:16px 0 0;border-top:1px solid #d9cfbf;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#6c6a64\">\u003cli>— Purchases, sales and refinances\u003c/li>\u003cli>— Deeds, easements and boundary issues\u003c/li>\u003cli>— Land division among heirs\u003c/li>\u003c/ul>\n\u003c/article>\n\u003carticle data-reveal=\"1\" style=\"background:#efe9de;border-radius:12px;padding:clamp(28px,2.6vw,40px);display:flex;flex-direction:column;gap:16px;transition:background-color .2s\" style-hover=\"background:#e8e0d2\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-size:20px;color:var(--rb-accent-strong,#6e5430)\">03\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.01em;color:#141413;margin:0\">Family law\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">Separation and divorce handled with discretion. We favor agreements where they protect you, and prepare fully for court where they don’t.\u003c/p>\n\u003cul style=\"list-style:none;margin:auto 0 0;padding:16px 0 0;border-top:1px solid #d9cfbf;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#6c6a64\">\u003cli>— Separation agreements\u003c/li>\u003cli>— Custody, visitation and support\u003c/li>\u003cli>— Uncontested and contested divorce\u003c/li>\u003c/ul>\n\u003c/article>\n\u003carticle data-reveal=\"1\" style=\"background:#efe9de;border-radius:12px;padding:clamp(28px,2.6vw,40px);display:flex;flex-direction:column;gap:16px;transition:background-color .2s\" style-hover=\"background:#e8e0d2\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-size:20px;color:var(--rb-accent-strong,#6e5430)\">04\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.01em;color:#141413;margin:0\">Business &amp; agriculture\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">Practical counsel for family businesses and working farms, from forming the company to planning who runs it next.\u003c/p>\n\u003cul style=\"list-style:none;margin:auto 0 0;padding:16px 0 0;border-top:1px solid #d9cfbf;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#6c6a64\">\u003cli>— LLC formation and operating agreements\u003c/li>\u003cli>— Contracts, leases and land use\u003c/li>\u003cli>— Succession planning\u003c/li>\u003c/ul>\n\u003c/article>\n\u003carticle data-reveal=\"1\" style=\"background:#efe9de;border-radius:12px;padding:clamp(28px,2.6vw,40px);display:flex;flex-direction:column;gap:16px;transition:background-color .2s\" style-hover=\"background:#e8e0d2\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-size:20px;color:var(--rb-accent-strong,#6e5430)\">05\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.01em;color:#141413;margin:0\">Civil disputes\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">Contract, property and neighbor disputes in General District and Circuit Court. An honest read on whether the case is worth pursuing comes first.\u003c/p>\n\u003cul style=\"list-style:none;margin:auto 0 0;padding:16px 0 0;border-top:1px solid #d9cfbf;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#6c6a64\">\u003cli>— Contract and debt disputes\u003c/li>\u003cli>— Property line and access claims\u003c/li>\u003cli>— Landlord and tenant matters\u003c/li>\u003c/ul>\n\u003c/article>\n\u003carticle data-reveal=\"1\" style=\"background:#efe9de;border-radius:12px;padding:clamp(28px,2.6vw,40px);display:flex;flex-direction:column;gap:16px;transition:background-color .2s\" style-hover=\"background:#e8e0d2\">\n\u003cspan style=\"font-family:var(--font-serif-display);font-size:20px;color:var(--rb-accent-strong,#6e5430)\">06\u003c/span>\n\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-0.01em;color:#141413;margin:0\">Mediation\u003c/h3>\n\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">A structured, private setting for families and neighbors who would rather settle a disagreement than litigate it.\u003c/p>\n\u003cul style=\"list-style:none;margin:auto 0 0;padding:16px 0 0;border-top:1px solid #d9cfbf;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#6c6a64\">\u003cli>— Family and inheritance disputes\u003c/li>\u003cli>— Business and partnership disagreements\u003c/li>\u003cli>— Half-day and full-day sessions\u003c/li>\u003c/ul>\n\u003c/article>\n\u003c/div>\n\u003cp data-reveal=\"1\" style=\"margin-top:32px;font-size:15px;color:#6c6a64;max-width:60em\">We don’t handle criminal defense or personal injury. If that’s what you need, call anyway and we will refer you to colleagues we trust.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"attorney\" aria-labelledby=\"attorney-title\" style=\"background:var(--rb-dark,#1d2420);color:#d7d9d3;scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(40px,6vw,104px);align-items:start\">\n\u003cfigure data-reveal=\"1\" style=\"margin:0\">\n\u003cdiv style=\"overflow:hidden;border-radius:12px;background:#252320\">\u003cimg src=\"riverdale-and-brooks/3fe1a8f5a6e3.webp\" alt=\"Portrait of Daniel A. Brooks seated at his desk in a dark suit\" loading=\"lazy\" style=\"width:100%;height:clamp(440px,52vw,760px);object-fit:cover;object-position:50% 30%;filter:saturate(.84) sepia(.1) contrast(1.02)\">\u003c/div>\n\u003cfigcaption style=\"margin-top:14px;font-size:13px;color:#a8aca5\">Daniel A. Brooks in the Main Street office\u003c/figcaption>\n\u003c/figure>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:28px\">\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:20px\">\n\u003cdiv style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-light,#c8a96e)\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent-light,#c8a96e)\">\u003c/span>Your attorney\u003c/div>\n\u003ch2 id=\"attorney-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5vw,76px);line-height:1;letter-spacing:-0.02em;color:#faf9f5;margin:0\">Daniel A. Brooks\u003c/h2>\n\u003cp style=\"font-size:14px;letter-spacing:0.06em;color:#a8aca5\">Principal attorney · Practicing in Ashby County since 2010\u003c/p>\n\u003c/div>\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:18px;max-width:36em\">\n\u003cp style=\"font-size:18px;line-height:1.7;text-wrap:pretty\">Daniel grew up twenty minutes from this office and came home after law school to work alongside Margaret Riverdale. When she retired, he kept her name on the door and her practice of answering the phone himself.\u003c/p>\n\u003cp style=\"font-size:18px;line-height:1.7;text-wrap:pretty\">Most of his work is quiet: a will reviewed at a kitchen table, a farm closing that happens on schedule, a separation settled without a courtroom. He serves on the board of the Ashby County Public Library and coaches youth soccer in the fall.\u003c/p>\n\u003c/div>\n\u003cblockquote data-reveal=\"1\" style=\"margin:8px 0;padding:4px 0 4px 28px;border-left:1px solid var(--rb-accent-light,#c8a96e);font-family:var(--font-serif-display);font-style:italic;font-size:clamp(24px,2.2vw,32px);line-height:1.3;color:#faf9f5;max-width:24em\">“People rarely call a lawyer on a good day. My job is to make the next few months easier than they expected.”\u003c/blockquote>\n\u003cdl data-reveal=\"1\" style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 40px\">\n\u003cdiv style=\"border-top:1px solid rgba(250,249,245,.12);padding:18px 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#a8aca5\">Education\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;line-height:1.55;color:#faf9f5\">J.D., Washington and Lee University School of Law, 2009\u003cbr>B.A., James Madison University\u003c/dd>\u003c/div>\n\u003cdiv style=\"border-top:1px solid rgba(250,249,245,.12);padding:18px 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#a8aca5\">Admitted\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;line-height:1.55;color:#faf9f5\">Virginia State Bar, 2009\u003cbr>U.S. District Court, W.D. Virginia\u003c/dd>\u003c/div>\n\u003cdiv style=\"border-top:1px solid rgba(250,249,245,.12);padding:18px 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#a8aca5\">Memberships\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;line-height:1.55;color:#faf9f5\">Ashby County Bar Association\u003cbr>Virginia Bar Association\u003c/dd>\u003c/div>\n\u003cdiv style=\"border-top:1px solid rgba(250,249,245,.12);padding:18px 0;display:flex;flex-direction:column;gap:6px\">\u003cdt style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#a8aca5\">Community\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;line-height:1.55;color:#faf9f5\">Board member, Ashby County Public Library\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"inverse\" sc-camel-on-click=\"{{ goContact }}\" dc-props=\"{{ btnLg }}\" hint-size=\"220px,52px\">Arrange a first meeting\u003c/x-import>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"process\" aria-labelledby=\"process-title\" style=\"scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,6vw,104px);align-items:start\">\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-strong,#6e5430)\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>How we work\u003c/div>\n\u003ch2 id=\"process-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(38px,4.4vw,64px);line-height:1.04;letter-spacing:-0.015em;color:#141413;margin:0\">What happens after you call\u003c/h2>\n\u003cp style=\"font-size:17px;line-height:1.65;max-width:30em;text-wrap:pretty\">Every matter follows the same six steps. You will always know which one you are in and what comes next.\u003c/p>\n\u003cdiv style=\"overflow:hidden;border-radius:12px;margin-top:12px\">\u003cimg src=\"riverdale-and-brooks/6f5f1a1cbbf7.webp\" alt=\"Daniel Brooks reviewing and annotating papers at his desk\" loading=\"lazy\" style=\"width:100%;height:clamp(300px,34vw,500px);object-fit:cover;object-position:60% 45%;filter:saturate(.84) sepia(.1) contrast(1.02)\">\u003c/div>\n\u003c/div>\n\u003col style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n\u003cli data-reveal=\"1\" style=\"display:grid;grid-template-columns:clamp(48px,9vw,72px) minmax(0,1fr);gap:8px clamp(12px,2.5vw,24px);padding:28px 0;border-top:1px solid #e6dfd8\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:40px;line-height:1;color:var(--rb-accent,#8a6a3b)\">01\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;color:#141413;margin:0\">Consultation\u003c/h3>\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">A thirty-minute conversation, in person or by video, about what happened and what you need.\u003c/p>\u003c/div>\u003c/li>\n\u003cli data-reveal=\"1\" style=\"display:grid;grid-template-columns:clamp(48px,9vw,72px) minmax(0,1fr);gap:8px clamp(12px,2.5vw,24px);padding:28px 0;border-top:1px solid #e6dfd8\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:40px;line-height:1;color:var(--rb-accent,#8a6a3b)\">02\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;color:#141413;margin:0\">Listen\u003c/h3>\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">We gather the documents and ask the questions that tend to change the answer.\u003c/p>\u003c/div>\u003c/li>\n\u003cli data-reveal=\"1\" style=\"display:grid;grid-template-columns:clamp(48px,9vw,72px) minmax(0,1fr);gap:8px clamp(12px,2.5vw,24px);padding:28px 0;border-top:1px solid #e6dfd8\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:40px;line-height:1;color:var(--rb-accent,#8a6a3b)\">03\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;color:#141413;margin:0\">Assess\u003c/h3>\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">You receive a short written summary of your options, the risks and the expected cost of each.\u003c/p>\u003c/div>\u003c/li>\n\u003cli data-reveal=\"1\" style=\"display:grid;grid-template-columns:clamp(48px,9vw,72px) minmax(0,1fr);gap:8px clamp(12px,2.5vw,24px);padding:28px 0;border-top:1px solid #e6dfd8\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:40px;line-height:1;color:var(--rb-accent,#8a6a3b)\">04\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;color:#141413;margin:0\">Strategy\u003c/h3>\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">We agree on a plan and a fee arrangement, and put both in an engagement letter you sign.\u003c/p>\u003c/div>\u003c/li>\n\u003cli data-reveal=\"1\" style=\"display:grid;grid-template-columns:clamp(48px,9vw,72px) minmax(0,1fr);gap:8px clamp(12px,2.5vw,24px);padding:28px 0;border-top:1px solid #e6dfd8\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:40px;line-height:1;color:var(--rb-accent,#8a6a3b)\">05\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;color:#141413;margin:0\">Representation\u003c/h3>\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">Drafting, negotiation or court appearances, with an update from Daniel at every milestone.\u003c/p>\u003c/div>\u003c/li>\n\u003cli data-reveal=\"1\" style=\"display:grid;grid-template-columns:clamp(48px,9vw,72px) minmax(0,1fr);gap:8px clamp(12px,2.5vw,24px);padding:28px 0;border-top:1px solid #e6dfd8;border-bottom:1px solid #e6dfd8\">\u003cspan style=\"font-family:var(--font-serif-display);font-size:40px;line-height:1;color:var(--rb-accent,#8a6a3b)\">06\u003c/span>\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003ch3 style=\"font-family:var(--font-serif-display);font-weight:400;font-size:30px;line-height:1.15;color:#141413;margin:0\">Resolution\u003c/h3>\u003cp style=\"font-size:16px;line-height:1.6;text-wrap:pretty\">We close the file properly: signed originals returned, deeds recorded, and a letter explaining what to keep and when to revisit it.\u003c/p>\u003c/div>\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"experience\" aria-labelledby=\"experience-title\" style=\"background:#efe9de;scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(48px,6vw,104px);align-items:center\">\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-strong,#6e5430)\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>Working together\u003c/div>\n\u003ch2 id=\"experience-title\" style=\"font-family:var(--font-serif-display);font-weight:400;font-size:clamp(38px,4.4vw,64px);line-height:1.04;letter-spacing:-0.015em;color:#141413;text-wrap:balance;margin:0\">A traditional practice with a modern back office\u003c/h2>\n\u003cp style=\"font-size:17px;line-height:1.65;max-width:32em;text-wrap:pretty\">Meet in person whenever you like. Everything in between, from signing paperwork to paying an invoice, can happen from home.\u003c/p>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px 32px;margin-top:8px\">\n\u003cdiv style=\"display:flex;gap:16px;align-items:flex-start\">\u003cspan style=\"flex:none;width:44px;height:44px;border-radius:9999px;border:1px solid #d9cfbf;display:flex;align-items:center;justify-content:center;color:#141413\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"lock\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/span>\u003cdiv>\u003ch3 style=\"font-family:var(--font-sans);font-weight:500;font-size:16px;color:#141413;margin:0 0 4px\">Secure client portal\u003c/h3>\u003cp style=\"font-size:14px;line-height:1.55;color:#6c6a64\">Your file, drafts and messages in one encrypted place.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;gap:16px;align-items:flex-start\">\u003cspan style=\"flex:none;width:44px;height:44px;border-radius:9999px;border:1px solid #d9cfbf;display:flex;align-items:center;justify-content:center;color:#141413\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"file-signature\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/span>\u003cdiv>\u003ch3 style=\"font-family:var(--font-sans);font-weight:500;font-size:16px;color:#141413;margin:0 0 4px\">Document sharing\u003c/h3>\u003cp style=\"font-size:14px;line-height:1.55;color:#6c6a64\">Upload records from your phone. Sign routine papers electronically.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;gap:16px;align-items:flex-start\">\u003cspan style=\"flex:none;width:44px;height:44px;border-radius:9999px;border:1px solid #d9cfbf;display:flex;align-items:center;justify-content:center;color:#141413\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"calendar\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/span>\u003cdiv>\u003ch3 style=\"font-family:var(--font-sans);font-weight:500;font-size:16px;color:#141413;margin:0 0 4px\">Easy scheduling\u003c/h3>\u003cp style=\"font-size:14px;line-height:1.55;color:#6c6a64\">Book office or video meetings, including early mornings.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv style=\"display:flex;gap:16px;align-items:flex-start\">\u003cspan style=\"flex:none;width:44px;height:44px;border-radius:9999px;border:1px solid #d9cfbf;display:flex;align-items:center;justify-content:center;color:#141413\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab le=\"height:3px;border-radius:2px;background:var(--rb-accent-light,#c8a96e)\">\u003c/span>\u003cspan style=\"font-size:11px;color:#faf9f5\">Review\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\u003cspan style=\"height:3px;border-radius:2px;background:rgba(250,249,245,.14)\">\u003c/span>\u003cspan style=\"font-size:11px;color:#a8aca5\">Signing\u003c/span>\u003c/div>\n\u003c/div>\n\u003cul style=\"list-style:none;margin:0;padding:0;font-size:13px\">\n\u003cli style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(250,249,245,.1)\">\u003cspan style=\"color:#faf9f5\">Draft will, revision 2\u003c/span>\u003cspan style=\"color:#a8aca5\">Oct 2\u003c/span>\u003c/li>\n\u003cli style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(250,249,245,.1)\">\u003cspan style=\"color:#faf9f5\">Revocable trust agreement\u003c/span>\u003cspan style=\"color:#a8aca5\">Oct 2\u003c/span>\u003c/li>\n\u003cli style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(250,249,245,.1);border-bottom:1px solid rgba(250,249,245,.1)\">\u003cspan style=\"color:#faf9f5\">Asset worksheet\u003c/span>\u003cspan style=\"color:#a8aca5\">Sep 28\u003c/span>\u003c/li>\n\u003c/ul>\n\u003cdiv style=\"background:rgba(250,249,245,.06);border-radius:8px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:13px\">\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"calendar\" size=\"{{ 16 }}\" hint-size=\"16px,16px\">\u003c/x-import>\u003cspan>\u003cspan style=\"color:#faf9f5\">Signing appointment\u003c/span> · Thu, Oct 15, 2:00 pm\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"testimonials\" aria-labelledby=\"testimonials-title\" style=\"scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px)\">\n\u003cdiv data-reveal=\"1\" style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-strong,#6e5430);margin-bottom:40px\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>\u003cspan id=\"testimonials-title\">In clients’ words\u003c/span>\u003c/div>\n\u003cfigure data-reveal=\"1\" style=\"margin:0 0 clamp(56px,7vw,96px);max-width:1080px\">\n\u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(32px,3.8vw,56px);line-height:1.14;letter-spacing:-0.015em;color:#141413;text-wrap:balance\">“He walked us through my mother’s estate in one afternoon at our kitchen table, then handled every piece of it. We never once had to wonder what was happening.”\u003c/blockquote>\n\u003cfigcaption style=\"margin-top:28px;display:flex;align-items:center;gap:14px;font-size:14px;color:#6c6a64\">\u003cspan style=\"width:24px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>Executor of a family estate, Haverly\u003c/figcaption>\n\u003c/figure>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(32px,5vw,72px)\">\n\u003cfigure data-reveal=\"1\" style=\"margin:0;border-top:1px solid #e6dfd8;padding-top:28px\">\n\u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,2vw,30px);line-height:1.3;color:#141413;text-wrap:pretty\">“Our farm sale turned up a boundary problem nobody had caught in forty years. Daniel sorted it out with the neighbors, and we still closed on the day we planned.”\u003c/blockquote>\n\u003cfigcaption style=\"margin-top:20px;font-size:14px;color:#6c6a64\">Landowner, Cedar Run\u003c/figcaption>\n\u003c/figure>\n\u003cfigure data-reveal=\"1\" style=\"margin:0;border-top:1px solid #e6dfd8;padding-top:28px\">\n\u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(24px,2vw,30px);line-height:1.3;color:#141413;text-wrap:pretty\">“I needed someone calm during a hard separation. I got honest advice about what was worth fighting over, and what wasn’t.”\u003c/blockquote>\n\u003cfigcaption style=\"margin-top:20px;font-size:14px;color:#6c6a64\">Family law client, Laurel Ford\u003c/figcaption>\n\u003c/figure>\n\u003c/div>\n\u003cp data-reveal=\"1\" style=\"margin-top:48px;font-size:13px;color:#8e8b82;max-width:60em\">Shared with permission; names withheld at clients’ request. Every matter is different, and past results do not guarantee a similar outcome.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"local\" aria-labelledby=\"local-title\" style=\"background:#f5f0e8;scroll-margin-top:84px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,9vw,136px) clamp(20px,4vw,48px) 0\">\n\u003cdiv data-reveal=\"1\" style=\"overflow:hidden;border-radius:16px\">\u003cimg src=\"riverdale-and-brooks/f5c7b864536d.webp\" alt=\"A valley town at golden hour beneath a forested ridge\" loading=\"lazy\" style=\"width:100%;height:clamp(280px,40vw,600px);object-fit:cover;object-position:50% 60%;filter:saturate(.86) sepia(.08) contrast(1.02)\">\u003c/div>\n\u003cp style=\"margin-top:14px;font-size:13px;color:#6c6a64\">The upper valley from the ridge road, late September\u003c/p>\n\u003c/div>\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,4vw,48px) clamp(72px,9vw,136px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,6vw,104px);align-items:start\">\n\u003cdiv data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:28px\">\n\u003cdiv style=\"display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--rb-accent-strong,#6e5430)\">\u003cspan style=\"width:32px;height:1px;background:var(--rb-accent,#8a6a3b)\">\u003c/span>Ashby County\u003c/div>\n\u003ch2 id height:1.65;text-wrap:pretty\">Estate planning consultations are free. For other matters, the first thirty minutes cost $150, credited toward your fee if you go on to hire us. We will tell you the cost before booking.\u003c/p>\u003c/sc-if>\n\u003c/div>\n\u003cdiv style=\"border-top:1px solid #e6dfd8\">\n\u003ch3 style=\"margin:0;font:inherit\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ toggleFaq1 }}\" aria-expanded=\"{{ faqExp1 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:var(--font-serif-display);font-size:clamp(22px,1.8vw,27px);line-height:1.25;color:#141413\" style-hover=\"color:#6e5430\">Do you offer flat fees?\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"{{ faqIcon1 }}\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/button>\u003c/h3>\n\u003csc-if value=\"{{ faq1 }}\" hint-placeholder-val=\"{{ false }}\">\u003cp style=\"padding:0 clamp(0px,4vw,48px) 28px 0;font-size:16px;line-height:1.65;text-wrap:pretty\">Yes, for wills, trusts, powers of attorney, most real estate closings and uncontested divorces. Litigation and contested matters are billed hourly, and we give you a written estimate up front.\u003c/p>\u003c/sc-if>\n\u003c/div>\n\u003cdiv style=\"border-top:1px solid #e6dfd8\">\n\u003ch3 style=\"margin:0;font:inherit\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ toggleFaq2 }}\" aria-expanded=\"{{ faqExp2 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:var(--font-serif-display);font-size:clamp(22px,1.8vw,27px);line-height:1.25;color:#141413\" style-hover=\"color:#6e5430\">Can we meet by video?\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"{{ faqIcon2 }}\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/button>\u003c/h3>\n\u003csc-if value=\"{{ faq2 }}\" hint-placeholder-val=\"{{ false }}\">\u003cp style=\"padding:0 clamp(0px,4vw,48px) 28px 0;font-size:16px;line-height:1.65;text-wrap:pretty\">Yes. Many clients meet by video for the first conversation and come in only for signings. Some documents, such as wills, still need to be signed in person with witnesses.\u003c/p>\u003c/sc-if>\n\u003c/div>\n\u003cdiv style=\"border-top:1px solid #e6dfd8\">\n\u003ch3 style=\"margin:0;font:inherit\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ toggleFaq3 }}\" aria-expanded=\"{{ faqExp3 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:var(--font-serif-display);font-size:clamp(22px,1.8vw,27px);line-height:1.25;color:#141413\" style-hover=\"color:#6e5430\">What should I bring?\u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"{{ faqIcon3 }}\" size=\"{{ 18 }}\" hint-size=\"18px,18px\">\u003c/x-import>\u003c/button>\u003c/h3>\n\u003csc-if value=\"{{ faq3 }}\" hint-placeholder-val=\"{{ false }}\">\u003cp style=\"padding:0 clamp(0px,4vw,48px) 28px 0;font-size:16px;line-height:1.65;text-wrap:pretty\">Any papers related to your question: existing wills, deeds, court notices, contracts or letters. If you aren’t sure, bring them anyway. The checklist above covers the common cases.\u003c/p>\u003c/sc-if>\n\u003c/div>\n\u003cdiv style=\"border-top:1px solid #e6dfd8;border-bottom:1px solid #e6dfd8\">\n\u003ch3 style=\"margin:0;font:inherit\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ toggleFaq4 }}\" aria-expanded=\"{{ faqExp4 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px 0;background:transparent;border:0;cursor:pointer;text-align:left;font-family:var(--font-serif-display);font-size:clamp(22px,1.8vw,27px);line-he size=\"160px,40px\">Send another\u003c/x-import>\n\u003c/div>\n\u003c/sc-if>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cfooter style=\"background:var(--rb-dark-deep,#151a17);color:#a8aca5;font-size:14px\">\n\u003cdiv style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,4vw,48px) 40px\">\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:40px 32px;padding-bottom:48px;border-bottom:1px solid rgba(250,249,245,.1)\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:18px;grid-column:span 1\">\n\u003cdiv style=\"display:flex;align-items:baseline;font-family:var(--font-serif-display);font-size:48px;line-height:1\">\u003cspan style=\"color:#faf9f5\">R\u003c/span>\u003cspan style=\"color:var(--rb-accent-light,#c8a96e);margin-left:-0.22em\">B\u003c/span>\u003c/div>\n\u003cdiv style=\"font-family:var(--font-serif-display);font-weight:500;font-size:17px;letter-spacing:0.16em;text-transform:uppercase;color:#faf9f5\">Riverdale &amp; Brooks\u003c/div>\n\u003cp style=\"font-size:12px;letter-spacing:0.2em;text-transform:uppercase\">Personal attention. Lasting solutions.\u003c/p>\n\u003c/div>\n\u003cnav aria-label=\"Footer\" style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#faf9f5;margin-bottom:6px\">The firm\u003c/p>\n\u003ca href=\"#practice\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Practice areas\u003c/a>\n\u003ca href=\"#about\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">About\u003c/a>\n\u003ca href=\"#attorney\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Attorney\u003c/a>\n\u003ca href=\"#resources\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Resources\u003c/a>\n\u003ca href=\"#experience\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Client portal\u003c/a>\n\u003c/nav>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#faf9f5;margin-bottom:6px\">Office\u003c/p>\n\u003cp style=\"line-height:1.6\">114 East Main Street\u003cbr>Laurel Ford, Virginia 22843\u003c/p>\n\u003ca href=\"tel:+15405550148\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">(540) 555-0148\u003c/a>\n\u003ca href=\"mailto:office@riverdalebrooks.law\" style=\"color:#a8aca5;text-decoration:none;overflow-wrap:anywhere\" style-hover=\"color:#faf9f5\">office@riverdalebrooks.law\u003c/a>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#faf9f5;margin-bottom:6px\">Hours\u003c/p>\n\u003cp style=\"line-height:1.6\">Mon–Thu 8:30 am – 5:30 pm\u003cbr>Fri 8:30 am – 3:00 pm\u003cbr>Evenings by appointment\u003c/p>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n\u003cp style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#faf9f5;margin-bottom:6px\">Service area\u003c/p>\n\u003cp style=\"line-height:1.6\">Ashby County, with clients in Greer and Rockdale counties and across the upper valley\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"padding-top:32px;display:flex;flex-direction:column;gap:24px\">\n\u003cp style=\"font-size:13px;line-height:1.65;max-width:72em;color:#8f948c\">Attorney advertising. The information on this website is general information, not legal advice. Viewing this site or contacting the firm does not create an attorney-client relationship; that relationship begins only with a signed engagement letter. Daniel A. Brooks is licensed to practice law in Virginia. Client comments reflect individual experiences and do not guarantee a similar result in any other matter.\u003c/p>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:13px\">\n\u003cspan>© 2026 Riverdale &amp; Brooks, PLLC\u003c/span>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:24px\">\n\u003ca href=\"#top\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Privacy\u003c/a>\n\u003ca href=\"#top\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Accessibility\u003c/a>\n\u003ca href=\"#top\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Legal disclaimer\u003c/a>\n\u003ca href=\"Image Credits.md\" style=\"color:#a8aca5;text-decoration:none\" style-hover=\"color:#faf9f5\">Photo credits\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/footer>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Brass&quot;,&quot;Antique gold&quot;,&quot;Bronze&quot;],&quot;default&quot;:&quot;Bronze&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;darkTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Evergreen&quot;,&quot;Charcoal&quot;,&quot;Ink navy&quot;],&quot;default&quot;:&quot;Charcoal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experience&quot;}}\">\nclass Component extends DCLogic {\n  state = { narrow: typeof window !== 'undefined' ? window.innerWidth \u003c 1100 : false, menuOpen: false, faq: 0, name: '', phone: '', email: '', matter: '', message: '', sent: false, error: '', now: Date.now() };\n  rootRef = React.createRef();\n\n  componentDidMount() {\n    this.onResize = () => { const n = window.innerWidth \u003c 1100; if (n !== this.state.narrow) this.setState({ narrow: n, menuOpen: false }); };\n    window.addEventListener('resize', this.onResize);\n    this.onKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };\n    window.addEventListener('keydown', this.onKey);\n    this.tick = setInterval(() => this.setState({ now: Date.now() }), 60000);\n    this.applyTheme();\n    this.setupMotion();\n  }\n  componentDidUpdate(pp) {\n    if (pp.accent !== this.props.accent || pp.darkTone !== this.props.darkTone) this.applyTheme();\n    if (pp.motion !== this.props.motion && this.props.motion === false) this.revealAll();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onKey);\n    clearInterval(this.tick);\n    if (this.io) this.io.disconnect();\n  }\n\n  applyTheme() {\n    const r = this.rootRef.current; if (!r) return;\n    const A = { 'Brass': ['#8a6a3b', '#6e5430', '#c8a96e'], 'Antique gold': ['#8b6c2e', '#6b5222', '#d2b273'], 'Bronze': ['#85583a', '#68432a', '#c99a74'] }[this.props.accent || 'Brass'] || ['#8a6a3b', '#6e5430', '#c8a96e'];\n    const D = { 'Evergreen': ['#1d2420', '#151a17'], 'Charcoal': ['#181715', '#100f0e'], 'Ink navy': ['#1a1f27', '#12161c'] }[this.props.darkTone || 'Evergreen'] || ['#1d2420', '#151a17'];\n    const set = (k, v) => r.style.setProperty(k, v);\n    set('--rb-accent', A[0]); set('--rb-accent-strong', A[1]); set('--rb-accent-light', A[2]);\n    set('--rb-dark', D[0]); set('--rb-dark-deep', D[1]);\n    set('--action-primary-bg', A[0]); set('--action-primary-bg-active', A[1]); set('--text-link', A[1]);\n    set('--border-focus', A[0]); set('--focus-ring-color', A[0]);\n  }\n\n  reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }\n\n  setupMotion() {\n    const root = this.rootRef.current; if (!root || this.props.motion === false || this.reduced()) return;\n    const hero = root.querySelector('[data-hero-img]');\n    if (hero) {\n      hero.style.transform = 'scale(1.06)';\n      hero.style.transition = 'transform 2400ms cubic-bezier(.2,0,0,1)';\n      requestAnimationFrame(() => requestAnimationFrame(() => { hero.style.transform = 'scale(1)'; }));\n    }\n    if (!('IntersectionObserver' in window)) return;\n    const vh = window.innerHeight;\n    const els = Array.from(root.querySelectorAll('[data-reveal]')).filter(el => el.getBoundingClientRect().top > vh * 0.9);\n    els.forEach(el => {\n      el.style.opacity = '0'; el.style.transform = 'translateY(18px)';\n      el.style.transition = 'opacity 900ms cubic-bezier(.2,0,0,1), transform 900ms cubic-bezier(.2,0,0,1)';\n    });\n    this.io = new IntersectionObserver(entries => entries.forEach(e => {\n      if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this.io.unobserve(e.target); }\n    }), { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });\n    els.forEach(el => this.io.observe(el));\n    this.revealTimer = setTimeout(() => {}, 0);\n  }\n  revealAll() {\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelectorAll('[data-reveal]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n  }\n\n  status() {\n    const ny = new Date(new Date(this.state.now).toLocaleString('en-US', { timeZone: 'America/New_York' }));\n    const day = ny.getDay(), m = ny.getHours() * 60 + ny.getMinutes();\n    const hrs = { 1: [510, 1050], 2: [510, 1050], 3: [510, 1050], 4: [510, 1050], 5: [510, 900] };\n    const fmt = (t) => { const h = Math.floor(t / 60), mm = t % 60; return `${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${h \u003c 12 ? 'am' : 'pm'}`; };\n    if (hrs[day] && m >= hrs[day][0] && m \u003c hrs[day][1]) return { open: true, text: `Office open now · until ${fmt(hrs[day][1])}` };\n    const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    for (let i = 0; i \u003c 8; i++) {\n      const d = (day + i) % 7;\n      if (hrs[d] && (i > 0 || m \u003c hrs[d][0])) return { open: false, text: `Office closed · opens ${i === 0 ? 'today' : i === 1 ? 'tomorrow' : names[d]} at ${fmt(hrs[d][0])}` };\n    }\n    return { open: false, text: 'Office closed' };\n  }\n\n  goContact = () => {\n    const el = document.getElementById('contact');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 84, behavior: this.reduced() ? 'auto' : 'smooth' });\n    this.setState({ menuOpen: false });\n  };\n\n  submit = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const { name, phone, email } = this.state;\n    if (!name.trim()) return this.setState({ error: 'Please add your name.' });\n    if (!phone.trim() && !email.trim()) return this.setState({ error: 'Add a phone number or email so we can reach you.' });\n    if (email.trim() && !/^\\S+@\\S+\\.\\S+$/.test(email.trim())) return this.setState({ error: 'That email address doesn’t look complete.' });\n    this.setState({ sent: true, error: '' });\n  };\n\n  renderVals() {\n    const s = this.state; const st = this.status();\n    const field = (k) => (e) => this.setState({ [k]: e.target.value, error: '' });\n    const v = {\n      rootRef: this.rootRef,\n      wide: !s.narrow, narrow: s.narrow,\n      showMobileMenu: s.narrow && s.menuOpen,\n      menuExpanded: s.menuOpen ? 'true' : 'false',\n      menuIcon: s.menuOpen ? 'x' : 'menu',\n      toggleMenu: () => this.setState(p => ({ menuOpen: !p.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      goContact: this.goContact,\n      statusText: st.text, statusDot: st.open ? '#5db872' : '#8e8b82',\n      btnNav: { style: { height: 44, padding: '0 20px' } },\n      btnLg: { style: { height: 52, padding: '0 28px', fontSize: 15 } },\n      btnBlock: { style: { height: 52, width: '100%', fontSize: 15 } },\n      name: s.name, phone: s.phone, email: s.email, matter: s.matter, message: s.message,\n      onName: field('name'), onPhone: field('phone'), onEmail: field('email'), onMatter: field('matter'), onMessage: field('message'),\n      matterOptions: ['Estate planning & probate', 'Real estate', 'Family law', 'Business & agriculture', 'Civil dispute', 'Mediation', 'Something else'],\n      submit: this.submit,\n      sent: s.sent, notSent: !s.sent, hasError: !!s.error, error: s.error,\n      firstName: (s.name.trim().split(/\\s+/)[0]) || 'for writing',\n      resetForm: () => this.setState({ sent: false, name: '', phone: '', email: '', matter: '', message: '' }),\n    };\n    for (let i = 0; i \u003c 5; i++) {\n      const open = s.faq === i;\n      v['faq' + i] = open; v['faqExp' + i] = open ? 'true' : 'false'; v['faqIcon' + i] = open ? 'minus' : 'plus';\n      v['toggleFaq' + i] = () => this.setState(p => ({ faq: p.faq === i ? -1 : i }));\n    }\n    return v;\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"</script>
