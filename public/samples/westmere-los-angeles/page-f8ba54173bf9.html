tion:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#B9B6AF;box-shadow:0 0 0 1px rgba(10,10,10,.9)}\n  .pin b{position:absolute;left:12px;top:-9px;white-space:nowrap;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B9B6AF;font-weight:400;text-shadow:0 1px 6px #0A0A0A}\n  .pin b s{display:block;text-decoration:none;color:#8F8C85;font-size:9px;letter-spacing:.1em;margin-top:2px}\n  .pin.on i{background:#9BA793;transform:scale(1.5)}\n  .pin.on b{color:#F5F3EE}\n  .pin i,.pin b{transition:all .45s cubic-bezier(.16,1,.3,1)}\n  .site i{left:-7px;top:-7px;width:14px;height:14px;background:#9BA793;box-shadow:0 0 0 1px #0A0A0A,0 0 0 7px rgba(155,167,147,.14)}\n  .site b{left:22px;top:-13px;color:#F5F3EE;font-size:12px;letter-spacing:.18em}\n  .ring{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border:1px solid rgba(155,167,147,.35);border-radius:50%;animation:pulse 4.5s ease-out infinite}\n  @keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.6);opacity:0}}\n  @media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.25}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"map\" role=\"application\" aria-label=\"Map of the residence and nearby destinations in Los Angeles\">\u003c/div>\n\u003cscript>\n(function(){\n  var SITE = [34.0928, -118.4003];\n  var PLACES = [\n    { id:'business', ll:[34.0583,-118.4162], label:'Century City',      meta:'Business district · 5 min' },\n    { id:'dining',   ll:[34.0900,-118.3855], label:'Sunset Strip',      meta:'Dining · 4 min' },\n    { id:'school',   ll:[34.0723,-118.4295], label:'Westside Academy',  meta:'International school · 8 min' },\n    { id:'hospital', ll:[34.0754,-118.3801], label:'Cedars-Sinai',      meta:'Medical · 9 min' },\n    { id:'shopping', ll:[34.0759,-118.3765], label:'Beverly Center',    meta:'Shopping · 12 min' },\n    { id:'airport',  ll:[33.9416,-118.4085], label:'LAX',               meta:'International airport · 18 min' }\n  ];\n  var map = L.map('map', { zoomControl:true, scrollWheelZoom:false, attributionControl:true });\n  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {\n    attribution: '© OpenStreetMap contributors', maxZoom: 19, detectRetina: true\n  }).addTo(map);\n  map.zoomControl.setPosition('bottomright');\n\n  var site = L.marker(SITE, { icon: L.divIcon({ className:'', iconSize:[1,1], html:\n    '\u003cdiv class=\"pin site\">\u003cdiv class=\"ring\">\u003c/div>\u003ci>\u003c/i>\u003cb>THE ORCHARD RESIDENCES\u003cs>Trousdale Estates\u003c/s>\u003c/b>\u003c/div>' }),\n    keyboard:true, title:'The Orchard Residences' }).addTo(map);\n\n  var pins = {};\n  PLACES.forEach(function(p){\n    var m = L.marker(p.ll, { icon: L.divIcon({ className:'', iconSize:[1,1], html:\n      '\u003cdiv class=\"pin\" data-id=\"'+p.id+'\">\u003ci>\u003c/i>\u003cb>'+p.label+'\u003cs>'+p.meta+'\u003c/s>\u003c/b>\u003c/div>' }),\n      keyboard:true, title:p.label + ' — ' + p.meta }).addTo(map);\n    pins[p.id] = m;\n    m.on('mouseover focus', function(){ set(p.id); });\n    m.on('mouseout blur', function(){ set(null); });\n  });\n\n  PLACES.forEach(function(p){\n    L.polyline([SITE, p.ll], { color:'#9BA793', weight:1, opacity:.22, dashArray:'1 5' }).addTo(map);\n  });\n\n  map.fitBounds(L.latLngBounds([SITE].concat(PLACES.map(function(p){ return p.ll; }))), {\n    paddingTopLeft:[70,50], paddingBottomRight:[70,60]\n  });\n  var base = { center: map.getCenter(), zoom: map.getZoom() };\n\n  function set(id){\n    Object.keys(pins).forEach(function(k){\n      var el = pins[k].getElement();\n      if(el && el.firstChild) el.firstChild.classList.toggle('on', k === id);\n    });\n  }\n  function focus(id){\n    var m = pins[id];\n    if(!m) return;\n    set(id);\n    map.flyToBounds(L.latLngBounds([SITE, m.getLatLng()]), { paddingTopLeft:[80,60], paddingBottomRight:[80,70], duration:1.1 });\n  }\n  addEventListener('message', function(e){\n    var d = e.data || {};\n    if(d.type === 'wm:focus') focus(d.id);\n    if(d.type === 'wm:reset'){ set(null); map.flyTo(base.center, base.zoom, { duration:.9 }); }\n  });\n})();\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"</script>
