portant}\n}\n\n/* App-surface tokens. The marketing site floors on --color-canvas; the application\n   floors one step darker (--color-surface-soft) so panels can sit *above* it in\n   canvas. Light theme lives here; dark overrides live in theme-dark.css. */\n:root{\n/* Surfaces */\n--app-canvas:#f5f0e8;          /* page floor */\n--app-surface:#faf9f5;         /* panels, cards, table body */\n--app-raised:#faf9f5;          /* popovers, dropdowns, modals (+ shadow) */\n--app-sunken:#efe9de;          /* table headers, inset wells, code */\n--app-hover:#efe9de;           /* row / item hover */\n--app-selected:#f3e4dd;        /* selected row, active nav item */\n--app-selected-strong:#ead5cb; /* multi-select, drag target */\n--app-scrim:rgba(20,20,19,0.35);\n\n/* Chrome */\n--app-topbar-bg:#faf9f5;\n--app-sidebar-bg:#f5f0e8;\n--app-code-bg:#181715;         /* code never inverts — always dark */\n\n/* Semantic aliases requested by the UI/UX master prompt */\n--background-default:var(--app-canvas);\n--background-subtle:var(--app-sunken);\n--background-elevated:var(--app-raised);\n--foreground-default:var(--color-ink);\n--foreground-muted:var(--color-body);\n--foreground-subtle:var(--color-muted);\n--foreground-disabled:var(--color-muted-soft);\n--border-strong:#d6cdc0;\n--action-destructive:var(--color-error);\n--action-destructive-fg:#ffffff;\n--status-info:var(--color-accent-teal);\n\n/* Status surfaces — 10% tints of each status colour on the light floor */\n--status-success-bg:#e6f2e6;\n--status-warning-bg:#f7efd9;\n--status-error-bg:#f7e4e4;\n--status-info-bg:#e2f1ee;\n--status-success-fg:#2f6b3c;\n--status-warning-fg:#7a5c08;\n--status-error-fg:#8f2f2f;\n--status-info-fg:#2f6b60;\n\n/* Focus */\n--focus-ring-color:var(--color-primary);\n--focus-ring:0 0 0 3px rgba(204,120,92,0.28);\n\n/* Density — medium. Marketing controls stay 40px; app controls are 32px. */\n--control-h-sm:28px;\n--control-h-md:32px;\n--control-h-lg:40px;\n--control-pad-sm:0 10px;\n--control-pad-md:0 12px;\n--control-pad-lg:0 16px;\n\n/* App chrome metrics */\n--topbar-h:56px;\n--sidebar-w:248px;\n--sidebar-w-collapsed:56px;\n--context-panel-w:320px;\n--row-h:44px;\n--row-h-compact:36px;\n--app-gutter:24px;\n--app-gutter-tight:16px;\n--modal-w-sm:420px;\n--modal-w-md:560px;\n--modal-w-lg:760px;\n--drawer-w:440px;\n\n/* Avatar sizes */\n--avatar-xs:20px;\n--avatar-sm:24px;\n--avatar-md:32px;\n--avatar-lg:40px;\n--avatar-xl:64px;\n\n/* Icon sizes */\n--icon-xs:14px;\n--icon-sm:16px;\n--icon-md:20px;\n--icon-lg:24px;\n--icon-stroke:1.75; /* @kind other */\n\n/* z-index */\n--z-sticky:20; /* @kind other */\n--z-dropdown:40; /* @kind other */\n--z-drawer:50; /* @kind other */\n--z-modal:60; /* @kind other */\n--z-toast:70; /* @kind other */\n--z-tooltip:80; /* @kind other */\n}\n\n/* Data-visualisation palette. The brand forbids a fourth *surface* family; data\n   series are not surfaces, so the ramp extends the warm trio rather than\n   introducing blues. Ordered for maximum adjacent separation. */\n:root{\n--chart-1:#cc785c;  /* coral */\n--chart-2:#5db8a6;  /* teal */\n--chart-3:#e8a55a;  /* amber */\n--chart-4:#8e8b82;  /* warm grey */\n--chart-5:#a9583e;  /* coral deep */\n--chart-6:#3f8577;  /* teal deep */\n--chart-7:#c9a227;  /* amber deep */\n--chart-8:#57544e;  /* grey deep */\n\n/* Sequential ramp (single-measure heatmaps, intensity) — coral tints */\n--chart-seq-1:#f6e7e0;\n--chart-seq-2:#ecccbe;\n--chart-seq-3:#e0ad98;\n--chart-seq-4:#d48f72;\n--chart-seq-5:#cc785c;\n--chart-seq-6:#a9583e;\n\n/* Diverging ramp (variance vs target) — teal to coral through cream */\n--chart-div-neg-2:#3f8577;\n--chart-div-neg-1:#9ad0c4;\n--chart-div-mid:#efe9de;\n--chart-div-pos-1:#e0ad98;\n--chart-div-pos-2:#a9583e;\n\n/* Chart chrome */\n--chart-grid:var(--border-subtle);\n--chart-axis:var(--border-default);\n--chart-label:var(--text-caption);\n--chart-tooltip-bg:var(--app-raised);\n--chart-track:var(--app-sunken);\n}\n[data-theme=\"dark\"]{\n--chart-1:#e08a68;\n--chart-2:#6ec5b4;\n--chart-3:#eeb46f;\n--chart-4:#8e8b82;\n--chart-5:#c06b48;\n--chart-6:#4d9a8a;\n--chart-7:#d4ae35;\n--chart-8:#6c6a64;\n--chart-seq-1:#2a211c;\n--chart-seq-2:#402e25;\n--chart-seq-3:#5c412f;\n--chart-seq-4:#8a583f;\n--chart-seq-5:#c06b48;\n--chart-seq-6:#e08a68;\n--chart-div-neg-2:#4d9a8a;\n--chart-div-neg-1:#2f5b53;\n--chart-div-mid:#2b2926;\n--chart-div-pos-1:#7a4634;\n--chart-div-pos-2:#e08a68;\n}\n\n/* Dark theme. Set data-theme=\"dark\" on \u003chtml> or any subtree.\n   Overriding the brand's semantic aliases here means every component written\n   against them flips for free — no per-component dark branch. */\n[data-theme=\"dark\"]{\n/* App surfaces */\n--app-canvas:#141312;\n--app-surface:#1f1e1b;\n--app-raised:#252320;\n--app-sunken:#181715;\n--app-hover:#252320;\n--app-selected:#2e2621;\n--app-selected-strong:#3b2e26;\n--app-scrim:rgba(0,0,0,0.6);\n--app-topbar-bg:#1f1e1b;\n--app-sidebar-bg:#181715;\n\n/* Semantic aliases */\n--background-default:var(--app-canvas);\n--background-subtle:var(--app-sunken);\n--background-elevated:var(--app-raised);\n--foreground-default:#faf9f5;\n--foreground-muted:#cfcbc2;\n--foreground-subtle:#a09d96;\n--foreground-disabled:#6c6a64;\n\n/* Brand aliases — the reason existing components adapt automatically */\n--bg-page:var(--app-canvas);\n--bg-band-soft:var(--app-sunken);\n--surface-card:var(--app-sunken);\n--surface-card-strong:var(--app-raised);\n\n--text-heading:#faf9f5;\n--text-lead:#e4e0d8;\n--text-body:#cfcbc2;\n--text-secondary:#a09d96;\n--text-caption:#8e8b82;\n--text-link:#e09a80;\n\n--border-default:#2f2c28;\n--border-subtle:#262320;\n--border-strong:#454039;\n\n--action-secondary-bg:var(--app-raised);\n--action-secondary-fg:#faf9f5;\n--action-primary-bg-disabled:#332f2b;\n\n/* Coral lifts slightly on dark so it holds its chroma against #141312 */\n--action-primary-bg:#d4835f;\n--action-primary-bg-active:#b4653f;\n--focus-ring-color:#e09a80;\n--focus-ring:0 0 0 3px rgba(224,154,128,0.32);\n\n/* Status — desaturated fills that survive on a dark floor */\n--status-success:#6fc384;\n--status-warning:#dbb23f;\n--status-error:#d96565;\n--status-info:#6ec5b4;\n--status-success-bg:#1c2a1f;\n--status-warning-bg:#2c2517;\n--status-error-bg:#2e1c1c;\n--status-info-bg:#182a27;\n--status-success-fg:#97d6a6;\n--status-warning-fg:#e6c766;\n--status-error-fg:#ed9292;\n--status-info-fg:#8fd7c8;\n\n--shadow-soft:0 1px 3px rgba(0,0,0,0.5); /* @kind shadow */\n}\n\nhtml{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}\nbody{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);font-size:var(--type-body-md-size);font-weight:var(--type-body-md-weight);line-height:var(--type-body-md-line)}\nh1,h2,h3{font-family:var(--font-serif-display);font-weight:var(--weight-regular);color:var(--text-heading);margin:0}\nh1{font-size:var(--type-display-xl-size);line-height:var(--type-display-xl-line);letter-spacing:var(--type-display-xl-tracking)}\nh2{font-size:var(--type-display-lg-size);line-height:var(--type-display-lg-line);letter-spacing:var(--type-display-lg-tracking)}\nh3{font-size:var(--type-display-md-size);line-height:var(--type-display-md-line);letter-spacing:var(--type-display-md-tracking)}\nh4,h5,h6{font-family:var(--font-sans);font-weight:var(--weight-medium);color:var(--text-heading);margin:0}\np{margin:0}\ncode,pre{font-family:var(--font-mono);font-size:var(--type-code-size);line-height:var(--type-code-line)}\na{color:var(--text-link);text-decoration:none}\na:hover{color:var(--color-primary-active);text-decoration:underline}\na:active{color:var(--color-primary-active)}\n:focus-visible{outline:2px solid var(--focus-ring-color);outline-offset:2px}\n::selection{background:rgba(204,120,92,0.22)}\n/* Application shell opt-in: floors the page on --app-canvas and switches all\n   headings to Inter. The serif display face stays on marketing and in print. */\n.cream-app{background:var(--app-canvas);color:var(--foreground-muted);min-height:100%}\n.cream-app h1,.cream-app h2,.cream-app h3{font-family:var(--font-sans);font-weight:var(--weight-medium);letter-spacing:0;color:var(--foreground-default)}\n.cream-app h1{font-size:24px;line-height:1.3}\n.cream-app h2{font-size:18px;line-height:1.4}\n.cream-app h3{font-size:16px;line-height:1.4}\n@keyframes cream-spin{to{transform:rotate(360deg)}}\n\n\u003c/style>\n  \u003cscript src=\"ostler-barbers/6deeaea2255a.js\">\u003c/script>\n  \u003cscript src=\"ostler-barbers/f6401a1b34db.js\">\u003c/script>\n  \u003cstyle>\n    html{scroll-behavior:smooth;scroll-padding-top:88px}\n    body{margin:0;background:#faf9f5;overflow-x:hidden}\n    img{display:block}\n    a{color:inherit;text-decoration:none}\n    a:hover{color:inherit;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}\n    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n  \u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"background: var(--color-canvas); color: var(--color-body); font-family: var(--font-sans); overflow-x: clip\">\n\n  \u003ca href=\"#main\" style=\"position: fixed; left: 16px; top: 16px; z-index: 100; padding: 12px 16px; background: var(--color-ink); color: var(--color-canvas); border-radius: 8px; font-size: 14px; font-weight: 500; transform: translateY(-200%)\" style-focus=\"transform: translateY(0)\">Skip to content\u003c/a>\n\n  \u003cheader style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 40; background-color: {{ navBg }}; border-bottom: 1px solid {{ navLine }}; transform: {{ navShift }}; transition: transform 420ms cubic-bezier(.2,0,0,1), background-color 280ms cubic-bezier(.2,0,0,1), border-color 280ms cubic-bezier(.2,0,0,1)\">\n    \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); height: clamp(64px, 5vw, 84px); display: flex; align-items: center; justify-content: space-between; gap: 24px; box-sizing: border-box\">\n      \u003ca href=\"#top\" aria-label=\"Ostler, back to top\" style=\"display: flex; align-items: baseline; gap: 14px; color: var(--color-ink)\">\n        \u003cspan style=\"font-family: var(--font-serif-display); font-size: clamp(28px, 2vw, 36px); letter-spacing: -0.02em; line-height: 1\">Ostler\u003c/span>\n        \u003csc-if value=\"{{ showTagline }}\" hint-placeholder-val=\"{{ true }}\">\n          \u003cspan style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">Barbers · W1\u003c/span>\n        \u003c/sc-if>\n      \u003c/a>\n      \u003csc-if value=\"{{ isDesk }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cnav aria-label=\"Primary\" style=\"display: flex; gap: clamp(20px, 2.4vw, 44px)\">\n          \u003ca href=\"#services\" style=\"font-size: 14px; font-weight: 500; color: var(--color-ink); padding: 12px 0\">Services\u003c/a>\n          \u003ca href=\"#house\" style=\"font-size: 14px; font-weight: 500; color: var(--color-ink); padding: 12px 0\">The house\u003c/a>\n          \u003ca href=\"#shop\" style=\"font-size: 14px; font-weight: 500; color: var(--color-ink); padding: 12px 0\">Shop\u003c/a>\n          \u003ca href=\"#barbers\" style=\"font-size: 14px; font-weight: 500; color: var(--color-ink); padding: 12px 0\">Barbers\u003c/a>\n          \u003ca href=\"#membership\" style=\"font-size: 14px; font-weight: 500; color: var(--color-ink); padding: 12px 0\">Membership\u003c/a>\n        \u003c/nav>\n      \u003c/sc-if>\n      \u003cdiv style=\"display: flex; align-items: center; gap: 6px\">\n        \u003cbutton type=\"button\" sc-camel-on-click=\"{{ bagClick }}\" aria-label=\"{{ bagAria }}\" style=\"height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: transparent; border: 0; cursor: pointer; font-family: var(--font-sans); font-size: 14px; font-weight: 500; color: var(--color-ink)\">\n          \u003csc-if value=\"{{ isDesk }}\" hint-placeholder-val=\"{{ true }}\">\u003cspan>Bag\u003c/span>\u003c/sc-if>\n          \u003csc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"shopping-bag\" size=\"{{ icon20 }}\" hint-size=\"20px,20px\">\u003c/x-import>\n          \u003c/sc-if>\n          \u003cspan style=\"min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--color-ink); color: var(--color-canvas); font-size: 12px; display: grid; place-items: center\">{{ bagCount }}\u003c/span>\n        \u003c/button>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"{{ navCtaVariant }}\" sc-camel-on-click=\"{{ openBookingDefault }}\" hint-size=\"120px,40px\">{{ navCtaLabel }}\u003c/x-import>\n        \u003csc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n          \u003cbutton type=\"button\" aria-label=\"Open menu\" aria-expanded=\"{{ menuOpenStr }}\" sc-camel-on-click=\"{{ openMenu }}\" style=\"width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; color: var(--color-ink); margin-right: -10px\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"menu\" size=\"{{ icon22 }}\" hint-size=\"22px,22px\">\u003c/x-import>\n          \u003c/button>\n        \u003c/sc-if>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv role=\"dialog\" aria-modal=\"true\" aria-label=\"Menu\" style=\"position: fixed; inset: 0; z-index: 45; background: var(--color-surface-dark); color: var(--color-on-dark); display: flex; flex-direction: column; padding: 0 clamp(20px, 4vw, 80px) 32px; overflow-y: auto; box-sizing: border-box\">\n      \u003cdiv style=\"height: 64px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto\">\n        \u003cspan style=\"font-family: var(--font-serif-display); font-size: 28px; letter-spacing: -0.02em; color: var(--color-on-dark)\">Ostler\u003c/span>\n        \u003cbutton type=\"button\" aria-label=\"Close menu\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; color: var(--color-on-dark); margin-right: -10px\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"x\" size=\"{{ icon22 }}\" hint-size=\"22px,22px\">\u003c/x-import>\n        \u003c/button>\n      \u003c/div>\n      \u003cnav aria-label=\"Mobile\" style=\"display: flex; flex-direction: column; margin-top: 24px\">\n        \u003ca href=\"#services\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(250,249,245,0.1); font-family: var(--font-serif-display); font-size: clamp(40px, 11vw, 64px); line-height: 1.05; letter-spacing: -0.02em; color: var(--color-on-dark)\">\u003cspan style=\"font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--color-on-dark-soft); width: 28px\">03\u003c/span>Services\u003c/a>\n        \u003ca href=\"#house\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(250,249,245,0.1); font-family: var(--font-serif-display); font-size: clamp(40px, 11vw, 64px); line-height: 1.05; letter-spacing: -0.02em; color: var(--color-on-dark)\">\u003cspan style=\"font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--color-on-dark-soft); width: 28px\">04\u003c/span>The house\u003c/a>\n        \u003ca href=\"#shop\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(250,249,245,0.1); font-family: var(--font-serif-display); font-size: clamp(40px, 11vw, 64px); line-height: 1.05; letter-spacing: -0.02em; color: var(--color-on-dark)\">\u003cspan style=\"font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--color-on-dark-soft); width: 28px\">05\u003c/span>Shop\u003c/a>\n        \u003ca href=\"#barbers\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(250,249,245,0.1); font-family: var(--font-serif-display); font-size: clamp(40px, 11vw, 64px); line-height: 1.05; letter-spacing: -0.02em; color: var(--color-on-dark)\">\u003cspan style=\"font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--color-on-dark-soft); width: 28px\">06\u003c/span>Barbers\u003c/a>\n        \u003ca href=\"#membership\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(250,249,245,0.1); font-family: var(--font-serif-display); font-size: clamp(40px, 11vw, 64px); line-height: 1.05; letter-spacing: -0.02em; color: var(--color-on-dark)\">\u003cspan style=\"font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--color-on-dark-soft); width: 28px\">07\u003c/span>Membership\u003c/a>\n      \u003c/nav>\n      \u003cdiv style=\"margin-top: auto; padding-top: 40px; display: flex; flex-direction: column; gap: 20px\">\n        \u003cp style=\"margin: 0; font-size: 15px; line-height: 1.6; color: var(--color-on-dark-soft)\">6 Carrow Mews, London W1T 4QS\u003cbr>{{ openTitle }} · {{ openLabel }}\u003c/p>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openBookingDefault }}\" dc-props=\"{{ fullBtn }}\" hint-size=\"100%,52px\">Book a chair\u003c/x-import>\n      \u003c/div>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003cmain id=\"main\">\n\n    \u003csection id=\"top\" data-screen-label=\"01 Hero\" style=\"background: var(--color-canvas); padding-top: clamp(64px, 5vw, 84px)\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: clamp(24px, 3vw, 48px) clamp(20px, 4vw, 80px) clamp(24px, 3vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: clamp(40px, 4vw, 88px); min-height: calc(100svh - clamp(64px, 5vw, 84px))\">\n        \u003cdiv style=\"flex: 7 1 520px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: clamp(40px, 5vw, 72px)\">\n          \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">\n            \u003cspan>Barbers &amp; grooming\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>Fitzrovia, London W1\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: clamp(28px, 2.6vw, 52px)\">\n            \u003ch1 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(96px, 13vw, 300px); line-height: 0.86; letter-spacing: -0.04em; color: var(--color-ink)\">Well\u003cspan style=\"display: block; padding-left: 0.62em\">kept.\u003c/span>\u003c/h1>\n            \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 28px clamp(32px, 4vw, 72px); align-items: flex-end\">\n              \u003cp style=\"flex: 1 1 340px; max-width: 46ch; margin: 0; font-size: clamp(17px, 1.1vw, 20px); line-height: 1.6; color: var(--color-body); text-wrap: pretty\">Ostler is a four-chair barbershop on Carrow Mews, in what was a cabinetmaker’s workshop until 1971. We cut by appointment, shave with a straight razor, and make a short shelf of things to use at home.\u003c/p>\n              \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n                \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openBookingDefault }}\" dc-props=\"{{ bigBtn }}\" hint-size=\"150px,52px\">Book a chair\u003c/x-import>\n                \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ shopScroll }}\" dc-props=\"{{ bigBtn }}\" hint-size=\"150px,52px\">Shop the shelf\u003c/x-import>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 20px 32px; border-top: 1px solid var(--color-ink); padding-top: 20px\">\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n              \u003cdt style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">Cuts\u003c/dt>\n              \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(22px, 1.6vw, 30px); line-height: 1.1; color: var(--color-ink)\">From £58\u003c/dd>\n            \u003c/div>\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n              \u003cdt style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">Shaves &amp; beards\u003c/dt>\n              \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(22px, 1.6vw, 30px); line-height: 1.1; color: var(--color-ink)\">From £38\u003c/dd>\n            \u003c/div>\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n              \u003cdt style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">Membership\u003c/dt>\n              \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(22px, 1.6vw, 30px); line-height: 1.1; color: var(--color-ink)\">£95 a month\u003c/dd>\n            \u003c/div>\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n              \u003cdt style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">{{ openTitle }}\u003c/dt>\n              \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(22px, 1.6vw, 30px); line-height: 1.1; color: var(--color-ink)\">{{ openLabel }}\u003c/dd>\n            \u003c/div>\n          \u003c/dl>\n        \u003c/div>\n        \u003cfigure style=\"flex: 5 1 380px; position: relative; margin: 0; min-height: clamp(440px, 120vw, 680px); overflow: hidden; background: var(--color-surface-card)\">\n          \u003cimg src=\"ostler-barbers/1c49b9b5c99d.webp\" alt=\"The front room at Ostler: tall backlit mirrors above black quilted barber chairs, with daylight from the street.\" data-parallax=\"0.06\" style=\"position: absolute; left: 0; top: -8%; width: 100%; height: 116%; object-fit: cover; object-position: 50% 35%; filter: grayscale(1) sepia(0.12) contrast(1.05); will-change: transform\">\n          \u003cfigcaption style=\"position: absolute; left: 0; bottom: 0; background: var(--color-canvas); padding: 14px 20px 0 0; font-size: 13px; color: var(--color-muted); display: flex; gap: 10px\">\u003cspan style=\"color: var(--color-ink); font-weight: 500\">Pl. 01\u003c/span>\u003cspan>The front room, Carrow Mews\u003c/span>\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"name\" data-screen-label=\"02 The name\" style=\"background: var(--color-surface-dark); color: var(--color-on-dark); padding: clamp(96px, 10vw, 200px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box\">\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6vw, 120px)\">\n          \u003cdiv style=\"flex: 1 1 200px; max-width: 320px; padding-top: 0.6em; display: flex; align-items: center; gap: 14px; align-self: flex-start; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft)\">\n            \u003cspan>02\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>The name\u003c/span>\n          \u003c/div>\n          \u003cp style=\"flex: 999 1 560px; max-width: 24ch; margin: 0; font-family: var(--font-serif-display); font-size: clamp(34px, 4.3vw, 92px); line-height: 1.06; letter-spacing: -0.02em; color: var(--color-on-dark); text-wrap: balance\">In the coaching inns of old London, the ostler looked after you before the next stage of the road. \u003cspan style=\"color: var(--color-on-dark-soft)\">We kept the name, and the job.\u003c/span>\u003c/p>\n        \u003c/div>\n        \u003col style=\"list-style: none; padding: 0; margin: clamp(80px, 9vw, 176px) 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 56px clamp(32px, 4vw, 80px)\">\n          \u003cli style=\"border-top: 1px solid rgba(250,249,245,0.14); padding-top: 28px; display: flex; flex-direction: column; gap: 18px\">\n            \u003cspan aria-hidden=\"true\" style=\"font-family: var(--font-serif-display); font-size: clamp(64px, 6vw, 120px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-on-dark-soft)\">01\u003c/span>\n            \u003ch3 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(28px, 2.2vw, 40px); line-height: 1.1; letter-spacing: -0.01em; color: var(--color-on-dark)\">We listen first.\u003c/h3>\n            \u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 40ch; text-wrap: pretty\">Every appointment opens with ten minutes at the mirror: how you wear it, how fast it grows, and what you do with it on a Tuesday morning.\u003c/p>\n          \u003c/li>\n          \u003cli style=\"border-top: 1px solid rgba(250,249,245,0.14); padding-top: 28px; display: flex; flex-direction: column; gap: 18px\">\n            \u003cspan aria-hidden=\"true\" style=\"font-family: var(--font-serif-display); font-size: clamp(64px, 6vw, 120px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-on-dark-soft)\">02\u003c/span>\n            \u003ch3 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(28px, 2.2vw, 40px); line-height: 1.1; letter-spacing: -0.01em; color: var(--color-on-dark)\">We book the hour.\u003c/h3>\n            \u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 40ch; text-wrap: pretty\">A cut is booked at sixty minutes because that is how long a good one takes. We never double-book a chair, and we start on time.\u003c/p>\n          \u003c/li>\n          \u003cli style=\"border-top: 1px solid rgba(250,249,245,0.14); padding-top: 28px; display: flex; flex-direction: column; gap: 18px\">\n            \u003cspan aria-hidden=\"true\" style=\"font-family: var(--font-serif-display); font-size: clamp(64px, 6vw, 120px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-on-dark-soft)\">03\u003c/span>\n            \u003ch3 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(28px, 2.2vw, 40px); line-height: 1.1; letter-spacing: -0.01em; color: var(--color-on-dark)\">Steel, leather, hot water.\u003c/h3>\n            \u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 40ch; text-wrap: pretty\">Straight razors kept on a leather strop, towels from the steamer, and a fresh blade for every client.\u003c/p>\n          \u003c/li>\n        \u003c/ol>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"services\" data-screen-label=\"03 Services\" style=\"background: var(--color-canvas); padding: clamp(88px, 9vw, 184px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: clamp(48px, 6vw, 120px)\">\n        \u003cdiv style=\"flex: 5 1 380px; min-width: 0\">\n          \u003cdiv style=\"position: sticky; top: clamp(96px, 8vw, 128px); display: flex; flex-direction: column; gap: 28px\">\n            \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">\n              \u003cspan>03\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>Services\u003c/span>\n            \u003c/div>\n            \u003ch2 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(44px, 4.4vw, 92px); line-height: 0.98; letter-spacing: -0.025em; color: var(--color-ink); max-width: 13ch; text-wrap: balance\">Booked at the length the work takes.\u003c/h2>\n            \u003cp style=\"margin: 0; font-size: clamp(16px, 1vw, 18px); line-height: 1.6; color: var(--color-body); max-width: 44ch; text-wrap: pretty\">Every service starts with a consultation and ends with a hot towel. Cancel up to 24 hours ahead at no charge.\u003c/p>\n            \u003cfigure data-reveal=\"\" style=\"margin: 8px 0 0; display: flex; flex-direction: column; gap: 14px\">\n              \u003cdiv style=\"aspect-ratio: 3 / 2; overflow: hidden; background: var(--color-surface-card)\">\n                \u003cimg src=\"ostler-barbers/09a27f04e7ff.webp\" alt=\"The wash room: two white basins on dark cabinets against oak panelling, with leather chairs facing them.\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; filter: grayscale(1) sepia(0.12) contrast(1.05)\">\n              \u003c/div>\n              \u003cfigcaption style=\"font-size: 13px; color: var(--color-muted); display: flex; gap: 10px\">\u003cspan style=\"color: var(--color-ink); font-weight: 500\">Pl. 02\u003c/span>\u003cspan>The wash room, where every appointment starts.\u003c/span>\u003c/figcaption>\n            \u003c/figure>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"flex: 7 1 520px; min-width: 0; display: flex; flex-direction: column; gap: clamp(48px, 4vw, 72px)\">\n          \u003csc-for list=\"{{ serviceGroups }}\" as=\"group\" hint-placeholder-count=\"3\">\n            \u003cdiv>\n              \u003cp style=\"margin: 0; padding-bottom: 16px; border-bottom: 1px solid var(--color-ink); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-ink)\">{{ group.label }}\u003c/p>\n              \u003csc-for list=\"{{ group.items }}\" as=\"s\" hint-placeholder-count=\"2\">\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ s.book }}\" aria-label=\"{{ s.aria }}\" style=\"width: calc(100% + 32px); margin: 0 -16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 32px; align-items: start; padding: clamp(22px, 2vw, 32px) 16px; background-color: transparent; border: 0; border-bottom: 1px solid var(--color-hairline); text-align: left; cursor: pointer; font-family: var(--font-sans); color: var(--color-ink); box-sizing: border-box; transition: background-color 180ms cubic-bezier(.2,0,0,1)\" style-hover=\"background-color: var(--color-surface-soft)\">\n                  \u003cspan style=\"display: flex; flex-direction: column; gap: 10px; min-width: 0\">\n                    \u003cspan style=\"display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px\">\n                      \u003cspan style=\"font-family: var(--font-serif-display); font-size: clamp(26px, 2.1vw, 40px); line-height: 1.1; letter-spacing: -0.01em; color: var(--color-ink)\">{{ s.name }}\u003c/span>\n                      \u003csc-if value=\"{{ s.signature }}\" hint-placeholder-val=\"{{ false }}\">\n                        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" variant=\"pill\" hint-size=\"80px,24px\">Signature\u003c/x-import>\n                      \u003c/sc-if>\n                    \u003c/span>\n                    \u003cspan style=\"font-size: 15px; line-height: 1.55; color: var(--color-muted); max-width: 52ch; text-wrap: pretty\">{{ s.desc }}\u003c/span>\n                  \u003c/span>\n                  \u003cspan style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right\">\n                    \u003cspan style=\"font-family: var(--font-serif-display); font-size: clamp(26px, 2.1vw, 40px); line-height: 1.1; color: var(--color-ink)\">{{ s.priceLabel }}\u003c/span>\n                    \u003cspan style=\"font-size: 13px; color: var(--color-muted); white-space: nowrap\">{{ s.durLabel }}\u003c/span>\n                    \u003cspan style=\"font-size: 13px; font-weight: 500; color: var(--color-ink); margin-top: 6px; white-space: nowrap\">Book →\u003c/span>\n                  \u003c/span>\n                \u003c/button>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/sc-for>\n          \u003cp style=\"margin: 0; font-size: 15px; line-height: 1.6; color: var(--color-body); max-width: 60ch\">Apprentice cuts with Leo at chair four, £34, on Tuesdays and Wednesdays. Gift cards in any amount, at the shop or by email.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"house\" data-screen-label=\"04 The house\" style=\"background: var(--color-surface-dark); color: var(--color-on-dark); padding: clamp(88px, 9vw, 184px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6vw, 120px); align-items: flex-end; justify-content: space-between\">\n        \u003cdiv style=\"flex: 1 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft)\">\n            \u003cspan>04\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>The house\u003c/span>\n          \u003c/div>\n          \u003ch2 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(44px, 5.4vw, 116px); line-height: 0.98; letter-spacing: -0.025em; color: var(--color-on-dark); max-width: 15ch; text-wrap: balance\">A cabinetmaker’s workshop, with four chairs in it.\u003c/h2>\n        \u003c/div>\n        \u003cp style=\"flex: 0 1 420px; margin: 0; font-size: clamp(16px, 1vw, 18px); line-height: 1.6; color: var(--color-on-dark-soft); text-wrap: pretty\">Carrow Mews was built in 1882 for the furniture trade that ran between Tottenham Court Road and Charlotte Street. Number six is the one with the green door.\u003c/p>\n      \u003c/div>\n      \u003cfigure style=\"margin: clamp(56px, 6vw, 112px) 0 0; position: relative; height: clamp(300px, 46vw, 1080px); overflow: hidden; background: var(--color-surface-dark-elevated)\">\n        \u003cimg src=\"ostler-barbers/835eb352aced.webp\" alt=\"Two white enamel barber chairs facing four black-framed mirrors across a white mosaic floor.\" loading=\"lazy\" data-parallax=\"0.06\" style=\"position: absolute; left: 0; top: -8%; width: 100%; height: 116%; object-fit: cover; object-position: 50% 58%; filter: grayscale(1) sepia(0.12) contrast(1.05); will-change: transform\">\n      \u003c/figure>\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px clamp(32px, 6vw, 120px); align-items: flex-start\">\n        \u003cdiv style=\"flex: 7 1 520px; min-width: 0; display: flex; flex-direction: column; gap: clamp(40px, 4vw, 72px); padding-top: 20px\">\n          \u003cp style=\"margin: 0; font-size: 13px; color: var(--color-on-dark-soft); display: flex; gap: 10px\">\u003cspan style=\"color: var(--color-on-dark); font-weight: 500\">Pl. 03\u003c/span>\u003cspan>The floor before opening. Chairs one and two.\u003c/span>\u003c/p>\n          \u003cp style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(26px, 2.3vw, 46px); line-height: 1.25; letter-spacing: -0.01em; color: var(--color-on-dark); max-width: 30ch; text-wrap: pretty\">Number six made cabinets for the shops on Tottenham Court Road until 1971. We kept the north-light windows, the oak benches and the iron hooks in the ceiling, and laid a mosaic floor that should outlast all of us.\u003c/p>\n          \u003cdl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 32px 40px\">\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(250,249,245,0.14); padding-top: 20px\">\n              \u003cdt style=\"font-family: var(--font-serif-display); font-size: clamp(40px, 3.4vw, 64px); line-height: 1; letter-spacing: -0.02em; color: var(--color-on-dark)\">1882\u003c/dt>\n              \u003cdd style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-on-dark-soft)\">Built for the furniture trade\u003c/dd>\n            \u003c/div>\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(250,249,245,0.14); padding-top: 20px\">\n              \u003cdt style=\"font-family: var(--font-serif-display); font-size: clamp(40px, 3.4vw, 64px); line-height: 1; letter-spacing: -0.02em; color: var(--color-on-dark)\">4 chairs\u003c/dt>\n              \u003cdd style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-on-dark-soft)\">Three barbers and an apprentice\u003c/dd>\n            \u003c/div>\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(250,249,245,0.14); padding-top: 20px\">\n              \u003cdt style=\"font-family: var(--font-serif-display); font-size: clamp(40px, 3.4vw, 64px); line-height: 1; letter-spacing: -0.02em; color: var(--color-on-dark)\">3 min\u003c/dt>\n              \u003cdd style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-on-dark-soft)\">Walk from Goodge Street\u003c/dd>\n            \u003c/div>\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(250,249,245,0.14); padding-top: 20px\">\n              \u003cdt style=\"font-family: var(--font-serif-display); font-size: clamp(40px, 3.4vw, 64px); line-height: 1; letter-spacing: -0.02em; color: var(--color-on-dark)\">Step-free\u003c/dt>\n              \u003cdd style=\"margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-on-dark-soft)\">Entrance and washroom\u003c/dd>\n            \u003c/div>\n          \u003c/dl>\n        \u003c/div>\n        \u003cfigure data-reveal=\"\" style=\"flex: 4 1 320px; min-width: 0; margin: calc(-1 * clamp(0px, calc((100vw - 1000px) * 0.3), 220px)) 0 0; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px\">\n          \u003cdiv style=\"aspect-ratio: 4 / 5; overflow: hidden; position: relative; background: var(--color-surface-dark-elevated)\">\n            \u003cimg src=\"ostler-barbers/8af4564aa7c1.webp\" alt=\"Detail of the bench by the window: a marble tray of glasses and a vase of dried branches beside a leather sofa.\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 100% 100%; transform: scale(1.7); transform-origin: 88% 86%; filter: grayscale(1) sepia(0.12) contrast(1.05)\">\n          \u003c/div>\n          \u003cfigcaption style=\"font-size: 13px; line-height: 1.5; color: var(--color-on-dark-soft); display: flex; gap: 10px\">\u003cspan style=\"color: var(--color-on-dark); font-weight: 500; white-space: nowrap\">Pl. 04\u003c/span>\u003cspan>The bench by the window. Coffee until noon, something stronger after five.\u003c/span>\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"shop\" data-screen-label=\"05 The shelf\" style=\"background: var(--color-surface-card); padding: clamp(88px, 9vw, 184px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box\">\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6vw, 120px); align-items: flex-end; justify-content: space-between\">\n          \u003cdiv style=\"flex: 1 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n            \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">\n              \u003cspan>05\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>The shelf\u003c/span>\n            \u003c/div>\n            \u003ch2 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(44px, 5.4vw, 116px); line-height: 0.98; letter-spacing: -0.025em; color: var(--color-ink); max-width: 14ch; text-wrap: balance\">A short shelf, made in small batches.\u003c/h2>\n          \u003c/div>\n          \u003cdiv style=\"flex: 0 1 420px; display: flex; flex-direction: column; gap: 16px\">\n            \u003cp style=\"margin: 0; font-size: clamp(16px, 1vw, 18px); line-height: 1.6; color: var(--color-body); text-wrap: pretty\">Four things we use at the chair every day, mixed in batches of two hundred by a perfumer in Walthamstow. Bring the empty back and the refill is half price.\u003c/p>\n            \u003cp style=\"margin: 0; font-size: 14px; color: var(--color-muted)\">Free UK delivery over £50. Collect from the shop the same day.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: clamp(12px, 1.6vw, 28px); margin-top: clamp(56px, 6vw, 104px)\">\n          \u003csc-for list=\"{{ productPairs }}\" as=\"pair\" hint-placeholder-count=\"2\">\n            \u003cdiv style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-wrap: wrap; gap: clamp(12px, 1.6vw, 28px)\">\n              \u003csc-for list=\"{{ pair }}\" as=\"p\" hint-placeholder-count=\"2\">\n                \u003carticle style=\"flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n                  \u003cdiv aria-hidden=\"true\" style=\"position: relative; aspect-ratio: 4 / 5; container-type: inline-size; background-color: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: 12px; display: grid; place-items: center; overflow: hidden; transition: background-color 280ms cubic-bezier(.2,0,0,1)\" style-hover=\"background-color: var(--color-surface-soft)\">\n                    \u003cspan style=\"position: absolute; top: 14px; left: 16px; font-size: 12px; font-weight: 500; letter-spacing: 1px; color: var(--color-muted)\">No. {{ p.no }}\u003c/span>\n                    \u003cspan style=\"position: absolute; top: 14px; right: 16px; font-size: 12px; color: var(--color-muted)\">{{ p.size }}\u003c/span>\n\n                    \u003csc-if value=\"{{ p.isTin }}\" hint-placeholder-val=\"{{ false }}\">\n                      \u003cdiv style=\"display: flex; flex-direction: column; align-items: center; gap: 5cqw\">\n                        \u003cdiv style=\"width: 58cqw; aspect-ratio: 1; border: 1px solid var(--color-ink); border-radius: 50%; display: grid; place-items: center; box-sizing: border-box\">\n                          \u003cdiv style=\"width: 84%; aspect-ratio: 1; border: 1p 03c/span>\n                                \u003cspan style=\"font-size: 1.9cqw; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-muted)\">No. {{ p.no }}\u003c/span>\n                              \u003c/div>\n                            \u003c/div>\n                          \u003c/div>\n                        \u003c/div>\n                        \u003cdiv style=\"width: 5cqw; border-top: 1px solid var(--color-muted); border-bottom: 1px solid var(--color-muted); display: flex; flex-direction: column; align-items: center; color: var(--color-muted)\">\n                          \u003cspan style=\"flex: 1; width: 1px; background: currentColor\">\u003c/span>\u003cspan style=\"writing-mode: vertical-rl; font-size: 2.6cqw; letter-spacing: 0.06em; padding: 1.6cqw 0\">{{ p.dim }}\u003c/span>\u003cspan style=\"flex: 1; width: 1px; background: currentColor\">\u003c/span>\n                        \u003c/div>\n                      \u003c/div>\n                    \u003c/sc-if>\n                  \u003c/div>\n                  \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\n                    \u003cdiv style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px\">\n                      \u003ch3 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(24px, 1.8vw, 34px); line-height: 1.1; letter-spacing: -0.01em; color: var(--color-ink)\">{{ p.name }}\u003c/h3>\n                      \u003cspan style=\"font-family: var(--font-serif-display); font-size: clamp(22px, 1.6vw, 30px); line-height: 1.1; color: var(--color-ink)\">{{ p.priceLabel }}\u003c/span>\n                    \u003c/div>\n                    \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.55; color: var(--color-muted); text-wrap: pretty\">{{ p.notes }}\u003c/p>\n                    \u003cdiv style=\"margin-top: 8px\">\n                      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ p.add }}\" aria-label=\"{{ p.aria }}\" dc-props=\"{{ touchBtn }}\" hint-size=\"110px,44px\">{{ p.addLabel }}\u003c/x-import>\n                    \u003c/div>\n                  \u003c/div>\n                \u003c/article>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"barbers\" data-screen-label=\"06 Barbers\" style=\"background: var(--color-canvas); padding: clamp(88px, 9vw, 184px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box\">\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6vw, 120px); align-items: flex-end; justify-content: space-between\">\n          \u003cdiv style=\"flex: 1 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n            \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">\n              \u003cspan>06\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>The barbers\u003c/span>\n            \u003c/div>\n            \u003ch2 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(44px, 5.4vw, 116px); line-height: 0.98; letter-spacing: -0.025em; color: var(--color-ink); max-width: 14ch; text-wrap: balance\">Book the barber, not the slot.\u003c/h2>\n          \u003c/div>\n          \u003cp style=\"flex: 0 1 420px; margin: 0; font-size: clamp(16px, 1vw, 18px); line-height: 1.6; color: var(--color-body); text-wrap: pretty\">Each barber keeps their own book and their own chair. Choose one and you will see the same person, at the same mirror, every time.\u003c/p>\n        \u003c/div>\n        \u003cdiv role=\"list\" style=\"display: flex; gap: clamp(16px, 2.2vw, 44px); margin: clamp(56px, 6vw, 104px) calc(-1 * clamp(20px, 4vw, 80px)) 0; padding: 0 clamp(20px, 4vw, 80px) 4px; scroll-padding-left: clamp(20px, 4vw, 80px); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none\">\n          \u003csc-for list=\"{{ barbers }}\" as=\"b\" hint-placeholder-count=\"3\">\n            \u003carticle role=\"listitem\" style=\"flex: 1 0 min(76vw, 340px); min-width: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 22px; margin-top: {{ b.offset }}\">\n              \u003cfigure data-reveal=\"\" style=\"margin: 0; position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--color-surface-card)\">\n                \u003cimg src=\"{{ b.img }}\" alt=\"{{ b.alt }}\" loading=\"lazy\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{ b.pos }}; filter: grayscale(1) sepia(0.12) contrast(1.05); transition: transform 1200ms cubic-bezier(.2,0,0,1)\" style-hover=\"transform: scale(1.035)\">\n                \u003cspan style=\"position: absolute; left: 0; top: 0; background: var(--color-canvas); padding: 0 16px 10px 0; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-ink)\">Chair {{ b.chair }}\u003c/span>\n              \u003c/figure>\n              \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n                \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-top: 1px solid var(--color-ink); padding-top: 18px\">\n                  \u003ch3 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(30px, 2.4vw, 46px); line-height: 1.05; letter-spacing: -0.015em; color: var(--color-ink)\">{{ b.name }}\u003c/h3>\n                  \u003cspan aria-hidden=\"true\" style=\"font-family: var(--font-serif-display); font-size: clamp(30px, 2.4vw, 46px); line-height: 1; color: var(--color-muted-soft)\">{{ b.chair }}\u003c/span>\n                \u003c/div>\n                \u003cp style=\"margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">{{ b.role }}\u003c/p>\n                \u003cp style=\"margin: 0; font-size: 15px; line-height: 1.6; color: var(--color-body); max-width: 40ch; text-wrap: pretty\">{{ b.spec }}\u003c/p>\n                \u003cdiv style=\"display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 10px\">\n                  \u003cspan style=\"font-size: 13px; color: var(--color-muted)\">{{ b.next }}\u003c/span>\n                  \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ b.book }}\" dc-props=\"{{ touchBtn }}\" hint-size=\"140px,44px\">{{ b.bookLabel }}\u003c/x-import>\n                \u003c/div>\n              \u003c/div>\n            \u003c/article>\n          \u003c/sc-for>\n        \u003c/div>\n        \u003cp style=\"margin: clamp(48px, 5vw, 80px) 0 0; font-size: 15px; line-height: 1.6; color: var(--color-body); max-width: 60ch\">Leo Hartley, our apprentice, cuts at chair four on Tuesdays and Wednesdays for £34, with Tomas at his shoulder.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"membership\" data-screen-label=\"07 Membership\" style=\"background: var(--color-primary); color: var(--color-ink); padding: clamp(88px, 9vw, 184px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 56px clamp(40px, 7vw, 160px); align-items: flex-end\">\n        \u003cdiv style=\"flex: 6 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 32px\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-ink)\">\n            \u003cspan>07\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>Membership\u003c/span>\n          \u003c/div>\n          \u003ch2 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(60px, 8vw, 176px); line-height: 0.9; letter-spacing: -0.035em; color: var(--color-ink); max-width: 10ch\">A standing appointment.\u003c/h2>\n          \u003cp style=\"margin: 0; font-size: clamp(17px, 1.1vw, 20px); line-height: 1.6; color: var(--color-ink); max-width: 44ch; text-wrap: pretty\">Members keep the same barber at the same hour, every three or four weeks. The appointment is yours until you give it up, and we hold it even when the book is full.\u003c/p>\n        \u003c/div>\n        \u003cdiv style=\"flex: 4 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n          \u003cdiv style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px\">\n            \u003cspan style=\"font-family: var(--font-serif-display); font-size: clamp(72px, 6.4vw, 136px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-ink)\">£95\u003c/span>\n            \u003cspan style=\"font-size: 16px; color: var(--color-ink)\">a month, cancel any month\u003c/span>\n          \u003c/div>\n          \u003cul style=\"list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--color-ink)\">\n            \u003cli style=\"display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--color-ink); font-size: 16px; line-height: 1.5; color: var(--color-ink)\">\u003cspan aria-hidden=\"true\">—\u003c/span>\u003cspan>A cut every three or four weeks, at a time that stays yours\u003c/span>\u003c/li>\n            \u003cli style=\"display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--color-ink); font-size: 16px; line-height: 1.5; color: var(--color-ink)\">\u003cspan aria-hidden=\"true\">—\u003c/span>\u003cspan>A beard shape or neck tidy between cuts\u003c/span>\u003c/li>\n            \u003cli style=\"display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--color-ink); font-size: 16px; line-height: 1.5; color: var(--color-ink)\">\u003cspan aria-hidden=\"true\">—\u003c/span>\u003cspan>10% off the shelf, and refills at cost\u003c/span>\u003c/li>\n            \u003cli style=\"display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--color-ink); font-size: 16px; line-height: 1.5; color: var(--color-ink)\">\u003cspan aria-hidden=\"true\">—\u003c/span>\u003cspan>First refusal on Friday and Saturday evenings\u003c/span>\u003c/li>\n          \u003c/ul>\n          \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"inverse\" sc-camel-on-click=\"{{ joinMembership }}\" dc-props=\"{{ bigBtn }}\" hint-size=\"170px,52px\">Become a member\u003c/x-import>\n            \u003cspan style=\"flex: 1 1 220px; font-size: 14px; line-height: 1.5; color: var(--color-ink)\">Capped at forty members per barber. Chair one has a waiting list.\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"words\" data-screen-label=\"08 From the chair\" style=\"background: var(--color-canvas); padding: clamp(88px, 9vw, 184px) 0\">\n      \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box\">\n        \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 16px\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">\n            \u003cspan>08\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>From the chair\u003c/span>\n          \u003c/div>\n          \u003cp style=\"margin: 0; font-size: 14px; color: var(--color-muted)\">Rated 4.9 from 1,186 reviews\u003c/p>\n        \u003c/div>\n        \u003cfigure style=\"margin: clamp(48px, 5vw, 96px) 0 0; display: flex; flex-direction: column; gap: 36px\">\n          \u003cblockquote style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(38px, 4.8vw, 104px); line-height: 1.04; letter-spacing: -0.02em; color: var(--color-ink); max-width: 22ch; text-wrap: balance\">“I’ve had the same Thursday at eight with Tomas for six years. In that time I’ve changed jobs twice and flats three times.”\u003c/blockquote>\n          \u003cfigcaption style=\"display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--color-body)\">\u003cspan style=\"width: 40px; height: 1px; background: var(--color-ink)\">\u003c/span>Daniel O., member since 2019\u003c/figcaption>\n        \u003c/figure>\n        \u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 48px clamp(32px, 5vw, 96px); margin-top: clamp(72px, 7vw, 136px); padding-left: clamp(0px, calc((100vw - 900px) * 0.25), 320px)\">\n          \u003cfigure style=\"margin: 0; display: flex; flex-direction: column; gap: 20px; border-top: 1px solid var(--color-hairline); padding-top: 28px\">\n            \u003cblockquote style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(24px, 1.9vw, 36px); line-height: 1.25; letter-spacing: -0.01em; color: var(--color-ink); text-wrap: pretty\">“Jonah talked me out of the cut I came in for. He was right, and he has been right every four weeks since.”\u003c/blockquote>\n            \u003cfigcaption style=\"font-size: 14px; color: var(--color-muted)\">Sam K., chair two\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure style=\"margin: 0; display: flex; flex-direction: column; gap: 20px; border-top: 1px solid var(--color-hairline); padding-top: 28px\">\n            \u003cblockquote style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(24px, 1.9vw, 36px); line-height: 1.25; letter-spacing: -0.01em; color: var(--color-ink); text-wrap: pretty\">“The hot-towel shave is forty-five minutes of nobody needing anything from you. I book one before every big week.”\u003c/blockquote>\n            \u003cfigcaption style=\"font-size: 14px; color: var(--color-muted)\">Marcus L., Bloomsbury\u003c/figcaption>\n          \u003c/figure>\n        \u003c/div>\n        \u003cdiv style=\"margin-top: clamp(96px, 9vw, 176px); border-top: 1px solid var(--color-hairline); padding-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 40px 48px\">\n          \u003cp style=\"grid-column: 1 / -1; margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-muted)\">In print\u003c/p>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n            \u003cp style=\"margin: 0; font-family: var(--font-serif-display); font-size: 26px; line-height: 1.1; color: var(--color-ink)\">The Weekend Edit\u003c/p>\n            \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.55; color: var(--color-muted)\">“The calmest forty-five minutes in W1.”\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n            \u003cp style=\"margin: 0; font-family: var(--font-serif-display); font-size: 26px; line-height: 1.1; color: var(--color-ink)\">Field &amp; Grain\u003c/p>\n            \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.55; color: var(--color-muted)\">“Run like a good restaurant: booked, on time, and properly looked after.”\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n            \u003cp style=\"margin: 0; font-family: var(--font-serif-display); font-size: 26px; line-height: 1.1; color: var(--color-ink)\">London Grooming Awards\u003c/p>\n            \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.55; color: var(--color-muted)\">Independent barbershop of the year, 2025.\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n            \u003cp style=\"margin: 0; font-family: var(--font-serif-display); font-size: 26px; line-height: 1.1; color: var(--color-ink)\">Mews Quarterly\u003c/p>\n            \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.55; color: var(--color-muted)\">“Their matte clay is the only one in the office that gets finished.”\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cfooter id=\"visit\" data-screen-label=\"09 Visit\" style=\"background: var(--color-surface-dark); color: var(--color-on-dark); padding-top: clamp(88px, 9vw, 184px); overflow: hidden\">\n    \u003cdiv style=\"max-width: 1840px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 80px); box-sizing: border-box\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 40px clamp(40px, 6vw, 120px); align-items: flex-end; justify-content: space-between\">\n        \u003cdiv style=\"flex: 1 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft)\">\n            \u003cspan>09\u003c/span>\u003cspan style=\"width: 32px; height: 1px; background: currentColor\">\u003c/span>\u003cspan>Visit\u003c/span>\n          \u003c/div>\n          \u003ch2 style=\"margin: 0; font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(52px, 6.6vw, 148px); line-height: 0.94; letter-spacing: -0.035em; color: var(--color-on-dark); max-width: 13ch; text-wrap: balance\">Next chair: {{ nextChair }}.\u003c/h2>\n        \u003c/div>\n        \u003cdiv style=\"flex: 0 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n          \u003cp style=\"margin: 0; font-size: clamp(16px, 1vw, 18px); line-height: 1.6; color: var(--color-on-dark-soft); text-wrap: pretty\">Book online in under a minute, or call the shop on 020 7946 0381. Walk-ins are seen when a chair is free, which is rarely after four.\u003c/p>\n          \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openBookingDefault }}\" dc-props=\"{{ bigBtn }}\" hint-size=\"150px,52px\">Book a chair\u003c/x-import>\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary-on-dark\" sc-camel-on-click=\"{{ membershipScroll }}\" dc-props=\"{{ bigBtn }}\" hint-size=\"170px,52px\">Become a member\u003c/x-import>\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary-on-dark\" sc-camel-on-click=\"{{ shopScroll }}\" dc-props=\"{{ bigBtn }}\" hint-size=\"150px,52px\">Shop the shelf\u003c/x-import>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"margin-top: clamp(80px, 8vw, 160px); padding-top: 48px; border-top: 1px solid rgba(250,249,245,0.1); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 48px 40px\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cp style=\"margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft)\">Find us\u003c/p>\n          \u003cp style=\"margin: 0; font-size: 15px; line-height: 1.6; color: var(--color-on-dark)\">6 Carrow Mews\u003cbr>London W1T 4QS\u003c/p>\n          \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.6; color: var(--color-on-dark-soft)\">Three minutes from Goodge Street. Bicycle hoops at the mews entrance.\u003c/p>\n          \u003ca href=\"https://maps.google.com/?q=Goodge+Street+London\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--color-on-dark); padding: 6px 0\">Get directions \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"arrow-up-right\" size=\"{{ icon16 }}\" hint-size=\"16px,16px\">\u003c/x-import>\u003c/a>\n        \u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cp style=\"margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft)\">Hours\u003c/p>\n          \u003cdl style=\"margin: 0; display: grid; grid-template-columns: auto auto; justify-content: start; gap: 8px 24px; font-size: 15px; line-height: 1.5\">\n            \u003cdt style=\"color: var(--color-on-dark-soft)\">Mon–Fri\u003c/dt>\u003cdd style=\"margin: 0; color: var(--color-on-dark)\">08:00–20:00\u003c/dd>\n            \u003cdt style=\"color: var(--color-on-dark-soft)\">Saturday\u003c/dt>\u003cdd style=\"margin: 0; color: var(--color-on-dark)\">08:00–18:00\u003c/dd>\n            \u003cdt style=\"color: var(--color-on-dark-soft)\">Sunday\u003c/dt>\u003cdd style=\"margin: 0; color: var(--color-on-dark)\">10:00–16:00\u003c/dd>\n          \u003c/dl>\n          \u003cp style=\"margin: 0; font-size: 14px; color: var(--color-on-dark-soft)\">{{ openTitle }} · {{ openLabel }}\u003c/p>\n        \u003c/div>\n        \u003cnav aria-label=\"Footer\" style=\"display: flex; flex-direction: column; gap: 10px\">\n          \u003cp style=\"margin: 0 0 6px; font-size: 12px; font-weight: d: null, toast: null,\n    bookingOpen: false, bookingDone: false, bkError: '', bkMember: false,\n    bk: { service: 'cut', barber: -1, day: 0, time: null, name: '', phone: '', assigned: 0 },\n    email: '', emailError: '', subscribed: false\n  };\n\n  componentDidMount() {\n    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    this.lastY = window.scrollY;\n    this.onResize = () => { if (window.innerWidth !== this.state.vw) this.setState({ vw: window.innerWidth }); };\n    this.onScroll = () => {\n      if (this.ticking) return;\n      this.ticking = true;\n      requestAnimationFrame(() => { this.ticking = false; this.handleScroll(); });\n    };\n    this.onKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    document.addEventListener('keydown', this.onKey);\n    this.onResize();\n    this.handleScroll();\n    this.setupReveal();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('scroll', this.onScroll);\n    document.removeEventListener('keydown', this.onKey);\n    if (this.io) this.io.disconnect();\n    clearTimeout(this.toastT); clearTimeout(this.addT);\n    document.body.style.overflow = '';\n  }\n\n  componentDidUpdate() {\n    document.body.style.overflow = (this.state.menuOpen || this.state.bookingOpen) ? 'hidden' : '';\n  }\n\n  motionOn() { return !this.reduce && (this.props.motion ?? true); }\n\n  setupReveal() {\n    if (!this.motionOn() || !('IntersectionObserver' in window)) return;\n    this.io = new IntersectionObserver((entries) => entries.forEach((e) => {\n      if (e.isIntersecting) { e.target.style.clipPath = 'inset(0 0 0 0)'; this.io.unobserve(e.target); }\n    }), { threshold: 0.08 });\n    setTimeout(() => {\n      document.querySelectorAll('[data-reveal]').forEach((el) => {\n        if (el.getBoundingClientRect().top \u003c window.innerHeight) return;\n        el.style.clipPath = 'inset(9% 0 0 0)';\n        el.style.transition = 'clip-path 1400ms cubic-bezier(.2,0,0,1)';\n        this.io.observe(el);\n      });\n    }, 300);\n  }\n\n  handleScroll() {\n    const y = window.scrollY, vh = window.innerHeight;\n    const d = y - this.lastY;\n    let navHidden = this.state.navHidden;\n    const autoHide = this.props.navAutoHide ?? true;\n    if (!autoHide || y \u003c 400) navHidden = false;\n    else if (d > 8) navHidden = true;\n    else if (d \u003c -8) navHidden = false;\n    if (Math.abs(d) > 8 || y \u003c 400) this.lastY = y;\n    const scrolled = y > 8, pastHero = y > vh * 0.75;\n    if (navHidden !== this.state.navHidden || scrolled !== this.state.scrolled || pastHero !== this.state.pastHero) {\n      this.setState({ navHidden, scrolled, pastHero });\n    }\n    if (!this.motionOn()) return;\n    document.querySelectorAll('[data-parallax]').forEach((el) => {\n      const r = el.parentElement.getBoundingClientRect();\n      if (r.bottom \u003c -100 || r.top > vh + 100) return;\n      const k = parseFloat(el.getAttribute('data-parallax')) || 0.06;\n      const off = (r.top + r.height / 2) - vh / 2;\n      el.style.transform = 'translate3d(0,' + (-off * k).toFixed(1) + 'px,0)';\n    });\n  }\n\n  fmt(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }\n  dayDate(i) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i); return d; }\n  relDay(i) { return i === 0 ? 'today' : i === 1 ? 'tomorrow' : this.dayDate(i).toLocaleDateString('en-GB', { weekday: 'long' }); }\n\n  slots(dayIdx, bi, dur) {\n    const d = this.dayDate(dayIdx);\n    const [o, c] = this.HOURS[d.getDay()];\n    const now = new Date();\n    const nowM = now.getHours() * 60 + now.getMinutes();\n    return this.BASE.filter((m) => m >= o && m + dur \u003c= c && (dayIdx > 0 || m >= nowM + 30)).map((m) => {\n      const seed = (d.getDate() * 131 + m * 17 + (bi + 2) * 53) % 89;\n      const free = bi \u003c 0 ? seed % 4 !== 0 : (seed % 3 === 0 || seed % 5 === 1);\n      return { m, free };\n    });\n  }\n\n  firstFree(bi, dur) {\n    for (let d = 0; d \u003c 7; d++) {\n      const f = this.slots(d, bi, dur).find((t) => t.free);\n      if (f) return { day: d, m: f.m };\n    }\n    return null;\n  }\n\n  scrollToId(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    this.setState({ menuOpen: false });\n    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: this.reduce ? 'auto' : 'smooth' });\n  }\n\n  showToast(title, body) {\n    clearTimeout(this.toastT);\n    this.setState({ toast: { title, body } });\n    this.toastT = setTimeout(() => this.setState({ toast: null }), 4200);\n  }\n\n  bagTotal(bag) { return bag.reduce((s, id) => s + this.PRODUCTS.find((x) => x.id === id).price, 0); }\n\n  addToBag(p) {\n    const bag = this.state.bag.concat(p.id);\n    this.setState({ bag, justAdded: p.id });\n    this.showToast('Added to your bag', p.name + ', ' + p.size + '. ' + bag.length + (bag.length === 1 ? ' item' : ' items') + ', £' + this.bagTotal(bag) + ' in total.');\n    clearTimeout(this.addT);\n    this.addT = setTimeout(() => this.setState({ justAdded: null }), 1800);\n  }\n\n  bagClick() {\n    const bag = this.state.bag;\n    if (!bag.length) { this.showToast('Your bag is empty', 'The shelf has four things, from £24.'); this.scrollToId('shop'); return; }\n    const counts = {};\n    bag.forEach((id) => { counts[id] = (counts[id] || 0) + 1; });\n    const list = Object.keys(counts).map((id) => { const p = this.PRODUCTS.find((x) => x.id === id); return (counts[id] > 1 ? counts[id] + ' × ' : '') + p.name; }).join(', ');\n    this.showToast('Your bag · £' + this.bagTotal(bag), list + '. Checkout opens with the full shop.');\n  }\n\n  openBooking(opts) {\n    opts = opts || {};\n    const s = this.state;\n    const service = opts.service || s.bk.service;\n    const barber = opts.barber != null ? opts.barber : s.bk.barber;\n    const dur = this.SERVICES.find((x) => x.id === service).dur;\n    const f = this.firstFree(barber, dur);\n    this.setState({ menuOpen: false, bookingOpen: true, bookingDone: false, bkError: '', bkMember: !!opts.member, bk: Object.assign({}, s.bk, { service, barber, day: f ? f.day : 0, time: null }) });\n  }\n\n  setBk(patch) { this.setState((s) => ({ bk: Object.assign({}, s.bk, patch), bkError: '' })); }\n\n  confirmBooking() {\n    const bk = this.state.bk;\n    const cur = this.SERVICES.find((x) => x.id === bk.service);\n    if (bk.time == null) { this.setState({ bkError: 'Choose a time to continue.' }); return; }\n    if (!bk.name.trim() || bk.phone.replace(/\\D/g, '').length \u003c 7) { this.setState({ bkError: 'Add your name and a mobile number so we can confirm by text.' }); return; }\n    let assigned = bk.barber;\n    if (assigned \u003c 0) {\n      assigned = this.BARBERS.findIndex((b, i) => (this.slots(bk.day, i, cur.dur).find((t) => t.m === bk.time) || {}).free);\n      if (assigned \u003c 0) assigned = 0;\n    }\n    this.setState({ bookingDone: true, bk: Object.assign({}, bk, { assigned }) });\n  }\n\n  renderVals() {\n    const s = this.state, vw = s.vw, bk = s.bk;\n    const fmt = (m) => this.fmt(m);\n    const isDesk = vw >= 1100;\n    const now = new Date();\n    const nm = now.getHours() * 60 + now.getMinutes();\n    const [o, c] = this.HOURS[now.getDay()];\n    const isOpen = nm >= o && nm \u003c c;\n    const openTitle = isOpen ? 'Open now' : 'Closed now';\n    const openLabel = isOpen ? 'Until ' + fmt(c) : (nm \u003c o ? 'Opens at ' + fmt(o) : 'Opens ' + fmt(this.HOURS[(now.getDay() + 1) % 7][0]));\n    const nf = this.firstFree(-1, 60);\n    const nextChair = nf ? this.relDay(nf.day) + ' at ' + fmt(nf.m) : 'later this week';\n\n    const serviceGroups = ['Cuts', 'Shaves & beards', 'Together'].map lor: on ? 'var(--color-canvas)' : ink, select: () => this.setBk({ barber: opt.i, time: null }) };\n    });\n    const bkDays = [0, 1, 2, 3, 4, 5, 6].map((i) => {\n      const d = this.dayDate(i);\n      const on = i === bk.day;\n      return { dow: i === 0 ? 'Today' : d.toLocaleDateString('en-GB', { weekday: 'short' }), date: d.getDate(), aria: d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }), pressed: on ? 'true' : 'false', border: on ? ink : line, bg: on ? ink : 'transparent', color: on ? 'var(--color-canvas)' : ink, select: () => this.setBk({ day: i, time: null }) };\n    });\n    const sl = this.slots(bk.day, bk.barber, cur.dur);\n    const bkTimes = sl.map((t) => {\n      const on = t.m === bk.time;\n      return {\n        label: fmt(t.m), disabled: !t.free, pressed: on ? 'true' : 'false',\n        bg: on ? ink : 'transparent', color: on ? 'var(--color-canvas)' : (t.free ? ink : 'var(--color-muted-soft)'),\n        border: on ? ink : (t.free ? line : 'var(--color-hairline-soft)'), deco: t.free ? 'none' : 'line-through', cursor: t.free ? 'pointer' : 'not-allowed',\n        aria: fmt(t.m) + (t.free ? '' : ', taken'),\n        select: () => { if (t.free) this.setBk({ time: t.m }); }\n      };\n    });\n    const dayD = this.dayDate(bk.day);\n    const dayShort = dayD.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });\n    const dayLong = dayD.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });\n    const who = bk.barber \u003c 0 ? 'the first free barber' : this.BARBERS[bk.barber].first;\n    const assignedB = this.BARBERS[bk.barber \u003c 0 ? bk.assigned : bk.barber] || this.BARBERS[0];\n\n    return {\n      icon16: 16, icon20: 20, icon22: 22,\n      isDesk, isMobile: !isDesk, showTagline: vw >= 1360,\n      navBg: (s.scrolled ? 'rgba(250,249,245,1)' : 'rgba(250,249,245,0)'),\n      navLine: s.scrolled ? 'var(--color-hairline)' : 'transparent',\n      navShift: (s.navHidden && !s.menuOpen && !s.bookingOpen) ? 'translateY(-100%)' : 'translateY(0)',\n      navCtaVariant: s.pastHero ? 'primary' : 'secondary',\n      navCtaLabel: vw \u003c 480 ? 'Book' : 'Book a chair',\n      bagCount: s.bag.length,\n      bagAria: 'Bag, ' + s.bag.length + (s.bag.length === 1 ? ' item' : ' items'),\n      bagClick: () => this.bagClick(),\n      menuOpen: s.menuOpen, menuOpenStr: s.menuOpen ? 'true' : 'false',\n      openMenu: () => this.setState({ menuOpen: true }),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      openTitle, openLabel, nextChair,\n      bigBtn: { style: { height: '52px', padding: '0 28px', fontSize: '15px' } },\n      fullBtn: { style: { width: '100%', height: '52px', fontSize: '15px' } },\n      touchBtn: { style: { height: '44px', padding: '0 16px' } },\n      openBookingDefault: () => this.openBooking(),\n      joinMembership: () => this.openBooking({ service: 'cut', member: true }),\n      shopScroll: () => this.scrollToId('shop'),\n      membershipScroll: () => this.scrollToId('membership'),\n      serviceGroups,\n      productPairs: [prods.slice(0, 2), prods.slice(2, 4)],\n      barbers,\n      email: s.email, emailError: s.emailError, subscribed: s.subscribed, notSubscribed: !s.subscribed,\n      setEmail: (e) => this.setState({ email: e.target.value, emailError: '' }),\n      subscribe: () => {\n        if (/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.email.trim())) this.setState({ subscribed: true });\n        else this.setState({ emailError: 'Enter a full email address, like name@example.com.' });\n      },\n      toastOn: !!s.toast, toastTitle: s.toast ? s.toast.title : '', toastBody: s.toast ? s.toast.body : '',\n      dismissToast: () => this.setState({ toast: null }),\n      bookingOpen: s.bookingOpen, bookingDone: s.bookingDone, bookingFormOn: !s.bookingDone, bkMember: s.bkMember,\n      closeBooking: () => this.setState({ bookingOpen: false }),\n      bkServices, bkBarbers, bkDays, bkTimes,\n      noSlots
