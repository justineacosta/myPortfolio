eme-dark.css. */\n:root{\n/* Surfaces */\n--app-canvas:#f5f0e8;          /* page floor */\n--app-surface:#faf9f5;         /* panels, cards, table body */\n--app-raised:#faf9f5;          /* popovers, dropdowns, modals (+ shadow) */\n--app-sunken:#efe9de;          /* table headers, inset wells, code */\n--app-hover:#efe9de;           /* row / item hover */\n--app-selected:#f3e4dd;        /* selected row, active nav item */\n--app-selected-strong:#ead5cb; /* multi-select, drag target */\n--app-scrim:rgba(20,20,19,0.35);\n\n/* Chrome */\n--app-topbar-bg:#faf9f5;\n--app-sidebar-bg:#f5f0e8;\n--app-code-bg:#181715;         /* code never inverts — always dark */\n\n/* Semantic aliases requested by the UI/UX master prompt */\n--background-default:var(--app-canvas);\n--background-subtle:var(--app-sunken);\n--background-elevated:var(--app-raised);\n--foreground-default:var(--color-ink);\n--foreground-muted:var(--color-body);\n--foreground-subtle:var(--color-muted);\n--foreground-disabled:var(--color-muted-soft);\n--border-strong:#d6cdc0;\n--action-destructive:var(--color-error);\n--action-destructive-fg:#ffffff;\n--status-info:var(--color-accent-teal);\n\n/* Status surfaces — 10% tints of each status colour on the light floor */\n--status-success-bg:#e6f2e6;\n--status-warning-bg:#f7efd9;\n--status-error-bg:#f7e4e4;\n--status-info-bg:#e2f1ee;\n--status-success-fg:#2f6b3c;\n--status-warning-fg:#7a5c08;\n--status-error-fg:#8f2f2f;\n--status-info-fg:#2f6b60;\n\n/* Focus */\n--focus-ring-color:var(--color-primary);\n--focus-ring:0 0 0 3px rgba(204,120,92,0.28);\n\n/* Density — medium. Marketing controls stay 40px; app controls are 32px. */\n--control-h-sm:28px;\n--control-h-md:32px;\n--control-h-lg:40px;\n--control-pad-sm:0 10px;\n--control-pad-md:0 12px;\n--control-pad-lg:0 16px;\n\n/* App chrome metrics */\n--topbar-h:56px;\n--sidebar-w:248px;\n--sidebar-w-collapsed:56px;\n--context-panel-w:320px;\n--row-h:44px;\n--row-h-compact:36px;\n--app-gutter:24px;\n--app-gutter-tight:16px; rvice with packing\u003c/option>\n                \u003coption value=\"long\">Long-distance or interstate\u003c/option>\n                \u003coption value=\"office\">Office relocation\u003c/option>\n                \u003coption value=\"storage\">Move into storage\u003c/option>\n                \u003coption value=\"specialty\">Specialty item only\u003c/option>\n              \u003c/sc-raw-select>\n              \u003csc-if value=\"{{ eService }}\">\u003cp role=\"alert\" style=\"margin-top: 6px; font-size: 13px; color: var(--color-error);\">{{ eService }}\u003c/p>\u003c/sc-if>\n            \u003c/div>\n          \u003c/div>\n          \u003c/sc-if>\n\n          \u003csc-if value=\"{{ showGroup2 }}\">\n          \u003cdiv style=\"display: grid; gap: 16px; margin-top: {{ gapTop2 }};\">\n            \u003cdiv>\n              \u003clabel for=\"q-name\" style=\"display: block; font-size: 13px; font-weight: 500; color: var(--color-body-strong); margin-bottom: 6px;\">Name\u003c/label>\n              \u003cinput id=\"q-name\" name=\"name\" type=\"text\" sc-camel-auto-complete=\"name\" placeholder=\"First and last\" value=\"{{ vName }}\" sc-camel-on-change=\"{{ onName }}\" aria-invalid=\"{{ badName }}\" style=\"width: 100%; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--color-hairline); background: var(--color-canvas); color: var(--color-ink); font-size: 15px; outline: none;\" style-focus=\"border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(204,120,92,0.15);\">\n              \u003csc-if value=\"{{ eName }}\">\u003cp role=\"alert\" style=\"margin-top: 6px; font-size: 13px; color: var(--color-error);\">{{ eName }}\u003c/p>\u003c/sc-if>\n            \u003c/div>\n            \u003cdiv>\n              \u003clabel for=\"q-email\" style=\"display: block; font-size: 13px; font-weight: 500; color: var(--color-body-strong); margin-bottom: 6px;\">Email\u003c/label>\n              \u003cinput id=\"q-email\" name=\"email\" type=\"email\" sc-camel-input-mode=\"email\" sc-camel-auto-complete=\"email\" placeholder=\"you@example.com\" value=\"{{ vEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" aria-invalid=\"{{ badEmail }}\" style=\"width: 100%; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--color-hairline); background: var(--color-canvas); color: var(--color-ink); font-size: 15px; outline: none;\" style-focus=\"border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(204,120,92,0.15);\">\n              \u003csc-if value=\"{{ eEmail }}\">\u003cp role=\"alert\" style=\"margin-top: 6px; font-size: 13px; color: var(--color-error);\">{{ eEmail }}\u003c/p>\u003c/sc-if>\n            \u003c/div>\n            \u003cdiv>\n              \u003clabel for=\"q-phone\" style=\"display: block; font-size: 13px; font-weight: 500; color: var(--color-body-strong); margin-bottom: 6px;\">Phone\u003c/label>\n              \u003cinput id=\"q-phone\" name=\"phone\" type=\"tel\" sc-camel-input-mode=\"tel\" sc-camel-auto-complete=\"tel\" placeholder=\"(555) 000-0000\" value=\"{{ vPhone }}\" sc-camel-on-change=\"{{ onPhone }}\" aria-invalid=\"{{ badPhone }}\" style=\"width: 100%; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--color-hairline); background: var(--color-canvas); color: var(--color-ink); font-size: 15px; outline: none;\" style-focus=\"border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(204,120,92,0.15);\">\n              \u003csc-if value=\"{{ ePhone }}\">\u003cp role=\"alert\" style=\"margin-top: 6px; font-size: 13px; color: var(--color-error);\">{{ ePhone }}\u003c/p>\u003c/sc-if>\n            \u003c/div>\n          \u003c/div>\n          \u003c/sc-if>\n\n          \u003cdiv style=\"margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;\">\n            \u003csc-if value=\"{{ showBack }}\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ onBack }}\" style=\"height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--color-hairline); background: transparent; color: var(--color-ink); font-size: 14px; font-weight: 500; cursor: pointer;\" style-hover=\"background: var(--color-surface-cream-strong);\">Back\u003c/button>\u003c/sc-if>\n            \u003csc-if value=\"{{ showNext }}\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ onNext }}\" style=\"height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: var(--color-primary); color: var(--color-on-primary); font-size: 14px; font-weight: 500; cursor: pointer; flex: 1; min-width: 160px;\" style-hover=\"background: var(--color-primary-active);\">Continue\u003c/button>\u003c/sc-if>\n            \u003csc-if value=\"{{ showSubmit }}\">\u003cbutton type=\"submit\" disabled=\"{{ loading }}\" style=\"height: 44px; padding: 0 22px; border-radius: 8px; border: none; background: {{ submitBg }}; color: var(--color-on-primary); font-size: 14px; font-weight: 500; cursor: {{ submitCursor }}; flex: 1; min-width: 180px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;\" style-hover=\"background: var(--color-primary-active);\">\u003csc-if value=\"{{ loading }}\">\u003cspan aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #ffffff; animation: spin 0.7s linear infinite;\">\u003c/span>\u003c/sc-if>{{ submitLabel }}\u003c/button>\u003c/sc-if>\n          \u003c/div>\n          \u003cp style=\"margin-top: 14px; font-size: 13px; line-height: 1.5; color: var(--color-muted);\">We use these details to price the move and nothing else. Demonstration form — nothing is sent.\u003c/p>\n        \u003c/form>\n        \u003c/sc-if>\n\n        \u003csc-if value=\"{{ isSuccess }}\">\n        \u003cdiv role=\"status\" style=\"animation: settleIn 0.5s cubic-bezier(0.22,0.61,0.36,1) both;\">\n          \u003cspan style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary);\">\u003cspan aria-hidden=\"true\" style=\"width: 6px; height: 6px; border-radius: 999px; background: var(--color-accent-teal);\">\u003c/span>Request received\u003c/span>\n          \u003ch3 style=\"margin-top: 16px; font-family: var(--font-serif-display); font-weight: 400; font-size: 32px; line-height: 1.12; letter-spacing: -0.5px; color: var(--color-ink);\">Thank you, {{ firstName }}. Your estimate is with a coordinator.\u003c/h3>\n          \u003cp style=\"margin-top: 16px; font-size: 15px; line-height: 1.6; color: var(--color-body);\">We have your move from {{ vFrom }} to {{ vTo }}. Expect a written range by email today, and a call if we need to see the place first.\u003c/p>\n          \u003cdl style=\"margin: 24px 0 0; display: grid; gap: 12px; border-top: 1px solid var(--color-surface-cream-strong); padding-top: 20px;\">\n            \u003cdiv style=\"display: flex; justify-content: space-between; gap: 16px; font-size: 14px;\">\u003cdt style=\"color: var(--color-muted);\">Reference\u003c/dt>\u003cdd style=\"margin: 0; font-family: var(--font-mono); color: var(--color-ink);\">{{ refCode }}\u003c/dd>\u003c/div>\n            \u003cdiv style=\"display: flex; justify-content: space-between; gap: 16px; font-size: 14px;\">\u003cdt style=\"color: var(--color-muted);\">Target date\u003c/dt>\u003cdd style=\"margin: 0; color: var(--color-ink);\">{{ vDate }}\u003c/dd>\u003c/div>\n            \u003cdiv style=\"display: flex; justify-content: space-between; gap: 16px; font-size: 14px;\">\u003cdt style=\"color: var(--color-muted);\">Reply by\u003c/dt>\u003cdd style=\"margin: 0; color: var(--color-ink);\">End of today\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003cdiv style=\"margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px;\">\n            \u003ca href=\"tel:+15550142200\" style=\"height: 44px; padding: 0 20px; border-radius: 8px; background: var(--color-primary); color: var(--color-on-primary); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center;\" style-hover=\"background: var(--color-primary-active); text-decoration: none;\">Call {{ phone }}\u003c/a>\n            \u003cbutton type=\"button\" sc-camel-on-click=\"{{ onReset }}\" style=\"height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--color-hairline); background: transparent; color: var(--color-ink); font-size: 14px; font-weight: 500; cursor: pointer;\" style-hover=\"background: var(--color-surface-cream-strong);\">Start another estimate\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003c/sc-if>\n\n        \u003csc-if value=\"{{ isError }}\">\n        \u003cdiv role=\"alert\" style=\"animation: settleIn 0.5s cubic-bezier(0.22,0.61,0.36,1) both;\">\n          \u003cspan style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-error);\">\u003cspan aria-hidden=\"true\" style=\"width: 6px; height: 6px; border-radius: 999px; background: var(--color-error);\">\u003c/span>Could not send\u003c/span>\n          \u003ch3 style=\"margin-top: 16px; font-family: var(--font-serif-display); font-weight: 400; font-size: 30px; line-height: 1.12; letter-spacing: -0.5px; color: var(--color-ink);\">That request did not reach us.\u003c/h3>\n          \u003cp style=\"margin-top: 16px; font-size: 15px; line-height: 1.6; color: var(--color-body);\">Your details are still here. Try again, or call the office and we will take it down over the phone.\u003c/p>\n          \u003cdiv style=\"margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px;\">\n            \u003cbutton type=\"button\" sc-camel-on-click=\"{{ onRetry }}\" style=\"height: 44px; padding: 0 20px; border-radius: 8px; border: none; background: var(--color-primary); color: var(--color-on-primary); font-size: 14px; font-weight: 500; cursor: pointer;\" style-hover=\"background: var(--color-primary-active);\">Try again\u003c/button>\n            \u003ca href=\"tel:+15550142200\" style=\"height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--color-hairline); color: var(--color-ink); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center;\" style-hover=\"background: var(--color-surface-cream-strong); text-decoration: none;\">Call {{ phone }}\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \u003c/sc-if>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection aria-labelledby=\"numbers-title\" style=\"background: var(--color-surface-dark); color: var(--color-on-dark); padding: clamp(56px, 8vw, 88px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 48px;\">\n        \u003ch2 id=\"numbers-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -1px; color: var(--color-on-dark); max-width: 22ch; text-wrap: balance;\">Sixteen years of moves, counted honestly.\u003c/h2>\n        \u003cp style=\"font-size: 15px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 40ch; text-wrap: pretty;\">Figures below cover January 2009 through August 2026 and are illustrative for this demonstration site.\u003c/p>\n      \u003c/div>\n      \u003cdl style=\"margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: rgba(250,249,245,0.1);\">\n        \u003cdiv style=\"background: var(--color-surface-dark); padding: 28px 24px;\">\n          \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(42px, 4.6vw, 60px); line-height: 1; letter-spacing: -1.4px; color: var(--color-on-dark);\">\u003cspan data-count=\"11400\">11,400\u003c/span>\u003c/dd>\n          \u003cdt style=\"margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--color-on-dark-soft);\">Homes and offices moved\u003c/dt>\n        \u003c/div>\n        \u003cdiv style=\"background: var(--color-surface-dark); padding: 28px 24px;\">\n          \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(42px, 4.6vw, 60px); line-height: 1; letter-spacing: -1.4px; color: var(--color-on-dark);\">\u003cspan data-count=\"98.6\" data-decimals=\"1\" data-suffix=\"%\">98.6%\u003c/span>\u003c/dd>\n          \u003cdt style=\"margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--color-on-dark-soft);\">Delivered with no damage claim\u003c/dt>\n        \u003c/div>\n        \u003cdiv style=\"background: var(--color-surface-dark); padding: 28px 24px;\">\n          \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(42px, 4.6vw, 60px); line-height: 1; letter-spacing: -1.4px; color: var(--color-on-dark);\">\u003cspan data-count=\"42\">42\u003c/span>\u003c/dd>\n          \u003cdt style=\"margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--color-on-dark-soft);\">People on the payroll, no day labour\u003c/dt>\n        \u003c/div>\n        \u003cdiv style=\"background: var(--color-surface-dark); padding: 28px 24px;\">\n          \u003cdd style=\"margin: 0; font-family: var(--font-serif-display); font-size: clamp(42px, 4.6vw, 60px); line-height: 1; letter-spacing: -1.4px; color: var(--color-on-dark);\">\u003cspan data-count=\"9\" data-suffix=\" hrs\">9 hrs\u003c/span>\u003c/dd>\n          \u003cdt style=\"margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--color-on-dark-soft);\">Median door-to-door local move\u003c/dt>\n        \u003c/div>\n      \u003c/dl>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"story\" aria-labelledby=\"story-title\" style=\"background: var(--color-canvas); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px); display: grid; gap: clamp(32px, 5vw, 64px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: center;\">\n      \u003cdiv style=\"display: grid; gap: 16px; grid-template-columns: 1.3fr 1fr; align-items: end; animation: riseIn 0.8s cubic-bezier(0.22,0.61,0.36,1) both; animation-timeline: view(); animation-range: entry 0% cover 25%;\">\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card);\">\n          \u003cimg src=\"harbor-and-pine-moving/e57663888d30.webp\" srcset=\"harbor-and-pine-moving/0c7783c80f0b.webp 600w, harbor-and-pine-moving/e57663888d30.webp 1000w\" sizes=\"(max-width: 900px) 60vw, 30vw\" width=\"1000\" height=\"1250\" alt=\"A member of the moving crew standing at the open tailgate of a yellow and white moving truck\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 4 / 5; object-fit: cover;\">\n        \u003c/figure>\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card);\">\n          \u003cimg src=\"harbor-and-pine-moving/e61101d8e2b7.webp\" width=\"800\" height=\"800\" alt=\"A white box truck parked outside the company depot on a bright morning\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 1 / 1; object-fit: cover;\">\n        \u003c/figure>\n      \u003c/div>\n      \u003cdiv>\n        \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 18px;\">Our crew\u003c/p>\n        \u003ch2 id=\"story-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(32px, 4vw, 48px); line-height: 1.08; letter-spacing: -1px; color: var(--color-ink); text-wrap: balance;\">We started with one truck and a list of neighbours.\u003c/h2>\n        \u003cp style=\"margin-top: 20px; font-size: 16px; line-height: 1.65; color: var(--color-body); max-width: 50ch; text-wrap: pretty;\">In 2009 Marisol Vega bought a used 24-footer, parked it behind her father's boatyard in Bellhaven, and moved eleven families that first summer. The boatyard is now our warehouse. Most of the crew grew up within twenty miles of it.\u003c/p>\n        \u003cp style=\"margin-top: 16px; font-size: 16px; line-height: 1.65; color: var(--color-body); max-width: 50ch; text-wrap: pretty;\">We stayed small on purpose. Every move gets a named coordinator and a lead mover who walks the house with you before anything is lifted. Nothing is subcontracted out.\u003c/p>\n        \u003cfigure style=\"margin-top: 32px; border-left: 1px solid var(--color-hairline); padding-left: 20px;\">\n          \u003cblockquote style=\"font-family: var(--font-serif-display); font-size: 24px; line-height: 1.35; letter-spacing: -0.3px; color: var(--color-ink); text-wrap: pretty;\">\"People are handing us the things they cannot replace. That is the whole job, and it is why we still walk every house ourselves.\"\u003c/blockquote>\n          \u003cfigcaption style=\"margin-top: 14px; font-size: 14px; color: var(--color-muted);\">Marisol Vega — founder, Harbor &amp; Pine\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"services\" aria-labelledby=\"services-title\" style=\"background: var(--color-surface-soft); border-top: 1px solid var(--color-hairline); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: clamp(32px, 4vw, 56px);\">\n        \u003cdiv>\n          \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 18px;\">Services\u003c/p>\n          \u003ch2 id=\"services-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(32px, 4vw, 48px); line-height: 1.08; letter-spacing: -1px; color: var(--color-ink); max-width: 24ch; text-wrap: balance;\">Everything a move needs, under one roof.\u003c/h2>\n        \u003c/div>\n        \u003cp style=\"font-size: 15px; line-height: 1.6; color: var(--color-body); max-width: 38ch; text-wrap: pretty;\">Take the whole job or just the heavy part. Most customers start with a local move and add packing once they see the box count.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv style=\"display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); animation: riseIn 0.8s cubic-bezier(0.22,0.61,0.36,1) both; animation-timeline: view(); animation-range: entry 0% cover 20%;\">\n        \u003carticle style=\"background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;\" style-hover=\"border-color: var(--color-surface-cream-strong);\">\n          \u003cimg src=\"harbor-and-pine-moving/f96b689a0da2.webp\" srcset=\"harbor-and-pine-moving/a5d7b1839f0a.webp 700w, harbor-and-pine-moving/f96b689a0da2.webp 1100w\" sizes=\"(max-width: 760px) 100vw, 48vw\" width=\"1100\" height=\"700\" alt=\"A couple carrying labelled moving boxes through the front door of their new home\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 16 / 10; object-fit: cover;\">\n          \u003cdiv style=\"padding: 32px;\">\n            \u003ch3 style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: 28px; letter-spacing: -0.3px; color: var(--color-ink);\">Residential moving\u003c/h3>\n            \u003cp style=\"margin-top: 12px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Houses, apartments and condos across the coast. Floors and doorframes are protected before the first item leaves the room, and beds go back together the same day.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n        \u003carticle style=\"background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;\" style-hover=\"border-color: var(--color-surface-cream-strong);\">\n          \u003cimg src=\"harbor-and-pine-moving/8086d858fe61.webp\" srcset=\"harbor-and-pine-moving/8667e365d0e7.webp 700w, harbor-and-pine-moving/8086d858fe61.webp 1100w\" sizes=\"(max-width: 760px) 100vw, 48vw\" width=\"1100\" height=\"700\" alt=\"Movers securing a large appliance inside the back of a loaded moving truck\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 16 / 10; object-fit: cover;\">\n          \u003cdiv style=\"padding: 32px;\">\n            \u003ch3 style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: 28px; letter-spacing: -0.3px; color: var(--color-ink);\">Office and commercial relocation\u003c/h3>\n            \u003cp style=\"margin-top: 12px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Practices, studios and small offices moved over a weekend. Workstations are labelled by desk so Monday morning looks like Friday afternoon.\u003c/p>\n          \u003c/div>\n        \u003c/article>\n      \u003c/div>\n\n      \u003cdiv style=\"margin-top: 20px; display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));\">\n        \u003carticle style=\"background: var(--color-surface-card); border-radius: 12px; padding: 32px;\" style-hover=\"background: var(--color-surface-cream-strong);\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"route\" size=\"22\" hint-size=\"22px,22px\">\u003c/x-import>\n          \u003ch3 style=\"margin-top: 20px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">Long-distance and interstate\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Direct runs down the eastern corridor with one crew loading and unloading. You get the driver's number, not a dispatch queue.\u003c/p>\n        \u003c/article>\n        \u003carticle style=\"background: var(--color-surface-card); border-radius: 12px; padding: 32px;\" style-hover=\"background: var(--color-surface-cream-strong);\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"package\" size=\"22\" hint-size=\"22px,22px\">\u003c/x-import>\n          \u003ch3 style=\"margin-top: 20px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">Packing and materials\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Full pack, kitchen-and-fragiles only, or boxes dropped off two weeks early. Paper, cartons and tape are included in the quoted price.\u003c/p>\n        \u003c/article>\n        \u003carticle style=\"background: var(--color-surface-card); border-radius: 12px; padding: 32px;\" style-hover=\"background: var(--color-surface-cream-strong);\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"warehouse\" size=\"22\" hint-size=\"22px,22px\">\u003c/x-import>\n          \u003ch3 style=\"margin-top: 20px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">Storage and staging\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Climate-controlled space at the Bellhaven warehouse for closing-date gaps, renovations and homes being staged for sale.\u003c/p>\n        \u003c/article>\n        \u003carticle style=\"background: var(--color-surface-card); border-radius: 12px; padding: 32px;\" style-hover=\"background: var(--color-surface-cream-strong);\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"piano\" size=\"22\" hint-size=\"22px,22px\">\u003c/x-import>\n          \u003ch3 style=\"margin-top: 20px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">Specialty and fragile items\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Uprights and baby grands, marble tops, framed art, safes and lab equipment. Custom crating built in-house when an item warrants it.\u003c/p>\n        \u003c/article>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection aria-labelledby=\"standards-title\" style=\"background: var(--color-canvas); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n      \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 18px;\">Why people book us\u003c/p>\n      \u003ch2 id=\"standards-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(32px, 4vw, 48px); line-height: 1.08; letter-spacing: -1px; color: var(--color-ink); max-width: 26ch; text-wrap: balance;\">Four standards we do not move on.\u003c/h2>\n      \u003col style=\"margin-top: clamp(32px, 4vw, 56px); display: grid; gap: 1px; background: var(--color-hairline); border-top: 1px solid var(--color-hairline); border-bottom: 1px solid var(--color-hairline); grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));\">\n        \u003cli style=\"background: var(--color-canvas); padding: 32px 28px 32px 0;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 40px; line-height: 1; color: var(--color-primary);\">01\u003c/span>\n          \u003ch3 style=\"margin-top: 18px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">The estimate holds\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Written, itemised, and binding unless you add to the inventory. No fuel surcharge invented on the tailgate.\u003c/p>\n        \u003c/li>\n        \u003cli style=\"background: var(--color-canvas); padding: 32px 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 40px; line-height: 1; color: var(--color-primary);\">02\u003c/span>\n          \u003ch3 style=\"margin-top: 18px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">Wrapped before it moves\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Pads and stretch wrap on every piece of furniture, corner guards on banisters, runners down on hardwood and stairs.\u003c/p>\n        \u003c/li>\n        \u003cli style=\"background: var(--color-canvas); padding: 32px 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 40px; line-height: 1; color: var(--color-primary);\">03\u003c/span>\n          \u003ch3 style=\"margin-top: 18px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">Trained crews only\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Everyone on your job is on our payroll, background-checked, and has run at least forty moves with a lead before working unsupervised.\u003c/p>\n        \u003c/li>\n        \u003cli style=\"background: var(--color-canvas); padding: 32px 0 32px 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 40px; line-height: 1; color: var(--color-primary);\">04\u003c/span>\n          \u003ch3 style=\"margin-top: 18px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-ink);\">One person to call\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--color-body); text-wrap: pretty;\">Your coordinator is named on the estimate and answers through moving day. No ticket numbers, no call centre.\u003c/p>\n        \u003c/li>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"process\" aria-labelledby=\"process-title\" style=\"background: var(--color-surface-dark); color: var(--color-on-dark); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: clamp(32px, 4vw, 56px);\">\n        \u003cdiv>\n          \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 18px;\">How it works\u003c/p>\n          \u003ch2 id=\"process-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(32px, 4vw, 48px); line-height: 1.08; letter-spacing: -1px; color: var(--color-on-dark); max-width: 24ch; text-wrap: balance;\">Four steps from first call to last box.\u003c/h2>\n        \u003c/div>\n        \u003cp style=\"font-size: 15px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 36ch; text-wrap: pretty;\">Most local moves run on a single day. Long-distance jobs add a transit window you agree to in advance.\u003c/p>\n      \u003c/div>\n      \u003col style=\"display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));\">\n        \u003cli style=\"background: var(--color-surface-dark-elevated); border-radius: 12px; padding: 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 36px; line-height: 1; color: var(--color-primary);\">01\u003c/span>\n          \u003ch3 style=\"margin-top: 16px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-on-dark);\">Walkthrough and estimate\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 14px; line-height: 1.6; color: var(--color-on-dark-soft); text-wrap: pretty;\">On site or over video. We count rooms, stairs, access and parking, then send a written range the same day.\u003c/p>\n        \u003c/li>\n        \u003cli style=\"background: var(--color-surface-dark-elevated); border-radius: 12px; padding: 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 36px; line-height: 1; color: var(--color-primary);\">02\u003c/span>\n          \u003ch3 style=\"margin-top: 16px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-on-dark);\">Pack and protect\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 14px; line-height: 1.6; color: var(--color-on-dark-soft); text-wrap: pretty;\">Boxes arrive early if you are packing yourself. If we are packing, fragiles and the kitchen go first, a day ahead.\u003c/p>\n        \u003c/li>\n        \u003cli style=\"background: var(--color-surface-dark-elevated); border-radius: 12px; padding: 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 36px; line-height: 1; color: var(--color-primary);\">03\u003c/span>\n          \u003ch3 style=\"margin-top: 16px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-on-dark);\">Load and transport\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 14px; line-height: 1.6; color: var(--color-on-dark-soft); text-wrap: pretty;\">Inventory checked at the door, truck loaded and strapped by tier. You have the lead mover's number for the whole run.\u003c/p>\n        \u003c/li>\n        \u003cli style=\"background: var(--color-surface-dark-elevated); border-radius: 12px; padding: 28px;\">\n          \u003cspan style=\"font-family: var(--font-serif-display); font-size: 36px; line-height: 1; color: var(--color-primary);\">04\u003c/span>\n          \u003ch3 style=\"margin-top: 16px; font-family: var(--font-sans); font-size: 18px; font-weight: 500; color: var(--color-on-dark);\">Place and check\u003c/h3>\n          \u003cp style=\"margin-top: 10px; font-size: 14px; line-height: 1.6; color: var(--color-on-dark-soft); text-wrap: pretty;\">Furniture set where you want it, beds rebuilt, cartons stacked by room. We walk the inventory with you before we leave.\u003c/p>\n        \u003c/li>\n      \u003c/ol>\n      \u003cdiv style=\"margin-top: clamp(32px, 4vw, 48px); display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: center; background: var(--color-surface-dark-soft); border-radius: 12px; overflow: hidden;\">\n        \u003cdiv style=\"padding: clamp(28px, 3vw, 40px);\">\n          \u003ch3 style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15; letter-spacing: -0.5px; color: var(--color-on-dark); text-wrap: balance;\">Specialised logistics, when the move is not ordinary.\u003c/h3>\n          \u003cp style=\"margin-top: 14px; font-size: 15px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 46ch; text-wrap: pretty;\">Island ferries, harbour-front buildings with no loading dock, third-floor walk-ups in Lantern Bay, and a marble console that needs four people and a stair-climbing dolly. We plan those before the date, not on the day.\u003c/p>\n          \u003cul style=\"margin-top: 22px; display: grid; gap: 10px;\">\n            \u003cli style=\"font-size: 14px; color: var(--color-on-dark); display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: var(--color-primary);\">—\u003c/span>Crane and hoist coordination for narrow stairwells\u003c/li>\n            \u003cli style=\"font-size: 14px; color: var(--color-on-dark); display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: var(--color-primary);\">—\u003c/span>Custom crating for art, glass and instruments\u003c/li>\n            \u003cli style=\"font-size: 14px; color: var(--color-on-dark); display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: var(--color-primary);\">—\u003c/span>Ferry scheduling to the outer islands\u003c/li>\n            \u003cli style=\"font-size: 14px; color: var(--color-on-dark); display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: var(--color-primary);\">—\u003c/span>Certificates of insurance filed with building management\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cfigure style=\"height: 100%;\">\n          \u003cimg src=\"harbor-and-pine-moving/c4315eb30083.webp\" srcset=\"harbor-and-pine-moving/69c35d0c5b24.webp 700w, harbor-and-pine-moving/c4315eb30083.webp 1200w\" sizes=\"(max-width: 900px) 100vw, 45vw\" width=\"1200\" height=\"800\" alt=\"A moving truck crossing a long coastal bridge at dusk on a long-distance run\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; height: 100%; min-height: 260px; object-fit: cover;\">\n        \u003c/figure>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection aria-labelledby=\"gallery-title\" style=\"background: var(--color-canvas); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: clamp(28px, 3vw, 40px);\">\n        \u003ch2 id=\"gallery-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; letter-spacing: -1px; color: var(--color-ink); max-width: 22ch; text-wrap: balance;\">A week on the coast.\u003c/h2>\n        \u003cp style=\"font-size: 15px; line-height: 1.6; color: var(--color-body); max-width: 36ch; text-wrap: pretty;\">Photographs from working days — loading, packing, and the quiet part where everything is finally in the right room.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); animation: riseIn 0.8s cubic-bezier(0.22,0.61,0.36,1) both; animation-timeline: view(); animation-range: entry 0% cover 20%;\">\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card); grid-column: span 2; min-width: 0;\">\n          \u003cimg src=\"harbor-and-pine-moving/30e5cf1cbf00.webp\" srcset=\"harbor-and-pine-moving/84e959461a7a.webp 800w, harbor-and-pine-moving/30e5cf1cbf00.webp 1300w\" sizes=\"(max-width: 760px) 100vw, 60vw\" width=\"1300\" height=\"866\" alt=\"The rear doors of a moving van standing open beside a kerb, ramp down and ready to load\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 3 / 2; object-fit: cover;\">\n        \u003c/figure>\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card); min-width: 0;\">\n          \u003cimg src=\"harbor-and-pine-moving/5bc6fb799c28.webp\" width=\"800\" height=\"1000\" alt=\"Kitchen items wrapped in paper on a table beside flat-packed cartons during a packing day\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 4 / 5; object-fit: cover;\">\n        \u003c/figure>\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card); min-width: 0;\">\n          \u003cimg src=\"harbor-and-pine-moving/7aaa937448e6.webp\" width=\"800\" height=\"1000\" alt=\"Two people carrying a large carton and a houseplant into a new apartment\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 4 / 5; object-fit: cover;\">\n        \u003c/figure>\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card); min-width: 0;\">\n          \u003cimg src=\"harbor-and-pine-moving/915f2a2c8bab.webp\" width=\"800\" height=\"1000\" alt=\"A customer carrying a small labelled box out of an emptied room\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 4 / 5; object-fit: cover;\">\n        \u003c/figure>\n        \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card); grid-column: span 2; min-width: 0;\">\n          \u003cimg src=\"harbor-and-pine-moving/2290aed651bb.webp\" srcset=\"harbor-and-pine-moving/5a7a5a3a7b02.webp 800w, harbor-and-pine-moving/2290aed651bb.webp 1300w\" sizes=\"(max-width: 760px) 100vw, 60vw\" width=\"1300\" height=\"866\" alt=\"Labelled cartons staged on the driveway in loading order before going into the truck\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 3 / 2; object-fit: cover;\">\n        \u003c/figure>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"areas\" aria-labelledby=\"areas-title\" style=\"background: var(--color-surface-soft); border-top: 1px solid var(--color-hairline); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px); display: grid; gap: clamp(32px, 5vw, 56px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start;\">\n      \u003cdiv>\n        \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 18px;\">Service area\u003c/p>\n        \u003ch2 id=\"areas-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(32px, 4vw, 48px); line-height: 1.08; letter-spacing: -1px; color: var(--color-ink); max-width: 22ch; text-wrap: balance;\">Based in Bellhaven, working the whole coast.\u003c/h2>\n        \u003cp style=\"margin-top: 20px; font-size: 16px; line-height: 1.6; color: var(--color-body); max-width: 44ch; text-wrap: pretty;\">Local crews cover the towns below with no travel charge. Long-distance runs go south to Charleston and west to Columbus on a fixed transit window.\u003c/p>\n        \u003cul style=\"margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 24px;\">\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Bellhaven\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Lantern Bay\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Marrow Point\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Saltbrook\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Fern Cove\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Windward Hill\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Ashby Landing\u003c/li>\n          \u003cli style=\"font-size: 15px; color: var(--color-body-strong); border-bottom: 1px solid var(--color-hairline); padding: 10px 0;\">Cormorant Isle\u003c/li>\n        \u003c/ul>\n        \u003cp style=\"margin-top: 20px; font-size: 14px; color: var(--color-muted);\">Moving somewhere not on the list? Ask anyway — we quote most of the state.\u003c/p>\n      \u003c/div>\n      \u003cfigure style=\"border-radius: 12px; overflow: hidden; background: var(--color-surface-card);\">\n        \u003cimg src=\"harbor-and-pine-moving/d9322f9751f3.webp\" srcset=\"harbor-and-pine-moving/05a3f74d6dc3.webp 760w, harbor-and-pine-moving/a40dd16763cd.webp 1200w\" sizes=\"(max-width: 900px) 100vw, 45vw\" width=\"1200\" height=\"900\" alt=\"A moving truck on an open coastal road between towns on a clear afternoon\" loading=\"lazy\" decoding=\"async\" style=\"width: 100%; aspect-ratio: 4 / 3; object-fit: cover;\">\n        \u003cfigcaption style=\"padding: 20px 4px 0; font-size: 14px; color: var(--color-muted); text-wrap: pretty;\">Long-distance runs leave Bellhaven Tuesdays and Fridays. Transit is two to four days depending on the corridor.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"reviews\" aria-labelledby=\"reviews-title\" style=\"background: var(--color-canvas); padding: clamp(56px, 9vw, 96px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: clamp(32px, 4vw, 48px);\">\n        \u003cdiv>\n          \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 18px;\">Reviews\u003c/p>\n          \u003ch2 id=\"reviews-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(32px, 4vw, 48px); line-height: 1.08; letter-spacing: -1px; color: var(--color-ink); max-width: 20ch; text-wrap: balance;\">What customers say afterwards.\u003c/h2>\n        \u003c/div>\n        \u003cp style=\"font-size: 15px; line-height: 1.6; color: var(--color-body); max-width: 32ch; text-wrap: pretty;\">4.9 average across 612 reviews. Sample testimonials written for this demonstration site.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));\">\n        \u003cfigure style=\"background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px;\">\n          \u003cblockquote style=\"font-size: 16px; line-height: 1.65; color: var(--color-body-strong); text-wrap: pretty;\">\"They wrapped a hundred-year-old dresser like it was going to a museum. The quote I got in March was the number I paid in June, and the lead mover texted me when they were ten minutes out.\"\u003c/blockquote>\n          \u003cfigcaption style=\"margin-top: auto; font-size: 14px; color: var(--color-muted);\">\u003cspan style=\"display: block; font-weight: 500; color: var(--color-ink);\">Dana Okonkwo\u003c/span>Three-bedroom house, Fern Cove to Bellhaven\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px;\">\n          \u003cblockquote style=\"font-size: 16px; line-height: 1.65; color: var(--color-body-strong); text-wrap: pretty;\">\"We moved the clinic over a weekend and opened Monday at eight. Everything was labelled by room, the server rack was crated properly, and nothing needed rescheduling.\"\u003c/blockquote>\n          \u003cfigcaption style=\"margin-top: auto; font-size: 14px; color: var(--color-muted);\">\u003cspan style=\"display: block; font-weight: 500; color: var(--color-ink);\">Dr. Priya Raman\u003c/span>Dental practice relocation, Lantern Bay\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure style=\"background: var(--color-canvas); border: 1px solid var(--color-hairline); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px;\">\n          \u003cblockquote style=\"font-size: 16px; line-height: 1.65; color: var(--color-body-strong); text-wrap: pretty;\">\"Third-floor walk-up, no lift, August heat. They finished under the estimate and put the bed back together without being asked. I have already given their number to two neighbours.\"\u003c/blockquote>\n          \u003cfigcaption style=\"margin-top: auto; font-size: 14px; color: var(--color-muted);\">\u003cspan style=\"display: block; font-weight: 500; color: var(--color-ink);\">Marcus Feld\u003c/span>One-bedroom apartment, Marrow Point\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection aria-labelledby=\"cta-title\" style=\"background: var(--color-primary); color: var(--color-on-primary); padding: clamp(56px, 8vw, 88px) 0;\">\n    \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px); display: grid; gap: clamp(28px, 4vw, 48px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: center;\">\n      \u003cdiv>\n        \u003ch2 id=\"cta-title\" style=\"font-family: var(--font-serif-display); font-weight: 400; font-size: clamp(34px, 4.2vw, 52px); line-height: 1.06; letter-spacing: -1.2px; color: var(--color-on-primary); text-wrap: balance;\">Tell us where you are going.\u003c/h2>\n        \u003cp style=\"margin-top: 18px; font-size: 17px; line-height: 1.6; color: var(--color-on-primary); max-width: 42ch; text-wrap: pretty;\">A written estimate today, a date held without a deposit, and the same crew on the other end of it.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-start;\">\n        \u003cbutton type=\"button\" sc-camel-on-click=\"{{ goQuote }}\" style=\"height: 52px; padding: 0 26px; border-radius: 8px; border: none; background: var(--color-canvas); color: var(--color-ink); font-size: 15px; font-weight: 500; cursor: pointer;\" style-hover=\"background: #ffffff;\">Get a free quote\u003c/button>\n        \u003ca href=\"tel:+15550142200\" style=\"height: 52px; padding: 0 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.55); color: var(--color-on-primary); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px;\" style-hover=\"background: var(--color-primary-active); border-color: var(--color-primary-active); text-decoration: none;\">Call {{ phone }}\u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cfooter style=\"background: var(--color-surface-dark); color: var(--color-on-dark); padding: clamp(48px, 7vw, 80px) 0 40px;\">\n  \u003cdiv style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 24px);\">\n    \u003cdiv style=\"display: grid; gap: 40px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); padding-bottom: 40px; border-bottom: 1px solid rgba(250,249,245,0.1);\">\n      \u003cdiv>\n        \u003cp style=\"font-family: var(--font-serif-display); font-size: 26px; letter-spacing: -0.4px; color: var(--color-on-dark);\">Harbor &amp; Pine\u003c/p>\n        \u003cp style=\"margin-top: 14px; font-size: 14px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 30ch; text-wrap: pretty;\">Family-run movers on {{ region }}. Residential, commercial and long-distance relocation since 2009.\u003c/p>\n      \u003c/div>\n      \u003cnav aria-label=\"Services\">\n        \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft); margin-bottom: 16px;\">Services\u003c/p>\n        \u003cul style=\"display: grid; gap: 10px;\">\n          \u003cli>\u003ca href=\"#services\" style=\"font-size: 14px; color: var(--color-on-dark);\" style-hover=\"color: var(--color-primary); text-decoration: none;\">Residential moving\u003c/a>\u003c/li>\n          \u003cli>\u003ca href=\"#services\" style=\"font-size: 14px; color: var(--co -primary); text-decoration: none;\">Get a free quote\u003c/a>\u003c/li>\n        \u003c/ul>\n      \u003c/nav>\n      \u003cdiv>\n        \u003cp style=\"font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-on-dark-soft); margin-bottom: 16px;\">Contact\u003c/p>\n        \u003cul style=\"display: grid; gap: 10px;\">\n          \u003cli>\u003ca href=\"tel:+15550142200\" style=\"font-size: 14px; color: var(--color-on-dark);\" style-hover=\"color: var(--color-primary); text-decoration: none;\">{{ phone }}\u003c/a>\u003c/li>\n          \u003cli>\u003ca href=\"mailto:hello@harborandpine.example\" style=\"font-size: 14px; color: var(--color-on-dark);\" style-hover=\"color: var(--color-primary); text-decoration: none;\">hello@harborandpine.example\u003c/a>\u003c/li>\n          \u003cli style=\"font-size: 14px; color: var(--color-on-dark-soft); line-height: 1.6;\">418 Cannery Row\u003cbr>Bellhaven, Tidewater 04581\u003c/li>\n          \u003cli style=\"font-size: 14px; color: var(--color-on-dark-soft); line-height: 1.6;\">Mon–Fri 7am–6pm\u003cbr>Sat 8am–2pm\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; align-items: flex-start;\">\n      \u003cp style=\"font-size: 13px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 60ch; text-wrap: pretty;\">Harbor &amp; Pine Moving Co. is a fictional company created for a portfolio design demonstration. Company details, licence claims, statistics, reviews and contact information are invented and should not be relied on.\u003c/p>\n      \u003cp style=\"font-size: 13px; line-height: 1.6; color: var(--color-on-dark-soft); max-width: 40ch; text-wrap: pretty;\">Photography via Unsplash: Handiwork NYC, Richard Stachmann, Vitaly Gariev, Théo Dorp, Michal Balog, Markus Spiske, Aleksi Partanen, Maxim Tolchinskiy, Tan Kaninthanond, Rodrigo Abreu, t;default&quot;: &quot;success&quot;, &quot;tsType&quot;: &quot;'success' | 'error'&quot;, &quot;section&quot;: &quot;Quote form&quot; },\n  &quot;phone&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;(555) 014-2200&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Company&quot; },\n  &quot;serviceRegion&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;the Tidewater coast&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Company&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    w: 1180,\n    menuOpen: false,\n    step: 0,\n    status: 'idle',\n    errors: {},\n    refCode: '',\n    f: { from: '', to: '', date: '', size: '', service: '', name: '', email: '', phone: '' }\n  };\n\n  rootRef = React.createRef();\n\n  componentDidMount() {\n    const root = this.rootRef.current;\n    if (!root) return;\n\n    if (typeof ResizeObserver !== 'undefined') {\n      this.ro = new ResizeObserver(entries => {\n        const w = entries[0].contentRect.width;\n        if (Math.abs(w - this.state.w) > 8) this.setState({ w, menuOpen: w >= 1040 ? false : this.state.menuOpen });\n      });\n      this.ro.observe(root);\n    } else if (typeof window !== 'undefined') {\n      this.setState({ w: window.innerWidth });\n    }\n\n    const reduce = typeof window !== 'undefined' && window.matchMedia\n      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce || typeof IntersectionObserver === 'undefined') return;\n\n    this.io = new IntersectionObserver((entries, obs) => {\n      entries.forEach(en => {\n        if (!en.isIntersecting) return;\n        obs.unobserve(en.target);\n        this.countUp(en.target);\n      });\n    }, { threshold: 0.5 });\n    root.querySelectorAll('[data-count]').forEach(el => this.io.observe(el));\n  }\n\n  componentWillUnmount() {\n    if (this.ro) this.ro.disconnect();\n    if (this.io) this.io.disconnect();\n    clearTimeout(this._t);\n  }\n\n  countUp(el) {\n    const target = parseFloat(el.getAttribute('data-count'));\n    if (!isFinite(target)) return;\n    const dec = parseInt(el.getAttribute('data-decimals') || '0', 10);\n    const suffix = el.getAttribute('data-suffix') || '';\n    const dur = 1500;\n    const t0 = performance.now();\n    const fmt = v => v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suffix;\n    el.textContent = fmt(0);\n    const tick = now => {\n      const p = Math.min(1, (now - t0) / dur);\n      el.textContent = fmt(target * (1 - Math.pow(1 - p, 3)));\n      if (p \u003c 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  field(name) {\n    this._h = this._h || {};\n    if (!this._h[name]) {\n      this._h[name] = e => {\n        const v = e.target.value;\n        this.setState(s => ({\n          f: Object.assign({}, s.f, { [name]: v }),\n          errors: Object.assign({}, s.errors, { [name]: null })\n        }));\n      };\n    }\n    return this._h[name];\n  }\n\n  validate(groups) {\n    const f = this.state.f;\n    const e = {};\n    if (groups.indexOf(0) > -1) {\n      if (!f.from.trim()) e.from = 'Tell us where the move starts.';\n      if (!f.to.trim()) e.to = 'Tell us where it is going.';\n      if (!f.date) e.date = 'Pick a target date — it can change later.';\n    }\n    if (groups.indexOf(1) > -1) {\n      if (!f.size) e.size = 'Choose the closest size.';\n      if (!f.service) e.service = 'Choose a service.';\n    }\n    if (groups.indexOf(2) > -1) {\n      if (!f.name.trim()) e.name = 'Add a name for the estimate.';\n      if (!/^[^@\\s]+@[^@\\s.]+\\.[^@\\s]+$/.test(f.email)) e.email = 'Add an email we can send the estimate to.';\n      if (f.phone.replace(/\\D/g, '').length \u003c 10) e.phone = 'Add a 10-digit phone number.';\n    }\n    return e;\n  }\n\n  next = () => {\n    const e = this.validate([this.state.step]);\n    if (Object.keys(e).length) { this.setState({ errors: e }); return; }\n    this.setState(s => ({ step: Math.min(2, s.step + 1), errors: {} }));\n  };\n\n  back = () => this.setState(s => ({ step: Math.max(0, s.step - 1), errors: {} }));\n\n  send = () => {\n    const single = (this.props.quoteFlow || 'stepped') === 'single';\n    const e = this.validate(single ? [0, 1, 2] : [2]);\n    if (Object.keys(e).length) { this.setState({ errors: e, status: 'idle' }); return; }\n    this.setState({ status: 'loading' });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => {\n      if ((this.props.demoQuoteResult || 'success') === 'error') { this.setState({ status: 'error' }); return; }\n      this.setState({ status: 'success', refCode: 'HP-' + Math.floor(1000 + Math.random() * 9000) });\n    }, 1200);\n  };\n\n  submit = e => { e.preventDefault(); this.send(); };\n\n  reset = () => this.setState({\n    status: 'idle', step: 0, errors: {}, refCode: '',\n    f: { from: '', to: '', date: '', size: '', service: '', name: '', email: '', phone: '' }\n  });\n\n  goQuote = () => {\n    const el = document.getElementById('quote');\n    if (!el) return;\n    this.setState({ menuOpen: false });\n    const top = el.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) - 76;\n    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });\n  };\n\n  renderVals() {\n    const s = this.state;\n    const p = this.props;\n    const f = s.f;\n    const er = s.errors;\n    const stepped = (p.quoteFlow || 'stepped') === 'stepped';\n    const narrow = s.w \u003c 1040;\n    const bar = i => (s.step >= i ? 'var(--color-primary)' : 'var(--color-surface-cream-strong)');\n    const loading = s.status === 'loading';\n\n    return {\n      rootRef: this.rootRef,\n      showBar: p.showAnnouncementBar !== false,\n      phone: p.phone || '(555) 014-2200',\n      region: p.serviceRegion || 'the Tidewater coast',\n      isWide: !narrow,\n      isNarrow: narrow,\n      menuOpen: s.menuOpen,\n      menuIcon: s.menuOpen ? 'x' : 'menu',\n      toggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      goQuote: this.goQuote,\n\n      stepped: stepped,\n      stepLabel: 'Step ' + (s.step + 1) + ' of 3',\n      bar0: bar(0), bar1: bar(1), bar2: bar(2),\n      formOpen: s.status === 'idle' || loading,\n      isSuccess: s.status === 'success',\n      isError: s.status === 'error',\n      loading: loading,\n      submitLabel: loading ? 'Sending your request' : 'Send my request',\n      submitBg: loading ? 'var(--color-primary-active)' : 'var(--color-primary)',\n      submitCursor: loading ? 'progress' : 'pointer',\n\n      showGroup0: !stepped || s.step === 0,\n      showGroup1: !stepped || s.step === 1,\n      showGroup2: !stepped || s.step === 2,\n      gapTop1: stepped ? '0px' : '16px',\n      gapTop2: stepped ? '0px' : '16px',\n      showBack: stepped && s.step > 0,\n      showNext: stepped && s.step \u003c 2,\n      showSubmit: !stepped || s.step === 2,\n\n      onSubmit: this.submit,\n      onNext: this.next,\n      onBack: this.back,\n      onReset: this.reset,\n      onRetry: this.send,\n\n      vFrom: f.from, vTo: f.to, vDate: f.date, vSize: f.size,\n      vService: f.service, vName: f.name, vEmail: f.email, vPhone: f.phone,\n      onFrom: this.field('from'), onTo: this.field('to'), onDate: this.field('date'),\n      onSize: this.field('size'), onService: this.field('service'),\n      onName: this.field('name'), onEmail: this.field('email'), onPhone: this.field('phone'),\n      eFrom: er.from, eTo: er.to, eDate: er.date, eSize: er.size,\n      eService: er.service, eName: er.name, eEmail: er.email, ePhone: er.phone,\n      badFrom: !!er.from, badTo: !!er.to, badDate: !!er.date, badSize: !!er.size,\n      badService: !!er.service, badName: !!er.name, badEmail: !!er.email, badPhone: !!er.phone,\n\n      firstName: (f.name.trim().split(/\\s+/)[0] || 'there'),\n      refCode: s.refCode\n    };\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"</script>
