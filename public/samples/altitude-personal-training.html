p>\n        \u003ch2 id=\"apply-title\" style=\"margin:14px 56px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(38px,4vw,52px);line-height:1;letter-spacing:-0.025em;color:#141413\">{{ applyTitle }}\u003c/h2>\n        \u003cp style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3d3d3a\">{{ applyIntro }}\u003c/p>\n        \u003cform sc-camel-on-submit=\"{{ submitApply }}\" style=\"display:grid;gap:22px;margin-top:28px\">\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextInput\" label=\"Name\" name=\"name\" required=\"{{ true }}\" sc-camel-auto-complete=\"name\" hint-size=\"100%,66px\">\u003c/x-import>\n          \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextInput\" label=\"Email\" name=\"email\" type=\"email\" required=\"{{ true }}\" sc-camel-auto-complete=\"email\" hint-size=\"100%,66px\">\u003c/x-import>\n          \u003cfieldset style=\"border:0;margin:0;padding:0;min-width:0\">\n            \u003clegend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:500;color:#141413\">Main goal\u003c/legend>\n            \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              \u003csc-for list=\"{{ goalOptions }}\" as=\"g\" hint-placeholder-count=\"7\">\n                \u003clabel style=\"display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid {{ g.border }};background:{{ g.bg }};font-size:14px;color:#141413;cursor:pointer\">\n                  \u003cinput type=\"radio\" name=\"goal\" value=\"{{ g.value }}\" checked=\"{{ g.checked }}\" sc-camel-on-change=\"{{ g.select }}\" style=\"margin:0;accent-color:#141413\">{{ g.value }}\n                \u003c/label>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/fieldset>\n          \u003cfieldset style=\"border:0;margin:0;padding:0;min-width:0\">\n            \u003clegend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:500;color:#141413\">Format\u003c/legend>\n            \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              \u003csc-for list=\"{{ formatOptions }}\" as=\"g\" hint-placeholder-count=\"4\">\n                \u003clabel style=\"display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid {{ g.border }};background:{{ g.bg }};font-size:14px;color:#141413;cursor:pointer\">\n                  \u003cinput type=\"radio\" name=\"format\" value=\"{{ g.value }}\" checked=\"{{ g.checked }}\" sc-camel-on-change=\"{{ g.select }}\" style=\"margin:0;accent-color:#141413\">{{ g.value }}\n                \u003c/label>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/fieldset>\n          \u003clabel style=\"display:grid;gap:8px;font-size:14px;font-weight:500;color:#141413\">Anything we should know?\n            \u003ctextarea name=\"notes\" rows=\"3\" placeholder=\"Injuries, schedule, equipment at home\" style=\"font:inherit;font-weight:400;font-size:15px;color:#141413;background:#faf9f5;border:1px solid #e6dfd8;border-radius:8px;padding:10px 12px;resize:vertical;min-height:88px;box-sizing:border-box;width:100%\" style-focus=\"outline:none;border-color:#cc785c;box-shadow:0 0 0 3px rgba(204,120,92,0.15)\">\u003c/textarea>\n          \u003c/label>\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px\">\n            \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"primary\" type=\"submit\" hint-size=\"160px,40px\">{{ submitLabel }}\u003c/x-import>\n            \u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Reply within two working days\u003c/span>\n          \u003c/div>\n        \u003c/form>\n      \u003c/sc-if>\n      \u003csc-if value=\"{{ submitted }}\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Received\u003c/p>\n        \u003ch2 id=\"apply-title\" style=\"margin:14px 56px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(38px,4vw,52px);line-height:1;letter-spacing:-0.025em;color:#141413\">Thank you, {{ applicantName }}.\u003c/h2>\n        \u003cp style=\"margin:14px 0 28px;font-size:15px;line-height:1.6;color:#3d3d3a\">We will email you within two working days to book your free consultation. Until then, the journal is a good place to start.\u003c/p>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ closeApply }}\" hint-size=\"90px,40px\">Close\u003c/x-import>\n      \u003c/sc-if>\n    \u003c/div>\n  \u003c/div>\n\u003c/sc-if>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { wide: true, vw: 1440, scrolled: false, menuOpen: false, stage: 0, program: 0, caseIdx: 0, faq: 0, applyOpen: false, mode: 'apply', submitted: false, applicantName: '', goal: 'Not sure yet', format: 'Not sure yet' };\n\n  componentDidMount() {\n    this._resize = () => { const vw = window.innerWidth; this.setState({ wide: vw >= 1080, vw }); };\n    this._scroll = () => { const s = window.scrollY > 8; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };\n    this._key = (e) => { if (e.key === 'Escape' && (this.state.applyOpen || this.state.menuOpen)) this.setState({ applyOpen: false, menuOpen: false }); };\n    window.addEventListener('resize', this._resize);\n    window.addEventListener('scroll', this._scroll, { passive: true });\n    window.addEventListener('keydown', this._key);\n    this._resize(); this._scroll();\n    this._reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    setTimeout(() => this.initMotion(), 60);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._resize);\n    window.removeEventListener('scroll', this._scroll);\n    window.removeEventListener('keydown', this._key);\n    if (this._io) this._io.disconnect();\n    document.body.style.overflow = '';\n  }\n  componentDidUpdate(pp, ps) {\n    const lock = this.state.applyOpen || this.state.menuOpen;\n    if (lock !== (ps.applyOpen || ps.menuOpen)) document.body.style.overflow = lock ? 'hidden' : '';\n    if (this.state.applyOpen && !ps.applyOpen) setTimeout(() => { const el = document.querySelector('#apply-dialog input'); if (el) el.focus(); }, 80);\n    if (this.state.wide && this.state.menuOpen) this.setState({ menuOpen: false });\n  }\n  initMotion() {\n    const hero = document.querySelector('[data-hero-img]');\n    if (hero) { if (this._reduce) hero.style.transition = 'none'; hero.style.transform = 'scale(1)'; }\n    if (this._reduce || !('IntersectionObserver' in window)) return;\n    const vh = window.innerHeight;\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (!en.isIntersecting) return;\n        const el = en.target; io.unobserve(el);\n        if (el.hasAttribute('data-count')) this.countUp(el);\n        else { el.style.opacity = '1'; el.style.transform = 'none'; }\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.01 });\n    document.querySelectorAll('[data-reveal]').forEach((el) => {\n      if (el.getBoundingClientRect().top \u003c vh * 0.92) return;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(32px)';\n      el.style.transition = 'opacity 900ms cubic-bezier(0.2,0,0,1), transform 900ms cubic-bezier(0.2,0,0,1)';\n      io.observe(el);\n    });\n    document.querySelectorAll('[data-count]').forEach((el) => {\n      if (el.getBoundingClientRect().top \u003c vh * 0.95) return;\n      el._final = el.textContent;\n      el.textContent = (el.getAttribute('data-prefix') || '') + '0' + (el.getAttribute('data-suffix') || '');\n      io.observe(el);\n    });\n    this._io = io;\n  }\n  countUp(el) {\n    const target = parseFloat(el.getAttribute('data-count'));\n    const pre = el.getAttribute('data-prefix') || '', suf = el.getAttribute('data-suffix') || '';\n    const final = el._final || el.textContent, t0 = performance.now(), dur = 1400;\n    const step = (t) => {\n      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);\n      el.textContent = p \u003c 1 ? pre + Math.round(target * e).toLocaleString('en-US') + suf : final;\n      if (p \u003c 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const open = (mode, extra) => this.setState(Object.assign({ applyOpen: true, menuOpen: false, submitted: false, mode }, extra || {}));\n\n    const W = [[50, 252], [230, 214], [410, 174], [590, 136], [770, 92], [950, 40]];\n    const anchors = [[0, 266]].concat(W, [[1000, 28]]);\n    const line = [];\n    for (let i = 0; i \u003c anchors.length - 1; i++) {\n      const a = anchors[i], b = anchors[i + 1];\n      for (let j = 0; j \u003c 6; j++) {\n        const t = j / 6;\n        const bump = j === 0 ? 0 : 9 * Math.sin((i * 3 + j) * 1.9) * Math.sin(Math.PI * t);\n        line.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t + bump]);\n      }\n    }\n    line.push(anchors[anchors.length - 1]);\n    const profileLine = line.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n    const profileArea = profileLine + ' 1000,300 0,300';\n\n    const stagesRaw = [\n      ['Basecamp', 'Assess', 'Week 0', 'A 60-minute assessment in the studio or over video: training history, schedule, injuries, a movement screen and baseline strength and conditioning numbers.', 'A baseline report'],\n      ['Route', 'Plan', 'Week 1', 'Your coach writes a 12-week block around one primary goal, the equipment you have and the days you can actually train. Every session has a stated purpose.', 'Your written training block'],\n      ['Ascent', 'Train', 'Weeks 1–12', 'Three to five sessions a week in the app, with video demos, target loads, rest times and a plan-B session for weeks that go sideways.', 'Sessions in the app, studio time on hybrid and studio plans'],\n      ['Checkpoint', 'Track', 'Every Sunday', 'A five-minute check-in covering sleep, steps, bodyweight trend, energy and how the sessions felt. You get a written reply within a day.', 'Weekly written feedback'],\n      ['Acclimatize', 'Adjust', 'Every 4 weeks', 'We review the numbers together and change what is not working: loads, exercise choices, volume or nutrition targets.', 'An updated program'],\n      ['Summit', 'Progress', 'Week 12', 'You re-test the baseline, see the change in plain numbers, and we set the next objective.', 'A re-test report and your next block']\n    ];\n    const stages = stagesRaw.map((r, i) => {\n      const num = String(i + 1).padStart(2, '0'), active = s.stage === i;\n      return {\n        num, name: r[0], verb: r[1], when: r[2], desc: r[3], gets: r[4], active,\n        x: (W[i][0] / 10) + '%', y: (W[i][1] / 3) + '%',\n        dot: active ? '18px' : '12px', dotBg: active ? '#141413' : '#faf9f5',\n        axisLabel: s.wide ? num + ' ' + r[0] : num,\n        shift: i === 0 ? '-12%' : i === 5 ? '-88%' : '-50%',\n        labelColor: active ? '#141413' : '#6c6a64',\n        aria: 'Stage ' + (i + 1) + ': ' + r[0] + ', ' + r[1],\n        icon: active ? 'minus' : 'plus',\n        select: () => this.setState({ stage: i })\n      };\n    });\n\n    const progRaw = [\n      ['Foundations', 'New to lifting, or coming back after years away', '12 weeks', '12 wk', 'Confident technique on the six key movements', 'We teach the squat, hinge, push, pull, carry and lunge from the ground up, with loads that build week by week. Two to three sessions a week.', ((window.__resources && window.__resources.img_foundations_deadlift) || 'images/foundations-deadlift.jpg'), '55% 50%', 'A woman setting up a barbell deadlift in a bright gym'],\n      ['Strength', 'Intermediate lifters who want their numbers to move', '16-week blocks', '16 wk', 'Measurable gains on squat, bench, deadlift and press', 'Barbell-centred programming with planned progressions, deloads and a re-test at the end of every block.', ((window.__resources && window.__resources.img_strength_rack) || 'images/strength-rack.jpg'), '50% 35%', 'A woman gripping a barbell in a squat rack, seen from behind'],\n      ['Muscle', 'Build size and shape with technique that holds up', '12–16 weeks', '12–16 wk', 'Lean mass tracked monthly', 'Hypertrophy training with enough volume to grow and enough recovery to keep coming back. Exercise choices fit your joints and your gym.', ((window.__resources && window.__resources.img_muscle_deadlift) || 'images/muscle-deadlift.jpg'), '35% 50%', 'A man in a black T-shirt lifting a barbell from the floor in a bright gym'],\n      ['Recomposition', 'Lose fat and keep the muscle you have', '16–24 weeks', '16–24 wk', 'A steady weekly trend without crash phases', 'Strength training, daily steps and nutrition targets you can keep at a restaurant. We aim for a sustainable rate, typically 0.5 to 1 percent of bodyweight a week.', ((window.__resources && window.__resources.img_trail_silhouette) || 'images/trail-silhouette.jpg'), '60% 50%', 'Silhouette of a runner on a rocky ridge against a low sun'],\n      ['Performance', 'Speed, power and resilience for athletes', 'Off-season and in-season', 'Seasonal', 'Sport-specific testing every block', 'Sprint mechanics, jumps, strength and conditioning planned around your competition calendar, with lighter in-season phases.', ((window.__resources && window.__resources.img_sprint_track) || 'images/sprint-track.jpg'), '50% 45%', 'A sprinter mid-stride on a running track in golden light'],\n      ['Mountain and endurance', 'Runners, hikers, climbers and skiers', '12–16 weeks', '12–16 wk', 'Stronger climbs and steadier descents', 'Two focused strength sessions a week that support your running and mountain days instead of competing with them.', ((window.__resources && window.__resources.img_hillside_run) || 'images/hillside-run.jpg'), '50% 45%', 'A woman running up a grassy hillside at golden hour']\n    ];\n    const programs = progRaw.map((r, i) => {\n      const active = s.program === i;\n      return {\n        num: String(i + 1).padStart(2, '0'), name: r[0], who: r[1], length: r[2], lengthShort: r[3], benefit: r[4], desc: r[5], img: r[6], pos: r[7], alt: r[8],\n        active, inline: active && !s.wide, opacity: active ? 1 : 0, scale: active ? 1 : 1.04,\n        nameColor: active ? '#141413' : '#6c6a64',\n        select: () => { if (this.state.program !== i) this.setState({ program: i }); },\n        start: () => open('apply', { goal: r[0] })\n      };\n    });\n\n    const chart = (vals) => {\n      const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), pad = (max - min) * 0.12;\n      const lo = min - pad, hi = max + pad, n = vals.length;\n      const P = vals.map((v, i) => [8 + i * (584 / (n - 1)), 220 - (v - lo) / (hi - lo) * 200]);\n      return { points: P.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), startX: P[0][0], startY: P[0][1], endX: P[n - 1][0], endY: P[n - 1][1] };\n    };\n    const casesRaw = [\n      { tab: 'Maya, 41 — Strength', name: 'Maya R.', meta: '41 · Architect · Online with monthly studio sessions', program: 'Strength', duration: '24 weeks', goal: 'Wanted to lift with confidence after years of on-and-off classes.', quote: 'I had always trained hard and never had anything to show for it. Seeing the numbers every week changed how I thought about the gym.', chartLabel: 'Deadlift, estimated 1RM (kg)', unit: ' kg', vals: [45, 48, 50, 52.5, 55, 57.5, 52.5, 60, 62.5, 65, 67.5, 67.5, 60, 70, 72.5, 75, 77.5, 80, 72.5, 82.5, 85, 87.5, 90, 92], metrics: [{ v: '45 → 92 kg', l: 'Deadlift, estimated 1RM' }, { v: '68 / 72', l: 'Planned sessions completed' }, { v: '3', l: 'Blocks, each ending in a re-test' }] },\n      { tab: 'James, 34 — Recomposition', name: 'James O.', meta: '34 · ER nurse on rotating shifts · Online', program: 'Recomposition', duration: '20 weeks', goal: 'Rotating shifts had broken every plan he had tried.', quote: 'Shift work wrecked every routine I tried. Elias wrote two versions of each week, one for days and one for nights. It was the first plan that survived a bad month.', chartLabel: 'Bodyweight, 7-day average (kg)', unit: ' kg', vals: [98.4, 98.0, 97.1, 97.4, 96.5, 96.0, 95.8, 95.9, 95.1, 94.4, 94.6, 93.8, 93.2, 93.4, 92.5, 91.8, 91.6, 90.7, 90.2, 89.1], metrics: [{ v: '−9.3 kg', l: 'Bodyweight, 7-day average' }, { v: '−8 cm', l: 'Waist' }, { v: '80 → 110 kg', l: 'Back squat, estimated 1RM' }] },\n      { tab: 'Priya, 29 — Mountain', name: 'Priya S.', meta: '29 · Trail runner · Hybrid', program: 'Mountain and endurance', duration: '16 weeks', goal: 'Wanted strength work that helped her running instead of competing with it.', quote: 'I thought lifting would slow me down. Sixteen weeks later the climbs felt shorter, and the last ten kilometres of a race stopped feeling like survival.', chartLabel: 'Weekly vertical gain (m)', unit: ' m', vals: [800, 850, 900, 1000, 950, 1100, 1200, 1150, 1300, 1400, 1350, 1500, 1650, 1550, 1750, 1900], metrics: [{ v: '800 → 1,900 m', l: 'Weekly vertical gain' }, { v: '12 → 28 kg', l: 'Split squat, per hand' }, { v: '2 a week', l: 'Strength sessions, all season' }] }\n    ];\n    const cases = casesRaw.map((c, i) => {\n      const active = s.caseIdx === i;\n      return { tabLabel: c.tab, tabId: 'case-tab-' + i, active, tabBg: active ? '#faf9f5' : 'transparent', tabColor: active ? '#141413' : '#faf9f5', tabBorder: active ? '#faf9f5' : 'rgba(250,249,245,0.2)', select: () => this.setState({ caseIdx: i }) };\n    });\n    const cr = casesRaw[s.caseIdx], ch = chart(cr.vals);\n    const fmt = (v) => v.toLocaleString('en-US') + cr.unit;\n    const cur = Object.assign({}, cr, ch, {\n      tabId: 'case-tab-' + s.caseIdx,\n      startLabel: 'Week 1 · ' + fmt(cr.vals[0]),\n      endLabel: 'Week ' + cr.vals.length + ' · ' + fmt(cr.vals[cr.vals.length - 1]),\n      chartAria: cr.chartLabel + ' from ' + fmt(cr.vals[0]) + ' in week 1 to ' + fmt(cr.vals[cr.vals.length - 1]) + ' in week ' + cr.vals.length\n    });\n\n    const faqRaw = [\n      ['Who is coaching for?', 'Adults who want structure: beginners, people returning after a break, intermediate lifters and athletes. Most clients are between 25 and 60 and train three or four times a week.'],\n      ['Do I need gym experience?', 'No. Foundations is built for people who have never followed a program. We teach every movement from the start and add load when you are ready.'],\n      ['Do you offer online coaching?', 'Yes, most clients are online. You get the same written program, weekly check-ins and video form review as studio clients.'],\n      ['Do I need access to a gym?', 'A gym gives us the most options, but we write programs for home setups too. Tell us what equipment you have and we will work with it.'],\n      ['How often do we check in?', 'Once a week in writing, every Sunday. Messages are open on weekdays, and we review the program in more depth every four weeks.'],\n      ['Do you provide nutrition guidance?', 'Yes: habit-based coaching with protein and energy targets. We do not prescribe meal plans for medical conditions and will refer you to a registered dietitian when that is needed.'],\n      ['How long are programs?', 'Blocks run 12 weeks. After the first block you continue month to month and can pause or cancel with 14 days of notice.'],\n      ['How does progress tracking work?', 'You log sessions in the app. We track your lifts, bodyweight trend, measurements if you want them, and how many planned sessions you completed. Each block ends with a short report.'],\n      ['What happens after I apply?', 'We reply within two working days to book a 20-minute call. If it is a fit, your assessment is booked within the same week.'],\n      ['What if I have an injury?', 'Tell us on the application. We coach around many common issues and work alongside your physical therapist or doctor. We do not diagnose or treat injuries.']\n    ];\n    const faqs = faqRaw.map((f, i) => ({ q: f[0], a: f[1], open: s.faq === i, rot: s.faq === i ? '45deg' : '0deg', btnId: 'faq-q-' + i, panelId: 'faq-a-' + i, toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i }) }));\n\n    const tiers = [\n      { name: 'Online', price: '$229', desc: 'Coaching in the app, for people who train on their own schedule.', features: ['Program written for you, updated every 4 weeks', 'Weekly check-in with written feedback', 'Video form review', 'Nutrition targets and habits', 'Messaging on weekdays'], cta: 'Start online', featured: false, onCta: () => open('apply', { format: 'Online' }) },\n      { name: 'Hybrid', price: '$449', desc: 'Online coaching plus regular time with Elias in the studio.', features: ['Everything in Online', 'Two 60-minute studio sessions a month', 'Re-testing in the studio each block', 'Priority replies'], cta: 'Start hybrid', featured: true, onCta: () => open('apply', { format: 'Hybrid' }) },\n      { name: 'Studio', price: '$760', desc: 'Coached in person twice a week, with the program built around those sessions.', features: ['Eight 60-minute sessions a month', 'App, check-ins and program included', 'Movement screen every block', 'Nutrition coaching'], cta: 'Book the studio', featured: false, onCta: () => open('apply', { format: 'Studio' }) }\n    ];\n\n    const opt = (list, key) => list.map((v) => ({ value: v, checked: s[key] === v, border: s[key] === v ? '#141413' : '#e6dfd8', bg: s[key] === v ? '#efe9de' : '#faf9f5', select: () => this.setState({ [key]: v }) }));\n    const consult = s.mode === 'consult';\n\n    return {\n      wide: s.wide, narrow: !s.wide, menuOpen: s.menuOpen, menuVisible: s.menuOpen && !s.wide,\n      navBorder: s.scrolled ? '#e6dfd8' : 'transparent',\n      navCta: s.vw \u003c 560 ? 'Start' : 'Start coaching',\n      menuIcon: s.menuOpen ? 'x' : 'menu', menuLabel: s.menuOpen ? 'Close menu' : 'Open menu',\n      icon16: 16, icon18: 18,\n      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      openApply: () => open('apply'),\n      openConsult: () => open('consult'),\n      closeApply: () => this.setState({ applyOpen: false }),\n      stop: (e) => e.stopPropagation(),\n      profileLine, profileArea, stages,\n      stageNum: s.stage + 1, stageName: stagesRaw[s.stage][0],\n      programs, prog: programs[s.program],\n      cases, cur, faqs, tiers,\n      goalOptions: opt(['Foundations', 'Strength', 'Muscle', 'Recomposition', 'Performance', 'Mountain and endurance', 'Not sure yet'], 'goal'),\n      formatOptions: opt(['Online', 'Hybrid', 'Studio', 'Not sure yet'], 'format'),\n      applyOpen: s.applyOpen, submitted: s.submitted, notSubmitted: !s.submitted, applicantName: s.applicantName,\n      applyEyebrow: consult ? 'Free consultation' : 'Application',\n      applyTitle: consult ? 'Book a consultation' : 'Start coaching',\n      applyIntro: consult ? 'A 20-minute call about your goals, your schedule and which format fits. No obligation.' : 'Five minutes. Tell us where you are and where you want to go, and we will reply within two working days.',\n      submitLabel: consult ? 'Request a call' : 'Send application',\n      submitApply: (e) => {\n        e.preventDefault();\n        const fd = new FormData(e.currentTarget);\n        const first = String(fd.get('name') || '').trim().split(/\\s+/)[0] || 'there';\n        this.setState({ submitted: true, applicantName: first });\n      }\n    };\n  }\n}\n\u003c/script>\n\n\n\n\u003c/body>\u003c/html>"</script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var template = JSON.parse(document.getElementById('__page').textContent)
  var doc = new DOMParser().parseFromString(template, 'text/html')
  document.documentElement.replaceWith(doc.documentElement)
  for (var old of Array.from(document.scripts)) {
    var s = document.createElement('script')
    for (var a of Array.from(old.attributes)) s.setAttribute(a.name, a.value)
    s.textContent = old.textContent
    var loaded = s.src ? new Promise(function (r) { s.onload = s.onerror = r }) : null
    old.replaceWith(s)
    if (loaded) await loaded
  }
  if (window.Babel && typeof window.Babel.transformScriptTags === 'function') window.Babel.transformScriptTags()
})
</script>
