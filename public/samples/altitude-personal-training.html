"\" src=\"altitude-personal-training/4449258ffe84.webp\" alt=\"A coach kneels beside a client, guiding her hip hinge as she lowers two dumbbells in a dark strength studio\" fetchpriority=\"high\" style=\"width:100%;height:100%;object-fit:cover;object-position:44% 50%;transform:scale(1.06);transition:transform 1800ms cubic-bezier(0.2,0,0,1)\">\n        \u003c/div>\n        \u003cfigcaption style=\"display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">\u003cspan>Studio session — hip hinge, week 2\u003c/span>\u003cspan>Pearl Street studio\u003c/span>\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:clamp(56px,7vw,112px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:32px clamp(16px,2vw,32px)\">\n      \u003cdiv style=\"border-top:1px solid #e6dfd8;padding-top:24px\">\n        \u003cp style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(52px,5.4vw,96px);line-height:1;letter-spacing:-0.03em;color:#141413;font-variant-numeric:lining-nums\">\u003cspan data-count=\"640\" data-suffix=\"+\">640+\u003c/span>\u003c/p>\n        \u003cp style=\"margin:12px 0 0;font-size:15px;line-height:1.45;color:#3d3d3a\">clients coached since 2017\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px solid #e6dfd8;padding-top:24px\">\n        \u003cp style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(52px,5.4vw,96px);line-height:1;letter-spacing:-0.03em;color:#141413;font-variant-numeric:lining-nums\">\u003cspan data-count=\"9\">9\u003c/span>\u003c/p>\n        \u003cp style=\"margin:12px 0 0;font-size:15px;line-height:1.45;color:#3d3d3a\">years of full-time coaching\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px solid #e6dfd8;padding-top:24px\">\n        \u003cp style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(52px,5.4vw,96px);line-height:1;letter-spacing:-0.03em;color:#141413;font-variant-numeric:lining-nums\">\u003cspan data-count=\"86\" data-suffix=\"%\">86%\u003c/span>\u003c/p>\n        \u003cp style=\"margin:12px 0 0;font-size:15px;line-height:1.45;color:#3d3d3a\">continue after their first 12-week block\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"border-top:1px solid #e6dfd8;padding-top:24px\">\n        \u003cp style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(52px,5.4vw,96px);line-height:1;letter-spacing:-0.03em;color:#141413;font-variant-numeric:lining-nums\">\u003cspan data-count=\"24\" data-prefix=\"&lt;\" data-suffix=\" h\">&lt;24 h\u003c/span>\u003c/p>\n        \u003cp style=\"margin:12px 0 0;font-size:15px;line-height:1.45;color:#3d3d3a\">typical reply to a weekly check-in\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cp style=\"margin:20px 0 0;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Figures are illustrative for this concept site.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"problem\" data-screen-label=\"Problem\" style=\"background:#181715;color:#faf9f5;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box;display:flex;flex-wrap:wrap;gap:clamp(48px,6vw,112px)\">\n    \u003cdiv data-reveal=\"\" style=\"flex:1 1 400px;min-width:0;max-width:600px\">\n      \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#a09d96\">Why training stalls\u003c/p>\n      \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#faf9f5;text-wrap:balance\">Most training goes sideways.\u003c/h2>\n      \u003cp style=\"margin:28px 0 0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#a09d96;text-wrap:pretty\">People who stall are usually working hard. What they lack is structure: a plan that progresses, someone watching the form, and a reason to show up on a Thursday in February.\u003c/p>\n      \u003col style=\"list-style:none;margin:40px 0 0;padding:0;border-top:1px solid rgba(250,249,245,0.1)\">\n        \u003cli style=\"display:flex;gap:20px;padding:18px 0;border-bottom:1px solid rgba(250,249,245,0.1);font-size:16px;line-height:1.5;color:#faf9f5\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#a09d96;padding-top:4px\">01\u003c/span>Workouts picked by mood, so nothing builds on last week.\u003c/li>\n        \u003cli style=\"display:flex;gap:20px;padding:18px 0;border-bottom:1px solid rgba(250,249,245,0.1);font-size:16px;line-height:1.5;color:#faf9f5\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#a09d96;padding-top:4px\">02\u003c/span>Loads guessed, so progress stalls or technique slips.\u003c/li>\n        \u003cli style=\"display:flex;gap:20px;padding:18px 0;border-bottom:1px solid rgba(250,249,245,0.1);font-size:16px;line-height:1.5;color:#faf9f5\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#a09d96;padding-top:4px\">03\u003c/span>Nobody notices when you drift for a fortnight.\u003c/li>\n        \u003cli style=\"display:flex;gap:20px;padding:18px 0;border-bottom:1px solid rgba(250,249,245,0.1);font-size:16px;line-height:1.5;color:#faf9f5\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#a09d96;padding-top:4px\">04\u003c/span>Diets that last until a birthday, a trip or a bad week.\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cdiv data-reveal=\"\" style=\"flex:1.5 1 560px;min-width:0;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start\">\n      \u003cdiv style=\"flex:1 1 280px;min-width:0;background:#252320;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#a09d96\">\u003cspan style=\"color:#faf9f5\">Without a plan\u003c/span>\u003cspan>March, weeks 1–4\u003c/span>\u003c/div>\n        \u003cul style=\"list-style:none;margin:0;padding:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.4\">\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Mon 03\u003c/span>\u003cspan style=\"color:#faf9f5\">Chest and arms, from a video\u003c/span>\u003cspan style=\"color:#e8a55a;border:1px solid rgba(232,165,90,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">no plan\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Wed 05\u003c/span>\u003cspan style=\"color:#faf9f5\">HIIT class\u003c/span>\u003cspan>\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Thu 06\u003c/span>\u003cspan style=\"color:#a09d96\">Skipped, late meeting\u003c/span>\u003cspan style=\"color:#e8a55a;border:1px solid rgba(232,165,90,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">missed\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Sat 08\u003c/span>\u003cspan style=\"color:#faf9f5\">Legs, guessed the weights\u003c/span>\u003cspan style=\"color:#e8a55a;border:1px solid rgba(232,165,90,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">guessing\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Mon 10\u003c/span>\u003cspan style=\"color:#faf9f5\">Chest and arms again\u003c/span>\u003cspan style=\"color:#e8a55a;border:1px solid rgba(232,165,90,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">same load\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Wed 12\u003c/span>\u003cspan style=\"color:#faf9f5\">New app, new routine\u003c/span>\u003cspan style=\"color:#e8a55a;border:1px solid rgba(232,165,90,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">restart\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">Thu 20\u003c/span>\u003cspan style=\"color:#a09d96\">Nothing for six days\u003c/span>\u003cspan>\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003csvg sc-camel-view-box=\"0 0 300 60\" style=\"width:100%;height:56px\" aria-hidden=\"true\">\u003cpolyline points=\"0,38 30,34 60,42 90,30 120,44 150,36 180,46 210,32 240,40 270,38 300,42\" fill=\"none\" stroke=\"#a09d96\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\">\u003c/polyline>\u003c/svg>\n        \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#a09d96\">4 weeks · 0 kg added to any lift\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"flex:1 1 280px;min-width:0;background:#252320;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#a09d96\">\u003cspan style=\"color:#faf9f5\">With a plan\u003c/span>\u003cspan>Block 1, weeks 1–4\u003c/span>\u003c/div>\n        \u003cul style=\"list-style:none;margin:0;padding:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.4\">\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W1 Mon\u003c/span>\u003cspan style=\"color:#faf9f5\">Squat 3×5 · 60 kg · RPE 7\u003c/span>\u003cspan>\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W1 Fri\u003c/span>\u003cspan style=\"color:#faf9f5\">Deadlift 3×5 · 80 kg\u003c/span>\u003cspan>\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W1 Sun\u003c/span>\u003cspan style=\"color:#faf9f5\">Check-in sent\u003c/span>\u003cspan style=\"color:#5db8a6;border:1px solid rgba(93,184,166,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">replied\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W2 Mon\u003c/span>\u003cspan style=\"color:#faf9f5\">Squat 3×5 · 62.5 kg\u003c/span>\u003cspan style=\"color:#5db8a6;border:1px solid rgba(93,184,166,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">+2.5 kg\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W2 Thu\u003c/span>\u003cspan style=\"color:#faf9f5\">Travel: hotel session B\u003c/span>\u003cspan style=\"color:#5db8a6;border:1px solid rgba(93,184,166,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">plan B\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W3 Mon\u003c/span>\u003cspan style=\"color:#faf9f5\">Squat 3×5 · 65 kg\u003c/span>\u003cspan style=\"color:#5db8a6;border:1px solid rgba(93,184,166,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">+2.5 kg\u003c/span>\u003c/li>\n          \u003cli style=\"display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">W4 Mon\u003c/span>\u003cspan style=\"color:#faf9f5\">Deload · 52.5 kg\u003c/span>\u003cspan style=\"color:#5db8a6;border:1px solid rgba(93,184,166,0.45);border-radius:999px;padding:2px 8px;font-size:11px\">planned\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003csvg sc-camel-view-box=\"0 0 300 60\" style=\"width:100%;height:56px\" aria-hidden=\"true\">\u003cpolyline points=\"0,52 60,52 60,44 120,44 120,36 180,36 180,28 220,28 220,38 260,38 260,18 300,18\" fill=\"none\" stroke=\"#faf9f5\" stroke-width=\"1.5\">\u003c/polyline>\u003c/svg>\n        \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#a09d96\">4 weeks · +5 kg squat · +7.5 kg deadlift\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"method\" data-screen-label=\"Method\" style=\"background:#faf9f5;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 480px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">The Altitude method\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413\">Built like a climb.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:520px;margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#252523;text-wrap:pretty\">Every client moves through the same six stages. What changes is the content: your history, your schedule, your lifts and your numbers.\u003c/p>\n    \u003c/div>\n    \u003cdiv data-reveal=\"\" style=\"position:relative;margin-top:clamp(48px,6vw,96px);height:clamp(180px,22vw,340px)\">\n      \u003csvg sc-camel-view-box=\"0 0 1000 300\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n        \u003cpolygon points=\"{{ profileArea }}\" fill=\"#efe9de\">\u003c/polygon>\n        \u003cpolyline points=\"{{ profileLine }}\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.5\" vector-effect=\"non-scaling-stroke\">\u003c/polyline>\n      \u003c/svg>\n      \u003csc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n        \u003cdiv aria-hidden=\"true\" style=\"position:absolute;left:{{ s.x }};top:{{ s.y }};bottom:0;width:0;border-left:1px dashed #cfc6b7\">\u003c/div>\n        \u003cbutton type=\"button\" aria-label=\"{{ s.aria }}\" aria-pressed=\"{{ s.active }}\" sc-camel-on-click=\"{{ s.select }}\" style=\"position:absolute;left:{{ s.x }};top:{{ s.y }};transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center\">\n          \u003cspan style=\"display:block;width:{{ s.dot }};height:{{ s.dot }};border-radius:50%;background:{{ s.dotBg }};border:1.5px solid #141413;box-sizing:border-box;transition:width 180ms, height 180ms, background-color 180ms\">\u003c/span>\n        \u003c/button>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv aria-hidden=\"true\" style=\"position:relative;height:40px;border-top:1px solid #e6dfd8\">\n      \u003csc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n        \u003cspan style=\"position:absolute;left:{{ s.x }};top:12px;transform:translateX({{ s.shift }});font-family:var(--font-mono);font-size:12px;white-space:nowrap;color:{{ s.labelColor }}\">{{ s.axisLabel }}\u003c/span>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,5vw,96px);margin-top:clamp(40px,5vw,72px);align-items:flex-start\">\n      \u003cdiv role=\"list\" style=\"flex:1.2 1 480px;min-width:0;border-bottom:1px solid #e6dfd8\">\n        \u003csc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n          \u003cdiv role=\"listitem\" style=\"border-top:1px solid #e6dfd8\">\n            \u003cbutton type=\"button\" aria-expanded=\"{{ s.active }}\" sc-camel-on-click=\"{{ s.select }}\" style=\"width:100%;display:grid;grid-template-columns:48px 1fr 36px;align-items:center;gap:12px;padding:20px 0;background:none;border:0;text-align:left;cursor:pointer;color:#141413\">\n              \u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64\">{{ s.num }}\u003c/span>\n              \u003cspan style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px\">\n                \u003cspan style=\"font-family:var(--font-serif-display);font-size:clamp(30px,2.6vw,44px);line-height:1.05;letter-spacing:-0.02em\">{{ s.name }}\u003c/span>\n                \u003cspan style=\"font-size:14px;color:#6c6a64\">{{ s.verb }} · {{ s.when }}\u003c/span>\n              \u003c/span>\n              \u003cspan style=\"width:36px;height:36px;border-radius:999px;border:1px solid #e6dfd8;display:flex;align-items:center;justify-content:center\">\n                \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Icon\" name=\"{{ s.icon }}\" size=\"{{ icon16 }}\" hint-size=\"16px,16px\">\u003c/x-import>\n              \u003c/span>\n            \u003c/button>\n            \u003csc-if value=\"{{ s.active }}\">\n              \u003cdiv style=\"padding:0 48px 28px 60px;display:grid;gap:14px\">\n                \u003cp style=\"margin:0;max-width:560px;font-size:16px;line-height:1.65;color:#3d3d3a;text-wrap:pretty\">{{ s.desc }}\u003c/p>\n                \u003cp style=\"margin:0;font-size:14px;color:#141413\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;margin-right:10px\">You get\u003c/span>{{ s.gets }}\u003c/p>\n              \u003c/div>\n            \u003c/sc-if>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cfigure data-reveal=\"\" style=\"flex:1 1 360px;min-width:0;margin:0\">\n        \u003cdiv style=\"height:clamp(380px,44vw,700px);border-radius:12px;overflow:hidden;background:#e8e0d2\">\n          \u003cimg src=\"altitude-personal-training/bfa70c74cbf8.webp\" alt=\"A narrow trail winding up a green ridge toward jagged grey peaks\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 60%\">\n        \u003c/div>\n        \u003cfigcaption style=\"margin-top:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Stage {{ stageNum }} of 6 — {{ stageName }}\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"programs\" data-screen-label=\"Programs\" style=\"background:#f5f0e8;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 520px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Programs\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413;text-wrap:balance\">What are you training for?\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:520px;margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#252523;text-wrap:pretty\">Six programs, each written and adjusted by your coach. Pick the goal that matters most and the plan is built around it.\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,5vw,96px);margin-top:clamp(48px,6vw,96px);align-items:flex-start\">\n      \u003csc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003cdiv style=\"flex:1 1 420px;min-width:0;position:sticky;top:104px\">\n          \u003cdiv style=\"position:relative;height:clamp(360px,36vw,620px);border-radius:12px;overflow:hidden;background:#e8e0d2\">\n            \u003csc-for list=\"{{ programs }}\" as=\"p\" hint-placeholder-count=\"1\">\n              \u003cimg src=\"{{ p.img }}\" alt=\"{{ p.alt }}\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ p.pos }};opacity:{{ p.opacity }};transform:scale({{ p.scale }});transition:opacity 600ms cubic-bezier(0.2,0,0,1), transform 1400ms cubic-bezier(0.2,0,0,1)\">\n            \u003c/sc-for>\n          \u003c/div>\n          \u003cdiv style=\"margin-top:20px;display:grid;gap:14px\">\n            \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">{{ prog.num }} / 06 — {{ prog.length }}\u003c/p>\n            \u003cp style=\"margin:0;font-size:16px;line-height:1.6;color:#3d3d3a;max-width:520px\">{{ prog.desc }}\u003c/p>\n            \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px\">\n              \u003cp style=\"margin:0;font-size:14px;color:#141413\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;margin-right:10px\">You'll see\u003c/span>{{ prog.benefit }}\u003c/p>\n              \u003cbutton type=\"button\" sc-camel-on-click=\"{{ prog.start }}\" style=\"background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;font-weight:500;color:#cc785c\">Start with {{ prog.name }} →\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n      \u003cdiv role=\"list\" style=\"flex:1.25 1 520px;min-width:0;border-bottom:1px solid #e0d8cb\">\n        \u003csc-for list=\"{{ programs }}\" as=\"p\" hint-placeholder-count=\"6\">\n          \u003cdiv role=\"listitem\" sc-camel-on-mouse-enter=\"{{ p.select }}\" style=\"border-top:1px solid #e0d8cb\">\n            \u003cbutton type=\"button\" aria-expanded=\"{{ p.active }}\" sc-camel-on-click=\"{{ p.select }}\" sc-camel-on-focus=\"{{ p.select }}\" style=\"width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:baseline;padding:clamp(20px,2vw,30px) 0;background:none;border:0;text-align:left;cursor:pointer\">\n              \u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64\">{{ p.num }}\u003c/span>\n              \u003cspan>\n                \u003cspan style=\"display:block;font-family:var(--font-serif-display);font-size:clamp(34px,3.4vw,60px);line-height:1;letter-spacing:-0.025em;color:{{ p.nameColor }};transition:color 180ms\">{{ p.name }}\u003c/span>\n                \u003cspan style=\"display:block;margin-top:10px;font-size:15px;line-height:1.45;color:#3d3d3a\">{{ p.who }}\u003c/span>\n              \u003c/span>\n              \u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;white-space:nowrap\">{{ p.lengthShort }}\u003c/span>\n            \u003c/button>\n            \u003csc-if value=\"{{ p.inline }}\">\n              \u003cdiv style=\"padding:0 0 28px 60px;display:grid;gap:16px\">\n                \u003cdiv style=\"aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#e8e0d2\">\u003cimg src=\"{{ p.img }}\" alt=\"{{ p.alt }}\" style=\"width:100%;height:100%;object-fit:cover;object-position:{{ p.pos }}\">\u003c/div>\n                \u003cp style=\"margin:0;font-size:16px;line-height:1.6;color:#3d3d3a\">{{ p.desc }}\u003c/p>\n                \u003cp style=\"margin:0;font-size:14px;color:#141413\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;margin-right:10px\">You'll see\u003c/span>{{ p.benefit }}\u003c/p>\n                \u003cbutton type=\"button\" sc-camel-on-click=\"{{ p.start }}\" style=\"justify-self:start;background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;font-weight:500;color:#cc785c\">Start with {{ p.name }} →\u003c/button>\n              \u003c/div>\n            \u003c/sc-if>\n          \u003c/div>\n        \u003c/sc-for>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"results\" data-screen-label=\"Results\" style=\"background:#181715;color:#faf9f5;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 520px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#a09d96\">Results\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#faf9f5\">Progress, on the record.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:520px;margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#a09d96;text-wrap:pretty\">Three client files. We show the whole line, plateaus and deload weeks included, because that is what steady progress looks like.\u003c/p>\n    \u003c/div>\n    \u003cdiv data-reveal=\"\" style=\"margin-top:clamp(48px,6vw,88px);height:clamp(200px,22vw,400px);border-radius:12px;overflow:hidden;background:#252320\">\n      \u003cimg src=\"altitude-personal-training/e67302ac2c14.webp\" alt=\"Black-and-white photo of a woman settling a barbell across her upper back before a squat\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 35%\">\n    \u003c/div>\n    \u003cdiv data-reveal=\"\" style=\"margin-top:16px;background:#252320;border-radius:12px;padding:clamp(20px,3.2vw,48px);box-sizing:border-box\">\n      \u003cdiv role=\"tablist\" aria-label=\"Client case files\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        \u003csc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n          \u003cbutton type=\"button\" role=\"tab\" id=\"{{ c.tabId }}\" aria-selected=\"{{ c.active }}\" aria-controls=\"case-panel\" sc-camel-on-click=\"{{ c.select }}\" style=\"min-height:44px;padding:0 18px;border-radius:999px;border:1px solid {{ c.tabBorder }};background:{{ c.tabBg }};color:{{ c.tabColor }};font-size:14px;font-weight:500;cursor:pointer;transition:background-color 180ms, color 180ms\">{{ c.tabLabel }}\u003c/button>\n        \u003c/sc-for>\n      \u003c/div>\n      \u003cdiv id=\"case-panel\" role=\"tabpanel\" aria-labelledby=\"{{ cur.tabId }}\" style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,4vw,80px);margin-top:clamp(28px,3vw,48px)\">\n        \u003cdiv style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:28px\">\n          \u003cdiv>\n            \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#a09d96\">{{ cur.meta }}\u003c/p>\n            \u003cp style=\"margin:10px 0 0;font-size:15px;line-height:1.55;color:#a09d96\">{{ cur.goal }}\u003c/p>\n          \u003c/div>\n          \u003cblockquote style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(26px,2.4vw,40px);line-height:1.18;letter-spacing:-0.015em;color:#faf9f5;text-wrap:pretty\">“{{ cur.quote }}”\u003c/blockquote>\n          \u003cp style=\"margin:0;font-size:14px;color:#a09d96\">{{ cur.name }} · {{ cur.program }} · {{ cur.duration }}\u003c/p>\n        \u003c/div>\n        \u003cdiv style=\"flex:1.4 1 460px;min-width:0\">\n          \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#a09d96\">\u003cspan>{{ cur.chartLabel }}\u003c/span>\u003cspan>Demo data\u003c/span>\u003c/div>\n          \u003csvg sc-camel-view-box=\"0 0 600 240\" role=\"img\" aria-label=\"{{ cur.chartAria }}\" style=\"width:100%;height:auto;display:block;margin-top:16px;overflow:visible\">\n            \u003cline x1=\"0\" y1=\"20\" x2=\"600\" y2=\"20\" stroke=\"rgba(250,249,245,0.08)\">\u003c/line>\n            \u003cline x1=\"0\" y1=\"86\" x2=\"600\" y2=\"86\" stroke=\"rgba(250,249,245,0.08)\">\u003c/line>\n            \u003cline x1=\"0\" y1=\"153\" x2=\"600\" y2=\"153\" stroke=\"rgba(250,249,245,0.08)\">\u003c/line>\n            \u003cline x1=\"0\" y1=\"220\" x2=\"600\" y2=\"220\" stroke=\"rgba(250,249,245,0.16)\">\u003c/line>\n            \u003cpolyline points=\"{{ cur.points }}\" fill=\"none\" stroke=\"#cc785c\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\u003c/polyline>\n            \u003ccircle cx=\"{{ cur.startX }}\" cy=\"{{ cur.startY }}\" r=\"4.5\" fill=\"#252320\" stroke=\"#a09d96\" stroke-width=\"1.5\">\u003c/circle>\n            \u003ccircle cx=\"{{ cur.endX }}\" cy=\"{{ cur.endY }}\" r=\"6\" fill=\"#cc785c\">\u003c/circle>\n          \u003c/svg>\n          \u003cdiv style=\"display:flex;justify-content:space-between;margin-top:10px;font-family:var(--font-mono);font-size:12px;color:#a09d96\">\u003cspan>{{ cur.startLabel }}\u003c/span>\u003cspan>{{ cur.endLabel }}\u003c/span>\u003c/div>\n          \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(250,249,245,0.1)\">\n            \u003csc-for list=\"{{ cur.metrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n              \u003cdiv>\n                \u003cp style=\"margin:0;font-family:var(--font-serif-display);font-size:clamp(30px,2.6vw,46px);line-height:1;letter-spacing:-0.02em;color:#faf9f5;font-variant-numeric:lining-nums\">{{ m.v }}\u003c/p>\n                \u003cp style=\"margin:10px 0 0;font-size:13px;line-height:1.4;color:#a09d96\">{{ m.l }}\u003c/p>\n              \u003c/div>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp style=\"margin:20px 0 0;max-width:760px;font-family:var(--font-mono);font-size:12px;line-height:1.6;color:#a09d96\">Individual results vary with training history, consistency, sleep and nutrition. Case files on this concept site are illustrative.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"coach\" data-screen-label=\"Coach\" style=\"background:#faf9f5;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box;display:flex;flex-wrap:wrap;gap:clamp(48px,6vw,120px);align-items:flex-start\">\n    \u003cdiv data-reveal=\"\" style=\"flex:1 1 440px;min-width:0;max-width:640px\">\n      \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Your coach\u003c/p>\n      \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(48px,6vw,112px);line-height:0.92;letter-spacing:-0.035em;color:#141413\">Elias Varga\u003c/h2>\n      \u003cp style=\"margin:16px 0 0;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Head coach and founder · CSCS · Coaching since 2017\u003c/p>\n      \u003cp style=\"margin:32px 0 0;font-size:clamp(18px,1.35vw,21px);line-height:1.55;color:#252523;text-wrap:pretty\">Elias started coaching in a university weight room in 2017 and opened the Altitude studio on Pearl Street in 2022.\u003c/p>\n      \u003cp style=\"margin:16px 0 0;font-size:16px;line-height:1.65;color:#3d3d3a;text-wrap:pretty\">He keeps a roster of around 40 clients so he can read every check-in himself. His background is in endurance sport, which is why the programs care as much about recovery and consistency as they do about load on the bar.\u003c/p>\n      \u003cblockquote style=\"margin:36px 0 0;padding:0;font-family:var(--font-serif-display);font-style:italic;font-size:clamp(26px,2.2vw,36px);line-height:1.2;letter-spacing:-0.01em;color:#141413;text-wrap:pretty\">“The best program is the one you are still running in March. My job is to write that one, then keep adjusting it until it fits your life.”\u003c/blockquote>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:32px\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" variant=\"pill\" hint-size=\"170px,28px\">Strength for busy adults\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" variant=\"pill\" hint-size=\"190px,28px\">Returning after a long break\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" variant=\"pill\" hint-size=\"200px,28px\">Runners and mountain athletes\u003c/x-import>\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Badge\" variant=\"pill\" hint-size=\"140px,28px\">Technique and form\u003c/x-import>\n      \u003c/div>\n      \u003cdl style=\"margin:36px 0 0;border-top:1px solid #e6dfd8\">\n        \u003cdiv style=\"display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #e6dfd8\">\u003cdt style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;padding-top:2px\">Education\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;color:#141413\">BSc, Exercise Science\u003c/dd>\u003c/div>\n        \u003cdiv style=\"display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #e6dfd8\">\u003cdt style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;padding-top:2px\">Certification\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;color:#141413\">NSCA Certified Strength and Conditioning Specialist\u003c/dd>\u003c/div>\n        \u003cdiv style=\"display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #e6dfd8\">\u003cdt style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;padding-top:2px\">Nutrition\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;color:#141413\">Precision Nutrition Level 1\u003c/dd>\u003c/div>\n        \u003cdiv style=\"display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #e6dfd8\">\u003cdt style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;padding-top:2px\">Weightlifting\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;color:#141413\">USA Weightlifting Level 1\u003c/dd>\u003c/div>\n        \u003cdiv style=\"display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #e6dfd8\">\u003cdt style=\"font-family:var(--font-mono);font-size:12px;color:#6c6a64;padding-top:2px\">Background\u003c/dt>\u003cdd style=\"margin:0;font-size:15px;color:#141413\">Former collegiate 800 m runner\u003c/dd>\u003c/div>\n      \u003c/dl>\n      \u003cbutton type=\"button\" sc-camel-on-click=\"{{ openConsult }}\" style=\"margin-top:28px;background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;font-weight:500;color:#cc785c\">Book a call with Elias →\u003c/button>\n    \u003c/div>\n    \u003cdiv data-reveal=\"\" style=\"flex:1.1 1 460px;min-width:0;display:flex;gap:clamp(12px,1.5vw,24px);align-items:flex-start\">\n      \u003cfigure style=\"flex:1.45 1 0;min-width:0;margin:0\">\n        \u003cdiv style=\"aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#181715\">\n          \u003cimg src=\"altitude-personal-training/bb4ce20306ad.webp\" alt=\"Portrait of head coach Elias Varga in black, photographed against a dark studio wall\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:50% 3%;filter:grayscale(1) contrast(1.04)\">\n        \u003c/div>\n        \u003cfigcaption style=\"margin-top:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Elias Varga, head coach\u003c/figcaption>\n      \u003c/figure>\n      \u003cfigure style=\"flex:1 1 0;min-width:0;margin:clamp(56px,9vw,180px) 0 0\">\n        \u003cdiv style=\"aspect-ratio:3/5;border-radius:12px;overflow:hidden;background:#181715\">\n          \u003cimg src=\"altitude-personal-training/385fa9964f7c.webp\" alt=\"The Altitude studio: squat racks and plates beside tall windows\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 50%\">\n        \u003c/div>\n        \u003cfigcaption style=\"margin-top:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">The studio, Pearl Street\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"experience\" data-screen-label=\"What you get\" style=\"background:#efe9de;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 520px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#3d3d3a\">What you get\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413;text-wrap:balance\">A coached week, start to finish.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:520px;margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#252523;text-wrap:pretty\">Your sessions, check-ins and messages live in one app. Your coach sees the same screen you do.\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,5vw,96px);margin-top:clamp(48px,6vw,96px);align-items:flex-start\">\n      \u003cfigure data-reveal=\"\" aria-label=\"Example of a training day in the Altitude app\" style=\"flex:1 1 440px;min-width:0;max-width:680px;margin:0;background:#181715;border-radius:12px;padding:clamp(16px,2vw,24px);box-sizing:border-box;color:#faf9f5\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 4px 18px\">\n          \u003cspan style=\"display:flex;align-items:center;gap:10px\">\u003csvg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#faf9f5\" stroke-width=\"2.4\" aria-hidden=\"true\">\u003cpath d=\"M2 28 L16 4 L30 28\">\u003c/path>\u003cpath d=\"M13 28 L19.5 17.5 L26 28\">\u003c/path>\u003c/svg>\u003cspan style=\"font-size:11px;font-weight:500;letter-spacing:0.3em\">ALTITUDE\u003c/span>\u003c/span>\n          \u003cspan style=\"font-family:var(--font-mono);font-size:11.5px;color:#a09d96\">Week 07 · Block 2 · Strength\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"background:#1f1e1b;border-radius:8px;padding:clamp(16px,2vw,24px)\">\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px\">\n            \u003cp style=\"margin:0;font-family:var(--font-serif-display);font-size:30px;line-height:1.1;letter-spacing:-0.01em\">Tuesday · Session A\u003c/p>\n            \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#a09d96\">55 min · 5 exercises\u003c/p>\n          \u003c/div>\n          \u003cul style=\"list-style:none;margin:18px 0 0;padding:0;font-family:var(--font-mono);font-size:12.5px\">\n            \u003cli style=\"display:grid;grid-template-columns:30px 1fr auto 16px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">A1\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px\">Back squat\u003c/span>\u003cspan style=\"color:#a09d96\">4×5 · 72.5 kg · RPE 7–8\u003c/span>\u003cspan style=\"width:12px;height:12px;border-radius:50%;background:#5db8a6\">\u003c/span>\u003c/li>\n            \u003cli style=\"display:grid;grid-template-columns:30px 1fr auto 16px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">A2\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px\">Hip airplane\u003c/span>\u003cspan style=\"color:#a09d96\">3×5 / side\u003c/span>\u003cspan style=\"width:12px;height:12px;border-radius:50%;background:#5db8a6\">\u003c/span>\u003c/li>\n            \u003cli style=\"display:grid;grid-template-columns:30px 1fr auto 16px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">B1\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px\">Romanian deadlift\u003c/span>\u003cspan style=\"color:#faf9f5\">3×8 · 60 kg · RPE 7\u003c/span>\u003cspan style=\"width:12px;height:12px;border-radius:50%;border:1.5px solid #faf9f5;box-sizing:border-box\">\u003c/span>\u003c/li>\n            \u003cli style=\"display:grid;grid-template-columns:30px 1fr auto 16px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">B2\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px\">Half-kneeling press\u003c/span>\u003cspan style=\"color:#a09d96\">3×10 · 14 kg\u003c/span>\u003cspan style=\"width:12px;height:12px;border-radius:50%;border:1.5px solid #6c6a64;box-sizing:border-box\">\u003c/span>\u003c/li>\n            \u003cli style=\"display:grid;grid-template-columns:30px 1fr auto 16px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(250,249,245,0.08)\">\u003cspan style=\"color:#a09d96\">C1\u003c/span>\u003cspan style=\"font-family:var(--font-sans);font-size:14px\">Farmer carry\u003c/span>\u003cspan style=\"color:#a09d96\">3×40 m · 2×24 kg\u003c/span>\u003cspan style=\"width:12px;height:12px;border-radius:50%;border:1.5px solid #6c6a64;box-sizing:border-box\">\u003c/span>\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv style=\"background:#1f1e1b;border-radius:8px;padding:18px 20px;margin-top:10px\">\n          \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:11.5px;color:#a09d96\">Coach note · Elias · 7:42 am\u003c/p>\n          \u003cp style=\"margin:8px 0 0;font-size:14px;line-height:1.55\">Hold 72.5 kg again today. Last week's final set moved fast. If it looks the same, we add 2.5 kg next week.\u003c/p>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:18px 4px 4px\">\n          \u003cspan style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            \u003cspan style=\"font-size:12.5px;padding:8px 12px;border-radius:8px;background:#252320\">Upload form check\u003c/span>\n            \u003cspan style=\"font-size:12.5px;padding:8px 12px;border-radius:8px;background:#252320\">Message Elias\u003c/span>\n          \u003c/span>\n          \u003cspan style=\"font-family:var(--font-mono);font-size:11.5px;color:#a09d96\">1 of 3 sessions · check-in Sunday\u003c/span>\n        \u003c/div>\n      \u003c/figure>\n      \u003col data-reveal=\"\" style=\"flex:1 1 380px;min-width:0;list-style:none;margin:0;padding:0;border-bottom:1px solid #d9d1c4\">\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Mon\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">Your week lands\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Sessions appear in the app, updated from Sunday's check-in.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Tue\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">Session one\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Video demos, target loads and rest timers for every exercise.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Wed\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">Form review\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Film a working set. Annotated feedback comes back within 24 hours.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Thu\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">Session two\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">In the studio, at your gym, or at home with the equipment you have.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Fri\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">One nutrition habit\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Protein and energy targets that fit your week, one habit at a time.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Sat\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">Session three, or plan B\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">A shorter session for weeks that got away from you.\u003c/p>\u003c/div>\u003c/li>\n        \u003cli style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px 0;border-top:1px solid #d9d1c4\">\u003cspan style=\"font-family:var(--font-mono);font-size:12px;color:#3d3d3a;padding-top:4px\">Sun\u003c/span>\u003cdiv>\u003cp style=\"margin:0;font-size:17px;font-weight:500;color:#141413\">Check-in\u003c/p>\u003cp style=\"margin:6px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Sleep, steps, bodyweight trend and how training felt. Your coach replies by Monday.\u003c/p>\u003c/div>\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"pricing\" data-screen-label=\"Pricing\" style=\"background:#faf9f5;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 520px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Pricing\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413\">Three ways to train.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:520px;margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#252523;text-wrap:pretty\">Every plan includes the assessment, a written program, the app and a weekly check-in. The first block is 12 weeks, then month to month.\u003c/p>\n    \u003c/div>\n    \u003cdiv data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:clamp(48px,6vw,88px);align-items:stretch\">\n      \u003csc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n        \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.PricingTierCard\" name=\"{{ t.name }}\" price=\"{{ t.price }}\" period=\"/ month\" description=\"{{ t.desc }}\" features=\"{{ t.features }}\" cta-label=\"{{ t.cta }}\" on-cta=\"{{ t.onCta }}\" featured=\"{{ t.featured }}\" hint-size=\"100%,480px\">\u003c/x-import>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;margin-top:28px\">\n      \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.6;color:#6c6a64\">Prices in USD, billed monthly. Pause or cancel with 14 days' notice after the first block.\u003c/p>\n      \u003cbutton type=\"button\" sc-camel-on-click=\"{{ openConsult }}\" style=\"background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;font-weight:500;color:#cc785c\">Not sure which fits? Book a free 20-minute consult →\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"process\" data-screen-label=\"Getting started\" style=\"background:#f5f0e8;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 520px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Getting started\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413\">Starting takes a week.\u003c/h2>\n      \u003c/div>\n      \u003cp style=\"flex:1 1 340px;max-width:520px;margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.6;color:#252523;text-wrap:pretty\">Four steps from application to your first session. Nothing to sign until you have met your coach.\u003c/p>\n    \u003c/div>\n    \u003col data-reveal=\"\" style=\"list-style:none;margin:clamp(48px,6vw,88px) 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:40px clamp(24px,3vw,48px)\">\n      \u003cli style=\"border-top:1px solid #141413;padding-top:24px\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">\u003cspan>01\u003c/span>\u003cspan>Day 1 · 5 min\u003c/span>\u003c/div>\n        \u003ch3 style=\"margin:28px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(34px,3vw,52px);line-height:1;letter-spacing:-0.02em;color:#141413\">Apply\u003c/h3>\n        \u003cp style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3d3d3a\">Tell us your goal, your schedule and what you have tried before.\u003c/p>\n      \u003c/li>\n      \u003cli style=\"border-top:1px solid #141413;padding-top:24px\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">\u003cspan>02\u003c/span>\u003cspan>Day 2–3 · 20 min\u003c/span>\u003c/div>\n        \u003ch3 style=\"margin:28px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(34px,3vw,52px);line-height:1;letter-spacing:-0.02em;color:#141413\">Consult\u003c/h3>\n        \u003cp style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3d3d3a\">A short call about fit, format and price. If we are the wrong coach for you, we will say so.\u003c/p>\n      \u003c/li>\n      \u003cli style=\"border-top:1px solid #141413;padding-top:24px\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">\u003cspan>03\u003c/span>\u003cspan>Day 4–5 · 60 min\u003c/span>\u003c/div>\n        \u003ch3 style=\"margin:28px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(34px,3vw,52px);line-height:1;letter-spacing:-0.02em;color:#141413\">Assess\u003c/h3>\n        \u003cp style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3d3d3a\">Movement screen and baseline numbers, in the studio or over video.\u003c/p>\n      \u003c/li>\n      \u003cli style=\"border-top:1px solid #141413;padding-top:24px\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">\u003cspan>04\u003c/span>\u003cspan>Day 7\u003c/span>\u003c/div>\n        \u003ch3 style=\"margin:28px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(34px,3vw,52px);line-height:1;letter-spacing:-0.02em;color:#141413\">Begin\u003c/h3>\n        \u003cp style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3d3d3a\">Your first block is in the app and your first week is scheduled.\u003c/p>\n      \u003c/li>\n    \u003c/ol>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin-top:clamp(48px,5vw,72px)\">\n      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openApply }}\" hint-size=\"140px,40px\">Start coaching\u003c/x-import>\n      \u003cbutton type=\"button\" sc-camel-on-click=\"{{ openConsult }}\" style=\"background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;font-weight:500;color:#cc785c\">Or book a consultation →\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"journal\" data-screen-label=\"Journal\" style=\"background:#faf9f5;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box\">\n    \u003cdiv data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 64px\">\n      \u003cdiv style=\"flex:1 1 520px;min-width:0\">\n        \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">Journal\u003c/p>\n        \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413\">Notes from the studio.\u003c/h2>\n      \u003c/div>\n      \u003cx-import component-from-global-scope=\"CreamDesignSystem_52cab2.TextLink\" href=\"#journal\" hint-size=\"110px,24px\">All articles →\u003c/x-import>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,3vw,56px);margin-top:clamp(48px,6vw,88px)\">\n      \u003carticle data-reveal=\"\" style=\"flex:1.4 1 480px;min-width:0\">\n        \u003ca href=\"#journal\" style=\"display:block;color:inherit;text-decoration:none\">\n          \u003cdiv style=\"height:clamp(260px,30vw,540px);border-radius:12px;overflow:hidden;background:#e8e0d2\">\u003cimg src=\"altitude-personal-training/ef958ffafbf8.webp\" alt=\"Close-up of hands gripping a loaded barbell over a chalk-marked rubber floor\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;transition:transform 900ms cubic-bezier(0.2,0,0,1)\" style-hover=\"transform:scale(1.03)\">\u003c/div>\n          \u003cp style=\"margin:20px 0 0;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Training · 6 min read\u003c/p>\n          \u003ch3 style=\"margin:10px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(32px,2.8vw,48px);line-height:1.05;letter-spacing:-0.02em;color:#141413\">What RPE 8 should feel like\u003c/h3>\n          \u003cp style=\"margin:12px 0 0;max-width:560px;font-size:16px;line-height:1.6;color:#3d3d3a\">A practical guide to rating effort, with the cues we use in the studio to keep sets honest.\u003c/p>\n        \u003c/a>\n      \u003c/article>\n      \u003cdiv style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:clamp(32px,3vw,48px)\">\n        \u003carticle data-reveal=\"\">\n          \u003ca href=\"#journal\" style=\"display:flex;flex-wrap:wrap;gap:20px;color:inherit;text-decoration:none\">\n            \u003cdiv style=\"flex:1 1 180px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#e8e0d2\">\u003cimg src=\"altitude-personal-training/a5463e64a6a6.webp\" alt=\"A bowl of vegetables, chickpeas, avocado and greens on a wooden table\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\u003c/div>\n            \u003cdiv style=\"flex:1.3 1 200px;min-width:0\">\n              \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Nutrition · 4 min read\u003c/p>\n              \u003ch3 style=\"margin:10px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(26px,2vw,34px);line-height:1.08;letter-spacing:-0.015em;color:#141413\">Protein targets without a spreadsheet\u003c/h3>\n              \u003cp style=\"margin:10px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Palm-sized portions, a few anchor meals, and when counting is worth it.\u003c/p>\n            \u003c/div>\n          \u003c/a>\n        \u003c/article>\n        \u003carticle data-reveal=\"\">\n          \u003ca href=\"#journal\" style=\"display:flex;flex-wrap:wrap;gap:20px;color:inherit;text-decoration:none\">\n            \u003cdiv style=\"flex:1 1 180px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#e8e0d2\">\u003cimg src=\"altitude-personal-training/e97aee0ff190.webp\" alt=\"A mountain range at sunset behind a line of pine trees\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover\">\u003c/div>\n            \u003cdiv style=\"flex:1.3 1 200px;min-width:0\">\n              \u003cp style=\"margin:0;font-family:var(--font-mono);font-size:12px;color:#6c6a64\">Recovery · 5 min read\u003c/p>\n              \u003ch3 style=\"margin:10px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(26px,2vw,34px);line-height:1.08;letter-spacing:-0.015em;color:#141413\">The case for the deload week\u003c/h3>\n              \u003cp style=\"margin:10px 0 0;font-size:15px;line-height:1.55;color:#3d3d3a\">Why we plan easier weeks before you need them, and what to do with the spare energy.\u003c/p>\n            \u003c/div>\n          \u003c/a>\n        \u003c/article>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"faq\" data-screen-label=\"FAQ\" style=\"background:#f5f0e8;padding:clamp(88px,10vw,168px) 0;scroll-margin-top:72px\">\n  \u003cdiv style=\"max-width:1680px;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box;display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,120px);align-items:flex-start\">\n    \u003cdiv data-reveal=\"\" style=\"flex:1 1 320px;min-width:0;max-width:520px\">\n      \u003cp style=\"margin:0;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#6c6a64\">FAQ\u003c/p>\n      \u003ch2 style=\"margin:20px 0 0;font-family:var(--font-serif-display);font-weight:400;font-size:clamp(44px,5.6vw,104px);line-height:0.95;letter-spacing:-0.03em;color:#141413\">Questions, answered.\u003c/h2>\n      \u003cp style=\"margin:24px 0 0;font-size:16px;line-height:1.65;color:#3d3d3a\">Anything else, ask us directly. We reply within two working days.\u003c/p>\n      \u003cbutton type=\"button\" sc-camel-on-click=\"{{ openConsult }}\" style=\"margin-top:16px;background:none;border:0;padding:8px 0;cursor:pointer;font-size:15px;font-weight:500;color:#cc785c\">Book a free consultation →\u003c/button>\n    \u003c/div>\n    \u003cdiv style=\"flex:1.6 1 520px;min-width:0;border-bottom:1px solid #ddd5c8\">\n      \u003csc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"10\">\n        \u003cdiv style=\"border-top:1px solid #ddd5c8\">\n          \u003ch3 style=\"margin:0;font-family:var(--font-sans);font-size:inherit;letter-spacing:0\">\n            \u003cbutton type=\"button\" id=\"{{ f.btnId }}\" aria-expanded=\"{{ f.open }}\" aria-controls=\"{{ f.panelId }}\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 0;background:none;border:0;text-align:left;cursor:pointer;font-family:var(--font-sans);font-size:clamp(17px,1.25vw,19px);font-weight:500;line-height:1.4;color:#141413\">\n              \u003cspan>{{ f.q }}\u003c/span>\n              \u003cspan aria-hidden=\"true\" style=\"flex:none;width:36px;height:36px;border-radius:999px;border:1px solid #d3cabb;display:flex;align-items:center;justify-content:center;transform:rotate({{ f.rot }});transition:transform 180ms\">\n                \u003cx
